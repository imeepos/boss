# 102 自动部署:main 分支 push/merge 触发——构建全二进制镜像、推私有仓库、compose 拉起。
# runs-on 标签由 102 gitea-runner 注册(docker://deploy-runner 镜像,含 git+docker CLI+compose);
# runner docker_host 自动探测,宿主 /var/run/docker.sock 会挂进 job 容器,直接操控宿主 docker。
name: deploy-102
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: deploy-102
    steps:
      - name: Clone
        run: |
          git clone --depth 2 "http://sker:${GITHUB_TOKEN}@192.168.0.102:3001/sker/boss.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify change
        id: change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          runtime=false
          # 优先用 push 事件的 before SHA 精确取本次推送的变更面(社区标准:
          # github.event.before/after;before 为全零 = 新建分支/force push)。
          # before 取不到(服务端不允许按 SHA fetch)时回退双父并集启发式:
          # 只看 HEAD^ 会漏判——feature 侧先 merge main 再推送时 HEAD^ 是
          # feature tip,运行时变更被误判 docs-only 跳过部署(task 2606 实例)。
          base=""
          if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            # gitea 默认不允许按裸 SHA fetch,改为加深 main 历史后检查 before 是否在场
            # (常规推送跨度远小于 100,force push/超长推送时 before 不在场,走回退)。
            git fetch -q --depth=100 origin main 2>/dev/null || true
            if git rev-parse --verify -q "$BEFORE^{commit}" >/dev/null 2>&1; then
              base="$BEFORE"
            fi
          fi
          if [ -n "$base" ]; then
            echo "Classifying by push event before=$BEFORE"
            files=$(git diff --name-only "$base" HEAD)
          else
            echo "before SHA unavailable; falling back to parent-diff heuristic"
            files=$(git diff --name-only HEAD^ HEAD)
            if git rev-parse --verify -q HEAD^2 >/dev/null 2>&1; then
              files="$files
          $(git diff --name-only HEAD^2 HEAD)"
            fi
          fi
          for path in $files; do
            case "$path" in
              docs/*|.agents/*|*.md) ;;
              *) runtime=true; break ;;
            esac
          done
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          if [ "$runtime" = true ]; then
            echo "Runtime-affecting changes detected; deployment will build and restart services."
          else
            echo "Documentation/skill-only changes detected; deployment is skipped."
          fi

      - name: Build server image
        if: steps.change.outputs.runtime == 'true'
        run: docker build -f deployments/docker/server.Dockerfile -t 192.168.0.102:5000/boss/server:${GITHUB_SHA} -t 192.168.0.102:5000/boss/server:latest .

      - name: Build admin-web image
        if: steps.change.outputs.runtime == 'true'
        run: docker build -f deployments/docker/admin-web.Dockerfile -t 192.168.0.102:5000/boss/admin-web:${GITHUB_SHA} -t 192.168.0.102:5000/boss/admin-web:latest .

      - name: Push images
        if: steps.change.outputs.runtime == 'true'
        run: |
          docker push 192.168.0.102:5000/boss/server:${GITHUB_SHA}
          docker push 192.168.0.102:5000/boss/server:latest
          docker push 192.168.0.102:5000/boss/admin-web:${GITHUB_SHA}
          docker push 192.168.0.102:5000/boss/admin-web:latest

      - name: Deploy (compose up)
        if: steps.change.outputs.runtime == 'true'
        run: |
          # 根治遗留问题:固定 container_name 可能被其他 compose 项目(手动 deploy 的 deployments 项目、
          # 无 label 的 docker run)占用,--force-recreate 在名字冲突处中止,已 Recreate 的容器滞留 Created。
          # 先按名字清掉残留,保证 compose 独占名字后 up 必然完整拉起。
          docker rm -f boss-server boss-aaa boss-report boss-admin-web 2>/dev/null || true
          docker-compose -f deployments/docker-compose.102.app.yml -p boss-app up -d --force-recreate --remove-orphans
          sleep 12
          docker-compose -f deployments/docker-compose.102.app.yml -p boss-app ps

      - name: Verify all containers running
        if: steps.change.outputs.runtime == 'true'
        run: |
          for c in boss-server boss-aaa boss-report boss-admin-web; do
            state=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)
            echo "$c=$state"
            [ "$state" = "running" ] || { echo "container $c not running"; exit 1; }
          done

      - name: Healthcheck
        if: steps.change.outputs.runtime == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if wget -qO- http://192.168.0.102:28080/healthz; then echo; exit 0; fi
            sleep 6
          done
          echo "healthz failed"; docker logs boss-server --tail 50; exit 1

      - name: Healthcheck admin-web
        if: steps.change.outputs.runtime == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if wget -qO- http://192.168.0.102:5180/; then echo; exit 0; fi
            sleep 3
          done
          echo "admin-web failed"; docker logs boss-admin-web --tail 20; exit 1
