# 102 自动部署:main 分支 push/merge 触发——构建全二进制镜像、推私有仓库、compose 拉起。
# runs-on 标签由 102 gitea-runner 注册(docker://deploy-runner 镜像,含 git+docker CLI+compose);
# runner docker_host 自动探测,宿主 /var/run/docker.sock 会挂进 job 容器,直接操控宿主 docker。
name: deploy-102
on:
  push:
    branches: [main]

# 线上部署操作宿主 Docker，必须串行；新提交取消尚未开始的旧部署。
concurrency:
  group: deploy-102
  cancel-in-progress: true

jobs:
  # 镜像守护(2026-09-06 事故固化,ISSUE.md CI/deploy-102):deploy-runner job 镜像被
  # prune 后 runner 拉 job 容器即失败且 runner 日志无错误行(act_runner 0.2.11 缺陷),
  # 部署通道整体静默停摆。守护 job 刻意跑在 ubuntu-latest 标签(= runner:bookworm 基座,
  # 与 deploy-runner 互不依赖),即使 deploy-runner 本地+注册表双缺也能拉起并就地重建,
  # 阻断「镜像没了→守护也起不来」的鸡蛋互锁;自检幂等零副作用,重建细节见
  # scripts/ops/deploy-runner-guard.sh(构建上下文固化在 scripts/ops/,不再依赖 /tmp)。
  runner-image-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        run: |
          git clone --depth 1 "http://sker:${GITHUB_TOKEN}@192.168.0.102:3001/sker/boss.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard deploy-runner image
        run: bash scripts/ops/deploy-runner-guard.sh

  deploy:
    # needs=镜像守护先行:deploy job 容器本身跑在 deploy-runner 镜像上,镜像缺失时该
    # job 根本拉不起来;守护重建失败则部署不启动(失败大声可见,不留静默窗口)。
    needs: [runner-image-guard]
    runs-on: deploy-102
    steps:
      - name: Clone
        run: |
          git clone --depth 2 "http://sker:${GITHUB_TOKEN}@192.168.0.102:3001/sker/boss.git" .
          echo "::notice::deploy-102 run for ${GITHUB_SHA} (event before=${GITHUB_EVENT_BEFORE:-${{ github.event.before }}})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify change
        id: change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          runtime=false
          base=""
          # 优先与「102 上实际已部署的镜像 sha」比对:gitea 同分支新 push 会取消
          # 待执行的旧 run,若中途夹一个 docs-only 推送,仅看 github.event.before
          # 会把此前未部署的 runtime 变更漏判为 docs-only 跳过部署(2026-09-22
          # 装维队/批量导入两会话同坑:run 被 docs 提交取代取消,feature 未上线)。
          # || true 兜底 SIGPIPE 竞态:head -1 提前关闭管道时上游 grep 收 141,
          # pipefail 放大为整管道失败 → set -e 杀步骤(2026-08-25 deploy run 1716-1743
          # 全部 5s 内死于本行,本地镜像 sha tag 累积增多后竞态窗口必现;task 2862 实证 exitcode 141)。
          deployed=$(docker images --format '{{.Tag}}' 192.168.0.102:5000/boss/server 2>/dev/null | grep -Ev '^latest$|^$' | head -1 || true)
          if [ -n "$deployed" ]; then
            git fetch -q --depth=200 origin main 2>/dev/null || true
            if git rev-parse --verify -q "$deployed^{commit}" >/dev/null 2>&1; then
              base="$deployed"
              echo "Classifying against last deployed sha=$deployed"
            fi
          fi
          # 部署 sha 不可用时退回 push 事件 before(社区标准;before 为全零=新建分支/force push)。
          if [ -z "$base" ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            git fetch -q --depth=100 origin main 2>/dev/null || true
            if git rev-parse --verify -q "$BEFORE^{commit}" >/dev/null 2>&1; then
              base="$BEFORE"
              echo "Classifying by push event before=$BEFORE"
            fi
          fi
          if [ -z "$base" ]; then
            # 双父并集启发式:只看 HEAD^ 会漏判——feature 侧先 merge main 再推送时
            # HEAD^ 是 feature tip,运行时变更被误判 docs-only 跳过部署(task 2606 实例)。
            echo "before SHA unavailable; falling back to parent-diff heuristic"
            files=$(git diff --name-only HEAD^ HEAD)
            if git rev-parse --verify -q HEAD^2 >/dev/null 2>&1; then
              files="$files
          $(git diff --name-only HEAD^2 HEAD)"
            fi
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          for path in $files; do
            case "$path" in
              docs/*|.agents/*|*.md) ;;
              *) runtime=true; break ;;
            esac
          done
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          if [ "$runtime" = true ]; then
            echo "Runtime-affecting changes detected; deployment will build and restart services."
          else
            echo "Documentation/skill-only changes detected; deployment is skipped."
          fi

      - name: Build server image
        if: steps.change.outputs.runtime == 'true'
        # 生产镜像注入授权公钥(B 档强制门禁)。公钥非机密(验签公钥),直接内联——
        # 不依赖仓库 secret(公钥轮换时改此处 + buildinfo 同源),禁止空值交付。
        # 当前公钥对应 release-platform 签发密钥 boss-integration-v1(102)。
        run: |
          BOSS_LICENSE_PUBLIC_KEY_HEX="f82d2db7a72efc66f8ffca0a67a7f8a29c6c6ea8f720fe5c139afdaa8869ff63"
          docker build \
            -f deployments/docker/server.Dockerfile \
            --build-arg BOSS_LICENSE_PUBLIC_KEY_HEX="$BOSS_LICENSE_PUBLIC_KEY_HEX" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t 192.168.0.102:5000/boss/server:${GITHUB_SHA} \
            -t 192.168.0.102:5000/boss/server:latest .

      - name: Build admin-web image
        if: steps.change.outputs.runtime == 'true'
        run: docker build -f deployments/docker/admin-web.Dockerfile -t 192.168.0.102:5000/boss/admin-web:${GITHUB_SHA} -t 192.168.0.102:5000/boss/admin-web:latest .

      - name: Push images
        if: steps.change.outputs.runtime == 'true'
        run: |
          docker push 192.168.0.102:5000/boss/server:${GITHUB_SHA}
          docker push 192.168.0.102:5000/boss/server:latest
          docker push 192.168.0.102:5000/boss/admin-web:${GITHUB_SHA}
          docker push 192.168.0.102:5000/boss/admin-web:latest

      - name: Deploy (compose up)
        if: steps.change.outputs.runtime == 'true'
        run: |
          # 根治遗留问题:固定 container_name 可能被其他 compose 项目(手动 deploy 的 deployments 项目、
          # 无 label 的 docker run)占用,--force-recreate 在名字冲突处中止,已 Recreate 的容器滞留 Created。
          # 先按名字清掉残留,保证 compose 独占名字后 up 必然完整拉起。
          docker rm -f boss-server boss-aaa boss-report boss-provisioner boss-admin-web 2>/dev/null || true
          docker-compose -f deployments/docker-compose.102.app.yml -p boss-app up -d --force-recreate --remove-orphans
          sleep 12
          docker-compose -f deployments/docker-compose.102.app.yml -p boss-app ps

      - name: Verify all containers running
        if: steps.change.outputs.runtime == 'true'
        run: |
          for c in boss-server boss-aaa boss-report boss-provisioner boss-admin-web; do
            state=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)
            echo "$c=$state"
            [ "$state" = "running" ] || { echo "container $c not running"; exit 1; }
          done

      - name: Healthcheck
        if: steps.change.outputs.runtime == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if wget -qO- http://192.168.0.102:28080/healthz; then echo; exit 0; fi
            sleep 6
          done
          echo "healthz failed"; docker logs boss-server --tail 50; exit 1

      - name: Healthcheck admin-web
        if: steps.change.outputs.runtime == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if wget -qO- http://192.168.0.102:5180/; then echo; exit 0; fi
            sleep 3
          done
          echo "admin-web failed"; docker logs boss-admin-web --tail 20; exit 1

      # 版本自证复验(2026-09-07):部署尾部机器核验「上没上线」——服务端 healthz
      # 自报 commit(容器构建经 GIT_SHA ldflags 注入)+ admin-web bundle 指纹,
      # 任一不过即红,替代人工 curl 指纹猜(ISSUE.md 复验口诀的流水线化,
      # 2026-08-29 空提交重触发误判事故的根治项之一)。
      - name: Verify deployment fingerprint
        if: steps.change.outputs.runtime == 'true'
        run: bash scripts/ops/verify-deploy.sh --expect-sha "${GITHUB_SHA}"

      # 孤儿巡检门禁(2026-08-29):部署后打 /db-patrol/orphans,任一软引用孤儿类 >0
      # 即失败,拦截 E2E 造数泄漏随部署进入 102(2026-08-25 审计 §五.2;脚本自带解析)。
      - name: Patrol orphans gate
        if: steps.change.outputs.runtime == 'true'
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('.agents/skills/bossctl-cli/test-accounts.json'))['admin']['apiKeys'][0]['key'])")
          ADMIN_API_KEY="$KEY" ./scripts/ops/db-patrol-gate.sh

      # 部署成功标记落盘(2026-09-06):容器/healthz/指纹/孤儿门禁全过后,把「最近成功
      # 部署时间戳+git sha」经 docker-run 写到 102 宿主,供 deploy-guard-alert.sh 每日
      # cron 比对;超 24h 无健康部署即 [deploy-guard] ALERT(部署静默停摆兜底告警,
      # 堵住「6 次 push 零部署且不可见」的诊断盲区,口径见 docs/ops/patrol-cron.md)。
      - name: Record deploy success marker
        if: steps.change.outputs.runtime == 'true'
        run: bash scripts/ops/deploy-marker-write.sh
