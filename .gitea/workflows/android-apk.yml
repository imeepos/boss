# Android APK 出包:main 分支改 mobile/*/android 时构建 worker/user 两端 release APK,
# 归档到宿主 /srv/boss/apk/<sha>/。与 deploy-102 同风格:纯 run 步骤,不依赖 marketplace action。
# 镜像 192.168.0.102:5000/boss/android-builder:1(自建:102 无法直连 Docker Hub,
# daocloud 镜像源白名单不含 cimg/android;基座 eclipse-temurin17 + Google 官方源
# cmdline-tools,Dockerfile 见 deployments/docker/android-builder.Dockerfile)。
# gradle 缓存/SDK 缓存走命名卷 boss-gradle-home / boss-android-sdk(平台包首跑自动下载)。
# release 签名:repo secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEYSTORE_ALIAS/
# KEYSTORE_KEY_PASSWORD 四项齐备时解码正式签名(keystore 永不入库);
# 缺省则 gradle 自动回退 debug 签名,产物仅用于测试分发;
# jpushAppKey 走仓库 secret JPUSH_APP_KEY,缺省空串(SDK 仅日志不 crash)。
name: android-apk
on:
  push:
    branches: [main]
    paths:
      - "mobile/worker/android/**"
      - "mobile/user/android/**"
      - ".gitea/workflows/android-apk.yml"
  workflow_dispatch:

env:
  IMG: 192.168.0.102:5000/boss/android-builder:1
  OUT: /srv/boss/apk

jobs:
  build:
    runs-on: deploy-102
    steps:
      - name: Clone
        run: |
          git clone --depth 1 "http://sker:${GITHUB_TOKEN}@192.168.0.102:3001/sker/boss.git" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode signing material
        # keystore 永不入库:repo secret KEYSTORE_BASE64(keystore 文件 base64) +
        # KEYSTORE_PASSWORD/KEYSTORE_ALIAS/KEYSTORE_KEY_PASSWORD 四项齐备时解码出
        # 各端的 release.keystore + keystore.properties(gradle 已按存在即启用)。
        # 任一缺失则跳过,沿用 debug 签名回退。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
            echo "signing secrets incomplete, keep debug-signing fallback"
            exit 0
          fi
          for d in mobile/worker/android mobile/user/android; do
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$d/release.keystore"
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_KEY_PASSWORD" > "$d/keystore.properties"
          done
          echo "signing material decoded for both apps"

      - name: Build APKs
        env:
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
        run: |
          set -e
          OUTDIR="$OUT/$GITHUB_SHA"
          mkdir -p "$OUTDIR"
          build_one() {
            local dir="$1" name="$2"
            echo "=== build $name ==="
            echo "sdk.dir=/opt/android-sdk" > "$dir/local.properties"
            # job 容器内 $PWD 对宿主 daemon 不可见(-v bind mount 会挂空目录),
            # 改走 docker create + cp(与 deploy-102 用 build context 同理,不依赖路径)
            local cid
            cid=$(docker create -w /prj --user root \
              -v boss-gradle-home:/root/.gradle -e GRADLE_USER_HOME=/root/.gradle \
              -v boss-android-sdk:/opt/android-sdk \
              -e JPUSH_APP_KEY="$JPUSH_APP_KEY" "$IMG" \
              ./gradlew assembleRelease --quiet -PjpushAppKey="${JPUSH_APP_KEY:-}")
            trap 'docker rm -f $cid >/dev/null 2>&1 || true' EXIT
            docker cp "$dir/." "$cid:/prj/"
            docker start -a "$cid"
            docker cp "$cid:/prj/app/build/outputs/apk/release/app-release.apk" "$OUTDIR/$name.apk"
            docker rm "$cid" >/dev/null
          }
          build_one mobile/worker/android boss-worker
          build_one mobile/user/android boss-user

      - name: Checksum
        run: |
          cd "$OUT/$GITHUB_SHA"
          sha256sum *.apk | tee SHA256SUMS
          echo "APKs at: $OUT/$GITHUB_SHA"
