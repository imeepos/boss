openapi: 3.0.3
info:
  title: BOSS 管理后台(admin 端) REST API
  version: 1.1.0
  description: |
    管理后台(admin 端,对应 docs/admin/*.html 全量页面)对外 REST 契约。
    权威字段/状态枚举见 docs/contract/{terms,fields,domain-map}.md;
    本文件为 APISIX 路由的单一事实源;接口按域拆分至 admin/ 目录,本文件仅做聚合(内联 $ref)。
    前缀 /api/admin/v1(与 Go 实现 internal/httpapi/admin 对齐,三端前缀分离见 note 2026-08-19-api-three-portal-prefix;
    三端独立账号体系与鉴权,JWT aud=admin)。
    响应约定(对齐 pkg/apitypes 与 http.go respond;V1.1 起取代旧"平铺+{items}"约定):
    1) 统一 envelope { code, msg, data },HTTP 状态恒 200,业务成败只看 code(0=成功)。
    2) 域文件中的 inline response schema 一律描述 data 负载,不含 envelope 外壳。
    3) 列表的 data 为裸数组(实现 respond(c, CodeOK, list);前端请求层适配 UI 所需 {items})。
    4) code=401 未认证(清 token 跳登录),403 无权限,404 不存在;参数/状态非法等码见 pkg/apitypes。
servers:
  - url: /api/admin/v1
    description: 管理后台接口前缀(Go cmd/server 直连;APISIX 网关同前缀转发)

tags:
  - name: Auth
    description: 登录 / 当前用户 / 退出
  - name: Dashboard
    description: 工作台(统计卡 + 订单状态分布 + 待办 + 趋势)
  - name: Geo
    description: 国际地理基础数据(国家/行政区划/译名/批量导入)
  - name: Sys
    description: 基础配置(账号/地址层级/业务参数/审计日志/数据导入)
  - name: AI
    description: AI 能力网关(OpenAI SDK 封装;apiKey/apiUrl 集中配置热更)
  - name: Org
    description: 组织与权限(法人/部门/岗位/区域/菜单权限/数据权限)
  - name: Customer
    description: 客户档案 + 产品资费(CRM + PROD 域)
  - name: Billing
    description: 计费账务(出账/缴费/欠费停复机/渠道对账)
  - name: Asset
    description: 资产与标签(台账/生命周期/电子标签/盘点/更换单)
  - name: Oss
    description: 网络资源(端口/预占/调配/OLT/认证账号/扩容)
  - name: Order
    description: 订单与工单(订单 12 环节/派单/拆机/报障/激活回调)
  - name: Quad
    description: 四码合一(关联查询/对账告警/扫码记录)
  - name: Provision
    description: 配置下发(任务/模板/日志)
  - name: Alarm
    description: 告警中心(含批量复测)
  - name: Aaa
    description: 认证与话单日志
  - name: Intel
    description: GIS 联动 / 经营分析 / 报告中心
  - name: Userdata
    description: 用户端数据管理(账户/地址簿/套餐订购/增值服务/通知订阅/FAQ/消息/优惠券/流量/排障指南/协议/余额/发票/投诉/实名记录/卖点与账单明细配置)
  - name: Worker
    description: 师傅管理(档案与接单设置/绩效提成/评价/消息/公告/FAQ/物料工具/旧件回收/设备健康/抢单池/调度会话/排期)

