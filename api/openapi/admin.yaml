  /tags: { $ref: './admin/asset.yaml#/paths/~1tags' }
  /stocktakes: { $ref: './admin/asset.yaml#/paths/~1stocktakes' }
  /stocktakes/{taskId}/diff-handle: { $ref: './admin/asset.yaml#/paths/~1stocktakes~1{taskId}~1diff-handle' }
