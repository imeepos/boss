paths:
  /orders:
    get:
      tags: [Order]
      summary: '订单列表(12 环节跟踪;status: PENDING/RESERVED/INSTALLING/DONE)'
      operationId: listOrders
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - $ref: './schemas.yaml#/components/parameters/status'
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤(开户工作台聚合展示) }
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        orderNo: { type: string }
                        customer: { type: string }
                        product: { type: string }
                        address: { type: string }
                        stage: { type: integer, minimum: 1, maximum: 12 }
                        stageLabel: { type: string }
                        status: { type: string, enum: [PENDING, RESERVED, INSTALLING, DONE] }
                        createdAt: { type: string, format: date-time }
                        ops: { type: array, items: { type: string }, description: 可用操作(跟踪/变更/退订) }
    post:
      tags: [Order]
      summary: 新建订单(仅限线下代客极少数场景;正常下单口径是 user 端 /api/user/v1/orders)
      operationId: createOrder
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /orders/address:
    post:
      tags: [Order]
      summary: '开单内联建址(零阻塞;逐级补建到楼栋级,单事务;契约细节见 fields.md §1.5.0b)'
      operationId: orderInlineAddress
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [customerId, city, district, street, compound, building]
              properties:
                customerId: { type: integer, format: int64, description: 必填,客户须已存在(缺失 40400);未建档场景走 POST /customers/address }
                city: { type: string, maxLength: 60 }
                district: { type: string, maxLength: 60 }
                street: { type: string, maxLength: 60 }
                compound: { type: string, maxLength: 60 }
                building: { type: string, maxLength: 60 }
                backfillCustomer: { type: boolean, description: true=同事务回填客户档案装机地址 }
      responses:
        '200':
          description: 楼栋定位+归属预览(addressId/fullPath/fullPathNames/legalEntityId/regionPath/fallback/needsReview/backfilled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  addressId: { type: integer, format: int64 }
                  fullPath: { type: string }
                  fullPathNames: { type: string }
                  legalEntityId: { type: integer, format: int64 }
                  regionPath: { type: string }
                  fallback: { type: boolean }
                  needsReview:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        level: { type: integer, minimum: 1, maximum: 5 }
                        name: { type: string }
                  backfilled: { type: boolean }

  /orders/catalog:
    get:
      tags: [Order]
      summary: '代客下单选项目录(在售产品+渠道;带 q 附地址搜索,fullPath=祖先链拍平)'
      operationId: orderCatalog
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 地址关键字(空=不返回地址) }
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    description: 仅 PUBLISHED 在售产品
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        monthlyFee: { type: number }
                        bandwidth: { type: string }
                        category: { type: string }
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        code: { type: string, enum: [HALL, ONLINE, AGENT] }
                        name: { type: string }
                        status: { type: string, enum: [ACTIVE, DISABLED] }
                  addresses:
                    type: array
                    description: q 非空时返回
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        fullPath: { type: string }

  /orders/{orderNo}:
    get:
      tags: [Order]
      summary: '订单详情(含 12 环节时间轴: 完成时间/耗时/重试/结果)'
      operationId: getOrder
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { type: object }
                  ticket:
                    nullable: true
                    type: object
                    description: 派单工单(未到派单环节为 null;开户工作台指派/激活寻址用)
                    properties:
                      ticketId: { type: integer, format: int64 }
                      ticketNo: { type: string }
                      orderId: { type: integer, format: int64 }
                      workerId: { type: integer }
                      workerName: { type: string }
                      status: { type: string }
                  latestLocation:
                    nullable: true
                    type: object
                    properties:
                      workerId: { type: integer, format: int64 }
                      lat: { type: number, format: double }
                      lng: { type: number, format: double }
                      accuracyM: { type: number, format: float }
                      speedMps: { type: number, format: float }
                      bearing: { type: number, format: float }
                      reportedAt: { type: string, format: date-time }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        stage: { type: integer }
                        name: { type: string }
                        finishedAt: { type: string }
                        duration: { type: string }
                        retries: { type: integer }
                        result: { type: string, enum: [DONE, DOING, PENDING] }

  /dispatch/pool:
    get:
      tags: [Order]
      summary: 调度工作台·跨区工单池
      operationId: listDispatchPool
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /dispatch/pool/{ticketNo}/assign:
    post:
      tags: [Order]
      summary: 工单指派(候选师傅;跨区默认 40900 提醒,force 确认后强派)
      operationId: assignTicket
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [masterId]
              properties:
                masterId: { type: integer }
                scheduleSlot: { type: string, description: '预约时间段，如 08-22 14:00-16:00' }
                preBindTag: { type: string, description: '预绑定 EPC 标签，如 EPC-0001' }
                force: { type: boolean, description: '跨区指派二次确认:已知晓区域不匹配仍强制派单' }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
        '409':
          description: 师傅负责区域与工单区域不匹配(data 携带 forceRequired/ticketRegionId/workerRegionId),前端确认后带 force 重发

  /dispatch/my-tickets:
    get:
      tags: [Order]
      summary: 装维师傅视图·我的工单
      operationId: listMyTickets
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 }, description: 按师傅过滤(代码读取 workerId) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /dispatch/transfers:
    get:
      tags: [Order]
      summary: 改派/转单处理列表
      operationId: listDispatchTransfers
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /dispatch/tickets/{ticketNo}/transfer:
    post:
      tags: [Order]
      summary: 工单转派(跨区默认 40900 提醒,force 确认后放行)
      operationId: transferTicket
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [toMasterId, reason]
              properties:
                toMasterId: { type: integer }
                reason: { type: string }
                force: { type: boolean, description: '跨区转派二次确认' }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
        '409':
          description: 目标师傅区域与工单区域不匹配(data 携带 forceRequired/ticketRegionId/workerRegionId)

  /dismantles:
    get:
      tags: [Order]
      summary: 拆机单列表(待扫码/已解绑/已拆机)
      operationId: listDismantles
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - $ref: './schemas.yaml#/components/parameters/status'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Order]
      summary: 新建拆机单
      operationId: createDismantle
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /complaints:
    get:
      tags: [Order]
      summary: 报障与投诉工单(CS 客服域)
      operationId: listComplaints
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [NETWORK_FAULT, TARIFF_DISPUTE, SERVICE_COMPLAINT] }
        - $ref: './schemas.yaml#/components/parameters/status'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /complaint-metrics:
    get:
      tags: [Order]
      summary: 客服工单状态与 SLA 指标
      operationId: complaintMetrics
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /complaints/{ticketNo}/close:
    post:
      tags: [Order]
      summary: 投诉办结
      operationId: closeComplaint
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /complaints/{ticketNo}/status:
    post:
      tags: [Order]
      summary: 工单状态流转(OPEN/PROCESSING/CLOSED)
      operationId: transitionTicket
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, PROCESSING, CLOSED] }
                actor: { type: integer, format: int64 }
                note: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /complaints/{ticketNo}/escalate:
    post:
      tags: [Order]
      summary: 升级工单优先级
      operationId: escalateTicket
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: integer, format: int64 }
                note: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /complaints/{ticketNo}/events:
    get:
      tags: [Order]
      summary: 工单状态审计事件列表
      operationId: listTicketEvents
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /callbacks:
    get:
      tags: [Order]
      summary: 客服回访计划列表
      operationId: listCallbacks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Order]
      summary: 创建客服回访计划
      operationId: createCallback
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /callbacks/{callbackId}:
    put:
      tags: [Order]
      summary: 更新客服回访计划
      operationId: updateCallback
      parameters:
        - { name: callbackId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    delete:
      tags: [Order]
      summary: 删除客服回访计划
      operationId: deleteCallback
      parameters:
        - { name: callbackId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /callbacks/{callbackId}/complete:
    post:
      tags: [Order]
      summary: 回访结果回填(调度结果回写)
      operationId: completeCallback
      parameters:
        - { name: callbackId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { type: string }
                rating: { type: integer, format: int16 }
                comment: { type: string }
                operatorId: { type: integer, format: int64 }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /activation-callbacks:
    get:
      tags: [Order]
      summary: 激活回调日志(订单第 11 环节)
      operationId: listActivationCallbacks
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - $ref: './schemas.yaml#/components/parameters/status'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /activation-callbacks/{callbackId}/retry:
    post:
      tags: [Order]
      summary: 回调重试
      operationId: retryActivationCallback
      parameters:
        - { name: callbackId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  # ---------- 开网流程推进(CLI 模拟 / 联调用) ----------
  /orders/{orderNo}/check-resource:
    post:
      tags: [Order]
      summary: 环节2 资源核查:调资源域核查目标地址,推进 stage=2
      operationId: checkOrderResource
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /orders/{orderNo}/reserve:
    post:
      tags: [Order]
      summary: 环节3 端口预占:资源域占空闲端口并推进状态 PENDING→RESERVED
      operationId: reserveOrderPort
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /orders/{orderNo}/charge:
    post:
      tags: [Order]
      summary: 环节4 合同收费,并自动推进环节 5-8(标签预绑定/建档/预下发/派单)
      operationId: chargeOrder
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /tickets/{ticketNo}/activate:
    post:
      tags: [Order]
      summary: 环节10 激活(上门扫码后),并自动推进环节 11-12(激活回调/更新GIS)→ DONE
      operationId: activateTicket
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /orders/{orderNo}/check-preview:
    get:
      tags: [Order]
      summary: 核查预览(只读:地址下设备与端口分布,不推进订单)
      operationId: checkPreviewOrder
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /orders/{orderNo}/cancel:
    post:
      tags: [Order]
      summary: 订单取消(任一未完成状态→CANCELLED;与门户 portalOrderCancel 同语义)
      operationId: cancelOrder
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
