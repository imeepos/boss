paths:
  /quad-links:
    get:
      tags: [Quad]
      summary: 四码合一关联查询(资产/客户/端口/地址任一码反查,见 docs/contract/fields.md 5.1;代码不读任何参数,返回全量)
      operationId: queryQuadLinks
      responses:
        '200':
          description: 四码关联关系
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        assetCode: { type: string }
                        customerCode: { type: string, description: 客户域编码,取值为客户认证账号 LOID(与 worker 端一致) }
                        portCode: { type: string }
                        addrCode: { type: string }
                        status: { type: string, enum: [LINKED, CONFLICT, UNLINKED] }

  /quad-conflicts:
    get:
      tags: [Quad]
      summary: 四码对账冲突/告警列表
      operationId: listQuadConflicts
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /quad-conflicts/{id}/resolve:
    post:
      tags: [Quad]
      summary: 冲突处理(对齐 Go 实现 POST /quad-conflicts/:id/resolve)
      operationId: resolveQuadConflict
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /quad-links/by-asset:
    get:
      tags: [Quad]
      summary: 按资产码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByAsset
      parameters:
        - { name: assetId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-customer:
    get:
      tags: [Quad]
      summary: 按客户码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByCustomer
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-port:
    get:
      tags: [Quad]
      summary: 按端口码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByPort
      parameters:
        - { name: portId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-address:
    get:
      tags: [Quad]
      summary: 按地址码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByAddress
      parameters:
        - { name: addressId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/reconcile:
    post:
      tags: [Quad]
      summary: 四码对账(触发每日对账任务;对齐 Go 实现)
      operationId: reconcileQuadLinks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /scan-logs:
    get:
      tags: [Quad]
      summary: 扫码绑定记录(订单第 9 环节,预绑定 vs 现场扫码校验)
      operationId: listScanLogs
      parameters:
        - { name: orderId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
