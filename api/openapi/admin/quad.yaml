paths:
  /quad-links:
    post:
      tags: [Quad]
      summary: 新建四码绑定(装维前预绑定:资产+客户+端口+地址,status 默认 UNLINKED)
      operationId: createQuadLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, customerId, portId, addressId, legalEntityId]
              properties:
                assetId: { type: integer, format: int64 }
                customerId: { type: integer, format: int64 }
                portId: { type: integer, format: int64 }
                addressId: { type: integer, format: int64 }
                legalEntityId: { type: integer, format: int64 }
                legalEntityName: { type: string }
                status: { type: string, enum: [LINKED, CONFLICT, UNLINKED] }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    get:
      tags: [Quad]
      summary: 四码合一关联查询(资产/客户/端口/地址任一码反查,见 docs/contract/fields.md 5.1;代码不读任何参数,返回全量)
      operationId: queryQuadLinks
      responses:
        '200':
          description: 四码关联关系(data.items 为关联数组)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            assetCode: { type: string }
                            customerCode: { type: string, description: 客户域编码,取值为客户认证账号 LOID }
                            portCode: { type: string }
                            addrCode: { type: string }
                            status: { type: string, enum: [LINKED, CONFLICT, UNLINKED] }

  /quad-conflicts:
    get:
      tags: [Quad]
      summary: 四码对账冲突/告警列表
      operationId: listQuadConflicts
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /quad-conflicts/{id}/resolve:
    post:
      tags: [Quad]
      summary: 冲突处理(对齐 Go 实现 POST /quad-conflicts/:id/resolve)
      operationId: resolveQuadConflict
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /quad-links/by-asset:
    get:
      tags: [Quad]
      summary: 按资产码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByAsset
      parameters:
        - { name: assetId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-customer:
    get:
      tags: [Quad]
      summary: 按客户码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByCustomer
      parameters:
        - { name: customerId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-port:
    get:
      tags: [Quad]
      summary: 按端口码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByPort
      parameters:
        - { name: portId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/by-address:
    get:
      tags: [Quad]
      summary: 按地址码反查(对齐 Go 实现,permCode menu:quadlink)
      operationId: queryQuadLinksByAddress
      parameters:
        - { name: addressId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /quad-links/reconcile:
    post:
      tags: [Quad]
      summary: 四码对账(触发每日对账任务;对齐 Go 实现)
      operationId: reconcileQuadLinks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /quad-links/clearance-rate:
    get:
      tags: [Quad]
      summary: 四码冲突 4 小时清零率(7 天窗口;验收线 ≥95%,Q2)
      description: 000114 冲突时间线:Reconcile 标 CONFLICT 记 conflict_at,ResolveConflict 记 cleared_at;rate=clearedWithin4h/discovered,无事件=1。
      operationId: getQuadClearanceRate
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /scan-logs:
    get:
      tags: [Quad]
      summary: 扫码绑定记录(订单第 9 环节,预绑定 vs 现场扫码校验)
      operationId: listScanLogs
      parameters:
        - { name: orderId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /tickets/{ticketNo}/scan-bind:
    post:
      tags: [Quad]
      summary: 扫码绑定(环节 9;admin 面向 API key worker 主体/账号代扫场景)
      description: 与 worker 端 /tickets/{ticketNo}/scan-bind 同语义;实物光猫标签与预绑定核对,不一致 40920、未预绑定 40910。
      operationId: adminScanBind
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epc]
              properties:
                epc: { type: string, example: EPC-0001 }
                offline: { type: boolean, default: false, description: 弱网离线缓存补传 }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /tickets/{ticketNo}/dismantle/scan:
    post:
      tags: [Quad]
      summary: 拆机扫码解绑(端口释放;未解绑拆机被系统拦截)
      operationId: adminDismantleScan
      parameters:
        - { name: ticketNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epc]
              properties:
                epc: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /quad-links/purge-orphans:
    post:
      tags: [Quad]
      summary: 清理孤儿链路(删除四码引用主体已不存在的 UNLINKED 行)
      operationId: purgeOrphanQuadLinks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
