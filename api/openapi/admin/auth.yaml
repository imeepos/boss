paths:
  # 已移除 /auth/register:admin 端为封闭账号模型(契约 domain-map.md SYS 域),
  # 账号由超管引导(EnsureSuperAdmin)或 org/account 受权流程创建;客户侧注册属用户端 PORT-007。
  /auth/login:
    post:
      tags: [Auth]
      summary: 管理后台登录(账号密码)
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功(envelope;账号密码错误 code=401,见 apitypes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      accountId: { type: integer }
                      realName: { type: string }
                      roleName: { type: string }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 退出登录(token 无状态,前端清本地 token 即可)。
      operationId: adminLogout
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 滑动续期(token 仍有效时换发新 token,TTL 重置)
      description: 需 Bearer token;角色取 DB 最新快照。活跃期定时调用即可免二次登录。
      operationId: adminRefresh
      responses:
        '200':
          description: 新 token(envelope)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      token: { type: string }

  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户信息(header 展示;不含菜单树,菜单可见性由 roleCode 前端映射)
      operationId: adminMe
      responses:
        '200':
          description: 当前用户(envelope)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      accountId: { type: integer }
                      username: { type: string }
                      realName: { type: string }
                      phone: { type: string, description: 手机号(可空) }
                      roleCode: { type: string, description: 角色码(RoleCode 枚举,见 server-ts/src/enums.ts) }
                      roleName: { type: string }
                      legalEntityName: { type: string }
                      regionScope: { type: string, description: 区域数据范围(空=全集团) }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: 自助改密(旧口令 bcrypt 校验;新口令最短 6 位;API key 主体拒绝)
      operationId: adminChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200':
          description: envelope;旧口令错误 code=40100,参数非法 code=42200
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string }

  /auth/profile:
    put:
      tags: [Auth]
      summary: 自助改基本资料(仅 realName/phone;组织/角色仍走受权流程防自助提权)
      operationId: adminUpdateSelfProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realName]
              properties:
                realName: { type: string }
                phone: { type: string, description: 空串清空 }
      responses:
        '200':
          description: envelope;realName 缺失 code=42200
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string }
