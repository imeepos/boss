paths:
  /legal-entities:
    get:
      tags: [Org]
      summary: 子公司/法人列表(品牌×区域交叉经营)
      operationId: listLegalEntities
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }
    post:
      tags: [Org]
      summary: 新建法人
      operationId: createLegalEntity
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /legal-entities/{legalEntityId}:
    put:
      tags: [Org]
      summary: 编辑法人
      operationId: updateLegalEntity
      parameters:
        - { name: legalEntityId, in: path, required: true, schema: { type: integer } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /departments:
    get:
      tags: [Org]
      summary: 部门列表(含数据范围/工单队列/越权拦截)
      operationId: listDepartments
      parameters:
        - name: legalEntityId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }
    post:
      tags: [Org]
      summary: 新建部门(挂靠子公司,子公司内同名唯一;permCode menu:department)
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, name]
              properties:
                legalEntityId: { type: integer }
                name: { type: string, description: 64 位内 }
      responses:
        '200':
          description: 新建成功(envelope,data.id;40900=子公司内同名)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { id: { type: integer } } }

  /departments/{deptId}:
    put:
      tags: [Org]
      summary: 编辑部门(改挂靠/改名;permCode menu:department)
      operationId: updateDepartment
      parameters:
        - { name: deptId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, name]
              properties:
                legalEntityId: { type: integer }
                name: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /posts:
    get:
      tags: [Org]
      summary: 岗位列表(同名岗位跨子公司复用)
      operationId: listPosts
      parameters:
        - name: deptId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }
    post:
      tags: [Org]
      summary: 新建岗位(部门内 code 唯一;roles 全量绑定;permCode menu:post)
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deptId, code, name]
              properties:
                deptId: { type: integer }
                code: { type: string, description: 2-64 位,小写字母开头 }
                name: { type: string }
                roles: { type: array, items: { type: string }, description: 功能角色码,未知码 42200 }
      responses:
        '200':
          description: 新建成功(envelope,data.id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { id: { type: integer } } }

  /posts/{postId}:
    put:
      tags: [Org]
      summary: 编辑岗位(改名/换部门/重绑角色;permCode menu:post)
      operationId: updatePost
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deptId, code, name]
              properties:
                deptId: { type: integer }
                code: { type: string }
                name: { type: string }
                roles: { type: array, items: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /regions:
    get:
      tags: [Org]
      summary: '经营区域树(level: 1集团 2大区 3省 4城市)'
      operationId: listRegions
      parameters:
        - { name: parentPath, in: query, schema: { type: string }, description: 父区域路径前缀过滤 }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /permissions:
    get:
      tags: [Org]
      summary: 全量权限码清单(角色编辑抽屉数据源)
      operationId: listPermissions
      description: permissions 表全量 code/name;menu:menuperm 门禁
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /role-details:
    get:
      tags: [Org]
      summary: 角色详情全集(内置标记 + 权限码聚合)
      operationId: listRoleDetails
      description: 每角色含 id/code/name/isBuiltin/permissionCodes[];内置在前;menu:menuperm 门禁。内置角色权限集即"模板",前端新建派生角色以此为初始勾选。
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /roles/{roleId}:
    put:
      tags: [Org]
      summary: 编辑派生角色(改名 + 权限集全量替换)
      operationId: updateCustomRole
      description: 内置角色拒改(40300);menu:menuperm 门禁;permissionCodes 为全集,空=清空
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    delete:
      tags: [Org]
      summary: 删除派生角色(连同 role_permissions)
      operationId: deleteCustomRole
      description: 内置角色拒删(40300);被账号/岗位引用拒(40900);menu:menuperm 门禁
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /menu-perms:
    get:
      tags: [Org]
      summary: 菜单权限矩阵(三层权限模型 + 角色×菜单组可见性)
      description: 角色×menu:* 权限矩阵(data:{model:{layers[3]},matrix:{roleColumns,rows}})。
      operationId: getMenuPerms
      responses:
        '200':
          description: 权限矩阵
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: object
                    description: 三层权限模型说明(角色/菜单/数据)
                  matrix:
                    type: object
                    properties:
                      roleColumns:
                        type: array
                        items: { type: object }
                      rows:
                        type: array
                        items: { type: object }

  /data-scopes:
    get:
      tags: [Org]
      summary: 数据权限清单(账号级授权策略)
      operationId: listDataScopes
      description: 账号数据范围清单,keyword 过滤账号/姓名/角色;menu:datascope 门禁
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /regions/{regionId}/coverage:
    put:
      tags: [Org]
      summary: 区域覆盖主体划分(子公司划经营区域;legalEntityId=0 摘除回落祖先/总公司兜底)
      operationId: assignRegionCoverage
      parameters:
        - { name: regionId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId]
              properties:
                legalEntityId: { type: integer, format: int64 }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
