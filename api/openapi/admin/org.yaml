paths:
  /legal-entities:
    get:
      tags: [Org]
      summary: 子公司/法人列表(品牌×区域交叉经营)
      operationId: listLegalEntities
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }
    post:
      tags: [Org]
      summary: 新建法人
      operationId: createLegalEntity
      description: （未实现 planned）
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /legal-entities/{legalEntityId}:
    put:
      tags: [Org]
      summary: 编辑法人
      operationId: updateLegalEntity
      description: （未实现 planned）
      parameters:
        - { name: legalEntityId, in: path, required: true, schema: { type: integer } }
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /departments:
    get:
      tags: [Org]
      summary: 部门列表(含数据范围/工单队列/越权拦截)
      operationId: listDepartments
      parameters:
        - name: legalEntityId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /posts:
    get:
      tags: [Org]
      summary: 岗位列表(同名岗位跨子公司复用)
      operationId: listPosts
      parameters:
        - name: deptId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /regions:
    get:
      tags: [Org]
      summary: '经营区域树(level: 1集团 2大区 3省 4城市)'
      operationId: listRegions
      parameters:
        - { name: parentPath, in: query, schema: { type: string }, description: 父区域路径前缀过滤 }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /menu-perms:
    get:
      tags: [Org]
      summary: 菜单权限矩阵(三层权限模型 + 角色×菜单组可见性)
      description: |
        未实现:Go 后端(internal/app)尚未提供本接口,前端 A0 不依赖;
        菜单可见性暂由 /auth/me 的 roleCode 前端映射,待 /auth/menus 契约变更单落地后切换。
        （未实现 planned）
      operationId: getMenuPerms
      responses:
        '200':
          description: 权限矩阵
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: object
                    description: 三层权限模型说明(角色/菜单/数据)
                  matrix:
                    type: object
                    properties:
                      roleColumns:
                        type: array
                        items: { type: object }
                      rows:
                        type: array
                        items: { type: object }

  /data-scopes:
    get:
      tags: [Org]
      summary: 数据权限清单(账号级授权策略)
      operationId: listDataScopes
      description: （未实现 planned）
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
