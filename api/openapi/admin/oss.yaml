paths:
  /inventory-audit:
    get:
      tags: [Oss]
      summary: '资源台账稽核(P5-W3,三类计数+明细,只报不修;permCode menu:resource;每日快照 period=oss-audit-daily)'
      operationId: inventoryAudit
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, enum: [ownership, state, coding] } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /resources:
    get:
      tags: [Oss]
      summary: 网络资源清单(OSS/OLT/分光器;对齐 Go 实现 GET /resources,permCode menu:resource)
      operationId: listResources
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Oss]
      summary: '新建资源行(T2 存量导入配套;type 仅收 OLT/SPLITTER,code 全局唯一冲突 40900,addressId/legalEntityId 必填,status 缺省 ONLINE;permCode menu:resource)'
      operationId: createResource
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /resources/capacity:
    get:
      tags: [Oss]
      summary: '端口容量聚合(OLT/分光器维度;usageRate=USED/(USED+IDLE) 百分比两位小数,DISABLED/RESERVED 不入分母;对齐 Go 实现 GET /resources/capacity,permCode menu:resource)'
      operationId: resourceCapacity
      parameters:
        - { name: dim, in: query, required: false, schema: { type: string, enum: [OLT, SPLITTER] }, description: 空=全部类型 }
        - { name: order, in: query, required: false, schema: { type: string, enum: [usageDesc, usageAsc], default: usageDesc }, description: 按使用率排序方向,缺省倒序 }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /resources/capacity/alert-scan:
    post:
      tags: [Oss]
      summary: '容量阈值预警扫描(使用率>=80% 产生 WARNING 容量告警入告警体系;同一对象阈值状态变化才重复告警,周期重跑幂等;对齐 Go 实现 POST /resources/capacity/alert-scan,permCode menu:resource)'
      operationId: scanResourceCapacityAlert
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /ports:
    get:
      tags: [Oss]
      summary: '端口台账(status: IDLE/RESERVED/USED/DISABLED;对齐 Go 实现 GET /ports,按 resourceId 过滤)'
      operationId: listPorts
      parameters:
        - { name: resourceId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /ports/{portId}/change-history:
    get:
      tags: [Oss]
      summary: 端口变更历史(变更前后/触发来源;对齐 Go 实现 :portId)
      operationId: listPortChangeHistory
      parameters:
        - { name: portId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /ports/{portId}/path:
    get:
      tags: [Oss]
      summary: 'PON 端到端链路反查(端口→分光器→PON口→OLT 逐跳;portId 支持端口 ID 或端口编码;断链返回 missing 跳不报错;对齐 Go 实现 GET /ports/:portId/path)'
      operationId: portPath
      parameters:
        - { name: portId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reserves:
    get:
      tags: [Oss]
      summary: 端口预占记录(预占中/已超时/已释放)
      operationId: listReserves
      parameters:
        - { name: portId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reserves/{reserveId}/release:
    post:
      tags: [Oss]
      summary: 手动释放预占
      operationId: releaseReserve
      parameters:
        - { name: reserveId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /transfers:
    get:
      tags: [Oss]
      summary: 跨区域调配单(资产/端口/设备,归属变更台账)
      operationId: listTransfers
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Oss]
      summary: 新建调配申请(对齐 Go 实现 POST /transfers,必填 resourceId/fromRegionId/toRegionId,transferNo/status 缺省自动补)
      operationId: createTransfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, fromRegionId, toRegionId]
              properties:
                resourceId: { type: integer, format: int64 }
                fromRegionId: { type: integer, format: int64 }
                toRegionId: { type: integer, format: int64 }
                transferNo: { type: string }
                status: { type: string }
      responses:
        '200':
          description: 新建结果(data 含 id 与调配单号)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      transferNo: { type: string }

  /transfers/{transferNo}/approve:
    post:
      tags: [Oss]
      summary: 调配审批通过
      operationId: approveTransfer
      parameters:
        - { name: transferNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /transfers/{transferNo}/reject:
    post:
      tags: [Oss]
      summary: 调配审批驳回
      operationId: rejectTransfer
      parameters:
        - { name: transferNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /device/metrics:
    get:
      tags: [Oss]
      summary: 设备指标时序(对齐 Go 实现 GET /device/metrics,permCode menu:device;原 /olt-devices 的 OLT 设备监控语义(状态/丢包率/光功率/告警)合并于此,按 resourceId 过滤)
      operationId: listDeviceMetrics
      parameters:
        - { name: resourceId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /device/maintenances:
    get:
      tags: [Oss]
      summary: 设备维护记录(对齐 Go 实现 GET /device/maintenances,permCode menu:device)
      operationId: listDeviceMaintenances
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /lo-accounts:
    get:
      tags: [Oss]
      summary: '认证账号 LOID 分页列表(AAA 域,挂 oss 页面)'
      operationId: listLoAccounts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: LOID 或公司关键字 }
        - { name: status, in: query, schema: { type: string }, description: ACTIVE/SUSPENDED/CLOSED }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Oss]
      summary: 'AAA 建号(T2 存量导入配套;loid 全局唯一冲突 40900,customerId/offerId/qosTemplateId 必填,offer 须 PUBLISHED,billingMode 可选缺省 POSTPAID,法人缺省平台总公司,status 固定 ACTIVE;permCode menu:loaccount)'
      operationId: createLoAccount
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /lo-accounts/{loid}/reset-password:
    post:
      tags: [Oss]
      summary: 重置 LOID 接入密码(A1:随机生成,明文仅本次响应返回;menu:loaccount)
      operationId: resetLoAccountPassword
      parameters:
        - { name: loid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /expansions:
    get:
      tags: [Oss]
      summary: 扩容申请单列表
      operationId: listExpansions
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Oss]
      summary: 新建扩容申请(对齐 Go 实现 POST /expansions,必填 legalEntityId/regionId,expansionNo/status 缺省自动补)
      operationId: createExpansion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, regionId]
              properties:
                legalEntityId: { type: integer, format: int64 }
                regionId: { type: integer, format: int64 }
                expansionNo: { type: string }
                status: { type: string }
      responses:
        '200':
          description: 新建结果(data 含 id 与扩容单号)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      expansionNo: { type: string }

  /expansions/{expansionNo}/execute:
    post:
      tags: [Oss]
      summary: '执行扩容单(PENDING→DONE):目标设备按 expectedPorts 批量建端口(端口码续号,quad_code=端口码,IDLE 入池);已建满则直接完成;建口失败留 PENDING 可重试;设备须归属扩容单同一法人'
      operationId: executeExpansion
      parameters:
        - { name: expansionNo, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: { type: integer, format: int64 }
      responses:
        '200':
          description: 执行结果(data 含 created/existing/totalPorts/portCodes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created: { type: integer }
                      existing: { type: integer }
                      totalPorts: { type: integer }
                      portCodes: { type: array, items: { type: string } }

  /expansions/{expansionNo}/reject:
    post:
      tags: [Oss]
      summary: 扩容驳回(PENDING→DONE 终态;仅 PENDING 可驳回)
      operationId: rejectExpansion
      parameters:
        - { name: expansionNo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 驳回结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { nullable: true }

  /expansions/qos-templates:
    get:
      tags: [Oss]
      summary: 扩容 QoS 模板(对齐 Go 实现 GET /expansions/qos-templates)
      operationId: listExpansionQosTemplates
      parameters:
        - { name: legalEntityId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
