paths:
  /assets:
    get:
      tags: [Asset]
      summary: '资产台账清单(status: IN_STOCK/DEPLOYED/MAINTENANCE/SCRAPPED;代码不读查询参数,返回全量)'
      operationId: listAssets
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: '资产建档(P2-W1-T1;batchId 必填,企业快照自批次回填;状态固定 IN_STOCK;型号可选须在用,类型缺省由型号类别派生;标签可选绑定写 BIND 事件,已被其他资产占用 40900 整单回滚;assetCode 缺省服务端生成;建档同事务落初始轨迹行;sn/mac/loid 身份三要素可选,P3-T2:MAC 六组 hex(:或-分隔),唯一冲突 40900 含冲突字段名)'
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              properties:
                assetCode: { type: string, maxLength: 32, description: '资产编码(可空,缺省 A-批次8位-序号5位 自动生成)' }
                batchId: { type: integer, format: int64, description: '入库批次 ID(必填,缺失 42200)' }
                modelId: { type: integer, format: int64, description: '型号 ID(可选,须存在且未停用)' }
                tagId: { type: integer, format: int64, description: '标签 ID(可选,绑定成功写 BIND,占用 40900)' }
                type: { type: string, maxLength: 32, description: '类型(可选,未给定时由型号类别派生)' }
                sn: { type: string, description: '序列号(可选,P3-T2;去首尾空格,空串存 NULL;全网唯一 uq_assets_sn,冲突 40900)' }
                mac: { type: string, description: 'MAC 地址(可选,P3-T2;冒号/横杠/裸 hex 三形态输入,写入归一为大写冒号规范形 AA:BB:CC:DD:EE:FF,000190;全网唯一 uq_assets_mac 表达式索引,格式非法 42200/冲突 40900)' }
                loid: { type: string, description: '电信 LOID(可选,P3-T2;去首尾空格,空串存 NULL;全网唯一 uq_assets_loid,冲突 40900)' }
      responses:
        '200':
          description: 资产已建档(data 返回新 id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }

  /assets/{assetId}:
    get:
      tags: [Asset]
      summary: 资产详情(按 id 返回单条主档,含企业/区域快照;未命中 40400)
      operationId: getAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 资产主档
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      assetId: { type: integer, format: int64 }
                      assetCode: { type: string }
                      batchId: { type: integer, format: int64 }
                      legalEntityId: { type: integer, format: int64 }
                      legalEntityName: { type: string }
                      tagId: { type: integer, format: int64 }
                      addressId: { type: integer, format: int64 }
                      regionId: { type: integer, format: int64 }
                      regionName: { type: string }
                      type: { type: string }
                      modelId: { type: integer, format: int64 }
                      status: { type: string, enum: [IN_STOCK, DEPLOYED, MAINTENANCE, SCRAPPED] }
    put:
      tags: [Asset]
      summary: '受限编辑(P2-W1-T1;类型/型号/标签/批次 四键 + sn/mac/loid 身份三要素 P3-T2(指针语义:缺省=保持现值,空串=清除存 NULL);标签换绑同事务 UNBIND+BIND,冲突 40900 整单回滚;批次仅 IN_STOCK 可改并同步企业快照;状态与部署地址不在编辑范围走业务流转;字段无变化幂等成功)'
      operationId: updateAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              properties:
                type: { type: string, maxLength: 32, description: '类型(可空=由型号派生或保持现值)' }
                modelId: { type: integer, format: int64, description: '型号 ID(0=不挂型号)' }
                tagId: { type: integer, format: int64, description: '标签 ID(0=解绑,解绑写 UNBIND 事件)' }
                batchId: { type: integer, format: int64, description: '入库批次 ID(必填;仅 IN_STOCK 可改,同步企业归属快照)' }
                sn: { type: string, description: '序列号(P3-T2;缺省=保持,空串=清除存 NULL;全网唯一,冲突 40900 含字段名)' }
                mac: { type: string, description: 'MAC 地址(P3-T2;缺省=保持,空串=清除;六组 hex(:或-分隔),非法 42200)' }
                loid: { type: string, description: '电信 LOID(P3-T2;缺省=保持,空串=清除存 NULL)' }
      responses:
        '200':
          description: 编辑成功(data 返回更新后主档;无变化亦 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      assetId: { type: integer, format: int64 }
                      assetCode: { type: string }
                      status: { type: string }
    delete:
      tags: [Asset]
      summary: '守卫删除(P2-W1-T1;仅 IN_STOCK 且无标签绑定/持有台账/换新单/盘点明细/四码关联可物理删;命中任一引用 40900 且 message 列全阻断项;SCRAPPED 一律拒绝硬删提示走报废端点)'
      operationId: deleteAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 已物理删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }

  /assets/{assetId}/lifecycle:
    get:
      tags: [Asset]
      summary: 资产生命周期时间轴/流转记录(对齐 Go 实现 :assetId)
      operationId: listAssetLifecycle
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/batches:
    get:
      tags: [Asset]
      summary: 资产批次(对齐 Go 实现 GET /assets/batches)
      operationId: listAssetBatches
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/assignments:
    get:
      tags: [Asset]
      summary: 资产装维指派(对齐 Go 实现 GET /assets/assignments)
      operationId: listAssetAssignments
      parameters:
        - { name: assetId, in: query, schema: { type: integer, format: int64 }, description: 按资产 ID 过滤(代码读取 assetId) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /tags:
    get:
      tags: [Asset]
      summary: '电子标签列表(status: UNBOUND/BOUND/DISABLED)'
      operationId: listTags
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 建标签(P2-W2-T1 A;编号+EPC+频段必填且唯一,冲突 40900;状态缺省 UNBOUND;法人必填且须存在)
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, tagNo, epcCode, band]
              properties:
                legalEntityId: { type: integer, format: int64, description: 法人主体 ID(必填) }
                tagNo: { type: string, maxLength: 32, description: 标签编号(必填且唯一) }
                epcCode: { type: string, maxLength: 32, description: 'EPC 码(必填且唯一;P3-T2:24 位 hex 大小写不敏感,入库统一大写;头部字节须在 30/32/33/35 内,否则 42200)' }
                band: { type: string, maxLength: 8, description: 频段(必填,如 UHF) }
                battery: { type: string, maxLength: 8, description: 电量(可选) }
      responses:
        '200':
          description: 标签已建(data 返回新 id;编号/EPC 重复 40900;法人不存在 42200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }

  /tags/{tagId}/unbind:
    post:
      tags: [Asset]
      summary: 解绑标签(P1-T2;标签回 UNBOUND 可复用,写 UNBIND 事件;expectedAssetId 传入时校验当前绑定一致)
      operationId: unbindTag
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedAssetId: { type: integer, format: int64, description: 预期当前绑定资产 ID(可选,防误解绑) }
                reason: { type: string, maxLength: 255, description: 解绑原因(入事件流 detail) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /tags/{tagId}/events:
    get:
      tags: [Asset]
      summary: 标签事件流(P2-T4 消费面;id 倒序,limit 默认 50 上限 100;action 多值白名单 BIND/UNBIND/RECYCLE,白名单外 42200;标签不存在 40400)
      operationId: listTagEvents
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 }, description: 页大小(缺省 50,超限取 100) }
        - { name: before_id, in: query, schema: { type: integer, format: int64 }, description: 游标(只取 id 小于该值的事件;首版 UI 不用,翻页预留) }
        - { name: action, in: query, schema: { type: string, enum: [BIND, UNBIND, RECYCLE] }, description: 动作过滤(可重复传多值,缺省不过滤) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }


  /assets/{assetId}/events:
    get:
      tags: [Asset]
      summary: 资产事件流(P2-T4 消费面;口径同 /tags/{tagId}/events,资产不存在 40400)
      operationId: listAssetEvents
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 }, description: 页大小(缺省 50,超限取 100) }
        - { name: before_id, in: query, schema: { type: integer, format: int64 }, description: 游标(只取 id 小于该值的事件;首版 UI 不用,翻页预留) }
        - { name: action, in: query, schema: { type: string, enum: [BIND, UNBIND, RECYCLE] }, description: 动作过滤(可重复传多值,缺省不过滤) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/{assetId}/scrap:
    post:
      tags: [Asset]
      summary: 报废资产(P1-T2;任意非终态→SCRAPPED 终态幂等,标签强解绑写 RECYCLE 事件,轨迹落行,同事务)
      operationId: scrapAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 64, description: 报废原因(必填,入审计与事件流) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /asset-models:
    get:
      tags: [Asset]
      summary: 型号字典(P1-T3;含停用,管理端下拉与列表;UNIQUE vendor+model+category+partNumber)
      operationId: listAssetModels
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 建型号(P1-T3;冲突 40900;停用不物理删,引用由 assets.model_id 承载)
      operationId: createAssetModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, category]
              properties:
                vendor: { type: string, maxLength: 64, description: 厂商(可空) }
                model: { type: string, maxLength: 128, description: 型号名(必填) }
                category: { type: string, maxLength: 32, description: 类别(必填,如 ONU;Type 未给定时派生) }
                partNumber: { type: string, maxLength: 64, description: 料号(可空) }
                spec: { type: object, description: 规格键值(端口数/蒲式比等,JSONB) }
      responses:
        '200':
          description: 型号已建(data 返回新 id;冲突返回 40900+reason)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }

  /stocktakes:
    get:
      tags: [Asset]
      summary: 盘点任务列表
      operationId: listStocktakes
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 发起盘点任务
      operationId: createStocktake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, scope]
              properties:
                legalEntityId: { type: integer, format: int64, description: 法人主体 ID(必填,非 0) }
                scope: { type: string, description: 盘点范围(必填,非空) }
                status: { type: string, description: 状态,缺省 DOING }
      responses:
        '200':
          description: 盘点任务已创建(data 返回新任务 id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }

  /stocktakes/{taskId}/diff-handle:
    post:
      tags: [Asset]
      summary: 盘点关单(未处置差异非 0 → 40900;全处置完置 DONE)
      operationId: handleStocktakeDiff
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /stocktakes/{taskId}/scans:
    post:
      tags: [Asset]
      summary: 盘点扫码回填(预期行判 OK/MISMATCH,计划外行记 EXTRA,重算进度与差异数)
      operationId: scanStocktake
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, status]
              properties:
                assetId: { type: integer, format: int64, description: 资产 ID(必填,非 0) }
                status: { type: string, enum: [IN_STOCK, DEPLOYED, MAINTENANCE, SCRAPPED], description: 实盘所见状态 }
      responses:
        '200':
          description: 已回填(data 返回明细 id 与差异判定)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      itemId: { type: integer, format: int64 }
                      kind: { type: string, enum: [OK, MISMATCH, EXTRA] }

  /stocktakes/{taskId}/items:
    get:
      tags: [Asset]
      summary: "盘点差异明细清单(kind: PENDING/OK/MISMATCH/MISSING/EXTRA;resolution: OPEN/CONFIRMED/FIXED/ESCALATED)"
      operationId: listStocktakeItems
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /stocktakes/{taskId}/items/{itemId}/handle:
    post:
      tags: [Asset]
      summary: 差异逐条处置(CONFIRM 确认差异并按实盘修正台账 / FIX 现场核实台账为准 / ESCALATE 上报;FIX/ESCALATE 必填 note)
      operationId: handleStocktakeItem
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [CONFIRM, FIX, ESCALATE] }
                note: { type: string, maxLength: 255, description: 处理说明(FIX/ESCALATE 必填) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /replacements:
    get:
      tags: [Asset]
      summary: 设备更换单列表(代码不读查询参数,返回全量)
      operationId: listReplacements
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 新建设备更换单
      operationId: createReplacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: integer, format: int64, description: 被更换资产 ID(必填,非 0) }
                replacementNo: { type: string, description: 更换单号,缺省自动生成 RPL 前缀 }
                status: { type: string, description: 状态,缺省 PENDING }
      responses:
        '200':
          description: 更换单已创建(data 返回新单 id 与单号;法人快照自资产主档回填)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      replacementNo: { type: string }

  /replacements/{id}/assign:
    post:
      tags: [Asset]
      summary: 换新单派单(指派师傅,PENDING→DOING;adopted note 2026-08-27-replacement-ticket-flow)
      operationId: assignReplacement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: integer, format: int64, description: 指派师傅 ID(必填,在职) }
      responses:
        '200':
          description: 派单成功(data 返回更新后的更换单)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      replacementNo: { type: string }
                      status: { type: string, description: DOING }
                      workerId: { type: integer, format: int64 }
                      workerName: { type: string }
  /tags/{tagId}/disable:
    post:
      tags: [Asset]
      summary: 停用标签(P2-W2-T1 B;仅 UNBOUND 可停用,BOUND 必须先解绑 40900;已停用幂等;DISABLED 不可被绑定)
      operationId: disableTag
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: 停用原因(入审计) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /tags/{tagId}/enable:
    post:
      tags: [Asset]
      summary: 启用标签(P2-W2-T1 B;仅对 DISABLED 生效回 UNBOUND,非停用态幂等成功)
      operationId: enableTag
      parameters:
        - { name: tagId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
  /asset-models/{id}:
    put:
      tags: [Asset]
      summary: 编辑型号(P2-W2-T1 D;厂商/型号名/类别/料号/规格可改;四元组唯一冲突 40900;停用型号不可编辑 40900 先启用)
      operationId: updateAssetModel
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, category]
              properties:
                vendor: { type: string, maxLength: 64, description: 厂商 }
                model: { type: string, maxLength: 128, description: 型号名(必填) }
                category: { type: string, maxLength: 32, description: 类别(必填) }
                partNumber: { type: string, maxLength: 64, description: 料号 }
                spec: { type: object, description: 规格键值(JSONB) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /asset-models/{id}/disable:
    post:
      tags: [Asset]
      summary: 停用型号(P2-W2-T1 E;is_active 置否,不物理删,引用由 model_id 承载;幂等)
      operationId: disableAssetModel
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /asset-models/{id}/enable:
    post:
      tags: [Asset]
      summary: 启用型号(P2-W2-T1 E;is_active 置真;幂等)
      operationId: enableAssetModel
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /asset-batches:
    post:
      tags: [Asset]
      summary: 建批次(P2-W2-T1 F;名称+法人主体必填;批次编码缺省自动生成 RK-YYYYMMDD-NNNNN;法人不存在 42200)
      operationId: createAssetBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, name]
              properties:
                legalEntityId: { type: integer, format: int64, description: 法人主体 ID(必填,不存在 42200) }
                name: { type: string, maxLength: 64, description: 批次名称(必填) }
                code: { type: string, maxLength: 32, description: 批次编码(可选,缺省 RK-YYYYMMDD-NNNNN 自动生成) }
      responses:
        '200':
          description: 批次已建(data 返回 id 与编码)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      code: { type: string }

  /asset-assignments:
    post:
      tags: [Asset]
      summary: 领用(P2-W2-T1 G;资产+师傅+事由必填;仅 IN_STOCK 可领用否则 40900;落持有台账开段;资产状态不变,装机扫码才置 DEPLOYED)
      operationId: createAssetAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, workerId, reason]
              properties:
                assetId: { type: integer, format: int64, description: 资产 ID(必填,须 IN_STOCK) }
                workerId: { type: integer, format: int64, description: 师傅 ID(必填,须在职) }
                reason: { type: string, maxLength: 128, description: 领用事由(必填) }
      responses:
        '200':
          description: 已领用(data 返回台账 id 与 effectiveFrom)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      effectiveFrom: { type: string, format: date-time }

  /asset-assignments/{id}/return:
    post:
      tags: [Asset]
      summary: 归还(P2-W2-T1 H;闭合持有段 effective_to=now;重复归还 40900;写审计)
      operationId: returnAssetAssignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 已归还(data 返回台账 id 与 effectiveTo)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      effectiveTo: { type: string, format: date-time }

  /replacements/{id}/cancel:
    post:
      tags: [Asset]
      summary: 取消换新单(P2-W2-T1 I;仅 PENDING 可取消 → CANCELLED 终态;非 PENDING 40900;写审计)
      operationId: cancelReplacement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 已取消(data 返回取消后的更换单)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      replacementNo: { type: string }
                      status: { type: string, description: CANCELLED }
