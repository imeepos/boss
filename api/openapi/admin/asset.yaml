paths:
  /assets:
    get:
      tags: [Asset]
      summary: '资产台账清单(status: IN_STOCK/DEPLOYED/MAINTENANCE/SCRAPPED;代码不读查询参数,返回全量)'
      operationId: listAssets
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/{assetId}/lifecycle:
    get:
      tags: [Asset]
      summary: 资产生命周期时间轴/流转记录(对齐 Go 实现 :assetId)
      operationId: listAssetLifecycle
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/batches:
    get:
      tags: [Asset]
      summary: 资产批次(对齐 Go 实现 GET /assets/batches)
      operationId: listAssetBatches
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /assets/assignments:
    get:
      tags: [Asset]
      summary: 资产装维指派(对齐 Go 实现 GET /assets/assignments)
      operationId: listAssetAssignments
      parameters:
        - { name: assetId, in: query, schema: { type: integer, format: int64 }, description: 按资产 ID 过滤(代码读取 assetId) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /tags:
    get:
      tags: [Asset]
      summary: '电子标签列表(status: UNBOUND/BOUND/DISABLED)'
      operationId: listTags
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /stocktakes:
    get:
      tags: [Asset]
      summary: 盘点任务列表
      operationId: listStocktakes
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 发起盘点任务
      operationId: createStocktake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, scope]
              properties:
                legalEntityId: { type: integer, format: int64, description: 法人主体 ID(必填,非 0) }
                scope: { type: string, description: 盘点范围(必填,非空) }
                status: { type: string, description: 状态,缺省 DOING }
      responses:
        '200':
          description: 盘点任务已创建(data 返回新任务 id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }

  /stocktakes/{taskId}/diff-handle:
    post:
      tags: [Asset]
      summary: 盘点关单(未处置差异非 0 → 40900;全处置完置 DONE)
      operationId: handleStocktakeDiff
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /stocktakes/{taskId}/scans:
    post:
      tags: [Asset]
      summary: 盘点扫码回填(预期行判 OK/MISMATCH,计划外行记 EXTRA,重算进度与差异数)
      operationId: scanStocktake
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, status]
              properties:
                assetId: { type: integer, format: int64, description: 资产 ID(必填,非 0) }
                status: { type: string, enum: [IN_STOCK, DEPLOYED, MAINTENANCE, SCRAPPED], description: 实盘所见状态 }
      responses:
        '200':
          description: 已回填(data 返回明细 id 与差异判定)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      itemId: { type: integer, format: int64 }
                      kind: { type: string, enum: [OK, MISMATCH, EXTRA] }

  /stocktakes/{taskId}/items:
    get:
      tags: [Asset]
      summary: 盘点差异明细清单(kind: PENDING/OK/MISMATCH/MISSING/EXTRA;resolution: OPEN/CONFIRMED/FIXED/ESCALATED)
      operationId: listStocktakeItems
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /stocktakes/{taskId}/items/{itemId}/handle:
    post:
      tags: [Asset]
      summary: 差异逐条处置(CONFIRM 确认差异并按实盘修正台账 / FIX 现场核实台账为准 / ESCALATE 上报;FIX/ESCALATE 必填 note)
      operationId: handleStocktakeItem
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [CONFIRM, FIX, ESCALATE] }
                note: { type: string, maxLength: 255, description: 处理说明(FIX/ESCALATE 必填) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /replacements:
    get:
      tags: [Asset]
      summary: 设备更换单列表(代码不读查询参数,返回全量)
      operationId: listReplacements
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Asset]
      summary: 新建设备更换单
      operationId: createReplacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: integer, format: int64, description: 被更换资产 ID(必填,非 0) }
                replacementNo: { type: string, description: 更换单号,缺省自动生成 RPL 前缀 }
                status: { type: string, description: 状态,缺省 PENDING }
      responses:
        '200':
          description: 更换单已创建(data 返回新单 id 与单号;法人快照自资产主档回填)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      replacementNo: { type: string }

  /replacements/{id}/assign:
    post:
      tags: [Asset]
      summary: 换新单派单(指派师傅,PENDING→DOING;adopted note 2026-08-27-replacement-ticket-flow)
      operationId: assignReplacement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: integer, format: int64, description: 指派师傅 ID(必填,在职) }
      responses:
        '200':
          description: 派单成功(data 返回更新后的更换单)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  msg: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      replacementNo: { type: string }
                      status: { type: string, description: DOING }
                      workerId: { type: integer, format: int64 }
                      workerName: { type: string }
