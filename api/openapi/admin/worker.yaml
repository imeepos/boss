# 师傅管理(Worker) —— 师傅端用到的全部数据的后台管理契约。
# 实体单一事实源: migrations + internal/domain/worker(mock 已移除)。
paths:
  /worker-groups:
    get:
      tags: [Worker]
      summary: 师傅分组(对齐 Go 实现 GET /worker-groups,permCode menu:order)
      operationId: listWorkerGroups
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 新建班组(legalEntityId+code+name 唯一)
      operationId: createWorkerGroup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legalEntityId: { type: integer }
                code: { type: string }
                name: { type: string }
                leaderId: { type: integer }
                leaderName: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  # 师傅注册 / 审核 / 实名认证 子域(迁移 000050)。
  /worker-registrations:
    get:
      tags: [Worker]
      summary: 注册审核队列(按 status 过滤,空=全部)
      operationId: listWorkerRegistrations
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    # 自助注册提交在 worker 端契约(api/openapi/worker/auth.yaml),admin 只管审核。

  /worker-registrations/{id}/approve:
    post:
      tags: [Worker]
      summary: 审核通过(建 workers 主档 + 回填 worker_id)
      operationId: approveWorkerRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-registrations/{id}/reject:
    post:
      tags: [Worker]
      summary: 审核驳回(记 reviewNote)
      operationId: rejectWorkerRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /workers/{workerId}/real-name:
    get:
      tags: [Worker]
      summary: 师傅实名核验结果
      operationId: getWorkerRealName
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
    post:
      tags: [Worker]
      summary: 提交实名认证资料
      operationId: submitWorkerRealName
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                realName: { type: string }
                idCardNo: { type: string }
                method: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /workers/{workerId}/real-name/verify:
    post:
      tags: [Worker]
      summary: 后台实名核验(PASS/FAIL)
      operationId: verifyWorkerRealName
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { type: string, enum: [PASS, FAIL] }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /workers:
    get:
      tags: [Worker]
      summary: 师傅台账(主档×接单设置×月绩效,含在途工单数)
      operationId: listWorkers
      parameters:
        - { name: groupId, in: query, schema: { type: integer, format: int64 } }
        - $ref: './schemas.yaml#/components/parameters/keyword'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /workers/{workerId}:
    get:
      tags: [Worker]
      summary: 师傅详情
      operationId: getWorker
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /workers/{workerId}/settings:
    put:
      tags: [Worker]
      summary: 修改接单设置(在线/半径/接单类型),即时生效于师傅端
      operationId: saveWorkerSettings
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                online: { type: boolean }
                radiusKm: { type: number }
                acceptTypes: { type: array, items: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-performances:
    get:
      tags: [Worker]
      summary: 月度绩效排名(完成量/准时率/评分)
      operationId: listWorkerPerformances
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-commissions:
    get:
      tags: [Worker]
      summary: 提成结算明细
      operationId: listWorkerCommissions
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-feedbacks:
    get:
      tags: [Worker]
      summary: 客户评价(差评待复核)
      operationId: listWorkerFeedbacks
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-feedbacks/{feedbackId}/review:
    post:
      tags: [Worker]
      summary: 差评复核
      operationId: reviewWorkerFeedback
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-messages:
    get:
      tags: [Worker]
      summary: 消息下发记录
      operationId: listWorkerMessages
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 下发消息(即时出现在师傅端消息中心)
      operationId: sendWorkerMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                workerId: { type: integer }
                level: { type: string, enum: [INFO, WARN, URGENT] }
                title: { type: string }
                content: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /notices:
    get:
      tags: [Worker]
      summary: 公告列表(含已下架)
      operationId: listNotices
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 发布公告(师傅端公告页即时可见)
      operationId: publishNotice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                category: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /notices/{noticeId}/toggle:
    put:
      tags: [Worker]
      summary: 公告上架/下架
      operationId: toggleNotice
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /faqs:
    get:
      tags: [Worker]
      summary: FAQ 知识库(含停用)
      description: （未实现 planned）
      operationId: listFaqs
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 新增 FAQ
      description: （未实现 planned）
      operationId: createFaq
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                summary: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /faqs/{faqId}/toggle:
    put:
      tags: [Worker]
      summary: FAQ 启用/停用
      description: （未实现 planned）
      operationId: toggleFaq
      parameters:
        - { name: faqId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-materials:
    get:
      tags: [Worker]
      summary: 随车物料台账
      operationId: listWorkerMaterials
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-tools:
    get:
      tags: [Worker]
      summary: 工具借用台账
      operationId: listWorkerTools
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /asset-returns:
    get:
      tags: [Worker]
      summary: 旧件待回收/返修登记(epc 挂资产台账)
      operationId: listAssetReturns
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /asset-returns/{returnId}/confirm:
    post:
      tags: [Worker]
      summary: 确认返库
      operationId: confirmAssetReturn
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /device-maintenances:
    get:
      tags: [Worker]
      summary: 设备健康观察(师傅端主动运维列表)
      description: （未实现 planned）
      operationId: listDeviceMaintenances
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /hall-items:
    get:
      tags: [Worker]
      summary: 抢单池任务(未指派抢修单 + 应急/预告附加任务)
      description: （未实现 planned）
      operationId: listHallItems
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /service-messages:
    get:
      tags: [Worker]
      summary: 调度会话记录
      description: （未实现 planned）
      operationId: listServiceMessages
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 调度下发会话
      description: （未实现 planned）
      operationId: sendServiceMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workerId: { type: integer }
                content: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-schedules:
    get:
      tags: [Worker]
      summary: 师傅月排期忙日
      operationId: listWorkerSchedules
      parameters:
        - { name: workerId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
