# 师傅管理(Worker) —— 师傅端用到的全部数据的后台管理契约。
# 实体单一事实源: api/mock/worker/entities.js(经 db.js 聚合);
# 师傅端视图(api/mock/worker/data.js)由此派生,后台改动即时生效。
paths:
  /workers:
    get:
      tags: [Worker]
      summary: 师傅台账(主档×接单设置×月绩效,含在途工单数)
      operationId: listWorkers
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /workers/{workerId}:
    get:
      tags: [Worker]
      summary: 师傅详情
      operationId: getWorker
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /workers/{workerId}/settings:
    put:
      tags: [Worker]
      summary: 修改接单设置(在线/半径/接单类型),即时生效于师傅端
      operationId: saveWorkerSettings
      parameters:
        - { name: workerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                online: { type: boolean }
                radiusKm: { type: number }
                acceptTypes: { type: array, items: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-performances:
    get:
      tags: [Worker]
      summary: 月度绩效排名(完成量/准时率/评分)
      operationId: listWorkerPerformances
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-commissions:
    get:
      tags: [Worker]
      summary: 提成结算明细
      operationId: listWorkerCommissions
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-feedbacks:
    get:
      tags: [Worker]
      summary: 客户评价(差评待复核)
      operationId: listWorkerFeedbacks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-feedbacks/{feedbackId}/review:
    post:
      tags: [Worker]
      summary: 差评复核
      operationId: reviewWorkerFeedback
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-messages:
    get:
      tags: [Worker]
      summary: 消息下发记录
      operationId: listWorkerMessages
      parameters:
        - { name: workerId, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 下发消息(即时出现在师傅端消息中心)
      operationId: sendWorkerMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                workerId: { type: integer }
                level: { type: string, enum: [INFO, WARN, URGENT] }
                title: { type: string }
                content: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /notices:
    get:
      tags: [Worker]
      summary: 公告列表(含已下架)
      operationId: listNotices
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 发布公告(师傅端公告页即时可见)
      operationId: publishNotice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                category: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /notices/{noticeId}/toggle:
    put:
      tags: [Worker]
      summary: 公告上架/下架
      operationId: toggleNotice
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /faqs:
    get:
      tags: [Worker]
      summary: FAQ 知识库(含停用)
      operationId: listFaqs
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 新增 FAQ
      operationId: createFaq
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                summary: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /faqs/{faqId}/toggle:
    put:
      tags: [Worker]
      summary: FAQ 启用/停用
      operationId: toggleFaq
      parameters:
        - { name: faqId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-materials:
    get:
      tags: [Worker]
      summary: 随车物料台账
      operationId: listWorkerMaterials
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /worker-tools:
    get:
      tags: [Worker]
      summary: 工具借用台账
      operationId: listWorkerTools
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /asset-returns:
    get:
      tags: [Worker]
      summary: 旧件待回收/返修登记(epc 挂资产台账)
      operationId: listAssetReturns
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /asset-returns/{returnId}/confirm:
    post:
      tags: [Worker]
      summary: 确认返库
      operationId: confirmAssetReturn
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /device-maintenances:
    get:
      tags: [Worker]
      summary: 设备健康观察(师傅端主动运维列表)
      operationId: listDeviceMaintenances
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /hall-items:
    get:
      tags: [Worker]
      summary: 抢单池任务(未指派抢修单 + 应急/预告附加任务)
      operationId: listHallItems
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /service-messages:
    get:
      tags: [Worker]
      summary: 调度会话记录
      operationId: listServiceMessages
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Worker]
      summary: 调度下发会话
      operationId: sendServiceMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workerId: { type: integer }
                content: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-schedules:
    get:
      tags: [Worker]
      summary: 师傅月排期忙日
      operationId: listWorkerSchedules
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
