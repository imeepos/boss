paths:
  /bills:
    get:
      tags: [Billing]
      summary: 出账管理(账单列表)
      operationId: listBills
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /payments:
    get:
      tags: [Billing]
      summary: 缴费记录列表
      operationId: listPayments
      parameters:
        - { name: billId, in: query, schema: { type: integer, format: int64 }, description: 按账单过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /arrears:
    get:
      tags: [Billing]
      summary: 欠费停复机列表(明细)
      operationId: listArrears
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /arrears/{customerId}/stop:
    post:
      tags: [Billing]
      summary: 欠费停机(生成停机任务)
      operationId: stopArrearsCustomer
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /arrears/{customerId}/resume:
    post:
      tags: [Billing]
      summary: 欠费复机
      operationId: resumeArrearsCustomer
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /stop-resume-tasks:
    get:
      tags: [Billing]
      summary: 停复机执行状态列表(网络侧结果)
      operationId: listStopResumeTasks
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /stop-resume-tasks/{taskId}/retry:
    post:
      tags: [Billing]
      summary: 失败任务重试
      operationId: retryStopResumeTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reconciliations:
    get:
      tags: [Billing]
      summary: 缴费渠道对账批次列表
      operationId: listReconciliations
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - $ref: './schemas.yaml#/components/parameters/status'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reconciliations/{batchNo}/settle:
    post:
      tags: [Billing]
      summary: 差异挂起批次平账
      operationId: settleReconciliation
      parameters:
        - { name: batchNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /billing-runs:
    post:
      tags: [Billing]
      summary: 出账+自动开票(同账期不重复开票,失败账单返人工)
      operationId: runBillingPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "2026-08" }
      responses:
        '200':
          description: envelope;data 含 bills(生成账单数)与 invoices(开票结果)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      bills: { type: integer }
                      invoices: { type: object }

  /invoices/{id}/void:
    post:
      tags: [Billing]
      summary: 作废发票(编号保留不回收,VOID)
      operationId: voidInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /invoices/{id}/reissue:
    post:
      tags: [Billing]
      summary: 重开发票(原票 VOID 保留 + 新票新号,TAX-003)
      operationId: reissueInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: envelope;data.invoice 为新发票
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      invoice: { type: object }

  /invoices/{id}/tax-submit:
    post:
      tags: [Billing]
      summary: 税局网关提交(按属地取网关;人工通道返回 42200 提示走回填)
      operationId: taxSubmitInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: envelope;data.receipt 为税局回执
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      receipt: { type: object }

  /invoices/{id}/tax-backfill:
    post:
      tags: [Billing]
      summary: 人工通道回填税局票号(运营者在税局平台开具后登记)
      operationId: taxBackfillInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taxNo]
              properties:
                taxNo: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
