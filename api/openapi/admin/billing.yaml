paths:
  /billing/ledger-recon:
    get:
      tags: [Billing]
      summary: 账实核对(应收/实收/开票三角,按账单定位差异;permCode menu:paycheck)
      operationId: ledgerRecon
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 账期 YYYY-MM }
        - { name: legalEntityId, in: query, schema: { type: integer, format: int64 }, description: 按法人过滤(0=数据范围内全部) }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /bills:
    get:
      tags: [Billing]
      summary: 出账管理(账单列表)
      operationId: listBills
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /payments:
    get:
      tags: [Billing]
      summary: 缴费记录列表
      operationId: listPayments
      parameters:
        - { name: billId, in: query, schema: { type: integer, format: int64 }, description: 按账单过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /payments/{id}/refund:
    post:
      tags: [Billing]
      summary: 全额退款(000112;流水 REFUNDED 留痕+账单回 UNPAID;permCode menu:payment)
      operationId: refundPayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 流水 id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: 退款原因(留痕) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /ar-metrics:
    get:
      tags: [Billing]
      summary: 应收信用账龄与停机指标
      operationId: arMetrics
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /collection-tasks:
    get:
      tags: [Billing]
      summary: 应收催收任务队列
      operationId: listCollectionTasks
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, DOING, DONE, FAILED] } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /collection-tasks/{taskId}/status:
    post:
      tags: [Billing]
      summary: 更新催收任务状态(人工可接管)
      operationId: updateCollectionTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING, DOING, DONE, FAILED] }
                outcome: { type: string }
                note: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /arrears:
    get:
      tags: [Billing]
      summary: 欠费停复机列表(明细)
      operationId: listArrears
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /ar/aging-snapshots:
    post:
      tags: [Billing]
      summary: 生成每日账龄快照(按客户+日期幂等)
      operationId: generateAgingSnapshots
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
    get:
      tags: [Billing]
      summary: 查询每日账龄快照
      operationId: listAgingSnapshots
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }

  /ar/payment-promises:
    get:
      tags: [Billing]
      summary: 承诺还款列表
      operationId: listPaymentPromises
      parameters: [{ name: customerId, in: query, schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
    post:
      tags: [Billing]
      summary: 创建承诺还款
      operationId: createPaymentPromise
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PaymentPromiseInput' } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }

  /ar/payment-promises/{id}/status:
    post:
      tags: [Billing]
      summary: 更新承诺还款状态
      operationId: updatePaymentPromiseStatus
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [OPEN, FULFILLED, BROKEN, CANCELED] } } } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }

  /ar/writeoffs:
    get:
      tags: [Billing]
      summary: 核销记录列表
      operationId: listWriteoffs
      parameters: [{ name: customerId, in: query, schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
    post:
      tags: [Billing]
      summary: 创建核销记录
      operationId: createWriteoff
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WriteoffInput' } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }

  /dunning-runs:
    post:
      tags: [Billing]
      summary: 欠费催收批处理(逾期标记+欠费快照+超停机线自动停机;permCode menu:stopsrv)
      operationId: runDunning
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                graceDays: { type: integer, description: 宽限天数(账单生成起算),缺省 15 }
                stopAfterDays: { type: integer, description: 最早逾期超此天数即停机,缺省 30 }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /arrears/{customerId}/stop:
    post:
      tags: [Billing]
      summary: 欠费停机(生成停机任务)
      operationId: stopArrearsCustomer
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /arrears/{customerId}/resume:
    post:
      tags: [Billing]
      summary: 欠费复机
      operationId: resumeArrearsCustomer
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /stop-resume-tasks:
    get:
      tags: [Billing]
      summary: 停复机执行状态列表(网络侧结果)
      operationId: listStopResumeTasks
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /stop-resume-tasks/{taskId}/retry:
    post:
      tags: [Billing]
      summary: 失败任务重试
      operationId: retryStopResumeTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reconciliations:
    get:
      tags: [Billing]
      summary: 缴费渠道对账批次列表
      operationId: listReconciliations
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reconciliations/{batchNo}/items:
    get:
      tags: [Billing]
      summary: 对账批次行级明细(D6 差异定位)
      operationId: listReconciliationItems
      parameters:
        - { name: batchNo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: envelope;data.items 为行级明细,渠道独有流水 paymentId 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            batchId: { type: integer }
                            paymentId: { type: integer, nullable: true, description: 软引用 payments;渠道独有流水为 null }
                            channelRef: { type: string, description: 渠道流水号,与 pay_no 比对 }
                            amount: { type: number }
                            diffKind: { type: string, description: 差异种类(MATCH/MISSING_SYSTEM/MISSING_CHANNEL/AMOUNT_MISMATCH 等) }
                            note: { type: string }

  /reconciliations/{batchNo}/statement:
    post:
      tags: [Billing]
      summary: 渠道侧流水录入并自动比对生成明细
      description: 本期手工录入渠道流水(自动拉流水不在范围);重复录入整体替换明细。
      operationId: recordReconciliationStatement
      parameters:
        - { name: batchNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channelRef, amount]
                    properties:
                      channelRef: { type: string }
                      amount: { type: number }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reconciliations/auto:
    post:
      tags: [Billing]
      summary: 自动对账(按渠道建当日批次并拉流水比对;幂等)
      description: 当日批次已存在则复用;manual 渠道只建批待手工录入;单渠道失败不中断。
      operationId: autoReconcile
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: 对账日,缺省今天 }
        - { name: channels, in: query, schema: { type: string }, description: 逗号分隔渠道目录,缺省 微信,支付宝,线下营业厅 }
      responses:
        '200':
          description: envelope;data.items 为逐渠道编排结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            channel: { type: string }
                            batchNo: { type: string }
                            status: { type: string, description: DIFF_PENDING / SETTLED / MANUAL_PENDING }
                            skipped: { type: string, description: 非空=该渠道本轮未比对,值为原因 }

  /reconciliations/{batchNo}/settle:
    post:
      tags: [Billing]
      summary: 差异挂起批次平账
      operationId: settleReconciliation
      parameters:
        - { name: batchNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /billing-runs:
    post:
      tags: [Billing]
      summary: 出账+自动开票(同账期不重复开票,失败账单返人工)
      operationId: runBillingPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "2026-08" }
      responses:
        '200':
          description: envelope;data 含 bills(生成账单数)与 invoices(开票结果)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      bills: { type: integer }
                      invoices: { type: object }

  /invoices:
    get:
      tags: [Billing]
      summary: 发票列表(TAX 域)
      operationId: listInvoices
      parameters:
        - { name: customerId, in: query, schema: { type: integer, format: int64 }, description: 按客户过滤 }
      responses:
        '200':
          description: envelope;data.items 为发票(billing.Invoice,ISSUED/VOIDED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }

  /invoices/{id}/void:
    post:
      tags: [Billing]
      summary: 作废发票(编号保留不回收,VOID)
      operationId: voidInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /invoices/{id}/reissue:
    post:
      tags: [Billing]
      summary: 重开发票(原票 VOID 保留 + 新票新号,TAX-003)
      operationId: reissueInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: envelope;data.invoice 为新发票
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      invoice: { type: object }

  /invoices/{id}/tax-submit:
    post:
      tags: [Billing]
      summary: 税局网关提交(按属地取网关;人工通道返回 42200 提示走回填)
      operationId: taxSubmitInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: envelope;data.receipt 为税局回执
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      receipt: { type: object }

  /invoices/{id}/tax-backfill:
    post:
      tags: [Billing]
      summary: 人工通道回填税局票号(运营者在税局平台开具后登记)
      operationId: taxBackfillInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taxNo]
              properties:
                taxNo: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /invoices/{id}/tax-events:
    get:
      tags: [Billing]
      summary: 发票税局轨迹回放(回执/回填/作废/重开留痕,时间正序;permCode menu:billing)
      operationId: listInvoiceTaxEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

components:
  schemas:
    PaymentPromiseInput:
      type: object
      required: [customerId, amount, promisedAt, dueAt]
      properties:
        customerId: { type: integer, format: int64 }
        amount: { type: number }
        promisedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
    WriteoffInput:
      type: object
      required: [customerId, amount, reason]
      properties:
        customerId: { type: integer, format: int64 }
        amount: { type: number }
        reason: { type: string }
        approvedBy: { type: integer, format: int64, nullable: true }
    Invoice:
      type: object
      description: 电子发票(billing.Invoice;业务状态 ISSUED/VOIDED 与税局网关状态正交)
      properties:
        id: { type: integer, format: int64 }
        invoiceNo: { type: string, description: 内部流水号(原 ARN),如 INV-00000001 }
        billId: { type: integer, format: int64 }
        billNo: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string, description: 快照 }
        title: { type: string, description: 发票抬头,默认客户名 }
        netAmount: { type: number, description: 不含税净额(=账单金额) }
        vatRate: { type: number, description: 税率,如 0.12 }
        vatAmount: { type: number }
        totalAmount: { type: number }
        status: { type: string, description: ISSUED/VOIDED }
        voidReason: { type: string }
        taxJurisdiction: { type: string, description: CN/PH,空=未定 }
        taxChannel: { type: string, description: manual/leqi/bir_eis }
        taxStatus: { type: string, description: PENDING/SUBMITTED/ISSUED/FAILED }
        taxNo: { type: string, description: 税局票号,ISSUED 时非空 }
        taxFailReason: { type: string }
        issuedAt: { type: string, format: date-time }
  /dunning-runs:
    post:
      summary: 欠费催收批处理(宽限/停机线天数可配,缺省 15/30)
      tags: [Billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                graceDays: { type: integer }
                stopAfterDays: { type: integer }
      responses:
        '200': { description: 催收执行结果 }
