# 公共响应组件(admin 端)
# V1.1 对齐 Go 实现(internal/app/http.go respond):统一 envelope {code,msg,data},HTTP 恒 200。
# 域文件 inline schema 均描述 data 负载;列表 data 为 {items:[...]} 对象。
components:
  responses:
    Ok:
      description: 操作成功(code=0,data 由各接口定义或为空)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, example: 0 }
              msg: { type: string, example: ok }
    List:
      description: 列表(data 为对象,含 items 数组)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, example: 0 }
              msg: { type: string, example: ok }
              data:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
    Item:
      description: 单条记录(data 为平铺对象;未命中 code=404)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, example: 0 }
              msg: { type: string, example: ok }
              data: { type: object }

  parameters:
    keyword:
      name: keyword
      in: query
      schema: { type: string }
      description: 关键字搜索(单号/客户/编码等,按页面占位提示)
    status:
      name: status
      in: query
      schema: { type: string }
      description: 状态过滤(枚举见 docs/contract/terms.md 第 3/4 节)

  schemas:
    OpenPlatApp:
      type: object
      description: 开放应用元数据(不含 Secret,迁移 000121)
      properties:
        id: { type: integer, format: int64 }
        appId: { type: string, example: op_0123456789abcdef }
        name: { type: string }
        status: { type: integer, enum: [0, 1] }
        rateLimitRpm: { type: integer }
        dailyQuota: { type: integer }
        sandbox: { type: boolean }
        lastUsedAt: { type: string, description: ISO8601,空=从未使用 }
        createdAt: { type: string }
    OpenPlatAppCreated:
      allOf:
        - $ref: '#/components/schemas/OpenPlatApp'
        - type: object
          properties:
            secret: { type: string, description: 应用密钥,仅创建响应返回一次 }
    OpenPlatSubscription:
      type: object
      description: Webhook 事件订阅(M2 投递器消费)
      properties:
        id: { type: integer, format: int64 }
        appId: { type: integer, format: int64, description: open_apps.id }
        eventType: { type: string, example: order.activated }
        endpointUrl: { type: string }
        status: { type: integer, enum: [0, 1] }
        createdAt: { type: string }
