# 对齐说明(V1.1):Go 后端当前仅实现 /addresses 与 /addresses/import(permCode menu:address/menu:importer);
# /accounts /roles /params /audit-logs /import-tasks 尚未实现,前端消费前需确认后端交付。
paths:
  /accounts:
    get:
      tags: [Sys]
      summary: 账号与角色列表（未实现 planned）
      operationId: listAccounts
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Sys]
      summary: 新建账号（未实现 planned）
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /accounts/{accountId}:
    put:
      tags: [Sys]
      summary: 编辑账号(角色/部门/岗位/数据范围/启停)（未实现 planned）
      operationId: updateAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    delete:
      tags: [Sys]
      summary: 删除账号（未实现 planned）
      operationId: deleteAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /roles:
    get:
      tags: [Sys]
      summary: 角色列表(7 角色码见 fields.md 1.2)（未实现 planned）
      operationId: listRoles
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /addresses:
    get:
      tags: [Sys]
      summary: 地址层级树(ltree 物化路径,见 ADR-002)
      operationId: listAddresses
      parameters:
        - { name: parentId, in: query, schema: { type: integer, format: int64 }, description: 父地址ID层级过滤 }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /addresses/import:
    post:
      tags: [Sys]
      summary: 地址批量导入(对齐 Go 实现 POST /addresses/import,permCode menu:importer)
      operationId: importAddresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    required: [path, name]
                    properties:
                      path: { type: string, description: ltree 物化路径 }
                      name: { type: string }
      responses:
        '200':
          description: data 含导入条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      imported: { type: integer }

  /params:
    get:
      tags: [Sys]
      summary: 业务参数列表（未实现 planned）
      operationId: listParams
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /params/{key}:
    put:
      tags: [Sys]
      summary: 修改业务参数（未实现 planned）
      operationId: updateParam
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /audit-logs:
    get:
      tags: [Sys]
      summary: 审计日志(操作类型:状态变更/数据变更/权限变更)（未实现 planned）
      operationId: listAuditLogs
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /import-tasks:
    get:
      tags: [Sys]
      summary: 数据导入任务列表(地址/客户/端口/资产台账)（未实现 planned）
      operationId: listImportTasks
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Sys]
      summary: 新建导入任务(上传文件)（未实现 planned）
      operationId: createImportTask
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
