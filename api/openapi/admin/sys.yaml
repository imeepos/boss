# 对齐说明(V1.4):Go 后端已实现 /accounts(GET/POST)、/accounts/{id}(PUT)、/roles(均 menu:account)、
# /params(GET/PUT,menu:params)、/audit-logs(GET,menu:audit,items+operator 联查)、
# /import-tasks(GET,menu:importer)、/api-keys(系列)与 /addresses(系列)。
paths:
  /accounts:
    get:
      tags: [Sys]
      summary: 账号与角色列表(裸数组;permCode menu:account)
      operationId: listAccounts
      responses:
        '200':
          description: data 为裸数组(respond(c,OK,list))
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/AccountRow' } }
    post:
      tags: [Sys]
      summary: 受权建号(封闭模型,上级分配;permCode menu:account;40900=账号已存在,42200=入参不合法)
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200':
          description: 建号成功(envelope,data.id=新账号 id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { id: { type: integer } } }

  /accounts/{accountId}:
    put:
      tags: [Sys]
      summary: 受权改号(角色/组织/数据范围/启停/改密;密码留空不改;permCode menu:account)
      operationId: updateAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    delete:
      tags: [Sys]
      summary: 删除账号（未实现 planned）
      operationId: deleteAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /roles:
    get:
      tags: [Sys]
      summary: 角色列表(7 角色码见 fields.md 1.2;permCode menu:account)
      operationId: listRoles
      responses:
        '200':
          description: data 为裸数组 [{code,name}]
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: ops }
                        name: { type: string, example: 业务运营 }

  /addresses:
    get:
      tags: [Sys]
      summary: 地址层级树(ltree 物化路径,见 ADR-002)
      operationId: listAddresses
      parameters:
        - { name: parentId, in: query, schema: { type: integer, format: int64 }, description: 父地址ID层级过滤 }
        - { name: unlinked, in: query, schema: { type: string }, description: 值为 1 时仅返回未挂接根节点 }
      responses:
        '200':
          description: data 为裸数组(代码 respond(c,OK,list),非 {items} 包装)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { type: array, items: { type: object } }

  /addresses/import:
    post:
      tags: [Sys]
      summary: 地址批量导入(对齐 Go 实现 POST /addresses/import,permCode menu:importer)
      operationId: importAddresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    required: [path, name]
                    properties:
                      path: { type: string, description: ltree 物化路径 }
                      name: { type: string }
                      countryCode: { type: string, description: 国家 alpha-2,可选 }
                      adminCode: { type: string, description: 一级区划码,可选 }
      responses:
        '200':
          description: data 含导入条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      imported: { type: integer }

  /addresses/{id}:
    put:
      tags: [Sys]
      summary: 编辑地址节点(menu:address)
      operationId: updateAddress
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
    delete:
      tags: [Sys]
      summary: 删除地址节点(有子节点/引用时拒绝)
      operationId: deleteAddress
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /addresses/{id}/geo:
    put:
      tags: [Sys]
      summary: 设置地址国际锚点(countryCode 两位 + adminCode,经 geo 域校验)
      operationId: setAddressGeo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countryCode]
              properties:
                countryCode: { type: string, minLength: 2, maxLength: 2 }
                adminCode: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /addresses/search:
    get:
      tags: [Sys]
      summary: 全树搜索(命中节点+祖先链,懒加载树展开用)
      operationId: searchAddresses
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /params:
    get:
      tags: [Sys]
      summary: 业务参数清单(permCode menu:params;data.items=[{key,value,desc}])
      operationId: listParams
      responses:
        '200':
          description: 全量业务参数(biz_params 表)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string }
                            value: { type: string, description: 标量文本(JSONB 去引号) }
                            desc: { type: string }
  /params/{key}:
    put:
      tags: [Sys]
      summary: 修改业务参数(不存在则插入;permCode menu:params;审计"数据变更")
      operationId: updateParam
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /auth-config:
    get:
      tags: [Sys]
      summary: 号码认证配置全量(permCode menu:authconfig;secret 只回 hasValue 掩码标记)
      operationId: getAuthConfig
      responses:
        '200':
          description: data.fields 以全 key(auth.cn.appKey 等)为索引;secret 字段 value 恒空
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value: { type: string, description: 标量文本;secret 字段恒空串 }
                            hasValue: { type: boolean, description: secret 字段是否已配置 }
  /auth-config/{group}:
    put:
      tags: [Sys]
      summary: 分组部分更新(group∈cn/my/fallback;permCode menu:authconfig;secret 空串=不修改,密文落库)
      operationId: updateAuthConfig
      parameters:
        - { name: group, in: path, required: true, schema: { type: string, enum: [cn, my, fallback] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: 全 key map,如 {"auth.cn.appKey":"..."};越组 key 42200
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
  /auth-config/{group}/test:
    post:
      tags: [Sys]
      summary: 连通性自检(v1=配置完整性校验;body 可携带草稿 values 合并校验)
      operationId: testAuthConfig
      parameters:
        - { name: group, in: path, required: true, schema: { type: string, enum: [cn, my, fallback] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: data={ok,latencyMs,message}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      latencyMs: { type: integer }
                      message: { type: string }

  /sms-config:
    get:
      tags: [Sys]
      summary: 短信配置全量(permCode menu:smsconfig;secret 只回 hasValue 掩码标记)
      operationId: getSMSConfig
      responses:
        '200':
          description: data.fields 以全 key(sms.accessKeyId 等)为索引;secret 字段 value 恒空
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value: { type: string }
                            hasValue: { type: boolean }
  /sms-config/{group}:
    put:
      tags: [Sys]
      summary: 分组部分更新(group∈channel/template;permCode menu:smsconfig;secret 空串=不修改,密文落库)
      operationId: updateSMSConfig
      parameters:
        - { name: group, in: path, required: true, schema: { type: string, enum: [channel, template] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: 全 key map,如 {"sms.from":"YMM"};越组 key 42200
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
  /sms-config/channel/test:
    post:
      tags: [Sys]
      summary: 通道自检(无 phone=完整性校验;带 phone=草稿合并配置后真实试发测试码,仅 +86/+60)
      operationId: testSMSConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                phone: { type: string, description: 试发目标号码(E.164 或裸中国手机号) }
      responses:
        '200':
          description: data={ok,latencyMs,message}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      latencyMs: { type: integer }
                      message: { type: string }

  /storage-config:
    get:
      tags: [Sys]
      summary: MinIO 存储配置全量(permCode menu:params;secret 只回 hasValue 掩码标记)
      operationId: getStorageConfig
      responses:
        '200':
          description: data.fields 以全 key(minio.endpoint/accessKey/secretKey/bucket/useSSL)为索引;secret 字段 value 恒空
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value: { type: string }
                            hasValue: { type: boolean }
    put:
      tags: [Sys]
      summary: 部分更新(permCode menu:params;minio.secretKey 空串=不修改,密文落库;未知 key 42200)
      operationId: updateStorageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: 全 key map,如 {"minio.bucket":"boss-attachments"};仅接受 minio.* 五键
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
  /realid-config:
    get:
      tags: [Sys]
      summary: 实名核验配置全量(permCode menu:realidconfig;secret 只回 hasValue 掩码标记)
      operationId: getRealIDConfig
      responses:
        '200':
          description: data.fields 以全 key(realid.accessKeyId 等)为索引;secret 字段 value 恒空
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value: { type: string }
                            hasValue: { type: boolean }
  /realid-config/{group}:
    put:
      tags: [Sys]
      summary: 分组部分更新(group=channel;permCode menu:realidconfig;secret 空串=不修改,密文落库)
      operationId: updateRealIDConfig
      parameters:
        - { name: group, in: path, required: true, schema: { type: string, enum: [channel] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  description: 全 key map,如 {"realid.accessKeyId":"LTAI.."};越组 key 42200
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
  /realid-config/channel/test:
    post:
      tags: [Sys]
      summary: 通道自检(无 name/idNo=完整性校验;带 =草稿合并配置后真实试核一组二要素)
      operationId: testRealIDConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                name: { type: string, description: 试核姓名 }
                idNo: { type: string, description: 试核身份证号 }
      responses:
        '200':
          description: data={ok,latencyMs,message}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      latencyMs: { type: integer }
                      message: { type: string }

  /audit-logs:
    get:
      tags: [Sys]
      summary: 审计日志查询(按人/类型/目标类型过滤+分页;permCode menu:audit)
      description: data.items 为 audit.Entry 数组(operator=操作人姓名联查);按 created_at 倒序,limit 缺省 100、上限 500。
      operationId: listAuditLogs
      parameters:
        - name: accountId
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string, description: 数据变更/状态变更/权限变更 }
        - name: targetType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 审计条目(envelope;items 见 audit.Entry)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }

  /import-tasks:
    get:
      tags: [Sys]
      summary: 数据导入任务清单(permCode menu:importer;近 200 条倒序)
      operationId: listImportTasks
      responses:
        '200':
          description: data.items=[{id,kind,operator,imported,failed,detail,createdAt}]
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            kind: { type: string, description: addresses/geo }
                            operator: { type: string, description: 操作人姓名联查 }
                            imported: { type: integer }
                            failed: { type: integer }
                            detail: { type: string, description: JSON 明细(geo 子计数) }
                            createdAt: { type: string }

  /attachments/upload:
    post:
      tags: [Sys]
      summary: 附件上传(multipart/form-data,字段 file;单文件上限 32MB)
      description: 上传者身份随主体类型落 attachments(account/worker/customer);API key 主体优先,否则 JWT 账号。
      operationId: uploadAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: envelope;data 为附件登记记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { $ref: '#/components/schemas/Attachment' }

  /attachments:
    get:
      tags: [Sys]
      summary: 当前上传者附件列表(近 50 条)
      description: 缺省按当前登录身份(API key 主体或 JWT 账号)过滤 uploaderType/uploaderId。
      operationId: listAttachments
      responses:
        '200':
          description: envelope;data.items 为附件
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Attachment' }

  /api-keys:
    get:
      tags: [Sys]
      summary: API key 清单(permCode menu:apikey;明文永不返回)
      operationId: listApiKeys
      responses:
        '200':
          description: data.items 为元数据数组(keyPrefix 前 8 位识别)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/APIKey' }
    post:
      tags: [Sys]
      summary: 签发 API key(permCode menu:apikey;plainKey 仅此一次返回)
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectType, subjectRef, name]
              properties:
                subjectType: { type: string, enum: [account, worker, customer], description: 主体类型 }
                subjectRef: { type: integer, format: int64, description: 主体表主键 }
                name: { type: string, description: 用途说明,如 ci-pipeline-01 }
      responses:
        '200':
          description: 签发成功(data.plainKey 明文仅此一次)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      subjectType: { type: string, enum: [account, worker, customer] }
                      subjectRef: { type: integer, format: int64 }
                      name: { type: string }
                      plainKey: { type: string, example: boss_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx }

  /api-keys/{id}:
    delete:
      tags: [Sys]
      summary: 吊销 API key(软删,status=0;permCode menu:apikey)
      operationId: revokeApiKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /storage-config/rotate-secret:
    post:
      tags: [Sys]
      summary: 轮换对象存储密钥(hostctl sidecar 新密钥落 secret 文件;permCode menu:params)
      operationId: rotateStorageSecret
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /attachments/batch-get:
    post:
      tags: [Sys]
      summary: 批量取附件元数据(按 id 列表)
      operationId: batchGetAttachments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /attachments/{id}:
    delete:
      tags: [Sys]
      summary: 删除附件(软删)
      operationId: deleteAttachment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

components:
  schemas:
    Attachment:
      type: object
      description: 附件登记记录(domain/attachment;三端通用)
      properties:
        id: { type: integer, format: int64 }
        objectKey: { type: string, description: 存储对象键 }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        uploaderType: { type: string, description: account | worker | customer }
        uploaderId: { type: integer, format: int64 }
        createdAt: { type: string }

    AccountRow:
      type: object
      description: 账号列表行(fields.md 1.1;status 1启用 0停用;空字符串=不限/全集团)
      properties:
        id: { type: integer }
        username: { type: string }
        realName: { type: string }
        phone: { type: string }
        roleCode: { type: string }
        roleName: { type: string }
        legalEntityName: { type: string }
        deptName: { type: string }
        postName: { type: string }
        regionScope: { type: string, description: LTREE path,空=全集团 }
        status: { type: integer }
    AccountInput:
      type: object
      required: [username, realName, roleCode]
      description: 建号/改号入参;新建必带 password;0/null 组织=不限,regionScope 空=全集团
      properties:
        username: { type: string, description: 3-64 位,字母/数字/_-. }
        password: { type: string, description: 新建必填不少于 6 位;修改留空=不改 }
        realName: { type: string }
        phone: { type: string, description: 可选,3-32 位数字/加减空格 }
        roleCode: { type: string, description: 7 角色码之一(fields.md 1.2) }
        legalEntityId: { type: integer, nullable: true }
