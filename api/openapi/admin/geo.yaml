# Geo 域:国际地理基础数据(国家/行政区划维护,menu:geo 门禁)。
# 实现见 internal/app/http_geo.go、http_geo_import.go;决策见 docs/notes/adopted/2026-08-18-geo-vs-gis-split.md。
# 响应统一 envelope {code,msg,data}(见 admin.yaml info.description);下述 data 负载用 dataSchema 复用。
paths:
  /geo/countries:
    get:
      tags: [Geo]
      summary: 国家列表(locale 过滤译名)
      operationId: listGeoCountries
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [Geo]
      summary: 新建国家
      operationId: createGeoCountry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alpha2, alpha3, numericCode, shortName, status, continentCode]
              properties:
                alpha2: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 }
                alpha3: { type: string, minLength: 3, maxLength: 3, description: ISO 3166-1 alpha-3 }
                numericCode: { type: string, minLength: 3, maxLength: 3, description: ISO 3166-1 numeric }
                shortName: { type: string, description: 短名 }
                fullName: { type: string, description: 全名 }
                status: { type: string, enum: [INDEPENDENT, DISCONTINUED] }
                continentCode: { type: string, enum: [AS, EU, NA, SA, AF, OC, AN] }
                m49Region: { type: string, description: UN M49 区域码 }
                postalRegex: { type: string, description: 邮编正则 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /geo/countries/{code}:
    get:
      tags: [Geo]
      summary: 国家详情
      operationId: getGeoCountry
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }
    put:
      tags: [Geo]
      summary: 编辑国家
      operationId: updateGeoCountry
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/countries/{code}/active:
    put:
      tags: [Geo]
      summary: 国家启停
      operationId: setGeoCountryActive
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/countries/{code}/attrs:
    put:
      tags: [Geo]
      summary: 更新国家关联属性(邮编/电话区号等)
      operationId: updateGeoCountryAttrs
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timeZones: { type: array, items: { type: string }, description: IANA 时区数组 }
                currencies:
                  type: array
                  items:
                    type: object
                    properties:
                      currency: { type: string, description: ISO 4217 货币码 }
                      isPrimary: { type: boolean }
                      minorUnit: { type: integer, format: int16 }
                callingCodes: { type: array, items: { type: string }, description: E.164 国家码 }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/countries/{code}/names:
    post:
      tags: [Geo]
      summary: 新增国家译名(locale+nameType 唯一)
      operationId: addGeoCountryName
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, name, nameType]
              properties:
                locale: { type: string, description: 语言代码,如 zh-Hans/en }
                name: { type: string, description: 译名 }
                nameType: { type: string, enum: [STANDARD, SHORT, ALIAS, HISTORIC] }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  '/geo/countries/{code}/names/{locale}/{nameType}':
    delete:
      tags: [Geo]
      summary: 删除国家译名
      operationId: deleteGeoCountryName
      parameters:
        - { $ref: '#/components/parameters/Code' }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: nameType, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/subdivisions:
    get:
      tags: [Geo]
      summary: 行政区划列表(country/locale/父码下钻/关键字/limit 截断)
      operationId: listGeoSubdivisions
      parameters:
        - { name: country, in: query, schema: { type: string }, description: '国家码过滤(代码读取 country;keyword 必须配合本参数)' }
        - { name: locale, in: query, schema: { type: string }, description: '译名 locale 过滤(代码读取 locale;displayName 联译名,回落 code)' }
        - { name: parentCode, in: query, schema: { type: string }, description: '父码下钻:非空=该父码直接子节点;传空值(parentCode=)=顶层节点;缺省=不过滤(兼容旧行为)' }
        - { name: keyword, in: query, schema: { type: string }, description: '模糊匹配区划编码与全部译名(ILIKE 大小写不敏感);缺 country 时拒绝 42200' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, description: '截断条数;<=0 取默认 50;>200 钳到 200' }
      responses:
        '200':
          description: envelope;data=区划行数组(每行含 hasChildren)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GeoSubdivisionRow' }
    post:
      tags: [Geo]
      summary: 新建行政区划
      operationId: createGeoSubdivision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, countryCode, level, category]
              properties:
                code: { type: string, description: ISO 3166-2 完整码,如 PH-NCR }
                countryCode: { type: string, minLength: 2, maxLength: 2, description: 所属国家 alpha-2 }
                parentCode: { type: string, description: 自引用父码,可空 }
                level: { type: integer, format: int16, minimum: 1, maximum: 4 }
                category: { type: string, description: state/province/region/municipality }
                osmAdminLevel: { type: integer, format: int16, description: OSM 行政层级 2~10 }
                geonameId: { type: integer, format: int64, description: GeoNames 挂接,0=未挂 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /geo/default-country:
    get:
      tags: [Geo]
      summary: 默认国家读(登录管理员即可读,不设 menu 门槛;选择器全局兜底)
      operationId: getDefaultGeoCountry
      description: >-
        读 biz_params geo.default_country(值=alpha-2,如 PH);写路径复用既有 PUT /params/geo.default_country(menu:params)。
        未配置或值非法时返回空值对象 {countryCode:"",configured:false};契约裁定不兜底部署主国家,由前端决定缺省态。
      responses:
        '200':
          description: envelope;data=默认国家读视图 DefaultCountryView
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data: { $ref: '#/components/schemas/DefaultCountryView' }

  /geo/subdivisions/{code}:
    put:
      tags: [Geo]
      summary: 编辑行政区划
      operationId: updateGeoSubdivision
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countryCode, level, category]
              properties:
                countryCode: { type: string, minLength: 2, maxLength: 2 }
                parentCode: { type: string }
                level: { type: integer, format: int16, minimum: 1, maximum: 4 }
                category: { type: string }
                osmAdminLevel: { type: integer, format: int16 }
                geonameId: { type: integer, format: int64 }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/subdivisions/{code}/active:
    put:
      tags: [Geo]
      summary: 行政区划启停
      operationId: setGeoSubdivisionActive
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/subdivisions/{code}/names:
    get:
      tags: [Geo]
      summary: 行政区划译名列表
      operationId: listGeoSubdivisionNames
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [Geo]
      summary: 新增行政区划译名
      operationId: addGeoSubdivisionName
      parameters: [ { $ref: '#/components/parameters/Code' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, name, nameType]
              properties:
                locale: { type: string, description: 语言代码 }
                name: { type: string, description: 译名 }
                nameType: { type: string, enum: [STANDARD, SHORT, ALIAS, HISTORIC, PINYIN, ROMANIZED] }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  '/geo/subdivisions/{code}/names/{locale}/{nameType}':
    delete:
      tags: [Geo]
      summary: 删除行政区划译名
      operationId: deleteGeoSubdivisionName
      parameters:
        - { $ref: '#/components/parameters/Code' }
        - { name: locale, in: path, required: true, schema: { type: string } }
        - { name: nameType, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /geo/import:
    post:
      tags: [Geo]
      summary: 批量导入(单事务 upsert,译名/区划四类载荷;PSGC 内置见 migration)
      operationId: importGeo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                countries:
                  type: array
                  items:
                    type: object
                    description: Country 对象数组
                countryNames:
                  type: array
                  items:
                    type: object
                    properties:
                      countryCode: { type: string }
                      name:
                        type: object
                        properties:
                          locale: { type: string }
                          name: { type: string }
                          nameType: { type: string }
                subdivisions:
                  type: array
                  items:
                    type: object
                    description: Subdivision 对象数组
                subdivisionNames:
                  type: array
                  items:
                    type: object
                    properties:
                      subdivisionCode: { type: string }
                      name:
                        type: object
                        properties:
                          locale: { type: string }
                          name: { type: string }
                          nameType: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }

components:
  parameters:
    Code: { name: code, in: path, required: true, schema: { type: string } }
  responses:
    Ok:
      description: envelope;data=null
      content:
        application/json:
          schema: { type: object, properties: { code: { type: integer }, msg: { type: string }, data: { nullable: true } } }
    Data:
      description: envelope;data=单对象
      content:
        application/json:
          schema: { type: object, properties: { code: { type: integer }, msg: { type: string }, data: { type: object } } }
    Array:
      description: envelope;data=裸数组
      content:
        application/json:
          schema: { type: object, properties: { code: { type: integer }, msg: { type: string }, data: { type: array, items: { type: object } } } }

  schemas:
    GeoSubdivisionRow:
      type: object
      description: 区划列表行(GET /geo/subdivisions)
      properties:
        code: { type: string, description: ISO 3166-2 完整码,如 PH-NCR }
        countryCode: { type: string, description: 所属国家 alpha-2 }
        parentCode: { type: string, description: 父码;顶层节点为空串 }
        level: { type: integer, format: int16, description: '1~4 各国深度不同' }
        category: { type: string, description: state/province/region/municipality }
        osmAdminLevel: { type: integer, format: int16, description: OSM 行政层级 2~10 }
        geonameId: { type: integer, format: int64, description: GeoNames 挂接,0=未挂 }
        isActive: { type: boolean }
        displayName: { type: string, description: locale 译名,回落 code }
        hasChildren: { type: boolean, description: 存在未停用子节点(下钻入口渲染用) }
    DefaultCountryView:
      type: object
      description: 默认国家读视图(GET /geo/default-country)
      properties:
        countryCode: { type: string, description: alpha-2 大写;未配置/非法为空串 }
        configured: { type: boolean, description: 配置存在且为合法 alpha-2 }
