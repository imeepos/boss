paths:
  /customers:
    get:
      tags: [Customer]
      summary: 客户档案列表(含实名状态)
      operationId: listCustomers
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - { name: phone, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 客户直建(批量导入用;regionName 服务端快照,realName PENDING/service ACTIVE)
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, legalEntityId, addressId, regionId]
              properties:
                name: { type: string }
                phone: { type: string }
                legalEntityId: { type: integer, format: int64 }
                addressId: { type: integer, format: int64 }
                regionId: { type: integer, format: int64 }
                idType: { type: string, description: 缺省身份证 }
                idNo: { type: string }
      responses:
        '200':
          description: data={id}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      id: { type: integer }

  /customers/{id}:
    get:
      tags: [Customer]
      summary: 客户档案详情(fields.md §2.1 单档;未命中 40400)
      operationId: getCustomer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /customers/{id}/verify-logs:
    get:
      tags: [Customer]
      summary: 客户实名核验记录
      operationId: listCustomerVerifyLogs
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /customers/{id}/real-name:
    get:
      tags: [Customer]
      summary: 客户当前实名核验(最新一条;未提交 PENDING 报 40410)
      operationId: getCustomerRealName
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 提交客户实名核验资料(落 PENDING;阿里云二要素通道启用时即时自动核验)
      description: 通道配置后提交即判定(PASS/FAIL 并同步状态);通道未配置/调用失败保持 PENDING,走 /real-name/verify 人工核验(fields.md §7.6)。
      operationId: submitCustomerRealName
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realName, idCardNo, method]
              properties:
                realName: { type: string, description: 申报实名 }
                idCardNo: { type: string, description: 证件号 }
                method: { type: string, description: 人脸/证件OCR/人工/第三方 }
      responses:
        '200':
          description: envelope;data={id,result},result 为自动核验结论(通道未启用即 PENDING 等人工)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64, description: 核验记录 ID }
                      result: { type: string, enum: [PASS, FAIL, PENDING] }

  /customers/{id}/real-name/verify:
    post:
      tags: [Customer]
      summary: 后台核验客户实名(result=PASS/FAIL;PASS 同步 customers.real_name_status=VERIFIED)
      operationId: verifyCustomerRealName
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [PASS, FAIL] }
                reason: { type: string, description: 驳回原因(FAIL 时落 verifications.reject_reason,用户端驳回页展示) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /customer-registrations:
    get:
      tags: [Customer]
      summary: 客户注册申请审核队列(status 过滤:空=全部;未审核在前)
      operationId: listCustomerRegistrations
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    # 自助注册提交在 user 端契约(api/openapi/user/auth.yaml),admin 只管审核。

  /customer-registrations/{id}/approve:
    post:
      tags: [Customer]
      summary: 审核通过:建 customers 主档并回填 customer_id
      operationId: approveCustomerRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /customer-registrations/{id}/reject:
    post:
      tags: [Customer]
      summary: 审核驳回(记审核意见,仅作用于 PENDING)
      operationId: rejectCustomerRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, description: 审核意见(驳回必填) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /products:
    get:
      tags: [Customer]
      summary: 产品资费列表
      operationId: listProducts
      parameters:
        - { name: legalEntityId, in: query, schema: { type: integer, format: int64 }, description: 按法人过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 新建产品
      operationId: createProduct
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /products/{id}:
    put:
      tags: [Customer]
      summary: 编辑产品基础信息(名称/带宽/分类;月费走调价、状态走 /status)
      operationId: updateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                bandwidth: { type: string }
                category: { type: string, enum: [broadband, fusion, addon], default: broadband }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /products/{id}/status:
    put:
      tags: [Customer]
      summary: 产品上下架(DRAFT/PUBLISHED/OFFLINE;发布即生效刷新生效时间)
      operationId: updateProductStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE] }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /products/{id}/price-history:
    get:
      tags: [Customer]
      summary: 产品价格历史/调价记录
      operationId: listProductPriceHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 产品调价
      operationId: changeProductPrice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [newPrice]
              properties:
                newPrice: { type: number }
                effectiveAt: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /verifications:
    get:
      tags: [Customer]
      summary: 实名审核中心列表(主体+证件+审核结论聚合)
      operationId: listVerifications
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - { name: subjectType, in: query, schema: { type: string, enum: [customer, worker] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PASS, FAIL] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 审核中心列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        subjectType: { type: string }
                        subjectId: { type: integer, format: int64 }
                        subjectName: { type: string }
                        subjectPhone: { type: string }
                        idCardNoMasked: { type: string }
                        method: { type: string }
                        realName: { type: string }
                        result: { type: string }
                        rejectReason: { type: string }
                        verifiedAt: { type: string }
                        operatorName: { type: string }
                        operatorAccountId: { type: integer, format: int64 }
                        idCardFrontId: { type: integer, format: int64 }
                        idCardBackId: { type: integer, format: int64 }
                  total: { type: integer }

  /verifications/{subjectType}/{subjectId}/verify:
    post:
      tags: [Customer]
      summary: 审核中心行内 PASS/FAIL 处置
      operationId: verifyFromCenter
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [customer, worker] } }
        - { name: subjectId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [PASS, FAIL] }
                rejectReason: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
