paths:
  /customers:
    get:
      tags: [Customer]
      summary: 客户档案列表(含实名状态)
      operationId: listCustomers
      parameters:
        - $ref: './schemas.yaml#/components/parameters/keyword'
        - { name: phone, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /customers/{id}/verify-logs:
    get:
      tags: [Customer]
      summary: 客户实名核验记录
      operationId: listCustomerVerifyLogs
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 客户ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /products:
    get:
      tags: [Customer]
      summary: 产品资费列表
      operationId: listProducts
      parameters:
        - { name: legalEntityId, in: query, schema: { type: integer, format: int64 }, description: 按法人过滤(0=全部) }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 新建产品
      operationId: createProduct
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /products/{id}/price-history:
    get:
      tags: [Customer]
      summary: 产品价格历史/调价记录
      operationId: listProductPriceHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Customer]
      summary: 产品调价
      operationId: changeProductPrice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: 产品ID }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [newPrice]
              properties:
                newPrice: { type: number }
                effectiveAt: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
