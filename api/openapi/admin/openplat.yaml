# 开放平台管理面(admin 端):应用凭证 + Webhook 订阅。
# 前缀 /api/admin/v1,permCode menu:openplat(迁移 000122)。
# Secret 仅创建响应返回一次,后续永不回显。
paths:
  /openplat/apps:
    get:
      tags: [OpenPlat]
      summary: 开放应用清单(裸数组;不含 Secret)
      operationId: listOpenApps
      responses:
        '200':
          description: data.items 为应用元数据数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/OpenPlatApp' }
    post:
      tags: [OpenPlat]
      summary: 创建开放应用(AppId+Secret 仅本次返回;缺省 rpm 60 / quota 10000)
      operationId: createOpenApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                rateLimitRpm: { type: integer, description: 每分钟调用上限,缺省 60 }
                dailyQuota: { type: integer, description: 日调用配额,缺省 10000 }
                sandbox: { type: boolean, description: 沙箱应用(M4) }
      responses:
        '200':
          description: data 含 appId 与 secret(仅此一次)
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OpenPlatAppCreated' }

  /openplat/apps/{id}/status:
    put:
      tags: [OpenPlat]
      summary: 启用/停用开放应用(停用即验签失效)
      operationId: setOpenAppStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: data 为 null

  /openplat/event-types:
    get:
      tags: [OpenPlat]
      summary: 可订阅事件目录(登记制;订阅事件选择器数据源,未登记事件不对外)
      operationId: listOpenEventTypes
      responses:
        '200':
          description: data.items 为事件目录(type + description)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, description]
                      properties:
                        type: { type: string, example: order.stage.done }
                        description: { type: string }

  /openplat/apps/{id}/subscriptions:
    get:
      tags: [OpenPlat]
      summary: 应用的事件订阅清单(裸数组)
      operationId: listOpenSubscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: data.items 为订阅数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/OpenPlatSubscription' }
    post:
      tags: [OpenPlat]
      summary: 新增事件订阅(同 app+事件+端点唯一;一个端点订阅多事件=多行,重复幂等跳过)
      operationId: createOpenSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointUrl]
              properties:
                eventTypes:
                  type: array
                  maxItems: 32
                  items: { type: string, maxLength: 64 }
                  description: 批量事件类型;与单数 eventType 合并去重,合并后至少一个
                eventType:
                  type: string
                  maxLength: 64
                  description: 单数兼容字段(旧客户端)
                endpointUrl: { type: string, maxLength: 512 }
      responses:
        '200':
          description: data.items 为该端点命中的订阅行(含幂等跳过的已有行)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/OpenPlatSubscription' }

  /openplat/subscriptions/{id}:
    delete:
      tags: [OpenPlat]
      summary: 删除事件订阅
      operationId: deleteOpenSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: data 为 null

  /openplat/deliveries:
    get:
      tags: [OpenPlat]
      summary: Webhook 投递 outbox(倒序最近 200;subscriptionId 过滤,0=全部)
      operationId: listOpenDeliveries
      parameters:
        - { name: subscriptionId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: data.items 为投递数组(迁移 000125)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/OpenPlatDelivery' }

  /openplat/deliveries/{id}/requeue:
    post:
      tags: [OpenPlat]
      summary: 死信/失败投递重置重试(attempts 清零;已投递行拒绝)
      operationId: requeueOpenDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: data 为 null

  /openplat/apps/{id}/test-event:
    post:
      tags: [OpenPlat]
      summary: 发测试事件(openplat.test)到该应用全部启用订阅,集成方自助验收签名/连通
      operationId: emitOpenTestEvent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: data 含 eventId(幂等键)与 queued(命中订阅数)
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  queued: { type: integer }
