                  items: { type: object }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/resource-chains:
    get:
      tags: [ODN]
      summary: 资源链清单(导入结果核对;batch 过滤,近批优先)
      operationId: listOdnResourceChains
      parameters:
        - { name: batch, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/resource-chains/patrol:
    get:
      tags: [ODN]
      summary: 孤儿/半链巡检(链上箱体编码必须存在导入域设备;计数+样本行号)
      operationId: patrolOdnResourceChains
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/devices/{id}/ports:
    get:
      tags: [ODN]
      summary: 设备端口列表(端口号序,含占用状态)
      operationId: listOdnPorts
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/devices/{id}/ports/allocate:
