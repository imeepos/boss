# ODN 域:无源物理层(网格分区/电杆人井等设施/光缆段落,menu:odn 门禁)。
# 实现见 internal/httpapi/admin/odn.go、odn_facility.go;规范《Suniway ODN 地理空间编码规范》V1.0。
# 响应统一 envelope {code,msg,data};字段口径 docs/contract/fields.md 1.5.2~1.5.4。
paths:
  /odn/grids:
    get:
      tags: [ODN]
      summary: 网格分区列表(含占用数与 >=80% 预警)
      operationId: listOdnGrids
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string, examples: [PHL001] } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string, examples: [MNL] } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建网格(备案,规范红线 2)
      operationId: createOdnGrid
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gridCode, status]
              properties:
                gridCode: { type: integer, minimum: 1, maximum: 99, description: 网格码 01~99 }
                name: { type: string, description: 网格名称 }
                coverage: { type: string, description: 覆盖区域 }
                status: { type: string, enum: [ACTIVE, RESERVED] }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/regions:
    get:
      tags: [ODN]
      summary: 省级编码字典(000075 种子只读;级联下拉数据源)
      operationId: listOdnRegions
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/cities:
    get:
      tags: [ODN]
      summary: 省内城市前缀字典(000075 种子只读;级联下拉数据源)
      operationId: listOdnCities
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string, examples: [PHL001] } }
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/facility-next-code:
    get:
      tags: [ODN]
      summary: 下一可用设施编码(退役占号不复用;P/MH 必带 gridCode)
      operationId: nextOdnFacilityCode
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [P, MH, TW, CLS, TBX] } }
        - { name: gridCode, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 99 } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/site-next-no:
    get:
      tags: [ODN]
      summary: 下一可用局点序号(退役占号不复用;满 999 报错)
      operationId: nextOdnSiteNo
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string, examples: [PHL001] } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string, examples: [MNL] } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/grid-investment:
    get:
      tags: [ODN]
      summary: 网格投资测算读模型(P-INFRA-1 W2,只读聚合;门禁 menu:grid-investment)
      operationId: listOdnGridInvestment
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/city-investment:
    get:
      tags: [ODN]
      summary: 城市投资卷积(W5,只读;网格行按 prv+city 卷积+分光容量户级列;门禁 menu:grid-investment)
      operationId: listOdnCityInvestment
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/split-capacity:
    get:
      tags: [ODN]
      summary: 设备分光容量清单+全网汇总(W5,只读;potentialHomes=潜在户数,expandable=还能接几户;门禁 menu:grid-investment)
      operationId: listOdnSplitCapacity
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/resource-chains/backfill-split:
    post:
      tags: [ODN]
      summary: 分光比回写建模(W5,幂等全量重建 odn_device_split_capacity;门禁 menu:odn,审计 odn.resource-chain.backfill-split)
      operationId: backfillOdnSplitCapacity
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/grids/{gridCode}:
    put:
      tags: [ODN]
      summary: 编辑网格(RETIRED 不可改回)
      operationId: updateOdnGrid
      parameters:
        - { name: gridCode, in: path, required: true, schema: { type: integer } }
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                name: { type: string }
                coverage: { type: string }
                status: { type: string, enum: [ACTIVE, RESERVED, RETIRED] }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [ODN]
      summary: 网格退役(须无在用设施)
      operationId: retireOdnGrid
      parameters:
        - { name: gridCode, in: path, required: true, schema: { type: integer } }
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /odn/facilities:
    get:
      tags: [ODN]
      summary: 设施列表(kind/网格过滤)
      operationId: listOdnFacilities
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [P, MH, TW, CLS, TBX] } }
        - { name: prvCode, in: query, schema: { type: string } }
        - { name: cityPrefix, in: query, schema: { type: string } }
        - { name: gridCode, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建设施(编码 5 位数字网格分区模式,红线 3;网格须已备案)
      operationId: createOdnFacility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, kind, prvCode, cityPrefix]
              properties:
                code: { type: string, examples: [P01001], description: '^(P|MH|TW|CLS|TBX)[0-9]{5}$' }
                kind: { type: string, enum: [P, MH, TW, CLS, TBX] }
                prvCode: { type: string, examples: [PHL001] }
                cityPrefix: { type: string, examples: [MNL] }
                gridCode: { type: integer, description: P/MH 必填且与编码网格段一致 }
                name: { type: string }
                lat: { type: number }
                lng: { type: number }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/facilities/{code}:
    get:
      tags: [ODN]
      summary: 设施详情
      operationId: getOdnFacility
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }
    delete:
      tags: [ODN]
      summary: 设施报废(编码永久锁定禁止复用)
      operationId: retireOdnFacility
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /odn/segments:
    get:
      tags: [ODN]
      summary: 光缆段落列表(endpoint 过滤含该端点的段落)
      operationId: listOdnSegments
      parameters:
        - { name: endpoint, in: query, schema: { type: string, examples: [ODF001] } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建光缆段落(端点按规范 5.2 优先级定向,'--' 仅图纸不入库)
      operationId: createOdnSegment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint1, endpoint2]
              properties:
                endpoint1: { type: string, examples: [ODF001] }
                endpoint2: { type: string, examples: [OCC001] }
                name: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/segments/{id}/fibers:
    get:
      tags: [ODN]
      summary: 段落纤芯列表(G01~G99)
      operationId: listOdnFibers
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 段落新增纤芯(同 G 号冲突 409)
      operationId: addOdnFiber
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gNo]
              properties:
                gNo: { type: integer, minimum: 1, maximum: 99 }
                kind: { type: string, description: 光缆型号 }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /odn/sites:
    get:
      tags: [ODN]
      summary: 局点列表(NodeCode = 城市前缀 + 3 位序号)
      operationId: listOdnSites
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建局点(规划部分配序号)
      operationId: createOdnSite
      parameters:
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteNo]
              properties:
                siteNo: { type: integer, minimum: 1, maximum: 999 }
                name: { type: string }
                lat: { type: number }
                lng: { type: number }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/sites/{siteNo}:
    delete:
      tags: [ODN]
      summary: 局点退役(须无在用设备挂接)
      operationId: retireOdnSite
      parameters:
        - { name: siteNo, in: path, required: true, schema: { type: integer } }
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /odn/devices:
    get:
      tags: [ODN]
      summary: 核心链路设备列表(kind/城市过滤)
      operationId: listOdnDevices
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [SNW, OLT, ODF, OCC, ODB, OBD, SDB, SBD, PRT, TBP] } }
        - { name: prvCode, in: query, schema: { type: string } }
        - { name: cityPrefix, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建设备(格式/归属链校验;SNW 全网唯一,其余市域唯一;扩容后缀 -N N>=2)
      operationId: createOdnDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, kind, prvCode, cityPrefix]
              properties:
                code: { type: string, examples: [OLT001, ODB001-2], description: '^(SNW|OLT|ODF|OCC|ODB|OBD|SDB|SBD|PRT|TBP)[0-9]{3}(-[2-9][0-9]*)?$' }
                kind: { type: string, enum: [SNW, OLT, ODF, OCC, ODB, OBD, SDB, SBD, PRT, TBP] }
                prvCode: { type: string, examples: [PHL001] }
                cityPrefix: { type: string, examples: [MNL] }
                siteNo: { type: integer, description: 归属局点序号,0=市域设备 }
                parentId: { type: integer, description: 上级设备 id(表单通道),与 parentCode 二选一 }
                parentCode: { type: string, examples: [OCC001], description: 上级设备编码(导入通道,同城市在用设备按编码反查 id) }
                name: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/devices/{id}:
    delete:
      tags: [ODN]
      summary: 设备报废(编码永久锁定)
      operationId: retireOdnDevice
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /odn/coverage:
    get:
      tags: [ODN]
      summary: 单地址覆盖查询(未登记返回 null)
      operationId: getOdnCoverage
      parameters:
        - { name: addressId, in: query, required: true, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Data' } }
    post:
      tags: [ODN]
      summary: 保存地址覆盖关联(一址一覆盖幂等;非 UNSERVED 必挂设施或设备)
      operationId: upsertOdnCoverage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, status]
              properties:
                addressId: { type: integer, description: 地址 id }
                facilityCode: { type: string, description: 服务设施码,可空 }
                deviceId: { type: integer, description: 服务核心设备 id,可空 }
                status: { type: string, enum: [SERVED, PENDING, UNSERVED] }
                note: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/coverage/list:
    get:
      tags: [ODN]
      summary: 覆盖关联列表(近更优先,联地址名)
      operationId: listOdnCoverage
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/coverage/resolve:
    get:
      tags: [ODN]
      summary: 就近设施可装性判定(P1 判据:2km 内 SERVED)
      operationId: resolveOdnCoverage
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/facilities/{code}/lifecycle:
    put:
      tags: [ODN]
      summary: 设施生命周期转移(PLANNED→IN_BUILD→IN_SERVICE→RETIRED,终态不可逆)
      operationId: setOdnFacilityLifecycle
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycleStatus]
              properties:
                lifecycleStatus: { type: string, enum: [PLANNED, IN_BUILD, IN_SERVICE, RETIRED] }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/sites/{siteNo}/lifecycle:
    put:
      tags: [ODN]
      summary: 局点生命周期转移
      operationId: setOdnSiteLifecycle
      parameters:
        - { name: siteNo, in: path, required: true, schema: { type: integer } }
        - { name: prvCode, in: query, required: true, schema: { type: string } }
        - { name: cityPrefix, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycleStatus]
              properties:
                lifecycleStatus: { type: string, enum: [PLANNED, IN_BUILD, IN_SERVICE, RETIRED] }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/devices/{id}/lifecycle:
    put:
      tags: [ODN]
      summary: 设备生命周期转移
      operationId: setOdnDeviceLifecycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycleStatus]
              properties:
                lifecycleStatus: { type: string, enum: [PLANNED, IN_BUILD, IN_SERVICE, RETIRED] }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions:
    get:
      tags: [ODN]
      summary: 施工单列表(近单优先,含明细计数)
      operationId: listOdnConstructions
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 新建施工单(projNo 唯一)
      operationId: createOdnConstruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projNo]
              properties:
                projNo: { type: string, description: 施工单号,唯一 }
                name: { type: string }
                prvCode: { type: string, examples: [PHL001] }
                cityPrefix: { type: string, examples: [MNL] }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}:
    get:
      tags: [ODN]
      summary: 施工单详情(含明细清单)
      operationId: getOdnConstruction
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/items:
    post:
      tags: [ODN]
      summary: 追加施工明细(工程量清单行;设施须 PLANNED;ACCEPTED 后锁定;金额后端计算)
      operationId: addOdnConstructionItem
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityCode]
              properties:
                facilityCode: { type: string, examples: [CLS00001] }
                quantity: { type: number, description: 工程量,可空(默认 0=未定额) }
                unitPrice: { type: number, description: 单价,可空;amount=round(quantity*unitPrice,2) 由生成列计算 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/items/{itemId}:
    put:
      tags: [ODN]
      summary: 清单定额编辑(数量/单价;ACCEPTED 后锁定;金额随生成列重算)
      operationId: updateOdnConstructionItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: number }
                unitPrice: { type: number }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/contractor:
    put:
      tags: [ODN]
      summary: 指定/更换承包商(引用采购域施工类供应商档案;名称快照;有有效结算单后锁定)
      operationId: assignOdnConstructionContractor
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractorId]
              properties:
                contractorId: { type: integer, description: procurement_suppliers.id,须 CONSTRUCTION 类型且启用 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/start:
    post:
      tags: [ODN]
      summary: 开工(PENDING→BUILDING,单内 PLANNED 设施批量转 IN_BUILD)
      operationId: startOdnConstruction
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/accept:
    post:
      tags: [ODN]
      summary: 竣工验收(BUILDING→ACCEPTED,设施批量回填 IN_SERVICE,记竣工人/时间/备注)
      operationId: acceptOdnConstruction
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: as-built 竣工备注 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/progress:
    post:
      tags: [ODN]
      summary: 进度上报(P0-B:资源级现场完成量/坐标/照片;clientMsgId 幂等,重复不重复计量)
      operationId: recordOdnConstructionProgress
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityCode, clientMsgId]
              properties:
                facilityCode: { type: string, description: 设施编码(须在项目明细范围内) }
                doneQty: { type: number, description: 累计完成量(>=0) }
                lat: { type: number, description: 纬度可带 }
                lng: { type: number, description: 经度可带 }
                note: { type: string, description: 备注 <=500 字 }
                photoIds: { type: array, items: { type: integer } }
                clientMsgId: { type: string, description: 客户端消息幂等键(8-64 字符) }
      responses: { '200': { $ref: '#/components/responses/Data' } }
    get:
      tags: [ODN]
      summary: 进度上报列表+清单级进度聚合(计划量 vs 累计完成量)
      operationId: listOdnConstructionProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/tests:
    post:
      tags: [ODN]
      summary: 追加资源级测试记录(P0-C:OTDR/光功率/连通性;append-only)
      operationId: recordOdnConstructionTest
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, resourceRef, testKind, result]
              properties:
                resourceType: { type: string, description: FACILITY/SEGMENT/FIBER/PORT }
                resourceRef: { type: string, description: 资源编码或 ID 串 }
                testKind: { type: string, description: OTDR/OPTICAL_POWER/CONNECTIVITY }
                result: { type: string, description: PASS/FAIL }
                attenuationDb: { type: number, description: 衰减 dB 可带 }
                powerDbm: { type: number, description: 光功率 dBm 可带 }
                note: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }
    get:
      tags: [ODN]
      summary: 测试记录列表(近单优先)
      operationId: listOdnConstructionTests
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/defects:
    post:
      tags: [ODN]
      summary: 开整改单(P0-C:设施须在项目范围内;验收前置=无未 VERIFIED 整改)
      operationId: openOdnConstructionDefect
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityCode, severity, description]
              properties:
                facilityCode: { type: string }
                severity: { type: string, description: MINOR/MAJOR/CRITICAL }
                description: { type: string, description: 问题描述必填 }
                note: { type: string }
      responses: { '200': { $ref: '#/components/responses/Data' } }
    get:
      tags: [ODN]
      summary: 整改单列表(可按 status 过滤)
      operationId: listOdnConstructionDefects
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/defects/{defectId}/rectify:
    post:
      tags: [ODN]
      summary: 整改上报(OPEN/RECTIFYING→RECTIFYING,记整改时间)
      operationId: rectifyOdnDefect
      parameters: [ { name: defectId, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/defects/{defectId}/verify:
    post:
      tags: [ODN]
      summary: 复验关闭(OPEN/RECTIFYING→VERIFIED,记复验人/时间;终态再动拒绝)
      operationId: verifyOdnDefect
      parameters: [ { name: defectId, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/settlements:
    post:
      tags: [ODN]
      summary: 发起结算(前置:项目 ACCEPTED 且已指定承包商;应付=清单金额汇总,后端计算)
      operationId: createOdnConstructionSettlement
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }
    get:
      tags: [ODN]
      summary: 项目结算单列表(含作废历史,近单优先)
      operationId: listOdnConstructionSettlements
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/settlements/{id}:
    get:
      tags: [ODN]
      summary: 结算单详情
      operationId: getOdnSettlement
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/settlements/{id}/settle:
    post:
      tags: [ODN]
      summary: 确认结算(PENDING→SETTLED,记结算人/时间)
      operationId: settleOdnSettlement
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/settlements/{id}/void:
    post:
      tags: [ODN]
      summary: 作废结算(PENDING/SETTLED→VOIDED,原因必填;作废后重开以新结算单表达)
      operationId: voidOdnSettlement
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255, description: 作废原因 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/budget:
    put:
      tags: [ODN]
      summary: 设置/清除项目预算(budgetAmount=null 清除;仅项目 PENDING 可改,W6 000218)
      operationId: setOdnConstructionBudget
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budgetAmount: { type: number, nullable: true, description: 预算金额(>=0, null=清除) }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/constructions/{id}/milestones:
    get:
      tags: [ODN]
      summary: 里程碑清单(序同创建序)
      operationId: listOdnConstructionMilestones
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Array' } }
    post:
      tags: [ODN]
      summary: 追加里程碑(名称必填/计划日可空;仅项目 PENDING 可改)
      operationId: addOdnConstructionMilestone
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                plannedDate: { type: string, description: 'YYYY-MM-DD 可空' }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/milestones/{milestoneId}:
    put:
      tags: [ODN]
      summary: 编辑里程碑(名称/计划日;项目须 PENDING)
      operationId: updateOdnMilestone
      parameters: [ { name: milestoneId, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                plannedDate: { type: string, description: 'YYYY-MM-DD 可空' }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/milestones/{milestoneId}/complete:
    post:
      tags: [ODN]
      summary: 标记完成(PENDING/BUILDING 可标记,ACCEPTED 后锁定)
      operationId: completeOdnMilestone
      parameters: [ { name: milestoneId, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/milestones/{milestoneId}/reopen:
    post:
      tags: [ODN]
      summary: 退回未完成(DONE→PENDING;ACCEPTED 后锁定)
      operationId: reopenOdnMilestone
      parameters: [ { name: milestoneId, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/payables:
    get:
      tags: [ODN]
      summary: 工程应付台账列表(SETTLED 结算单自动生成;status/projectId 过滤,近单优先;menu:payables)
      operationId: listOdnPayables
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PARTIAL, PAID, VOIDED] } }
        - { name: projectId, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Array' } }

  /odn/payables/{id}:
    get:
      tags: [ODN]
      summary: 应付详情聚合(单头+付款/核减/发票流水,单据链可回放)
      operationId: getOdnPayable
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/payables/{id}/payments:
    post:
      tags: [ODN]
      summary: 付款流水登记(部分付款/分期逐笔,单笔不超未付余额;VOIDED 拒绝)
      operationId: registerOdnPayablePayment
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number, description: '>0 且 <= 未付余额' }
                method: { type: string, enum: [TRANSFER, CASH, CHEQUE, OTHER] }
                paidAt: { type: string, description: 'YYYY-MM-DD[ HH24:MI:SS] 可空=当前' }
                reference: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 255 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/payables/{id}/deductions:
    post:
      tags: [ODN]
      summary: 核减(原因必填 append-only 留痕;核减不超应付,核减后净应付不得低于已付)
      operationId: deductOdnPayable
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number, description: '>0' }
                reason: { type: string, maxLength: 255 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/payables/{id}/invoices:
    post:
      tags: [ODN]
      summary: 发票登记(纯登记不联动税局;同应付内发票号唯一)
      operationId: registerOdnPayableInvoice
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceNo, amount]
              properties:
                invoiceNo: { type: string, maxLength: 64 }
                amount: { type: number }
                invoicedAt: { type: string, description: 'YYYY-MM-DD 可空' }
                note: { type: string, maxLength: 255 }
      responses: { '200': { $ref: '#/components/responses/Data' } }

  /odn/surveys:
    get:
      tags: [ODN]
      summary: 勘测任务列表(status/workerId 过滤,近单优先;P-INFRA-1 W7,000223)
      operationId: listOdnSurveys
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, ACCEPTED, BACKFILLED, CANCELLED] } }
