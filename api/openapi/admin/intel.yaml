paths:
  /gis/levels:
    get:
      tags: [Intel]
      summary: GIS 层级清单(八级钻取层级;对齐 Go 实现 GET /gis/levels,permCode menu:gis)
      operationId: listGisLevels
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/drill:
    get:
      tags: [Intel]
      summary: GIS 下钻(按 level 逐级;对齐 Go 实现 GET /gis/drill,permCode menu:gis)
      operationId: gisDrill
      parameters:
        - { name: level, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: parentId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/resources/{resourceId}/detail:
    get:
      tags: [Intel]
      summary: GIS 实体详情(端口/设备/链路;对齐 Go 实现,permCode menu:gis)
      operationId: getGisResourceDetail
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /analytics/indicators:
    get:
      tags: [Intel]
      summary: 经营分析核心指标(对齐 Go 实现 GET /analytics/indicators,permCode menu:analytics)
      operationId: getAnalyticsIndicators
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /analytics/heatmap:
    get:
      tags: [Intel]
      summary: 热力图聚合(区域×装机密度;对齐 Go 实现 GET /analytics/heatmap)
      operationId: getAnalyticsHeatmap
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /analytics/maintenance:
    get:
      tags: [Intel]
      summary: 维护一张表(装维质量;对齐 Go 实现 GET /analytics/maintenance)
      operationId: getAnalyticsMaintenance
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reports:
    get:
      tags: [Intel]
      summary: 经营分析报告列表(日/周/月/季度;对齐 Go 实现 GET /reports,permCode menu:report)
      operationId: listReports
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Intel]
      summary: 生成报告(未实现:Go 后端暂未提供,报告由定时任务产出)（未实现 planned）
      operationId: createReport
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reports/latest:
    get:
      tags: [Intel]
      summary: 最新一期报告(对齐 Go 实现 GET /reports/latest)
      operationId: getLatestReport
      parameters:
        - { name: period, in: query, schema: { type: string, default: daily } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /reports/{reportId}/send:
    post:
      tags: [Intel]
      summary: 报告推送(按 id 取快照→Push)
      operationId: sendReport
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }
