paths:
  /gis/levels:
    get:
      tags: [Intel]
      summary: GIS 层级清单(八级钻取层级;对齐 Go 实现 GET /gis/levels,permCode menu:gis)
      operationId: listGisLevels
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/points:
    get:
      tags: [Intel]
      summary: 地图点位(Point 列表;前端自行拼 GeoJSON;permCode menu:gis)
      operationId: gisPoints
      parameters:
        - { name: level, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: parentId, in: query, schema: { type: integer, format: int64 } }
        - { name: bbox, in: query, schema: { type: string, description: 'minLng,minLat,maxLng,maxLat(WGS84);空=不限' } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/odn-points:
    get:
      tags: [Intel]
      summary: ODN 点位图层(设施/局点/设备+勘测打点/施工进度;自带 lat/lng 作地图图层;permCode menu:gis)
      operationId: gisODNPoints
      parameters:
        - { name: entity, in: query, required: true, schema: { type: string, enum: [facility, site, device, survey, progress] }, description: 'survey=勘测打点(level 12,W7);progress=施工进度点(level 13,W7)' }
        - { name: bbox, in: query, schema: { type: string, description: 'minLng,minLat,maxLng,maxLat(WGS84);空=不限' } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/drill:
    get:
      tags: [Intel]
      summary: GIS 下钻(按 level 逐级;对齐 Go 实现 GET /gis/drill,permCode menu:gis)
      operationId: gisDrill
      parameters:
        - { name: level, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: parentId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /gis/resources/{resourceId}/detail:
    get:
      tags: [Intel]
      summary: GIS 实体详情(端口/设备/链路;对齐 Go 实现,permCode menu:gis)
      operationId: getGisResourceDetail
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /analytics/indicators:
    get:
      tags: [Intel]
      summary: 经营分析核心指标(对齐 Go 实现 GET /analytics/indicators,permCode menu:analytics)
      operationId: getAnalyticsIndicators
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /analytics/heatmap:
    get:
      tags: [Intel]
      summary: 热力图聚合(区域×装机密度;对齐 Go 实现 GET /analytics/heatmap)
      operationId: getAnalyticsHeatmap
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /analytics/maintenance:
    get:
      tags: [Intel]
      summary: 维护一张表(装维质量;对齐 Go 实现 GET /analytics/maintenance)
      operationId: getAnalyticsMaintenance
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reports:
    get:
      tags: [Intel]
      summary: 经营分析报告列表(日/周/月/季度;对齐 Go 实现 GET /reports,permCode menu:report)
      operationId: listReports
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Intel]
      summary: 生成报告(未实现:Go 后端暂未提供,报告由定时任务产出)（未实现 planned）
      operationId: createReport
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /reports/history:
    get:
      tags: [Intel]
      summary: 历史快照(新→旧,trend 用;period 默认 daily,limit 默认 12 上限 90)
      operationId: reportHistory
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [daily, weekly, monthly, quarterly] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reports/latest:
    get:
      tags: [Intel]
      summary: 最新一期报告(对齐 Go 实现 GET /reports/latest)
      operationId: getLatestReport
      parameters:
        - { name: period, in: query, schema: { type: string, default: daily } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /reports/recon/latest:
    get:
      tags: [Intel]
      summary: 最新每日数据对账快照(八域检查:订单/四码/资源/账务/GIS/发票/积分/Webhook;每日 03:00 定时产出)
      description: Q2/S2 每日对账:十项只读计数检查,allOK=false 时异常进 URGENT 待办;无快照 code=404。permCode menu:report。
      operationId: getLatestRecon
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /compensation-tasks:
    get:
      tags: [Intel]
      summary: 补偿任务中心(九类跨域补偿任务聚合,每项带可回放 retry/settle 路径)
      description: S2 补偿任务中心:provisionTask/stopResume/activationCallback/taxInvoice/cdrKafka/reconBatch/webhookDelivery/couponRecon/pointsFailed;只读聚合,回放调各域 retry 接口或 comp-tasks/:id/replay。permCode menu:report。
      operationId: listCompensationTasks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /reports/{reportId}/send:
    post:
      tags: [Intel]
      summary: 报告推送(按 id 取快照→Push)
      operationId: sendReport
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /db-patrol/orphans:
    get:
      tags: [Intel]
      summary: 软引用孤儿巡检清单(只读报表,不阻断业务;对齐 Go 实现,permCode menu:report)
      description: db-design-review D7:逐表扫描软引用悬空记录,发现项只读展示。
      operationId: listDbPatrolOrphans
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /db-patrol/latest:
    get:
      tags: [Intel]
      summary: 最新巡检快照(定时循环落 report_snapshots;无快照 code=404)
      operationId: getLatestDbPatrol
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
  # ---------- Monthly 月度填报(BI 经营分析,迁移 000181,permCode menu:monthly) ----------
  /monthly/regions:
    get:
      tags: [Intel]
      summary: 月度填报区域白名单(51 个标准 Barangay,含 active 标记)
      operationId: listMonthlyRegions
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /monthly/summary:
    get:
      tags: [Intel]
      summary: 月度汇总 KPI(期末在用/主营总收入合计、及时完工率、端口利用率、回款率、ARPU;分母 0 该率为 null)
      operationId: getMonthlySummary
      parameters:
        - { name: month, in: query, schema: { type: string, description: 'YYYY-MM;空=全部月份' } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /monthly/user-revenue:
    get:
      tags: [Intel]
      summary: 月度用户与收入列表(month/region 筛选+分页;响应含派生列 期末在用/主营总收入)
      operationId: listMonthlyUserRevenue
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
    put:
      tags: [Intel]
      summary: 月度用户与收入单行 upsert(校验同导入;派生列服务端计算,传入无效)
      operationId: upsertMonthlyUserRevenue
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /monthly/user-revenue/import:
    post:
      tags: [Intel]
      summary: 月度用户与收入 CSV 导入(multipart file;UTF-8 BOM,表头与 docs/books 模板逐字节一致,幂等 upsert,行级错误报告)
      operationId: importMonthlyUserRevenue
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /monthly/user-revenue/export:
    get:
      tags: [Intel]
      summary: 月度用户与收入 CSV 导出(与导入同格式同表头,BOM+CRLF,行序 month,region)
      operationId: exportMonthlyUserRevenue
      parameters:
        - { name: month, in: query, schema: { type: string, description: 'YYYY-MM;空=全量' } }
      responses:
        '200':
          description: CSV(UTF-8 with BOM)
          content:
            text/csv:
              schema: { type: string, format: binary }

  /monthly/network-delivery:
    get:
      tags: [Intel]
      summary: 月度网络与交付列表(month/region 筛选+分页;响应含派生列 期末在用/主营总收入)
      operationId: listMonthlyNetworkDelivery
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
    put:
      tags: [Intel]
      summary: 月度网络与交付单行 upsert(校验同导入;派生列服务端计算,传入无效)
      operationId: upsertMonthlyNetworkDelivery
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /monthly/network-delivery/import:
    post:
      tags: [Intel]
      summary: 月度网络与交付 CSV 导入(multipart file;UTF-8 BOM,表头与 docs/books 模板逐字节一致,幂等 upsert,行级错误报告)
      operationId: importMonthlyNetworkDelivery
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /monthly/network-delivery/export:
    get:
      tags: [Intel]
      summary: 月度网络与交付 CSV 导出(与导入同格式同表头,BOM+CRLF,行序 month,region)
      operationId: exportMonthlyNetworkDelivery
      parameters:
        - { name: month, in: query, schema: { type: string, description: 'YYYY-MM;空=全量' } }
      responses:
        '200':
          description: CSV(UTF-8 with BOM)
          content:
            text/csv:
              schema: { type: string, format: binary }

  /monthly/finance-cost:
    get:
      tags: [Intel]
      summary: 月度财务与成本列表(month/region 筛选+分页;响应含派生列 期末在用/主营总收入)
      operationId: listMonthlyFinanceCost
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
    put:
      tags: [Intel]
      summary: 月度财务与成本单行 upsert(校验同导入;派生列服务端计算,传入无效)
      operationId: upsertMonthlyFinanceCost
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /monthly/finance-cost/import:
    post:
      tags: [Intel]
      summary: 月度财务与成本 CSV 导入(multipart file;UTF-8 BOM,表头与 docs/books 模板逐字节一致,幂等 upsert,行级错误报告)
      operationId: importMonthlyFinanceCost
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }

  /monthly/finance-cost/export:
    get:
      tags: [Intel]
      summary: 月度财务与成本 CSV 导出(与导入同格式同表头,BOM+CRLF,行序 month,region)
      operationId: exportMonthlyFinanceCost
      parameters:
        - { name: month, in: query, schema: { type: string, description: 'YYYY-MM;空=全量' } }
      responses:
        '200':
          description: CSV(UTF-8 with BOM)
          content:
            text/csv:
              schema: { type: string, format: binary }

