# 招商引资/合作入驻域(迁移 000098/000099;internal/httpapi/admin/partner.go)。
# 公开提交免登录;审核走 menu:partner;企业工作台走 partner-* 菜单门禁。
paths:
  /partner/applications:
    post:
      tags: [Partner]
      summary: 企业自助提交入驻申请(公开,免登录)
      operationId: partnerSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, creditCode, contactName, contactPhone, businessDesc]
              properties:
                companyName: { type: string }
                creditCode: { type: string, description: 统一社会信用代码 }
                contactName: { type: string }
                contactPhone: { type: string }
                email: { type: string }
                businessDesc: { type: string }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
    get:
      tags: [Partner]
      summary: 入驻申请审核队列
      operationId: partnerList
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
  /partner/applications/{id}/approve:
    post:
      tags: [Partner]
      summary: 审核通过(建 partner 主体+管理员账号)
      operationId: partnerApprove
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
  /partner/applications/{id}/reject:
    post:
      tags: [Partner]
      summary: 审核驳回(记意见)
      operationId: partnerReject
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
  /partner/me:
    get:
      tags: [Partner]
      summary: 企业工作台-本企业档案
      operationId: partnerProfile
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
  /partner/staff:
    get:
      tags: [Partner]
      summary: 企业工作台-员工列表
      operationId: partnerStaffList
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
    post:
      tags: [Partner]
      summary: 企业工作台-新建员工(partner_staff)
      operationId: partnerStaffCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, realName]
              properties:
                username: { type: string }
                password: { type: string, minLength: 6 }
                realName: { type: string }
                phone: { type: string }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
  /partner/staff/{id}/status:
    put:
      tags: [Partner]
      summary: 企业工作台-员工启用(1)/停用(0)
      operationId: partnerStaffStatus
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: integer, enum: [0, 1] } } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
  /partner/orders:
    get:
      tags: [Partner]
      summary: 企业工作台-本企业订单列表
      operationId: partnerOrders
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
  /partner/commissions:
    get:
      summary: 渠道佣金台账列表(可按状态/企业筛选)
      tags: [Partner]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACCRUED, SETTLED, VOID] } }
        - { name: legalEntityId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 佣金台账列表 }
  /partner/commissions/{id}/settle:
    post:
      summary: 结算单条佣金台账(ACCRUED → SETTLED)
      tags: [Partner]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: 已结算 }
  /partner/audit-report:
    get:
      summary: 渠道操作审计报表(按当前账号,可按 action 过滤)
      tags: [Partner]
      parameters:
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200': { description: 审计报表条目列表 }
  /partner/region-scope:
    get:
      summary: 企业工作台-经营区域范围(按当前账号;permCode menu:partner-home)
      tags: [Partner]
      operationId: partnerRegionScope
      responses:
        '200': { description: data 为区域范围对象(regionPath 等) }
    put:
      summary: 更新经营区域范围(审计 partner_region_scope.update;permCode menu:partner-home)
      tags: [Partner]
      operationId: partnerRegionScopeUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regionPath]
              properties:
                regionPath: { type: string, description: 区域路径,如 PH/NCR/Quezon_City }
      responses:
        '200': { description: data 回显 regionPath }
