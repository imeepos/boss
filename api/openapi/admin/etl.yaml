paths:
  /etl-jobs:
    get:
      tags: [Intel]
      summary: ETL投影任务台账
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Intel]
      summary: upsert ETL任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobKey, name]
              properties:
                jobKey: { type: string }
                name: { type: string }
                sourceDomain: { type: string }
                targetDomain: { type: string }
                cronExpr: { type: string }
                refreshCadence: { type: string }
                owner: { type: string }
                enabled: { type: boolean }
                latenessThreshold: { type: integer }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Item' }
  /etl-jobs/{jobKey}:
    get:
      tags: [Intel]
      summary: ETL任务详情
      parameters: [{ name: jobKey, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Item' } }
  /etl-jobs/{jobKey}/disable:
    post:
      tags: [Intel]
      summary: 停用ETL任务
      parameters: [{ name: jobKey, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Item' } }
  /etl-jobs/{jobKey}/runs:
    get:
      tags: [Intel]
      summary: ETL运行历史
      parameters: [{ name: jobKey, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
    post:
      tags: [Intel]
      summary: 记录ETL运行
      parameters: [{ name: jobKey, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Item' } }
  /etl-freshness:
    get:
      tags: [Intel]
      summary: ETL数据新鲜度看板
      responses: { '200': { $ref: './schemas.yaml#/components/responses/List' } }
  /etl-freshness/scan:
    post:
      tags: [Intel]
      summary: 手动扫描并派发ETL逾期任务
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Item' } }
  /etl-freshness/scan/latest:
    get:
      tags: [Intel]
      summary: 获取最近一次ETL逾期扫描结果
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Item' } }
