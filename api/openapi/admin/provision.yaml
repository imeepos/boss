components:
  schemas:
    ProvisionTemplateInput:
      type: object
      required: [legalEntityId, code, name]
      properties:
        legalEntityId: { type: integer, format: int64, minimum: 1 }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        content: { type: object, description: 配置内容 JSON }
        status: { type: string, enum: [ENABLED, DISABLED], default: ENABLED }

paths:
  /provision-tasks:
    get:
      tags: [Provision]
      summary: 配置下发任务列表(代码无 stats 汇总,仅 items)
      operationId: listProvisionTasks
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /provision-tasks/{taskNo}/retry:
    post:
      tags: [Provision]
      summary: 失败任务重试
      operationId: retryProvisionTask
      parameters:
        - { name: taskNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /provision-templates:
    get:
      tags: [Provision]
      summary: 配置模板列表(设备类型/参数)
      operationId: listProvisionTemplates
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }
    post:
      tags: [Provision]
      summary: 新建/复制配置模板
      operationId: createProvisionTemplate
      requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ProvisionTemplateInput'
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /provision-templates/{templateId}:
    put:
      tags: [Provision]
      summary: 编辑配置模板(内容 JSON、版本自增)
      operationId: updateProvisionTemplate
      parameters: [{ name: templateId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ProvisionTemplateInput'
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }
    delete:
      tags: [Provision]
      summary: 删除未被任务引用的配置模板
      operationId: deleteProvisionTemplate
      parameters: [{ name: templateId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }

  /provision-templates/{templateId}/status:
    put:
      tags: [Provision]
      summary: 启用或停用配置模板
      operationId: setProvisionTemplateStatus
      parameters: [{ name: templateId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ENABLED, DISABLED] } } } } } }
      responses: { '200': { $ref: './schemas.yaml#/components/responses/Ok' } }

  /provision-logs:
    get:
      tags: [Provision]
      summary: 配置下发日志(成功/失败/回滚成功;列表不含指令/应答大字段)
      operationId: listProvisionLogs
      parameters:
        - { name: taskId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

  /provision-logs/{logId}:
    get:
      tags: [Provision]
      summary: 下发日志详情(完整下发指令/设备原始应答 + 任务/订单/模板多维上下文;menu:provlog)
      operationId: getProvisionLogDetail
      parameters:
        - { name: logId, in: path, required: true, schema: { type: integer, format: int64 }, description: 日志ID }
      responses:
        '200':
          description: 日志详情聚合
          content:
            application/json:
              schema:
                type: object
                properties:
                  log:
                    type: object
                    description: 日志本体;commands 为换行分隔的顺序设备指令,deviceResponse 为设备原始应答
                  task: { type: object, description: 来源下发任务(taskNo/stageEvent/status 等) }
                  order: { type: object, description: 订单维度(orderNo/status/offerName;无关联或已删为空值) }
                  template: { type: object, description: 模板维度(code/name/version/status/content;已删为空值) }

  /provision-bindings:
    get:
      tags: [Provision]
      summary: 产品/套餐↔下发模板绑定清单(admin 产品页"下发模板"列;方案B adopted 2026-09-01)
      operationId: listOfferProvisionBindings
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/List' }

