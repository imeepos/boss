components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Ok:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: 'success' }

    Profile:
      type: object
      properties:
        customerId: { type: integer, format: int64 }
        name: { type: string, example: '王先生' }
        phoneMasked: { type: string, example: '138****1234' }
        realName:
          type: object
          properties:
            nameMasked: { type: string, example: '王**' }
            idType: { type: string, example: '身份证' }
            idNoMasked: { type: string, example: '110***********1234' }
            status: { type: string, enum: [VERIFIED, PENDING] }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/AddressInfo' }
        plan: { $ref: '#/components/schemas/Plan' }

    Plan:
      type: object
      properties:
        planId: { type: string }
        name: { type: string, example: '1000M 极速宽带' }
        monthlyFee: { type: number, example: 199.0 }
        contractEnd: { type: string, example: '2026-08' }
        status: { type: string, example: ACTIVE }
        installAddress: { type: string }
        currentBillAmount: { type: number, example: 199.0 }
        currentBillDue: { type: string, example: '2026-08' }

    Security:
      type: object
      properties:
        realNameStatus: { type: string, enum: [VERIFIED, PENDING] }
        nameMasked: { type: string }
        idNoMasked: { type: string }
        verifyAt: { type: string }
        passwordUpdatedAt: { type: string }
        phoneMasked: { type: string }

    VerifyStatus:
      type: object
      properties:
        status: { type: string, enum: [VERIFIED, PENDING] }
        nameMasked: { type: string }
        idNoMasked: { type: string }
        phoneMasked: { type: string, example: '138****1234' }
        latestResult: { type: string, enum: [PASS, FAIL, PENDING, ''], description: 最新一条核验记录结论,空=从未提交 }
        submitTime: { type: string, description: 最新提交时间 }
        rejectReason: { type: string, description: 最近一次 FAIL 的驳回原因 }
        verifyAt: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              time: { type: string }
              result: { type: string, enum: [PASS, FAIL, PENDING] }
              reason: { type: string, description: FAIL 时的驳回原因 }

    VerifySubmit:
      type: object
      required: [name, idNo, smsCode, idCardFrontId, idCardBackId]
      properties:
        idType: { type: string, example: '身份证' }
        name: { type: string }
        idNo: { type: string }
        smsCode: { type: string, description: 发送到绑定手机号的验证码(/auth/verify/sms-code,scene=verify) }
        idCardFrontId: { type: integer, format: int64, description: 人像面附件 id(/attachments/upload 返回) }
        idCardBackId: { type: integer, format: int64, description: 国徽面附件 id }

    NotifySettings:
      type: object
      properties:
        business:
          type: object
          additionalProperties: { type: boolean }
        marketing:
          type: object
          additionalProperties: { type: boolean }
        channels:
          type: object
          additionalProperties: { type: boolean }

    Product:
      type: object
      properties:
        productId: { type: string }
        category: { type: string, enum: [broadband, fusion, addon] }
        name: { type: string, example: '300M 畅享宽带' }
        bandwidth: { type: string, example: '300M' }
        monthlyFee: { type: number, example: 99.0 }
        description: { type: string }
        contractMonths: { type: integer, example: 12 }
        featured: { type: boolean }

    Addon:
      type: object
      properties:
        addonId: { type: string }
        name: { type: string, example: 'IPTV 高清电视' }
        monthlyFee: { type: number, example: 10.0 }
        description: { type: string }
        subscribed: { type: boolean }

    ProductDetail:
      type: object
      properties:
        product: { $ref: '#/components/schemas/Product' }
        specs:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        compare:
          type: array
          items: { $ref: '#/components/schemas/Product' }

    OrderSummary:
      type: object
      properties:
        orderNo: { type: string, example: 'ORD-20250817-001' }
        status: { type: string, enum: [PENDING, RESERVED, INSTALLING, DONE, CANCELLED] }
        statusLabel: { type: string, example: '装维中' }
        productName: { type: string }
        address: { type: string }
        stage: { type: integer, example: 9 }
        stageLabel: { type: string, example: '扫码绑定' }
        estimateFinish: { type: string }
        canRate: { type: boolean }

    OrderDetail:
      type: object
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        submitedAt: { type: string }
        technicianName: { type: string }
        technicianPhoneMasked: { type: string }
        stageLabel: { type: string }
        completedStage: { type: integer }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/StageTimeline' }

    StageTimeline:
      type: object
      properties:
        stage: { type: integer }
        title: { type: string }
        result: { type: string, enum: [DONE, DOING, PENDING] }
        meta: { type: string }

    CancelPreview:
      type: object
      properties:
        unpaidBills:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        penalty: { type: number, example: 716.4 }
        penaltyDesc: { type: string }

    RateInfo:
      type: object
      properties:
        orderNo: { type: string }
        productName: { type: string }
        address: { type: string }
        finishedAt: { type: string }

    Bill:
      type: object
      properties:
        billNo: { type: string }
        period: { type: string, example: '2025-08' }
        productName: { type: string }
        periodRange: { type: string, example: '08-01 ~ 08-31' }
        amount: { type: number, example: 158.0 }
        status: { type: string, enum: [UNPAID, PAID, OVERDUE] }
        statusLabel: { type: string, example: '未缴' }

    BillDetail:
      type: object
      properties:
        bill: { $ref: '#/components/schemas/Bill' }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              range: { type: string }
              amount: { type: number }
        totalDue: { type: number }
        autoPayEnabled: { type: boolean }

    PaymentResult:
      type: object
      properties:
        payNo: { type: string, example: 'PAY20250817001' }
        amount: { type: number }
        billPeriod: { type: string }
        payMethod: { type: string }
        status: { type: string, example: SUCCESS }

    PaymentRecord:
      type: object
      description: 缴费/充值流水行;默认仅 SUCCESS,FAILED/REFUNDED 经 include 才回传。
      properties:
        payNo: { type: string }
        amount: { type: number }
        period: { type: string }
        payMethod: { type: string }
        paidAt: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED, REFUNDED], description: 流水状态(terms.md §4) }

    Receipt:
      type: object
      properties:
        receiptNo: { type: string, example: 'OR-20250817-0001' }
        customerName: { type: string }
        phoneMasked: { type: string }
        amount: { type: number }
        period: { type: string }
        payMethod: { type: string }
        paidAt: { type: string }
        payNo: { type: string }

    Balance:
      type: object
      properties:
        balance: { type: number, example: 42.0 }
        denominations: { type: array, items: { type: integer } }

    InvoiceOverview:
      type: object
      properties:
        titleType: { type: string, example: '个人' }
        title: { type: string, example: '王先生' }
        taxNo: { type: string, nullable: true }
        availablePeriods:
          type: array
          items: { $ref: '#/components/schemas/Bill' }
        records:
          type: array
          items:
            type: object
            properties:
              invoiceNo: { type: string }
              period: { type: string }
              amount: { type: number }
              issuedAt: { type: string }
              pdfUrl: { type: string }

    Fault:
      type: object
      properties:
        ticketNo: { type: string, example: 'TKT-20250817-012' }
        faultType: { type: string }
        faultTypeLabel: { type: string }
        address: { type: string }
        createdAt: { type: string }
        status: { type: string }
        statusLabel: { type: string }

    FaultDetail:
      type: object
      properties:
        fault: { $ref: '#/components/schemas/Fault' }
        technicianName: { type: string }
        technicianPhoneMasked: { type: string }
        sla: { type: string, example: '≤4h' }
        timeline:
          type: array
          items:
            type: object
            properties:
              step: { type: integer }
              title: { type: string }
              result: { type: string, enum: [DONE, DOING, PENDING] }
              meta: { type: string }

    Complaint:
      type: object
      description: |
        投诉/建议工单视图(用户端)。
        complaintId 即 ticketNo;status 取值 OPEN/PROCESSING/CLOSED;
        description/contact/relOrderNo 在用户端 POST /complaints 时真实落库
        (迁移 000151),列表/详情可直接回显。
      properties:
        complaintId: { type: string, description: 工单号 ticketNo }
        type: { type: string, enum: [attitude, quality, billing, suggestion, other] }
        typeLabel: { type: string }
        relOrderNo: { type: string, description: 关联订单/报修单号,选填 }
        description: { type: string, description: 用户端投诉/建议描述 }
        contact: { type: string, description: 用户端联系方式 }
        status: { type: string, enum: [OPEN, PROCESSING, CLOSED] }
        statusLabel: { type: string }
        createdAt: { type: string, description: 提交时间 YYYY-MM-DD HH:MM }
        slaDeadline: { type: string, description: SLA 截止时间(报障使用,投诉为空) }
        remoteDiag: { type: string, description: 装维诊断(报障使用,投诉为空) }
        closedAt: { type: string, description: 关闭时间(未关闭为空串) }

    ComplaintTimelineItem:
      type: object
      description: |
        投诉处理时间轴节点。第 1 项固定为提交投诉(DONE),其后每条对应
        cs_ticket_events 一行(状态变更/升级)。result 全为 DONE(已发生)。
      properties:
        step: { type: integer, description: 节点序号,从 1 起 }
        title: { type: string, description: 节点中文标题 }
        result: { type: string, enum: [DONE, DOING, PENDING] }
        meta: { type: string, description: 节点发生时间 YYYY-MM-DD HH:MM }
        eventType: { type: string, description: SUBMITTED/STATUS_CHANGED/ESCALATED }
        fromStatus: { type: string }
        toStatus: { type: string }
        note: { type: string, description: 处理备注 }

    Faq:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }

    Home:
      type: object
      properties:
        customerName: { type: string }
        phoneMasked: { type: string }
        onlineStatus: { type: string, example: '服务在线 · 网络正常' }
        hasUnread: { type: boolean }
        plan: { $ref: '#/components/schemas/Plan' }
        currentBill: { type: number }
        balance: { type: number }
        contractEnd: { type: string }
        ongoingOrders:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              desc: { type: string }
              status: { type: string }
              statusLabel: { type: string }

    Message:
      type: object
      properties:
        messageId: { type: string }
        category: { type: string }
        title: { type: string }
        content: { type: string }
        tag: { type: string }
        tagLevel: { type: string, enum: [balance, bill, fault, promo, info] }
        createdAt: { type: string }
        read: { type: boolean }

    Coupon:
      type: object
      properties:
        couponId: { type: string }
        amount: { type: number }
        threshold: { type: number }
        title: { type: string }
        expireAt: { type: string }
        status: { type: string, enum: [available, used, expired] }

    Usage:
      type: object
      properties:
        periodLabel: { type: string }
        used: { type: number }
        unit: { type: string, example: 'GB' }
        quota: { type: number }
        percent: { type: integer }
        dailyAvg: { type: number }
        forecastRemain: { type: number }
        detail:
          type: object
          properties:
            down: { type: number }
            up: { type: number }
            iptvNote: { type: string }
        online:
          type: object
          properties:
            duration: { type: string }
            lastOnlineAt: { type: string }

    AddressInfo:
      type: object
      properties:
        addressId: { type: string }
        label: { type: string }
        isDefault: { type: boolean }
        contact: { type: string }
        phoneMasked: { type: string }
        community: { type: string }
        building: { type: string }
        door: { type: string }

    DiySection:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        desc: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              desc: { type: string }

    StripeIntent:
      type: object
      description: 订单收款 Stripe PaymentIntent(原生表单 SDK 入口)。
      properties:
        payNo: { type: string, example: 'PAY-20260822-01' }
        billNo: { type: string }
        orderNo: { type: string, description: '订单号冗余回传(便于前端交叉对账)' }
        amount: { type: number, example: 158.0 }
        clientSecret: { type: string, example: 'pi_xxx_secret' }
        intentId: { type: string, example: 'pi_xxx' }
        currency: { type: string, example: php }
        ephemeralKey: { type: string, description: '可选;PaymentSheet 需 customer 时由服务端签发' }
        customerId: { type: string, description: '可选;Stripe Customer 标识' }
        publishableKey: { type: string, description: '可选;PaymentSheet 必传(服务端托管可减少前端耦合)' }

    StripeCheckout:
      type: object
      description: 订单收款 Stripe Hosted Checkout(浏览器跳页入口)。
      properties:
        payNo: { type: string, example: 'PAY-20260823-01' }
        billNo: { type: string }
        orderNo: { type: string }
        amount: { type: number, example: 158.0 }
        checkoutUrl: { type: string, format: uri }
        sessionId: { type: string, example: 'cs_xxx' }
              desc: { type: string }
