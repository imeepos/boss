paths:
  /home:
    get:
      tags: [Misc]
      summary: 首页聚合(在线状态/套餐卡片/进行中订单/我的服务/消息红点)
      operationId: getHome
      responses:
        '200':
          description: 首页聚合数据
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Home' }

  /messages:
    get:
      tags: [Misc]
      summary: 消息中心列表(可按分类过滤)
      operationId: listMessages
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [all, billing, balance, fault, promo] }
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Message' }

  /messages/read-all:
    post:
      tags: [Misc]
      summary: 全部标为已读
      operationId: readAllMessages
      responses:
        '200':
          description: 已全部已读
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /messages/{messageId}/read:
    put:
      tags: [Misc]
      summary: 单条消息标为已读
      operationId: readOneMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已读成功(业务码 0)
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }
        '404':
          description: 消息不存在或不属于当前用户(业务码 CodeNotFound=40400)
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /coupons:
    get:
      tags: [Misc]
      summary: 优惠券列表(可用/已使用/已过期;billCents>0 时附预估抵扣并过滤门槛不满足券)
      operationId: listCoupons
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [available, used, expired, all] }
        - name: billCents
          in: query
          description: 账单金额(分),用于可用性过滤与预估抵扣
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 优惠券列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Coupon' }
                  inviteLink: { type: string }

  /coupons/redeem:
    post:
      tags: [Misc]
      summary: 兑换码领券 / 接收转赠券
      operationId: redeemCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: 领取成功,返回券号
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      couponId: { type: string }

  /coupons/{couponId}/gift:
    post:
      tags: [Misc]
      summary: 整券转赠(返回一次性转赠码,受赠方经 /coupons/redeem 领取)
      operationId: giftCoupon
      parameters: [{ name: couponId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 转赠码
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      giftCode: { type: string }

  /usage:
    get:
      tags: [Misc]
      summary: 网络用量(本周期/上月/近 6 月)
      operationId: getUsage
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [current, last, six_month] }
      responses:
        '200':
          description: 用量数据
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Usage' }

  /addresses:
    get:
      tags: [Misc]
      summary: 家庭地址列表(分页)
      operationId: listAddresses
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 地址分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/AddressInfo' }
                  page: { type: integer, example: 1 }
                  pageSize: { type: integer, example: 20 }
                  total: { type: integer, example: 3 }
                  hasMore: { type: boolean, example: false }

    post:
      tags: [Misc]
      summary: 新增家庭地址
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/components/schemas/AddressInfo' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Misc]
      summary: 修改家庭地址
      operationId: updateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/components/schemas/AddressInfo' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }
        '404':
          description: 地址不存在或不属于当前客户
    delete:
      tags: [Misc]
      summary: 删除家庭地址
      operationId: deleteAddress
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }
        '404':
          description: 地址不存在或不属于当前客户

  /address-tree:
    get:
      tags: [Misc]
      summary: 地址层级树子节点(级联选择逐层懒加载)
      operationId: listAddressTreeChildren
      parameters:
        - name: parentId
          in: query
          schema: { type: integer, format: int64, default: 0 }
          description: 父节点ID,0=顶层
      responses:
        '200':
          description: 子节点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/AddressNode' }

  /address-tree/search:
    get:
      tags: [Misc]
      summary: 地址全树搜索(命中节点+祖先链,与 admin /addresses/search 同语义)
      operationId: searchAddressTree
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 命中列表(上限 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/AddressTreeHit' }
        '42200':
          description: q 为空

  /diy/steps:
    get:
      tags: [Misc]
      summary: 自助排障引导
      operationId: getDiySteps
      responses:
        '200':
          description: 排障步骤
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/DiySection' }

  /agreement:
    get:
      tags: [Misc]
      summary: 用户协议与隐私政策
      operationId: getAgreement
      responses:
        '200':
          description: 协议内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  userAgreement:
                    type: array
                    items: { type: string }
                  privacyPolicy:
                    type: array
                    items: { type: string }

  /attachments/upload:
    post:
      tags: [Misc]
      summary: 附件上传(multipart/form-data,字段 file;单文件上限 32MB)
      description: 上传者身份固定 customer + 当前客户 ID。
      operationId: uploadPortalAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: envelope;data 为附件登记记录(id/objectKey/fileName/contentType/sizeBytes/uploaderType/uploaderId/createdAt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object }

  /debug/sms-code:
    get:
      tags: [Misc]
      summary: 开发模式验证码回显(仅 BOSS_DEBUG_SMS=1 时注册;严禁线上开启)
      description: |
        login/register/reset 场景公开;verify 场景须带 JWT(phone 从 claims 解)。
        返回该手机号最近一条未过期且未消费的验证码。
      operationId: debugSmsCode
      parameters:
        - { name: phone, in: query, schema: { type: string } }
        - { name: scene, in: query, schema: { type: string, enum: [login, register, reset, verify] } }
      responses:
        '200': { description: 命中;data 含 code/issuedAt }
        '404': { description: 无有效验证码 }

  /push/device:
    post:
      tags: [Misc]
      summary: 推送设备上报(App 启动/登录后上报 JPush RegistrationID)
      operationId: registerPushDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId]
              properties:
                registrationId: { type: string, example: "1507bfd3f9ac1e045a", description: 10-64 位字母数字 }
                vendor: { type: string, example: jpush }
      responses:
        '200':
          description: envelope;同 RegistrationID 重复上报幂等(设备换账号改绑)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { ok: { type: boolean } } }
        '422':
          description: registrationId 形态非法(42200)
