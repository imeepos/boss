paths:
  /faults:
    get:
      tags: [CustomerService]
      summary: 报修记录列表
      operationId: listFaults
      responses:
        '200':
          description: 报修记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Fault' }

    post:
      tags: [CustomerService]
      summary: 提交报修
      operationId: submitFault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [faultType, address, description]
              properties:
                faultType:
                  type: string
                  enum: [no_internet, slow, ont_fault, other]
                address: { type: string }
                description: { type: string }
                contact: { type: string }
      responses:
        '200':
          description: 报修单已生成
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Fault' }

  /faults/{ticketNo}:
    get:
      tags: [CustomerService]
      summary: 报修详情(报障 6 环节时间轴)
      operationId: getFault
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 报修详情
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/FaultDetail' }

  /faults/{ticketNo}/urge:
    post:
      tags: [CustomerService]
      summary: 报修催单(CHG 单号留痕 + 站内消息)
      operationId: urgeFault
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 催单已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  urgeNo: { type: string, example: 'CHG-1' }
                  urgedAt: { type: string }

  /faults/{ticketNo}/contact:
    get:
      tags: [CustomerService]
      summary: 受理师傅明文联系方式(归属校验,未派单 404)
      operationId: faultContact
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 师傅联系方式
          content:
            application/json:
              schema:
                type: object
                properties:
                  technicianName: { type: string }
                  technicianPhone: { type: string }

  /complaints:
    get:
      tags: [CustomerService]
      summary: 我的投诉列表
      operationId: listComplaints
      responses:
        '200':
          description: 投诉列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Complaint' }

    post:
      tags: [CustomerService]
      summary: 提交投诉/建议
      operationId: submitComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type:
                  type: string
                  enum: [attitude, quality, billing, suggestion, other]
                relOrderNo: { type: string }
                description: { type: string }
                contact: { type: string }
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /service/chat:
    post:
      tags: [CustomerService]
      summary: 智能客服对话
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: 客服回复
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  toHuman: { type: boolean }

  /service/faq:
    get:
      tags: [CustomerService]
      summary: 常见问题
      operationId: listFaq
      responses:
        '200':
          description: 常见问题列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Faq' }


  /faults/{ticketNo}/urge:
    post:
      tags: [CustomerService]
      summary: 报修催单(CHG 单号留痕 + 站内消息回执;CLOSED 工单 code=409)
      operationId: urgeFault
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 催单受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      urgeNo: { type: string, description: 催单号 CHG-YYYYMMDD-NNNN }
                      urgedAt: { type: string, format: date-time }

  /faults/{ticketNo}/contact:
    get:
      tags: [CustomerService]
      summary: 受理师傅明文联系方式(归属校验;无已派师傅 code=404)
      description: 报障工单无师傅字段,受理师傅=客户最近一张已派师傅的派单工单(装机/维修同人)。
      operationId: getFaultContact
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 师傅联系方式
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      technicianName: { type: string }
                      technicianPhone: { type: string }
