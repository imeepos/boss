paths:
  /products:
    get:
      tags: [Product]
      summary: 产品套餐列表(可按分类过滤)
      operationId: listProducts
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [broadband, fusion, addon] }
          description: 分类(宽带/融合/增值)
      responses:
        '200':
          description: 套餐列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Product' }
                  addons:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Addon' }

  /products/{productId}:
    get:
      tags: [Product]
      summary: 套餐详情
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 套餐详情
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/ProductDetail' }

  /addons:
    get:
      tags: [Product]
      summary: 增值服务(可订购 + 已订购)
      operationId: listAddons
      responses:
        '200':
          description: 增值服务
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Addon' }
                  subscribed:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Addon' }

  /addons/{addonId}/subscribe:
    post:
      tags: [Product]
      summary: 订购增值服务
      operationId: subscribeAddon
      parameters:
        - name: addonId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已订购
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /addons/{addonId}/unsubscribe:
    post:
      tags: [Product]
      summary: 退订增值服务
      operationId: unsubscribeAddon
      parameters:
        - name: addonId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已退订
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }


  /products/{id}:
    get:
      tags: [Product]
      summary: 产品详情(PUBLISHED 才可见)
      operationId: getProductDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 产品详情;未命中/未发布 code=404
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          productId: { type: string }
                          category: { type: string }
                          name: { type: string }
                          bandwidth: { type: string }
                          monthlyFee: { type: number }
                          contractMonths: { type: integer }
                          featured: { type: boolean }
                      specs:
                        type: array
                        items:
                          type: object
                          properties:
                            label: { type: string }
                            value: { type: string }
                      compare: { type: array, items: {} }
  # ---------- Order ----------
