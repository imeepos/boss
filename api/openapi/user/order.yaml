paths:
  /orders:
    get:
      tags: [Order]
      summary: 我的订单列表(可按标签过滤)
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, in_progress, done, cancelled] }
          description: 标签过滤
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码,从 1 起
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: 每页条数
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/OrderSummary' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  hasMore: { type: boolean }

    post:
      tags: [Order]
      summary: 下单(环节1 submitOrder)
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, addressId]
              properties:
                productId: { type: string }
                addressId: { type: string }
                channelId: { type: string }
                billingMode: { type: string, enum: [PREPAID, POSTPAID], default: POSTPAID, description: 付费模式;预付费环节4当场收款(adopted 2026-08-22) }
                buyMonths: { type: integer, minimum: 0, maximum: 60, default: 0, description: 预缴月数;0=按月缴,预付费环节4按 N月x月费 收款并命中赠送阶梯(gift-rules) }
      responses:
        '200':
          description: 下单成功
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OrderSummary' }

  /orders/{orderNo}:
    get:
      tags: [Order]
      summary: 订单详情(含 12 环节时间轴)
      operationId: getOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OrderDetail' }

  /orders/{orderNo}/technician-contact:
    get:
      tags: [Order]
      summary: 装维师傅明文联系方式(派单工单回填,未派单 404)
      operationId: orderTechnicianContact
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 师傅联系方式
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderNo: { type: string }
                  name: { type: string }
                  phone: { type: string }

  /orders/{orderNo}/cancel:
    post:
      tags: [Order]
      summary: 取消订单(释放预占端口)
      operationId: cancelOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /orders/{orderNo}/urge:
    post:
      tags: [Order]
      summary: 催单
      operationId: urgeOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已催单
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /orders/{orderNo}/change-address:
    post:
      tags: [Order]
      summary: 变更安装地址
      operationId: changeOrderAddress
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { type: string }
      responses:
        '200':
          description: 已变更
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /plans/{planId}/change:
    post:
      tags: [Order]
      summary: 改套餐(生成变更单)
      operationId: changePlan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlanId, effectiveMode]
              properties:
                targetPlanId: { type: string }
                effectiveMode: { type: string, enum: [immediate, scheduled] }
                staticIp: { type: boolean, default: false }
      responses:
        '200':
          description: 变更单已生成
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OrderSummary' }

  /plans/{planId}/move:
    post:
      tags: [Order]
      summary: 迁址移机(生成迁址工单)
      operationId: moveAddress
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [community, building, door]
              properties:
                community: { type: string }
                building: { type: string }
                door: { type: string }
                expectDate: { type: string, format: date }
      responses:
        '200':
          description: 迁址工单已生成
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OrderSummary' }

  /plans/{planId}/cancel:
    get:
      tags: [Order]
      summary: 退订拆机预检(待结清款项/违约金)
      operationId: getCancelPreview
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 退订预检
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/CancelPreview' }

    post:
      tags: [Order]
      summary: 确认退订拆机
      operationId: cancelPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [leave_area, switch_operator, cost, other]
      responses:
        '200':
          description: 拆机单已生成
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/OrderSummary' }

  /orders/{orderNo}/rate:
    get:
      tags: [Order]
      summary: 评价详情(待评价订单)
      operationId: getRate
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 待评价信息
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/RateInfo' }

    post:
      tags: [Order]
      summary: 提交服务评价
      operationId: submitRate
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attitude, quality, stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                attitude: { type: integer, minimum: 1, maximum: 5 }
                quality: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

  /orders/{orderNo}/stripe-intent:
    post:
      tags: [Order]
      summary: 订单发起 Stripe 卡收款(返回 clientSecret 交原生表单;账单按订单自动建账,幂等)
      operationId: createOrderStripeIntent
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyMonths: { type: integer, minimum: 0, maximum: 60, default: 0, description: '预缴月数;0=首月按 1 个月月费,>0 按 N 月合计(订单提交时已锁定此处沿用,未传时回退订单值)' }
      responses:
        '200':
          description: 意图已创建(落账等回调)
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/StripeIntent' }
        '404': { description: 订单不存在或非归属客户 }
        '409': { description: 订单已收款/已取消,不可发起收款 }
        '400': { description: Stripe 通道未配置(无密钥)或参数非法 }

  /orders/{orderNo}/stripe-checkout:
    post:
      tags: [Order]
      summary: 订单发起 Stripe 托管收银台(免客户端 SDK,前端直接跳 checkoutUrl;落账等回调)
      operationId: createOrderStripeCheckout
      parameters:
        - name: orderNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyMonths: { type: integer, minimum: 0, maximum: 60, default: 0 }
                successUrl: { type: string, format: uri, description: '可选;缺省走 /pay/stripe/done 静态提示页' }
                cancelUrl: { type: string, format: uri, description: '可选;缺省走 /pay/stripe/cancel 静态提示页' }
      responses:
        '200':
          description: 会话已创建
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/StripeCheckout' }
        '404': { description: 订单不存在或非归属客户 }
        '409': { description: 订单已收款/已取消,不可发起收款 }
        '400': { description: Stripe 通道未配置(无密钥)或参数非法 }

