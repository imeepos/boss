paths:
  /bills:
    get:
      tags: [Billing]
      summary: 我的账单列表
      operationId: listBills
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [recent, paid, unpaid] }
      responses:
        '200':
          description: 账单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentDue:
                    type: number
                    example: 158.0
                  currentPeriod: { type: string, example: '2025-08' }
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Bill' }

  /bills/{billNo}:
    get:
      tags: [Billing]
      summary: 账单明细
      operationId: getBill
      parameters:
        - name: billNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 账单明细
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/BillDetail' }

  /payments:
    post:
      tags: [Billing]
      summary: 发起缴费(生成支付单)
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billNo, amount, payMethod]
              properties:
                billNo: { type: string }
                amount: { type: number }
                payMethod: { type: string, enum: [wechat, alipay, card, cash] }
                couponId: { type: string, description: 可选抵扣券,核销与落账同事务,实收=amount-抵扣 }
                buyMonths: { type: integer, description: 预缴实购月数,>0 时按赠送阶梯规则落痕并返回 giftMonths }
                productId: { type: integer, format: int64, description: 赠送规则匹配产品范围,0=全店规则 }
      responses:
        '200':
          description: 支付单已生成
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/PaymentResult' }

    get:
      tags: [Billing]
      summary: 缴费记录
      operationId: listPayments
      responses:
        '200':
          description: 缴费记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/PaymentRecord' }

  /payments/stripe/intent:
    post:
      tags: [Billing]
      summary: 发起 Stripe 卡收款(生成 PaymentIntent,clientSecret 交前端渠道 SDK)
      operationId: createStripeIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billNo, amount]
              properties:
                billNo: { type: string }
                amount: { type: number }
      responses:
        '200':
          description: 意图已创建(落账等 Stripe 回调)
          content:
            application/json:
              schema:
                type: object
                properties:
                  payNo: { type: string, example: 'PAY-20260822-01' }
                  billNo: { type: string }
                  amount: { type: number, example: 158.0 }
                  clientSecret: { type: string, example: 'pi_xxx_secret' }
                  intentId: { type: string, example: 'pi_xxx' }
                  currency: { type: string, example: php }
        '409': { description: 账单已缴 }
        '400': { description: Stripe 通道未配置(无密钥)或参数非法 }

  /payments/stripe/checkout:
    post:
      tags: [Billing]
      summary: 发起 Stripe 托管收银台(免客户端 SDK,前端直接跳 checkoutUrl;落账等回调)
      operationId: createStripeCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billNo, amount, successUrl, cancelUrl]
              properties:
                billNo: { type: string }
                amount: { type: number }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        '200':
          description: 会话已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  payNo: { type: string, example: 'PAY-20260823-01' }
                  billNo: { type: string }
                  amount: { type: number, example: 158.0 }
                  checkoutUrl: { type: string, format: uri }
                  sessionId: { type: string, example: 'cs_xxx' }
        '409': { description: 账单已缴 }
        '400': { description: Stripe 通道未配置(无密钥)或参数非法 }

  /pay/stripe/done:
    get:
      tags: [Billing]
      summary: 收银台支付回跳提示页(静态 HTML,结果以缴费记录为准)
      operationId: stripePayDone
      responses:
        '200': { description: 静态提示页 }

  /pay/stripe/cancel:
    get:
      tags: [Billing]
      summary: 收银台取消回跳提示页(静态 HTML)
      operationId: stripePayCancel
      responses:
        '200': { description: 静态提示页 }

  /webhooks/stripe:
    post:
      tags: [Billing]
      summary: Stripe 渠道回调(渠道服务器调用;Stripe-Signature 验签后按 payNo 幂等落账)
      operationId: stripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: 已接收(重投幂等) }
        '400': { description: 验签失败或落账错误(Stripe 将重试) }
        '503': { description: webhook 密钥未配置 }

  /payments/{payNo}/receipt:
    get:
      tags: [Billing]
      summary: 缴费凭证
      operationId: getReceipt
      parameters:
        - name: payNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 缴费凭证
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Receipt' }

  /payments/{payNo}/receipt.pdf:
    get:
      tags: [Billing]
      summary: 缴费凭证 PDF 下载(application/pdf 附件)
      operationId: getReceiptPdf
      parameters:
        - name: payNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF 文件
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /invoices/{invoiceNo}/pdf:
    get:
      tags: [Billing]
      summary: 电子发票 PDF 下载(application/pdf 附件)
      operationId: getInvoicePdf
      parameters:
        - name: invoiceNo
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF 文件
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /topups:
    get:
      tags: [Billing]
      summary: 余额信息
      operationId: getBalance
      responses:
        '200':
          description: 账户余额
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Balance' }

    post:
      tags: [Billing]
      summary: 余额充值
      operationId: topup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payMethod]
              properties:
                amount: { type: number }
                payMethod: { type: string, enum: [wechat, alipay, card, prepaid] }
      responses:
        '200':
          description: 充值成功
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/PaymentResult' }

  /billing/auto-pay:
    get:
      tags: [Billing]
      summary: 自动缴费开通状态
      operationId: getAutoPay
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  autoPayEnabled: { type: boolean }

    post:
      tags: [Billing]
      summary: 开通/关闭自动缴费
      operationId: setAutoPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  autoPayEnabled: { type: boolean }

  /invoices:
    get:
      tags: [Billing]
      summary: 电子发票(开票信息 + 可开票账期 + 记录)
      operationId: listInvoices
      responses:
        '200':
          description: 发票聚合
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/InvoiceOverview' }

    post:
      tags: [Billing]
      summary: 申请开票
      operationId: applyInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billNo]
              properties:
                billNo: { type: string }
      responses:
        '200':
          description: 已申请
          content:
            application/json:
              schema: { $ref: './schemas.yaml#/components/schemas/Ok' }

