# 师傅端通用组件。字段命名遵循 docs/contract/fields.md 第 0 节(lowerCamelCase)。
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    TicketNo:
      name: ticketNo
      in: path
      required: true
      schema: { type: string }
      description: 工单号(ORD-新装 / TKT-报障 / EMG-应急)

  responses:
    Ok:
      description: 统一信封(HTTP 恒 200,业务码在 code;对齐 pkg/apitypes 与 httpx.Respond)
      content:
        application/json:
          schema:
            type: object
            required: [code, msg, data]
            properties:
              code: { type: integer, example: 0, description: 0=成功,非 0 见 pkg/apitypes 错误码 }
              msg: { type: string, example: ok }
              data: { description: 业务载荷(本文件各 schema 定义的是 data 内的形态) }

  schemas:
    Ticket:
      type: object
      properties:
        ticketNo: { type: string, example: ORD-20250817-001 }
        type: { type: string, enum: [INSTALL, CHANGE, REPAIR, DISMANTLE, EMERGENCY] }
        typeLabel: { type: string, example: 1000M 安装 }
        bizNo: { type: string, example: ORD-20250817-001, description: 关联订单/报障号 }
        address: { type: string, example: 望京X · 3栋501 }
        distanceKm: { type: number, example: 2.1 }
        scheduleSlot: { type: string, example: 今天 10:00-12:00 }
        stage: { type: integer, description: '新装单:1~12 环节;报障单:1~6 环节' }
        stageTotal: { type: integer, example: 12 }
        status: { type: string, enum: [TODO, ACCEPTED, SCAN_PENDING, DOING, DONE] }
        statusLabel: { type: string, example: 待扫码绑定 }
        slaLeftMinutes: { type: integer, nullable: true, description: 报障 SLA 剩余分钟 }
        finishedAt: { type: string, example: 08-16 }

    TicketList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Ticket' } }

    StageItem:
      type: object
      properties:
        stage: { type: integer }
        name: { type: string, example: 扫码绑定 }
        result: { type: string, enum: [DONE, DOING, PENDING] }
        finishedAt: { type: string, example: 08-17 09:20 }
        durationMinutes: { type: integer, nullable: true }
        note: { type: string, example: EPC-0001 }

    Quad:
      type: object
      description: 四码合一对照(资产/客户/端口/地址,见 terms.md 第 5 节)
      properties:
        assetCode: { type: string, example: EPC-0001 }
        customerCode: { type: string, example: LOID-88A1 }
        portCode: { type: string, example: P-SPL03-07 }
        addrCode: { type: string, example: A-3-501 }
        status: { type: string, enum: [LINKED, CONFLICT, UNLINKED] }
        matched: { type: boolean }

    TicketDetail:
      type: object
      properties:
        ticketNo: { type: string }
        bizNo: { type: string }
        status: { type: string }
        statusLabel: { type: string }
        product: { type: string, example: 1000M 极速宽带（有线）· ¥199/月 }
        customerName: { type: string, example: 王先生 }
        customerPhoneMasked: { type: string, example: 138****1234 }
        address: { type: string }
        splitterPort: { type: string, example: SPL-03-07 · PON 7口 }
        preBindTag: { type: string, example: EPC-0001 }
        scheduleSlot: { type: string }
        faultTypeLabel: { type: string, example: 单户断网（紧急 SLA ≤4h） }
        reportedAt: { type: string, example: 今天 09:40（已受理） }
        slaLeftMinutes: { type: integer, nullable: true }
        remoteDiagnosis: { type: string, description: 远程诊断结论(报障单) }
        stages: { type: array, items: { $ref: '#/components/schemas/StageItem' } }
        quad: { $ref: '#/components/schemas/Quad' }
        riskCheck:
          type: object
          properties:
            blacklistHit: { type: boolean }
            graylistHit: { type: boolean }

    Home:
      type: object
      properties:
        workerName: { type: string, example: 张师傅 }
        groupName: { type: string, example: 装机一组 }
        phoneMasked: { type: string }
        today:
          type: object
          properties:
            accepted: { type: integer }
            finished: { type: integer }
            doing: { type: integer }
            todo: { type: integer }
        ongoing: { type: array, items: { $ref: '#/components/schemas/Ticket' } }

    Navi:
      type: object
      properties:
        address: { type: string }
        distanceKm: { type: number }
        etaMinutes: { type: integer }
        entrance: { type: string, example: 东门进 · 3栋1单元 }

    ScanResult:
      type: object
      properties:
        matched: { type: boolean, description: 四码是否一致 }
        result: { type: string, enum: [MATCH, MISMATCH, OFFLINE_CACHED] }
        message: { type: string }
        quad: { $ref: '#/components/schemas/Quad' }

    Photo:
      type: object
      properties:
        photoId: { type: string }
        fileName: { type: string, example: photo_0809.jpg }
        linked: { type: boolean }

    InstallReport:
      type: object
      properties:
        ticketNo: { type: string }
        quad: { $ref: '#/components/schemas/Quad' }
        checks:
          type: object
          properties:
            powerOn: { type: boolean, description: 光猫通电 }
            opticalPowerDbm: { type: number, example: -16.2 }
            provisionDone: { type: boolean, description: 配置下发 }
            loidAuthPassed: { type: boolean }
        provisionLog:
          type: object
          properties:
            template: { type: string, example: GPON-1000M-v3 }
            preResult: { type: string, example: 成功 · 08-17 09:18 }
            onsiteResult: { type: string, example: 成功 · 自动 }

    Activation:
      type: object
      properties:
        ticketNo: { type: string }
        loid: { type: string, example: LOID-88A1 }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED] }
        statusLabel: { type: string, example: 未生效 }
        lastTry: { type: string, example: 08-17 10:32 · 回调超时 }

    Charge:
      type: object
      properties:
        ticketNo: { type: string }
        amountDue: { type: number, example: 199 }
        amountDesc: { type: string, example: 首月 }
        payMethods: { type: array, items: { type: string } }

    Replace:
      type: object
      properties:
        ticketNo: { type: string }
        oldEpc: { type: string, example: EPC-0002 }
        oldEpcStatus: { type: string, example: 故障 }
        replaceType: { type: string, example: 故障调换 · 旧件返修 }
        steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: 扫旧件 }
              status: { type: string, enum: [DONE, TODO] }
              note: { type: string }

    Materials:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              name: { type: string, example: 光猫 }
              qty: { type: integer }
              spec: { type: string, example: GPON 千兆 · 含标签 }
              outBound: { type: boolean }
        returned:
          type: object
          properties:
            repairCount: { type: integer }
            dismantleCount: { type: integer }
        pendingReturn:
          type: array
          items:
            type: object
            properties:
              epc: { type: string }
              reason: { type: string, example: 故障 · 返修（换件） }

    Tool:
      type: object
      properties:
        toolId: { type: string }
        name: { type: string, example: 光功率计 }
        borrowed: { type: boolean }

    MaintenanceItem:
      type: object
      properties:
        deviceNo: { type: string, example: EPC-0023 }
        deviceType: { type: string, example: 光猫 }
        healthScore: { type: integer }
        faultCount: { type: integer }
        ageYears: { type: integer }
        reason: { type: string, example: 信号衰减 }
        priority: { type: string, enum: [MUST_REPLACE, SUGGEST, WATCH] }
        priorityLabel: { type: string, example: 强替换 }

    Measure:
      type: object
      properties:
        opticalPowerDbm: { type: number, example: -16.2 }
        opticalPowerLabel: { type: string, example: 正常 }
        downloadMbps: { type: number, example: 942 }
        uploadMbps: { type: number, example: 96 }
        packetLossRate: { type: number, example: 0 }

    WorkerProfile:
      type: object
      properties:
        workerId: { type: integer }
        name: { type: string, example: 张师傅 }
        groupName: { type: string }
        staffNo: { type: string, example: WK-1024 }
        phoneMasked: { type: string }
        online: { type: boolean, description: 在线接单 }
        serveYears: { type: integer }
        month:
          type: object
          properties:
            finished: { type: integer }
            onTimeRate: { type: integer, description: 百分比 }
            score: { type: number }

    Performance:
      type: object
      properties:
        period: { type: string, example: '2025-08' }
        summary:
          type: object
          properties:
            finished: { type: integer }
            onTimeRate: { type: integer }
            score: { type: number }
        commissions:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: 装机提成 }
              formula: { type: string, example: 46 × ¥30 }
              amount: { type: number }
        totalAmount: { type: number }
        ranking:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              rank: { type: integer }
              self: { type: boolean }

    Schedule:
      type: object
      properties:
        month: { type: string, example: '2025-08' }
        busyDays: { type: array, items: { type: integer }, description: 有排期的日期 }
        today:
          type: array
          items:
            type: object
            properties:
              time: { type: string, example: '10:00' }
              ticketNo: { type: string }
              address: { type: string }

    Settings:
      type: object
      properties:
        online: { type: boolean }
        radiusKm: { type: integer, example: 5 }
        acceptTypes: { type: array, items: { type: string }, example: [新装宽带, 宽带变更, 拆机] }

    Feedbacks:
      type: object
      properties:
        latest:
          type: object
          properties:
            ticketNo: { type: string }
            score: { type: number }
        monthAvgScore: { type: number }
        replyRate: { type: integer, description: 评价回收率百分比 }
        items:
          type: array
          items:
            type: object
            properties:
              customerName: { type: string }
              score: { type: number }
              comment: { type: string }
              needReview: { type: boolean, description: 低分(<3)转复核 }

    Message:
      type: object
      properties:
        level: { type: string, enum: [INFO, WARN, URGENT] }
        title: { type: string, example: 超时预警 }
        content: { type: string }
        sentAt: { type: string, example: 08-17 10:30 }
        read: { type: boolean }

    Notice:
      type: object
      properties:
        noticeId: { type: string }
        title: { type: string }
        category: { type: string, example: 安全作业提醒 }
        publishedAt: { type: string, example: 08-16 }

    Faq:
      type: object
      properties:
        faqId: { type: string }
        title: { type: string, example: 光猫红灯/无法注册 }
        summary: { type: string, example: LOID 认证失败排查 }
