paths:
  /auth/sms-code:
    post:
      tags: [Auth]
      summary: 发送登录验证码
      operationId: sendWorkerSmsCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 师傅登录(验证码/工号密码)
      operationId: workerLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, mode]
              properties:
                phone: { type: string }
                mode: { type: string, enum: [sms, password] }
                smsCode: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  workerId: { type: integer }

  /auth/dev/sms-code:
    post:
      tags: [Auth]
      summary: 开发模式查询最新验证码(仅 BOSS_DEV_MODE=true 注册)
      operationId: devWorkerSmsCode
      description: |
        只在服务端 BOSS_DEV_MODE=true 时注册。供师傅端开发模式自动填表使用。
        返回该手机号 login 场景最近一条未过期且未消费的验证码;不存在返回 40400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200':
          description: 命中
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: '123456' }
                  issuedAt: { type: string, format: date-time }
        '404': { $ref: './schemas.yaml#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      operationId: workerLogout
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /worker-registrations:
    post:
      tags: [Auth]
      summary: 师傅自助注册(提交后进 admin 审核队列,公开端点)
      operationId: submitWorkerRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, idCardNo, groupId, regionId]
              properties:
                name: { type: string }
                phone: { type: string }
                idCardNo: { type: string }
                groupId: { type: integer }
                regionId: { type: integer }
      responses:
        '200':
          description: 已提交待审核
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, example: PENDING }
