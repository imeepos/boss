# 杂项域:消息/公告/排障手册/联系调度/安全上报。
paths:
  /messages:
    get:
      tags: [Misc]
      summary: 消息中心(应急/超时预警/改派/下发/标签电量)
      operationId: listMessages
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Message' }

  /messages/read-all:
    post:
      tags: [Misc]
      summary: 全部标记已读
      operationId: readAllMessages
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /messages/clear:
    post:
      tags: [Misc]
      summary: 清空已读消息
      operationId: clearMessages
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /notices:
    get:
      tags: [Misc]
      summary: 服务公告(安全/物料/功能)
      operationId: listNotices
      responses:
        '200':
          description: 公告列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Notice' }

  /help/faq:
    get:
      tags: [Misc]
      summary: 排障手册 SOP 检索(中/英/菲,装维与客服共用)
      operationId: searchFaq
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: SOP 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas.yaml#/components/schemas/Faq' }

  /service/messages:
    get:
      tags: [Misc]
      summary: 联系调度会话消息
      operationId: listServiceMessages
      responses:
        '200':
          description: 会话消息
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string, enum: [dispatcher, worker] }
                        content: { type: string }
    post:
      tags: [Misc]
      summary: 发送消息给调度(可转人工)
      operationId: sendServiceMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /safety/checks:
    post:
      tags: [Misc]
      summary: 安全作业确认上报(高风险作业先确认留痕)
      operationId: submitSafetyCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workType, checklist]
              properties:
                workType: { type: string, example: 高空作业（爬杆/登高） }
                checklist: { type: array, items: { type: string } }
      responses:
        '200': { $ref: './schemas.yaml#/components/responses/Ok' }

  /attachments/upload:
    post:
      tags: [Misc]
      summary: 附件上传(multipart/form-data,字段 file;单文件上限 32MB)
      description: 上传者身份固定 worker + 当前师傅 ID。
      operationId: uploadWorkerAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: envelope;data 为附件登记记录(id/objectKey/fileName/contentType/sizeBytes/uploaderType/uploaderId/createdAt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object }

  /push/device:
    post:
      tags: [Misc]
      summary: 推送设备上报(师傅 App 启动/登录后上报 JPush RegistrationID)
      operationId: registerWorkerPushDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId]
              properties:
                registrationId: { type: string, example: "1507bfd3f9ac1e045a", description: 10-64 位字母数字 }
                vendor: { type: string, example: jpush }
      responses:
        '200':
          description: envelope;同 RegistrationID 重复上报幂等(设备换账号改绑)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { ok: { type: boolean } } }
        '422':
          description: registrationId 形态非法(42200)

  /client/crash:
    post:
      tags: [Misc]
      summary: 客户端崩溃日志上报(App 启动补传本地留痕,成功即删本地文件)
      operationId: uploadClientCrash
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log]
              properties:
                app: { type: string, example: "boss-worker/0.1.0", description: 客户端标识/版本 }
                log: { type: string, description: 崩溃文本(线程/时间/堆栈);服务端截断至 64KB 保尾部 }
      responses:
        '200':
          description: envelope;尽力而为,入库失败 5xx 由 App 保留文件重传
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data: { type: object, properties: { ok: { type: boolean } } }
