# 复制为 config.yaml 并按环境调整;敏感项建议走环境变量/Nacos
server:
  http_addr: ":8080"
  grpc_addr: ":9090"

database:
  dsn: "host=localhost port=5432 user=boss password=boss dbname=boss sslmode=disable"

redis:
  addrs: ["localhost:6379"]

kafka:
  brokers: ["localhost:9092"]

nacos:
  # 业务参数热更新(欠费阈值、预占有效期等)
  enabled: false
  server: "localhost:8848"

minio:
  endpoint: "localhost:9000"
  access_key: boss
  secret_key: boss12345

temporal:
  host: "localhost:7233"

victoriametrics:
  url: "http://localhost:8428"

jwt:
  secret: "change-me"
  ttl: 12h
