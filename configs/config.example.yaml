# 复制为 config.yaml 并按环境调整;敏感项建议走环境变量/Nacos
server:
  http_addr: ":8080"
  grpc_addr: ":9090"

database:
  # 102 服务器私有仓库版基础设施(见 deployments/docker-compose.102.yml)
  dsn: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"

redis:
  addrs: ["192.168.0.102:26379"]

kafka:
  brokers: ["192.168.0.102:29092"]

nacos:
  # 业务参数热更新(欠费阈值、预占有效期等)
  enabled: false
  server: "192.168.0.102:18848"

minio:
  endpoint: "192.168.0.102:29000"
  access_key: boss
  secret_key: boss12345

temporal:
  host: "192.168.0.102:17233"

victoriametrics:
  url: "http://192.168.0.102:18428"

jwt:
  secret: "change-me"
  ttl: 12h
