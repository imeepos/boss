<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍照取证 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="scanabnormal.html">&lsaquo;</a>
    <div class="t">拍照取证</div>
    <span class="act">留痕</span>
  </div>

  <div class="card">
    <div class="c-title" id="ticket-no">ORD-20250817-001</div>
    <div class="kv"><span class="k">取证场景</span><span class="v">光猫标签污损 / 现场环境</span></div>
  </div>

  <div class="card" style="text-align:center;">
    <div class="scan-frame" style="padding:50px 16px;">
      <div class="glyph">▣</div>
      <div class="hint">拍照并上传，自动关联当前工单</div>
      <div class="hint muted">支持多张，弱网自动缓存上传</div>
    </div>
    <button class="btn-primary btn-block" onclick="upload()">拍照上传</button>
  </div>

  <div class="card">
    <div class="c-title">已上传 <span class="more" id="photo-count">0 张</span></div>
    <div id="photo-list"></div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function set(id, text) { document.getElementById(id).textContent = text || '-'; }

function renderPhotos(d) {
  var items = (d && d.items) || [];
  set('ticket-no', d && d.ticketNo ? d.ticketNo : NO);
  set('photo-count', items.length + ' 张');
  document.getElementById('photo-list').innerHTML = items.map(function (it) {
    return '<div class="kv"><span class="k">' + it.fileName + '</span>'
      + '<span class="v">' + (it.linked ? '已关联' : '待关联') + '</span></div>';
  }).join('');
}

function refresh() {
  API.scan.photos(NO).then(renderPhotos).catch(function (e) { alert('加载失败：' + e.message); });
}

function upload() {
  API.scan.uploadPhoto(NO, '现场取证').then(function () {
    set('ticket-no', NO);
    refresh();
  }).catch(function (e) {
    alert('上传失败：' + (e && e.message ? e.message : e));
  });
}

refresh();
</script>
</body>
</html>
