<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务池 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="home.html">&lsaquo;</a>
    <div class="t">任务池</div>
    <span class="act">跨区公开</span>
  </div>

  <div class="card">
    <div class="c-title" id="hall-title">可抢工单</div>
    <div id="hall-list"></div>
  </div>

  <div class="card">
    <div class="notice">任务池按区域与技能公开，先到先得；抢单后进入「我的工单」。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  function fix(n, d) { if (n === undefined || n === null) return d; return n; }

  function orderType(no) {
    return (no && no.indexOf('EMG') === 0) ? 'repair.html' : 'order.html';
  }

  function cell(it) {
    var no = fix(it.ticketNo, '');
    var d = fix(it.address, '');
    if (it.distanceKm !== undefined && it.distanceKm !== null) d += ' · 距您 ' + it.distanceKm + 'km';
    return '<div class="cell"><div class="main"><div class="t" id="h-' + no + '">' + no + ' · ' + fix(it.typeLabel, '') + '</div><div class="d">' + d + '</div></div>'
      + '<div class="right"><button class="btn btn-primary" style="padding:6px 12px;" data-no="' + no + '">抢单</button></div></div>';
  }

  function load() {
    document.getElementById('hall-title').textContent = '可抢工单 · 加载中…';
    API.hall.list().then(function (r) {
      var items = (r && r.items) || [];
      document.getElementById('hall-title').textContent = '可抢工单 (' + items.length + ' 单)';
      document.getElementById('hall-list').innerHTML = items.map(cell).join('');
    }).catch(function () {
      document.getElementById('hall-title').textContent = '可抢工单';
      document.getElementById('hall-list').innerHTML = '<div class="notice">任务池加载失败，请刷新重试。</div>';
    });
  }

  var list = document.getElementById('hall-list');
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-no]');
    if (!btn) return;
    var no = btn.getAttribute('data-no');
    API.hall.grab(no).then(function (r) {
      alert((r && r.message) || '抢单成功');
      btn.textContent = '已抢';
      btn.disabled = true;
      btn.classList.remove('btn-primary');
      var t = document.getElementById('h-' + no);
      if (t) t.innerHTML = '<a href="' + orderType(no) + '?no=' + encodeURIComponent(no) + '">' + no + ' · ' + t.textContent.split('·').slice(1).join('·').trim() + '</a>';
    }).catch(function () { alert('抢单失败，请重试。'); });
  });

  load();
})();
</script>
</body>
</html>
