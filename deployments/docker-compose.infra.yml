name: boss-infra

services:
  postgres:
    # 迁移用到 PostGIS(GEOGRAPHY/GEOMETRY 类型),使用内置 postgis 的镜像(发现 2.4)。
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: boss
      POSTGRES_DB: boss
    ports: ["25432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"

  nacos:
    image: nacos/nacos-server:v2.3.2
    ports: ["8848:8848"]
    environment:
      MODE: standalone

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: boss
      MINIO_ROOT_PASSWORD: boss12345
    volumes: [miniodata:/data]

  temporal:
    image: temporalio/auto-setup:1.24
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: boss
      POSTGRES_PWD: boss
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]

  victoriametrics:
    image: victoriametrics/victoria-metrics
    ports: ["8428:8428"]
    volumes: [vmdata:/victoria-metrics-data]

volumes:
  pgdata:
  miniodata:
  vmdata:
