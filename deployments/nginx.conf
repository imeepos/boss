# Nginx 负载均衡配置
# boss-server 多节点负载均衡 + 健康检查

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # boss-server 上游服务器组
    upstream boss_servers {
        least_conn;  # 最少连接算法
        server 192.168.0.102:28080 max_fails=3 fail_timeout=30s;
        server 192.168.0.103:28080 max_fails=3 fail_timeout=30s;
        server 192.168.0.104:28080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # boss-server gRPC 上游
    upstream boss_grpc_servers {
        least_conn;
        server 192.168.0.102:29090 max_fails=3 fail_timeout=30s;
        server 192.168.0.103:29090 max_fails=3 fail_timeout=30s;
        server 192.168.0.104:29090 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP 服务
    server {
        listen 80;
        server_name boss.ymm.cn;

        # 健康检查端点
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API 代理
        location /api/ {
            proxy_pass http://boss_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # 重试配置
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # 健康检查代理
        location /healthz {
            proxy_pass http://boss_servers/healthz;
            proxy_set_header Host $host;
            access_log off;
        }

        # 静态文件(如果有)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS 配置(可选,需要证书)
    # server {
    #     listen 443 ssl http2;
    #     server_name boss.ymm.cn;
    #
    #     ssl_certificate /etc/nginx/ssl/boss.ymm.cn.pem;
    #     ssl_certificate_key /etc/nginx/ssl/boss.ymm.cn.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     location /api/ {
    #         proxy_pass http://boss_servers;
    #         # ... 其他配置同上
    #     }
    # }
}
