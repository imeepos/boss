# 102 服务器应用部署版:boss 业务进程,依赖 docker-compose.102.yml 基础设施。
# 镜像走私有仓库 192.168.0.102:5000/boss/server;全部配置内联 environment 段,
# 不依赖 env_file——CI runner working_dir 与宿主机不一致会导致 env_file 读不到。
# JWT 密钥固定不变,轮换会使全部登录 token 失效。
services:
  server:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-server
    restart: unless-stopped
    ports:
      - "28080:8080" # HTTP(/healthz /metrics /api)
      - "29090:9090" # gRPC
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_KAFKA_BROKERS: "192.168.0.102:29092"
      BOSS_JWT_SECRET: "sjb3jaoqhtWPAErtglyE2TqDiMc1j7oYXx5+IjmE+M5pdQ16V/Wrc5MUBIOZwYdt"
      BOSS_ADMIN_USERNAME: "admin"
      BOSS_ADMIN_PASSWORD: "admin123"
      BOSS_DEBUG_SMS: "1" # 102 联调机开启 /debug/sms-code;严禁带到线上
      BOSS_DEV_MODE: "true" # 102 联调机开启 dev 端点(验证码回显等);生产严禁开启
      BOSS_HOSTCTL_URL: "http://172.26.0.1:39093"
      # HMAC key 通过 bind mount 注入,不进 git/env/process
      BOSS_HOSTCTL_HMAC_KEY_FILE: "/run/hostctl-hmac/hmac.key"
      # 数据备份迁移归档目录(迁移 000095,/backup/* API);命名卷持久化
      BOSS_BACKUP_DIR: "/data/backups"
    volumes:
      # hostctl HMAC key:宿主机 /etc/boss-host-ctl/hmac.key(0600)
      - /etc/boss-host-ctl/hmac.key:/run/hostctl-hmac/hmac.key:ro
      - boss_backup_data:/data/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  report:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-report
    entrypoint: ["boss-report"]
    restart: unless-stopped
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_KAFKA_BROKERS: "192.168.0.102:29092"
      BOSS_REPORT_PERIOD: "daily"

  admin-web:
    image: 192.168.0.102:5000/boss/admin-web:latest
    container_name: boss-admin-web
    restart: unless-stopped
    ports:
      - "5180:80" # admin 前端
    depends_on:
      - server

volumes:
  boss_backup_data:
