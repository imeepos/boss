# 102 服务器应用部署版:boss 业务进程,依赖 docker-compose.102.yml 基础设施。
# 镜像走私有仓库 192.168.0.102:5000/boss/server;全部配置内联 environment 段,
# 不依赖 env_file——CI runner working_dir 与宿主机不一致会导致 env_file 读不到。
# JWT 密钥固定不变,轮换会使全部登录 token 失效。
services:
  server:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-server
    hostname: boss-server # 授权证书绑定机器指纹(hostname sha256);固定防容器重建后证书失效
    restart: unless-stopped
    ports:
      - "28080:8080" # HTTP(/healthz /metrics /api)
      - "29090:9090" # gRPC
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_KAFKA_BROKERS: "192.168.0.102:29092"
      BOSS_JWT_SECRET: "sjb3jaoqhtWPAErtglyE2TqDiMc1j7oYXx5+IjmE+M5pdQ16V/Wrc5MUBIOZwYdt"
      BOSS_ADMIN_USERNAME: "admin"
      BOSS_ADMIN_PASSWORD: "admin123"
      BOSS_DEBUG_SMS: "1" # 102 联调机开启 /debug/sms-code;严禁带到线上
      BOSS_DEV_MODE: "true" # 102 联调机开启 dev 端点(验证码回显等);生产严禁开启
      # Stripe 卡收单凭据 2026-09-05 起只走后台支付配置页(biz_params stripe.*,secret 密文落库),
      # 不再经环境变量注入;未配置时收款方式默认线下。102 测试账号凭据(sk_test/whsec)需在
      # admin「支付配置」页重新录入(自检页可真实探活),webhook endpoint 自愈循环仍按既有隧道制。
      # 前端直连后端(admin-web 5180 → server 28080)的 CORS 白名单:
      # 中间件现为任意 Origin 回显放行,此值作为显式配置与未来收紧时的护栏。
      BOSS_CORS_ORIGINS: "http://192.168.0.102:5180,http://localhost:5173,http://localhost:5174"
      BOSS_HOSTCTL_URL: "http://172.26.0.1:39093"
      # HMAC key 通过 bind mount 注入,不进 git/env/process
      BOSS_HOSTCTL_HMAC_KEY_FILE: "/run/hostctl-hmac/hmac.key"
      # 数据备份迁移归档目录(迁移 000095,/backup/* API);命名卷持久化
      BOSS_BACKUP_DIR: "/data/backups"
      # 系统授权激活链路(release-platform):rpat_ operator token,兑码+取离线令牌专用;
      # 铸造于 release-platform /v1/tokens(id=boss-activation),轮换=重铸后改此处。
      # 同"内网私有 gitea 简化 CI 直接入库"裁定落 env;API 地址走 config 默认 38080。
      BOSS_LICENSE_API_TOKEN: "rpat_b32374e327a0771d1786001192cbc82045d7ec5405dacb1cf13b356054e8e877"
      BOSS_LICENSE_API_BASE_URL: "http://192.168.0.102:38080"
      BOSS_LICENSE_PRODUCT_ID: "boss-server"
    volumes:
      # hostctl HMAC key:宿主机 /etc/boss-host-ctl/hmac.key(0600)
      - /etc/boss-host-ctl/hmac.key:/run/hostctl-hmac/hmac.key:ro
      - boss_backup_data:/data/backups
      # 系统授权证书(激活后离线令牌落盘);命名卷持久化,跨部署重建不丢授权
      - boss_license_data:/var/lib/boss
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  aaa:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-aaa
    entrypoint: ["boss-aaa"]
    restart: unless-stopped
    ports:
      - "1812:1812/udp" # RADIUS Authentication
      - "1813:1813/udp" # RADIUS Accounting
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_KAFKA_BROKERS: "192.168.0.102:29092"
      BOSS_AAA_AUTH_ADDR: ":1812"
      BOSS_AAA_ACCT_ADDR: ":1813"
      BOSS_AAA_SECRET: "boss-aaa-secret"
      BOSS_AAA_CDR_TOPIC: "boss-cdr"

  report:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-report
    entrypoint: ["boss-report"]
    restart: unless-stopped
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_KAFKA_BROKERS: "192.168.0.102:29092"
      BOSS_REPORT_PERIOD: "daily"

  # W7 配置下发守护进程:轮询 provision_tasks PENDING → Telnet 到 OLT 下发模板。
  # 102 接 oltsim 仿真 OLT(宿主机 systemd boss-oltsim.service,telnet 2323);
  # driver 缺省 log 桩(cbdddb22 起),102 环境必须显式 telnet,否则任务被静默 noop 落 DONE;
  # 接真实 OLT 时只改 BOSS_PROVISION_OLT_ADDR/USER/PASS,链路不变。
  provisioner:
    image: 192.168.0.102:5000/boss/server:latest
    container_name: boss-provisioner
    entrypoint: ["boss-provisioner"]
    restart: unless-stopped
    environment:
      BOSS_PG_DSN: "host=192.168.0.102 port=25432 user=boss password=boss dbname=boss sslmode=disable"
      BOSS_PROVISION_DRIVER: "telnet" # 缺省 log 桩;缺此行旧链路静默失效(2026-09-02 oltsim 回归)
      BOSS_PROVISION_OLT_ADDR: "172.26.0.1:2323" # docker 网桥宿主网关 → oltsim
      BOSS_PROVISION_OLT_USER: "admin"
      BOSS_PROVISION_OLT_PASS: "admin"

  admin-web:
    image: 192.168.0.102:5000/boss/admin-web:latest
    container_name: boss-admin-web
    restart: unless-stopped
    ports:
      - "5180:80" # admin 前端
    depends_on:
      - server

volumes:
  boss_backup_data:
  boss_license_data:
