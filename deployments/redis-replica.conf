# Redis 从节点配置 (node-2, node-3)
bind 0.0.0.0
port 6379
protected-mode no

# 持久化
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 复制:指向主节点
replicaof 192.168.0.102 6379
replica-announce-ip ${NODE_IP}
replica-announce-port 6379
replica-read-only yes

# 内存
maxmemory 4gb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
logfile "/data/redis.log"
