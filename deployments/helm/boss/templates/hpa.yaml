{{- if .Values.server.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boss-server
  labels: { app: boss, component: server }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boss-server
  minReplicas: {{ .Values.server.hpa.minReplicas }}
  maxReplicas: {{ .Values.server.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.server.hpa.cpuTarget }} }
{{- end }}
