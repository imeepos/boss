{{- $comp := dict
  "server" (dict "cmd" "server" "probes" true "svc" true)
  "collector" (dict "cmd" "collector" "probes" false "svc" false)
  "provisioner" (dict "cmd" "provisioner" "probes" false "svc" false)
  "gis" (dict "cmd" "gis" "probes" false "svc" false)
  "report" (dict "cmd" "report" "probes" false "svc" false) }}
{{- range $name, $c := $comp }}
{{- if or (eq $name "server") (index $.Values.components $name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boss-{{ $name }}
  labels: { app: boss, component: "{{ $name }}" }
spec:
  {{- if eq $name "server" }}
  replicas: {{ $.Values.server.replicas }}
  {{- else }}
  replicas: {{ $.Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: boss, component: "{{ $name }}" }
  template:
    metadata:
      labels: { app: boss, component: "{{ $name }}" }
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["boss-{{ $c.cmd }}"]
          env:
            - name: BOSS_HTTP_ADDR
              value: ":{{ $.Values.server.httpPort }}"
            - name: BOSS_GRPC_ADDR
              value: ":{{ $.Values.server.grpcPort }}"
            {{- range $k, $v := $.Values.env }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- /* 依赖自建时自动接线:显式 env 优先,子 chart 服务兜底 */}}
            {{- if and $.Values.postgresql.enabled (not $.Values.env.BOSS_DATABASE_DSN) }}
            - name: BOSS_DATABASE_DSN
              value: "host={{ $.Release.Name }}-postgresql port=5432 user=boss password=boss dbname=boss sslmode=disable"
            {{- end }}
            {{- if and $.Values.kafka.enabled (not $.Values.env.BOSS_KAFKA_BROKERS) }}
            - name: BOSS_KAFKA_BROKERS
              value: "{{ $.Release.Name }}-kafka:9092"
            {{- end }}
          {{- if $c.probes }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          {{- end }}
          resources:
            {{- if eq $name "server" }}
            {{- toYaml $.Values.server.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.worker.resources | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $.Values.server.httpPort }}
            - name: grpc
              containerPort: {{ $.Values.server.grpcPort }}
---
{{- if $c.svc }}
apiVersion: v1
kind: Service
metadata:
  name: boss-server
  labels: { app: boss, component: server }
spec:
  selector: { app: boss, component: server }
  ports:
    - name: http
      port: {{ $.Values.server.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ $.Values.server.grpcPort }}
      targetPort: grpc
---
{{- end }}
{{- end }}
{{- end }}
