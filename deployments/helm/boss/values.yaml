# BOSS 部署参数(阶段12)。DSN 等敏感项经 --set 或外部 Secret 注入,不落库。
image:
  repository: boss-server
  tag: ""        # 缺省取 appVersion
  pullPolicy: IfNotPresent

# 组件开关:server 必启;其余按阶段灰度。
components:
  collector: true
  provisioner: true
  gis: true
  report: true

server:
  replicas: 2
  httpPort: 8080
  grpcPort: 9090
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70

worker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

env:
  BOSS_DATABASE_DSN: ""        # 必填(外部注入);postgresql.enabled=true 时可留空自动接线
  BOSS_KAFKA_BROKERS: ""       # 留空且 kafka.enabled=true 时自动接线子 chart
  BOSS_EVENTS_TOPIC: boss-order-events
  BOSS_PROVISION_OLT_ADDR: "0" # 配置真实 OLT 后 Telnet 执行器生效
  BOSS_SNMP_TARGETS: ""
  BOSS_REPORT_PERIOD: daily

# 生产入口(域名/TLS 决策见 docs/notes/adopted/2026-08-20-prod-domain-tls.md)。
ingress:
  enabled: false            # 生产置 true,暴露 boss.ymm.cn
  className: nginx
  host: boss.ymm.cn
  clusterIssuer: letsencrypt-prod
  tlsSecret: boss-ymm-cn-tls

# 依赖子 chart(默认外接既有基础设施;新集群置 true 自建并自动接线)。
postgresql:
  enabled: false
  auth: { username: boss, password: boss, database: boss }
redis:
  enabled: false
kafka:
  enabled: false
