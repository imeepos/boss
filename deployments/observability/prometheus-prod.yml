# Prometheus 生产配置
# 多节点监控:基础设施 + 应用 + 节点指标

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alerting-rules.yml"

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 监控目标
scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (所有节点)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - '192.168.0.102:9100'
        - '192.168.0.103:9100'
        - '192.168.0.104:9100'
        labels:
          cluster: 'boss-prod'

  # Boss Server (所有节点)
  - job_name: 'boss-server'
    static_configs:
      - targets:
        - '192.168.0.102:28080'
        - '192.168.0.103:28080'
        - '192.168.0.104:28080'
    metrics_path: '/metrics'

  # PostgreSQL (所有节点)
  - job_name: 'postgres'
    static_configs:
      - targets:
        - '192.168.0.102:25432'
        - '192.168.0.103:25432'
        - '192.168.0.104:25432'

  # Redis (所有节点)
  - job_name: 'redis'
    static_configs:
      - targets:
        - '192.168.0.102:26379'
        - '192.168.0.103:26379'
        - '192.168.0.104:26379'

  # Kafka (所有节点)
  - job_name: 'kafka'
    static_configs:
      - targets:
        - '192.168.0.102:29092'
        - '192.168.0.103:29092'
        - '192.168.0.104:29092'

  # VictoriaMetrics
  - job_name: 'victoriametrics'
    static_configs:
      - targets:
        - '192.168.0.102:18428'

  # APISIX 网关
  - job_name: 'apisix'
    static_configs:
      - targets:
        - '192.168.0.102:29180'
        - '192.168.0.103:29180'
        - '192.168.0.104:29180'

  # Temporal
  - job_name: 'temporal'
    static_configs:
      - targets:
        - '192.168.0.102:17233'
