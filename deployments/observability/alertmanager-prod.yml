# Alertmanager 生产配置
# 告警通道:企微/钉钉/短信/邮件

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  routes:
    # 紧急告警:立即通知
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
    
    # 警告:延迟通知
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: 'default'
    # 默认:企微机器人 webhook
    webhook_configs:
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY'
        send_resolved: true
        http_config:
          bearer_token: 'YOUR_TOKEN'

  - name: 'critical-alerts'
    # 紧急告警:企微 + 钉钉 + 短信
    webhook_configs:
      # 企微机器人
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY'
        send_resolved: true
      # 钉钉机器人
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_DINGTALK_TOKEN'
        send_resolved: true
    # 邮件通知(可选)
    # email_configs:
    #   - to: 'admin@ymm.cn'
    #     from: 'alertmanager@ymm.cn'
    #     smarthost: 'smtp.ymm.cn:587'
    #     auth_username: 'alertmanager@ymm.cn'
    #     auth_password: 'EMAIL_PASSWORD'

  - name: 'warning-alerts'
    # 警告:企微机器人
    webhook_configs:
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY'
        send_resolved: true

# 告警静默规则(维护窗口)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
