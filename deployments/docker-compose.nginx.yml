# Nginx 负载均衡配置
# 用法:在所有节点运行,docker compose -f docker-compose.nginx.yml up -d
# 功能:负载均衡 boss-server + 健康检查 + 故障自动摘除
name: boss-nginx

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: boss-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nginx-logs:
