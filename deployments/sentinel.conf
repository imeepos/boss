# Redis 哨兵配置 (所有节点)
port 26379
sentinel monitor boss-master 192.168.0.102 6379 2
sentinel down-after-milliseconds boss-master 5000
sentinel failover-timeout boss-master 60000
sentinel parallel-syncs boss-master 1

# 告警脚本(可选)
# sentinel notification-script boss-master /data/alert.sh

# 日志
loglevel notice
logfile "/data/sentinel.log"
