<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四码合一 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">四码合一</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>四码合一</h2>
        <div class="desc">四码关联查询 · 对账见独立菜单</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:320px" id="code" placeholder="输入任一码反查四码关系">
        <button class="btn btn-primary" id="btn-query">查询</button>
        <span class="spacer"></span>
        <span class="tag tag-orange">今日对账冲突：2 笔待处理</span>
      </div>
      <div class="card">
        <div class="card-title">四码关联关系</div>
        <table class="tbl">
          <thead><tr><th>资产码</th><th>用户码</th><th>端口码</th><th>地址码</th><th>关联状态</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
(function () {
  var ST_TAG = { LINKED: 'tag-green', CONFLICT: 'tag-red', UNLINKED: 'tag-gray' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }

  function load() {
    API.quad.links(document.getElementById('code').value.trim())
      .then(function (r) {
        var html = '';
        for (var i = 0; i < r.items.length; i++) {
          var q = r.items[i];
          html += '<tr><td>' + esc(q.assetCode) + '</td><td>' + esc(q.customerCode) + '</td><td>' + esc(q.portCode)
            + '</td><td>' + esc(q.addrCode) + '</td><td>' + tag(ST_TAG[q.status] || 'tag-gray', q.statusLabel || q.status) + '</td></tr>';
        }
        document.getElementById('rows').innerHTML = html || '<tr><td colspan="5">无匹配记录</td></tr>';
      })
      .catch(function (e) { alert('四码查询失败: ' + e.message); });
  }

  document.getElementById('btn-query').onclick = load;
  document.getElementById('code').addEventListener('keydown', function (ev) {
    if (ev.keyCode === 13) load();
  });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
