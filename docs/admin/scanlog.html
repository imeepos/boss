<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码绑定记录 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">扫码绑定记录</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>扫码绑定记录</h2>
        <div class="desc">实物光猫与订单绑定 · 预绑定一致性校验 · 异常拒绝留痕</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="订单号/标签/资产码">
        <select class="input" style="width:140px" id="rs"><option value="">全部结果</option><option value="MATCH">绑定成功</option><option value="MISMATCH">绑定拒绝</option></select>
        <span class="spacer"></span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>订单号</th><th>师傅</th><th>扫码标签</th><th>预绑定标签</th><th>校验结果</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
(function () {
  var ST_TAG = { MATCH: 'tag-green', MISMATCH: 'tag-red' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }

  function load() {
    API.quad.scanLogs(document.getElementById('kw').value.trim())
      .then(function (r) {
        var rs = document.getElementById('rs').value;
        var items = rs ? r.items.filter(function (x) { return x.result === rs; }) : r.items;
        var html = '';
        for (var i = 0; i < items.length; i++) {
          var s = items[i];
          html += '<tr><td>' + esc(s.orderNo) + '</td><td>' + esc(s.master) + '</td><td>' + esc(s.scannedTag) + '</td><td>' + esc(s.preboundTag)
            + '</td><td>' + tag(ST_TAG[s.result] || 'tag-gray', s.resultLabel) + '</td><td>' + esc(s.time)
            + '</td><td><a href="#" class="op" data-no="' + esc(s.orderNo) + '">详情</a></td></tr>';
        }
        document.getElementById('rows').innerHTML = html || '<tr><td colspan="7">无数据</td></tr>';
      })
      .catch(function (e) { alert('扫码记录加载失败: ' + e.message); });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A') return;
    ev.preventDefault();
    alert('订单 ' + a.getAttribute('data-no') + ' 扫码详情: 演示操作');
  });

  document.getElementById('kw').addEventListener('input', load);
  document.getElementById('rs').addEventListener('change', load);

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
