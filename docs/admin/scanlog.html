<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码绑定记录 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">扫码绑定记录</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>扫码绑定记录</h2>
        <div class="desc">实物光猫与订单绑定 · 预绑定一致性校验 · 异常拒绝留痕</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="订单号/标签/资产码">
        <select class="input" style="width:140px"><option>全部结果</option><option>绑定成功</option><option>绑定拒绝</option></select>
        <span class="spacer"></span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>订单号</th><th>师傅</th><th>扫码标签</th><th>预绑定标签</th><th>校验结果</th><th>时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>ORD-20250817-001</td><td>张师傅</td><td>EPC-0001</td><td>EPC-0001</td><td><span class="tag tag-green">一致</span></td><td>10:40</td><td><a href="#">详情</a></td></tr>
            <tr><td>ORD-20250816-019</td><td>陈师傅</td><td>EPC-0019</td><td>EPC-0018</td><td><span class="tag tag-red">拒绝(不一致)</span></td><td>09:20</td><td><a href="#">详情</a></td></tr>
            <tr><td>ORD-20250816-020</td><td>李师傅</td><td>EPC-0020</td><td>EPC-0020</td><td><span class="tag tag-green">一致</span></td><td>08:55</td><td><a href="#">详情</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
