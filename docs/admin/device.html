<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLT 设备监控 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">OLT 设备监控</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>OLT 设备监控</h2>
        <div class="desc">OLT 在线状态、光功率、丢包率、告警</div>
      </div>

      <div class="grid g-4" style="margin-bottom:16px;" id="stats"></div>
      <div class="card">
        <div class="card-title">设备状态</div>
        <table class="tbl">
          <thead><tr><th>设备</th><th>地址</th><th>状态</th><th>光功率(dBm)</th><th>丢包率</th><th>告警</th></tr></thead>
          <tbody id="devBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderStats(stats) {
  var html = '';
  html += '<div class="stat"><div class="label">OLT 总数</div><div class="val">' + esc(stats.total) + '</div></div>';
  html += '<div class="stat"><div class="label">在线</div><div class="val">' + esc(stats.online) + '</div></div>';
  html += '<div class="stat"><div class="label">离线</div><div class="val">' + esc(stats.offline) + '</div></div>';
  html += '<div class="stat"><div class="label">活跃告警</div><div class="val">' + esc(stats.activeAlarms) + '</div></div>';
  document.getElementById('stats').innerHTML = html;
}
function alarmCell(d) {
  return d.alarmClass
    ? '<span class="tag ' + esc(d.alarmClass) + '">' + esc(d.alarmLabel) + '</span>'
    : esc(d.alarmLabel);
}
function renderDevices(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var d = items[i];
    html += '<tr><td>' + esc(d.deviceName) + '</td><td>' + esc(d.address) +
      '</td><td><span class="tag ' + esc(d.statusClass) + '">' + esc(d.statusLabel) + '</span></td>' +
      '<td>' + esc(d.opticalPower) + '</td><td>' + esc(d.packetLoss) + '</td><td>' + alarmCell(d) + '</td></tr>';
  }
  document.getElementById('devBody').innerHTML = html;
}
function loadDevices() {
  API.oss.oltDevices()
    .then(function (d) { renderStats(d.stats); renderDevices(d.items); })
    .catch(function (e) { alert('加载 OLT 设备失败: ' + e.message); });
}
function init() {
  loadDevices();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
