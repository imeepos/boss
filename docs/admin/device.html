<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLT 设备监控 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">OLT 设备监控</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>OLT 设备监控</h2>
        <div class="desc">OLT 在线状态、光功率、丢包率、告警</div>
      </div>

      <div class="grid g-4" style="margin-bottom:16px;">
        <div class="stat"><div class="label">OLT 总数</div><div class="val">86</div></div>
        <div class="stat"><div class="label">在线</div><div class="val">82</div></div>
        <div class="stat"><div class="label">离线</div><div class="val">4</div></div>
        <div class="stat"><div class="label">活跃告警</div><div class="val">17</div></div>
      </div>
      <div class="card">
        <div class="card-title">设备状态</div>
        <table class="tbl">
          <thead><tr><th>设备</th><th>地址</th><th>状态</th><th>光功率(dBm)</th><th>丢包率</th><th>告警</th></tr></thead>
          <tbody>
            <tr><td>OLT-01</td><td>望京机房</td><td><span class="tag tag-green">在线</span></td><td>-18.2</td><td>0.01%</td><td>无</td></tr>
            <tr><td>OLT-02</td><td>望京机房</td><td><span class="tag tag-green">在线</span></td><td>-18.6</td><td>0.03%</td><td>无</td></tr>
            <tr><td>OLT-15</td><td>朝阳机房</td><td><span class="tag tag-red">离线</span></td><td>—</td><td>—</td><td><span class="tag tag-red">3 条</span></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
