<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告警中心 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">告警中心</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>告警中心</h2><div class="desc">跨域告警汇聚 · 设备/四码/配置等异常</div></div>

      <div class="toolbar">
        <select class="input" style="width:140px" id="levelSel"><option value="">级别：全部</option><option value="CRITICAL">严重</option><option value="WARNING">警告</option><option value="INFO">提示</option></select>
        <span class="spacer"></span>
        <span class="tag tag-red">未处理严重告警：5</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>级别</th><th>来源</th><th>内容</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="alarmRows"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">台风应急 · 批量复测 <span class="extra">MON-004 应急任务下发</span></div>
        <table class="tbl">
          <thead><tr><th>任务号</th><th>片区</th><th>受影响客户</th><th>下发范围</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>EMG-20250817-001</td><td>望京X片区</td><td>23 户</td><td>跨区公开抢单</td><td><span class="tag tag-orange">进行中</span></td><td><a href="#" id="emgSend">下发</a> <a href="#" id="emgList">清单</a></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 告警中心渲染(契约: GET /alarms, POST /alarms/{alarmId}/ack, POST /alarms/batch-retest)
(function () {
  var LEVEL_TAG = { CRITICAL: 'tag-red', WARNING: 'tag-orange', INFO: 'tag-blue' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(items) {
    document.getElementById('alarmRows').innerHTML = items.map(function (r) {
      return '<tr><td><span class="tag ' + (LEVEL_TAG[r.level] || 'tag-gray') + '">' + esc(r.levelLabel)
        + '</span></td><td>' + esc(r.source) + '</td><td>' + esc(r.content) + '</td><td>' + esc(r.time)
        + '</td><td><a href="#" data-dispatch="' + esc(r.alarmId) + '">派单处理</a> <a href="#" data-ack="'
        + esc(r.alarmId) + '">确认</a></td></tr>';
    }).join('');
  }

  function load() {
    API.alarm.list(document.getElementById('levelSel').value).then(function (d) {
      render(d.items);
    });
  }

  document.getElementById('alarmRows').onclick = function (e) {
    var ack = e.target.getAttribute('data-ack');
    var dis = e.target.getAttribute('data-dispatch');
    if (ack) {
      API.alarm.ack(ack).then(function (res) {
        alert(res.code === 0 ? '告警 ' + ack + ' 已确认' : '确认失败');
      });
      return false;
    }
    if (dis) { alert('已派单处理: ' + dis); return false; }
  };
  document.getElementById('levelSel').onchange = load;

  document.getElementById('emgSend').onclick = function () {
    API.alarm.batchRetest('望京X片区').then(function (res) {
      alert(res.code === 0 ? '批量复测已受理，任务号: ' + res.taskNo : '下发失败');
    });
    return false;
  };
  document.getElementById('emgList').onclick = function () {
    alert('受影响客户清单: 望京X片区 23 户');
    return false;
  };

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
