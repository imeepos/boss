<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缴费管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">缴费管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>缴费管理</h2><div class="desc">在线缴费、缴费记录、缴费凭证</div></div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="客户/账单号">
        <span class="spacer"></span>
        <span class="tag tag-green">支付渠道已对接</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>缴费单号</th><th>客户</th><th>金额</th><th>方式</th><th>时间</th><th>凭证</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 缴费管理数据渲染(契约: GET /payments)
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fail(e) { alert('加载失败: ' + e.message); }

  function render(rows) {
    document.getElementById('rows').innerHTML = rows.map(function (r) {
      return '<tr><td>' + esc(r.payNo) + '</td><td>' + esc(r.customerName) + '</td><td>' + esc(r.amount)
        + '</td><td>' + esc(r.method) + '</td><td>' + esc(r.paidAt)
        + '</td><td><a href="#">' + esc(r.voucher) + '</a></td></tr>';
    }).join('');
  }

  API.billing.payments().then(function (d) { render(d.items); }).catch(fail);

  var kw = document.getElementById('kw'), timer = null;
  kw.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      API.billing.payments(kw.value.trim()).then(function (d) { render(d.items); }).catch(fail);
    }, 200);
  });
})();
</script>
<script src="menu.js"></script>
</body>
</html>
