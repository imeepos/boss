<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缴费管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">缴费管理</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>缴费管理</h2><div class="desc">在线缴费、缴费记录、缴费凭证</div></div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="客户/账单号">
        <span class="spacer"></span>
        <span class="tag tag-green">支付渠道已对接</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>缴费单号</th><th>客户</th><th>金额</th><th>方式</th><th>时间</th><th>凭证</th></tr></thead>
          <tbody>
            <tr><td>PAY-0001</td><td>王先生</td><td>¥299</td><td>微信</td><td>2025-08-16 14:20</td><td><a href="#">查看</a></td></tr>
            <tr><td>PAY-0002</td><td>李女士</td><td>¥199</td><td>支付宝</td><td>2025-08-16 10:05</td><td><a href="#">查看</a></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
