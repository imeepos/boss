<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子公司/法人 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">子公司/法人</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>子公司/法人</h2>
        <div class="desc">品牌隔离的最小隔离单元 · 跨子公司数据互不可见（REQ-BRAND-001）</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新建子公司</button>
        <input class="input" style="width:220px" placeholder="搜索编码/名称">
        <span class="spacer"></span>
        <span class="tag tag-blue">品牌隔离：客户/订单/账务/资产互不可见</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>法人编码</th><th>法人名称</th><th>品牌</th><th>经营区域</th><th>部门数</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="leBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">品牌×区域交叉经营 <span class="extra">跨大区经营的公司在此标注</span></div>
        <table class="tbl">
          <thead><tr><th>法人</th><th>大区</th><th>可触达数据范围</th></tr></thead>
          <tbody id="crossBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text) + '</span>'; }
// api.js 未覆盖 org 写接口,这里经统一网关直发 PUT
function req(method, path, body) {
  var opt = { method: method, headers: { 'Content-Type': 'application/json' } };
  var tk = API.token();
  if (tk) opt.headers['Authorization'] = 'Bearer ' + tk;
  if (body !== undefined) opt.body = JSON.stringify(body);
  return fetch(API.config.base + path, opt).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
function leRowHtml(e) {
  return '<tr>' +
    '<td>' + esc(e.code) + '</td>' +
    '<td>' + esc(e.name) + '</td>' +
    '<td>' + tag(e.brandTag, e.brandName) + '</td>' +
    '<td>' + esc(e.regionName) + '</td>' +
    '<td>' + esc(e.deptCount) + '</td>' +
    '<td>' + tag(e.statusTag, e.statusLabel) + '</td>' +
    '<td><a href="#" data-id="' + e.legalEntityId + '" data-act="edit">编辑</a> <a href="#" data-id="' + e.legalEntityId + '" data-act="stop">停用</a></td>' +
  '</tr>';
}
function crossRowHtml(c) {
  return '<tr><td>' + esc(c.legalEntity) + '</td><td>' + esc(c.region) + '</td><td>' + esc(c.scope) + '</td></tr>';
}
API.org.legalEntities().then(function (r) {
  document.getElementById('leBody').innerHTML = r.items.map(leRowHtml).join('');
  document.getElementById('crossBody').innerHTML = (r.crossRegions || []).map(crossRowHtml).join('');
}).catch(function (err) { alert('加载失败：' + err.message); });
document.getElementById('leBody').onclick = function (e) {
  var el = e.target || e.srcElement;
  if (el.tagName !== 'A') return;
  e.preventDefault();
  var id = el.getAttribute('data-id');
  var body = el.getAttribute('data-act') === 'stop' ? { status: 0 } : {};
  req('PUT', '/legal-entities/' + id, body).then(function (r) {
    alert('操作成功：' + r.message);
  }).catch(function (err) { alert('操作失败：' + err.message); });
};
</script>
<script src="menu.js"></script>
</body>
</html>
