<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">订单管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>订单管理</h2>
        <div class="desc">订单全流程 · 12 环节跟踪（下单→资源核查→端口预占→合同收费→标签预绑定→创建账号→预下发→派单→扫码绑定→激活→激活回调→更新GIS）</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="订单号/客户">
        <select class="input" style="width:140px" id="st"><option value="">全部状态</option><option value="PENDING">待核查</option><option value="RESERVED">已预占</option><option value="INSTALLING">装维中</option><option value="DONE">已完成</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="btn-new">+ 新建订单</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>订单号</th><th>客户</th><th>产品</th><th>地址</th><th>当前环节</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="order-rows"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">环节时间轴 <span class="extra">12 环节 · 耗时 / 回退重试</span></div>
        <table class="tbl">
          <thead><tr><th>环节</th><th>完成时间</th><th>耗时</th><th>重试</th><th>结果</th></tr></thead>
          <tbody id="timeline-rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
(function () {
  var STATUS_TAG = { PENDING: 'tag-blue', RESERVED: 'tag-blue', INSTALLING: 'tag-orange', DONE: 'tag-green' };
  var RESULT_TAG = { DONE: ['tag-green', '完成'], DOING: ['tag-orange', '进行中'], WAIT: ['tag', '待执行'] };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + '</span>'; }

  function renderOrders(items) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var o = items[i];
      var ops = '';
      for (var j = 0; j < o.ops.length; j++) {
        var name = o.ops[j];
        ops += ' <a href="#" data-op="' + esc(name) + '" data-no="' + esc(o.orderNo) + '">' + esc(name) + '</a>';
      }
      html += '<tr><td>' + esc(o.orderNo) + '</td><td>' + esc(o.customer) + '</td><td>' + esc(o.product) + '</td><td>' + esc(o.address)
        + '</td><td>' + esc(o.stageLabel) + '</td><td>' + tag(STATUS_TAG[o.status] || 'tag-blue', o.statusLabel) + '</td><td>' + ops + '</td></tr>';
    }
    document.getElementById('order-rows').innerHTML = html || '<tr><td colspan="7">无数据</td></tr>';
  }

  function renderTimeline(tl) {
    var html = '';
    for (var i = 0; i < tl.length; i++) {
      var t = tl[i];
      var meta = RESULT_TAG[t.result] || RESULT_TAG.WAIT;
      html += '<tr><td>' + t.stageNo + ' ' + esc(t.stageName) + '</td><td>' + esc(t.finishedAt) + '</td><td>' + esc(t.duration)
        + '</td><td>' + esc(t.retryCount) + '</td><td>' + tag(meta[0], meta[1]) + '</td></tr>';
    }
    document.getElementById('timeline-rows').innerHTML = html;
  }

  function load() {
    API.order.list(document.getElementById('kw').value.trim(), document.getElementById('st').value)
      .then(function (r) { renderOrders(r.items); })
      .catch(function (e) { alert('订单加载失败: ' + e.message); });
  }

  function track(orderNo) {
    API.order.detail(orderNo)
      .then(function (r) { renderTimeline(r.timeline); })
      .catch(function (e) { alert('时间轴加载失败: ' + e.message); });
  }

  document.querySelector('.content').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var op = a.getAttribute('data-op');
    var no = a.getAttribute('data-no');
    if (op === '跟踪') { track(no); return; }
    alert('订单 ' + no + ' ' + op + ': 演示操作');
  });

  document.getElementById('btn-new').onclick = function () {
    API.post('/orders', {}).then(function (r) { alert('新建订单: ' + r.message); load(); });
  };
  document.getElementById('kw').addEventListener('input', load);
  document.getElementById('st').addEventListener('change', load);

  load();
  track('ORD-20250817-001');
})();
</script>
<script src="menu.js"></script>
</body>
</html>
