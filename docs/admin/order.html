<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">订单管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>订单管理</h2>
        <div class="desc">订单全流程 · 12 环节跟踪（下单→资源核查→端口预占→合同收费→标签预绑定→创建账号→预下发→派单→扫码绑定→激活→激活回调→更新GIS）</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="订单号/客户">
        <select class="input" style="width:140px" id="st"><option value="">全部状态</option><option value="PENDING">待核查</option><option value="RESERVED">已预占</option><option value="INSTALLING">装维中</option><option value="DONE">已完成</option></select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-new">+ 新建订单</button>
      </div>
      <div class="card">
        <div class="card-title">订单列表</div>
        <table class="tbl">
          <thead><tr><th>订单号</th><th>客户</th><th>产品</th><th>地址</th><th>当前环节</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="order-rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>

      <div class="card">
        <div class="card-title">环节时间轴 <span class="extra">12 环节 · 耗时 / 回退重试</span></div>
        <table class="tbl">
          <thead><tr><th>环节</th><th>完成时间</th><th>耗时</th><th>重试</th><th>结果</th></tr></thead>
          <tbody id="timeline-rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 订单管理:筛选/分页/详情弹框/12环节时间轴(契约: GET /orders, GET /orders/{no})
(function () {
  var STATUS_TAG = { PENDING: 'tag-blue', RESERVED: 'tag-blue', INSTALLING: 'tag-orange', DONE: 'tag-green' };
  var RESULT_TAG = { DONE: ['tag-green', '完成'], DOING: ['tag-orange', '进行中'], PENDING: ['tag', '待执行'] };
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, text) { return '<span class="tag ' + cls + '">' + UI.esc(text) + '</span>'; }

  function matches(o) {
    var kw = document.getElementById('kw').value.trim();
    var st = document.getElementById('st').value;
    var hitKw = !kw || (String(o.orderNo) + String(o.customer)).indexOf(kw) >= 0;
    return hitKw && (!st || o.status === st);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('order-rows').innerHTML = slice.length ? slice.map(function (o) {
      var ops = '<a href="#" data-op="detail" data-no="' + UI.esc(o.orderNo) + '">详情</a>';
      for (var j = 0; j < (o.ops || []).length; j++) {
        var name = o.ops[j];
        ops += ' <a href="#" data-op="' + UI.esc(name) + '" data-no="' + UI.esc(o.orderNo) + '">' + UI.esc(name) + '</a>';
      }
      return '<tr><td>' + UI.esc(o.orderNo) + '</td><td>' + UI.esc(o.customer) + '</td><td>' + UI.esc(o.product) + '</td><td>' + UI.esc(o.address)
        + '</td><td>' + UI.esc(o.stageLabel) + '</td><td>' + tag(STATUS_TAG[o.status] || 'tag-blue', o.statusLabel) + '</td><td>' + ops + '</td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function renderTimeline(tl) {
    document.getElementById('timeline-rows').innerHTML = (tl || []).map(function (t) {
      var meta = RESULT_TAG[t.result] || RESULT_TAG.WAIT;
      return '<tr><td>' + UI.esc(t.stageNo + ' ' + t.stageName) + '</td><td>' + UI.esc(t.finishedAt) + '</td><td>' + UI.esc(t.duration)
        + '</td><td>' + UI.esc(t.retryCount) + '</td><td>' + tag(meta[0], meta[1]) + '</td></tr>';
    }).join('') || UI.tbodyState(5, '暂无环节数据');
  }

  function track(orderNo) {
    document.getElementById('timeline-rows').innerHTML = UI.tbodyState(5, '加载中...');
    API.order.detail(orderNo).then(function (r) { renderTimeline(r.timeline); })
      .catch(function (e) { UI.toast('时间轴加载失败: ' + e.message, 'err'); });
  }

  function showDetail(no) {
    var o = null;
    for (var i = 0; i < all.length; i++) if (String(all[i].orderNo) === String(no)) o = all[i];
    if (!o) return;
    var rows = [
      ['订单号', o.orderNo], ['客户', o.customer], ['产品', o.product], ['地址', o.address],
      ['当前环节', o.stageLabel], ['状态', o.statusLabel],
    ].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '订单详情', body: rows, okText: '关闭' });
    track(no);
  }

  function openNew() {
    var fields = [
      { key: 'customer', label: '客户', required: true, placeholder: '客户名称' },
      { key: 'product', label: '产品', required: true, placeholder: '产品/资费' },
      { key: 'address', label: '地址', required: true, placeholder: '装机地址' },
    ];
    UI.modal({
      title: '新建订单', body: UI.formFields(fields), okText: '提交',
      onOk: function (m, close) {
        var v = UI.readForm(m, fields);
        if (!v) return false;
        close();
        UI.toast('新建订单(演示): ' + v.customer, 'ok');
      }
    });
  }

  function opAction(op, no) {
    UI.confirm('确认对订单 ' + no + ' 执行「' + op + '」?', function () {
      UI.toast('订单 ' + no + ' ' + op + '(演示)', 'ok');
    });
  }

  document.querySelector('.content').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var op = a.getAttribute('data-op'), no = a.getAttribute('data-no');
    if (op === 'detail') showDetail(no);
    else if (op === '跟踪') track(no);
    else opAction(op, no);
  });

  function load() {
    document.getElementById('order-rows').innerHTML = UI.tbodyState(7, '加载中...');
    API.order.list('', '').then(function (r) {
      all = r.items || []; state.page = 1; render();
    }).catch(function (e) { UI.toast('订单加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = ''; document.getElementById('st').value = '';
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-new').onclick = openNew;
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
  track('ORD-20250817-001');
})();
</script>
<script src="menu.js"></script>
</body>
</html>
