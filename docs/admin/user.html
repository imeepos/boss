<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户列表 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">客户与资费 / 用户列表</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>用户列表</h2><div class="desc">用户端注册用户总览：账户 / 套餐 / 余额 / 欠费 / 在途业务，点击行进入用户详情</div></div>

      <div class="toolbar">
        <input class="input" style="width:240px" id="kw" placeholder="姓名/手机号/登录名/套餐">
        <select class="input" style="width:120px" id="st">
          <option value="">全部服务状态</option><option>在网</option><option>欠费</option><option>停机</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
      </div>

      <div class="card">
        <table class="tbl">
          <thead><tr><th>用户ID</th><th>姓名</th><th>手机号</th><th>登录名</th><th>实名</th><th>服务状态</th><th>在用套餐</th><th>余额</th><th>欠费账单</th><th>在途业务</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 用户列表(契约: GET /users, keyword 过滤;行数据字段: api/mock/admin/data/userdata.js)
(function () {
  var SERVICE_TAG = { '在网': 'tag-green', '欠费': 'tag-orange', '停机': 'tag-red' };
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(v, cls) { return '<span class="tag ' + (cls || 'tag-gray') + '">' + UI.esc(v) + '</span>'; }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var st = document.getElementById('st').value;
    var hitKw = !kw || (String(r.name) + String(r.phoneMasked) + String(r.username) + String(r.productName)).indexOf(kw) >= 0;
    return hitKw && (!st || r.service === st);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r) {
      return '<tr><td>' + UI.esc(r.customerId) + '</td><td>' + UI.esc(r.name) + '</td><td>' + UI.esc(r.phoneMasked)
        + '</td><td>' + UI.esc(r.username) + '</td><td>' + UI.esc(r.realName) + '</td>'
        + '<td>' + tag(r.service, SERVICE_TAG[r.service]) + '</td>'
        + '<td>' + UI.esc(r.productName) + '</td><td>' + UI.esc(r.balance) + '</td>'
        + '<td>' + (r.unpaidCount ? tag(r.unpaidCount + ' 笔', 'tag-orange') : '—') + '</td>'
        + '<td>' + (r.ongoingCount ? r.ongoingCount + ' 单' : '—') + '</td>'
        + '<td>' + UI.esc(r.registeredAt) + '</td>'
        + '<td><a href="#" data-op="view" data-id="' + UI.esc(r.customerId) + '">查看</a>'
        + ' <a href="user-detail.html?customerId=' + UI.esc(r.customerId) + '">详情</a></td></tr>';
    }).join('') : UI.tbodyState(12, '无匹配用户');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findById(id) {
    for (var i = 0; i < all.length; i++) if (String(all[i].customerId) === String(id)) return all[i];
    return null;
  }

  function showView(id) {
    var r = findById(id);
    if (!r) return;
    var items = [['用户ID', r.customerId], ['姓名', r.name], ['手机号', r.phoneMasked], ['登录名', r.username],
      ['实名', r.realName], ['服务状态', r.service], ['在用套餐', r.productName], ['余额', r.balance],
      ['欠费账单', r.unpaidCount + ' 笔'], ['在途业务', r.ongoingCount + ' 单'], ['注册时间', r.registeredAt]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '用户查看', body: items, okText: '关闭' });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || a.getAttribute('data-op') !== 'view') return;
    ev.preventDefault();
    showView(a.getAttribute('data-id'));
  });

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(12, '加载中...');
    API.get('/users', { keyword: document.getElementById('kw').value.trim() || undefined }).then(function (d) {
      all = d.items || [];
      state.page = 1;
      render();
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('st').value = '';
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
