<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下发日志 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">下发日志</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>配置下发日志</h2>
        <div class="desc">每次下发成功/失败留痕 · 失败可重试/回滚</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="任务号/光猫/OLT" id="kwInput">
        <select class="input" style="width:140px" id="resultSel"><option value="">全部结果</option><option>成功</option><option>失败</option><option>回滚成功</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="btnRetryAll">重试失败项</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>任务号</th><th>设备</th><th>模板</th><th>结果</th><th>重试</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="logRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 下发日志渲染(契约: GET /provision-logs, POST /provision-tasks/{taskNo}/retry)
(function () {
  var RESULT_TAG = { '成功': 'tag-green', '失败': 'tag-red', '回滚成功': 'tag-orange' };
  var rows = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ops(r) {
    if (r.result === '失败') {
      return '<a href="#" data-retry="' + esc(r.taskNo) + '">重试</a> <a href="#" data-rollback="' + esc(r.taskNo) + '">回滚</a>';
    }
    return '<a href="#" data-detail="' + esc(r.taskNo) + '">详情</a>';
  }

  function render(items) {
    rows = items;
    document.getElementById('logRows').innerHTML = items.map(function (r) {
      return '<tr><td>' + esc(r.taskNo) + '</td><td>' + esc(r.device) + '</td><td>' + esc(r.template)
        + '</td><td><span class="tag ' + (RESULT_TAG[r.result] || 'tag-gray') + '">' + esc(r.result)
        + '</span></td><td>' + esc(r.retries) + '</td><td>' + esc(r.time) + '</td><td>' + ops(r) + '</td></tr>';
    }).join('');
  }

  function retryTask(taskNo) {
    API.post('/provision-tasks/' + encodeURIComponent(taskNo) + '/retry').then(function (res) {
      alert(res.code === 0 ? '任务 ' + taskNo + ' 已重新下发' : '重试失败');
    });
  }

  function load() {
    API.provision.logs(document.getElementById('kwInput').value.trim(), document.getElementById('resultSel').value)
      .then(function (d) { render(d.items); });
  }

  document.getElementById('logRows').onclick = function (e) {
    var t = e.target.getAttribute('data-retry');
    var d = e.target.getAttribute('data-detail');
    var rb = e.target.getAttribute('data-rollback');
    if (t) { retryTask(t); return false; }
    if (rb) { alert('回滚请求已提交: ' + rb); return false; }
    if (d) { alert('任务详情: ' + d); return false; }
  };
  document.getElementById('btnRetryAll').onclick = function () {
    rows.filter(function (r) { return r.result === '失败'; })
      .forEach(function (r) { retryTask(r.taskNo); });
  };
  document.getElementById('kwInput').oninput = load;
  document.getElementById('resultSel').onchange = load;

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
