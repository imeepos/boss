<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
<style>
/* 工作台专属样式 */
.dashboard-welcome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.dashboard-welcome h2 {
  margin: 0;
  font-size: 20px;
  color: var(--ink);
}
.dashboard-welcome .welcome-text {
  font-size: 14px;
  color: var(--muted);
}
.stat-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}
.stat-icon.orders { background: #e6f7ff; color: #1890ff; }
.stat-icon.workorders { background: #fff7e6; color: #fa8c16; }
.stat-icon.warnings { background: #fff1f0; color: #ff4d4f; }
.stat-icon.quadrate { background: #f6ffed; color: #52c41a; }

.progress-bar {
  height: 6px;
  background: #f0f0f0;
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}
.progress-fill.blue { background: #1890ff; }
.progress-fill.green { background: #52c41a; }
.progress-fill.orange { background: #fa8c16; }
.progress-fill.red { background: #ff4d4f; }
.progress-fill.purple { background: #722ed1; }

.todo-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.todo-item:last-child {
  border-bottom: none;
}
.todo-time {
  width: 60px;
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}
.todo-content {
  flex: 1;
  font-size: 13px;
  color: var(--ink);
}
.todo-badge {
  display: inline-block;
  font-size: 12px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 8px;
}
.todo-badge.order { background: #e6f7ff; color: #1890ff; }
.todo-badge.workorder { background: #fff7e6; color: #fa8c16; }
.todo-badge.warning { background: #fff1f0; color: #ff4d4f; }

.chart-container {
  height: 200px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 20px 0;
}
.chart-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.chart-bar-value {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.chart-bar-fill {
  width: 100%;
  background: #1677ff;
  border-radius: 4px 4px 0 0;
  transition: height 0.3s ease;
  min-height: 4px;
}
.chart-bar-date {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">工作台</div>
      <div class="right">
        <span class="ico"><img src="icons/bell.svg" alt=""></span>
        <span>系统管理员</span>
        <div class="avatar">管</div>
      </div>
    </header>

    <div class="content">
      <div class="dashboard-welcome">
        <div>
          <h2>工作台</h2>
          <div class="welcome-text">欢迎，张明 (admin)</div>
        </div>
        <div>
          <button class="btn" id="btn-refresh">刷新</button>
        </div>
      </div>

      <div class="grid g-4" style="margin-bottom:24px;" id="stats"></div>

      <div class="grid g-2" style="margin-bottom:24px;">
        <div class="card">
          <div class="card-title">订单状态分布</div>
          <table class="tbl">
            <thead><tr><th>状态</th><th>数量</th><th>占比</th><th>进度</th></tr></thead>
            <tbody id="statusDist"></tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">我的待办 <span class="extra" id="row-hint"></span></div>
          <div id="todos"></div>
          <div class="pagination" id="pager"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">近 7 日下单趋势</div>
        <div class="chart-container" id="trendChart"></div>
        <div style="display:flex;gap:12px;font-size:12px;color:#999;" id="trendDays"></div>
      </div>
    </div>
  </div>
</div>

<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 工作台数据渲染(契约: GET /dashboard)
(function () {
  var STATUS_TAG = { PENDING: 'tag-blue', RESERVED: 'tag-orange', INSTALLING: 'tag-orange', DONE: 'tag-green', CANCELLED: 'tag-gray' };
  var STATUS_PROGRESS = { PENDING: 'blue', RESERVED: 'orange', INSTALLING: 'orange', DONE: 'green', CANCELLED: 'red' };
  var todos = [];
  var distCache = [];
  var state = { page: 1, pageSize: 5 };

  function esc(s) { return UI.esc(s); }

  function renderStats(stats) {
    var iconClasses = ['orders', 'workorders', 'warnings', 'quadrate'];
    document.getElementById('stats').innerHTML = stats.map(function (s, i) {
      return '<div class="stat">' +
        '<div class="stat-icon ' + iconClasses[i] + '"></div>' +
        '<div class="label">' + esc(s.label) + '</div>' +
        '<div class="val">' + esc(s.value) + '</div>' +
        '</div>';
    }).join('');
  }

  function renderStatusDist(rows) {
    distCache = rows;
    document.getElementById('statusDist').innerHTML = rows.length ? rows.map(function (r) {
      var progressClass = STATUS_PROGRESS[r.status] || 'blue';
      return '<tr><td><span class="tag ' + (STATUS_TAG[r.status] || '') + '">' + esc(r.statusLabel) +
        '</span></td><td>' + esc(r.count) + '</td><td>' + esc(r.percent) + '</td>' +
        '<td><div class="progress-bar"><div class="progress-fill ' + progressClass + '" style="width:' + esc(r.percent) + '"></div></div></td></tr>';
    }).join('') : UI.tbodyState(4, '无数据');
  }

  function todoMatches(t) {
    return true; // Show all todos in dashboard
  }

  function renderTodos() {
    var list = todos.filter(todoMatches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('todos').innerHTML = slice.length ? slice.map(function (t, i) {
      var time = t.time ? t.time.split(' ')[1] || t.time : '';
      var badgeClass = 'order';
      if (t.source === '告警中心') badgeClass = 'warning';
      else if (t.source === '派单池') badgeClass = 'order';
      return '<div class="todo-item">' +
        '<div class="todo-time">' + esc(time) + '</div>' +
        '<div class="todo-content">' + esc(t.subject) + '<span class="todo-badge ' + badgeClass + '">' + esc(t.source) + '</span></div>' +
        '</div>';
    }).join('') : '<div style="text-align:center;color:#999;padding:20px;">无待办事项</div>';
    document.getElementById('row-hint').textContent = list.length ? '共 ' + list.length + ' 条' : '';
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; renderTodos(); }
    });
  }

  function renderTrend(trend) {
    var max = Math.max.apply(null, trend.values);
    var container = document.getElementById('trendChart');
    container.innerHTML = trend.values.map(function (v, i) {
      var height = Math.max(4, Math.round((v / max) * 150));
      return '<div class="chart-bar">' +
        '<div class="chart-bar-value">' + v + '</div>' +
        '<div class="chart-bar-fill" style="height:' + height + 'px;" title="' + v + ' 单"></div>' +
        '</div>';
    }).join('');
    
    document.getElementById('trendDays').innerHTML = trend.days.map(function (day) {
      return '<span style="flex:1;text-align:center;">' + esc(day) + '</span>';
    }).join('');
  }

  function showTodoDetail(t) {
    var rows = [
      ['事项', t.subject], ['来源', t.source], ['时间', t.time], ['状态', t.statusLabel || '待处理'],
    ].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '待办详情', body: rows, okText: '关闭' });
  }

  function showStatusDetail(st, dist) {
    var row = null;
    for (var i = 0; i < dist.length; i++) if (dist[i].status === st) row = dist[i];
    if (!row) return;
    var rows = [
      ['状态', row.statusLabel || row.status], ['数量', row.count], ['占比', row.percent],
    ].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '订单状态详情', body: rows, okText: '关闭' });
  }

  function load() {
    document.getElementById('todos').innerHTML = '<div style="text-align:center;color:#999;padding:20px;">加载中...</div>';
    API.dashboard.get().then(function (d) {
      renderStats(d.stats);
      renderStatusDist(d.orderStatusDist);
      todos = (d.todos && d.todos.items) || [];
      state.page = 1;
      renderTodos();
      renderTrend(d.trend);
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-refresh').onclick = load;
  document.body.addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    if (a.getAttribute('data-op') === 'todo') {
      var t = todos[parseInt(a.getAttribute('data-idx'), 10)];
      if (t) showTodoDetail(t);
    } else if (a.getAttribute('data-op') === 'st') {
      showStatusDetail(a.getAttribute('data-status'), distCache);
    }
  });
  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
