<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <!-- 侧栏 -->
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="header">
      <div class="crumb">工作台</div>
      <div class="right">
        <span class="ico"><img src="icons/bell.svg" alt=""></span>
        <span>系统管理员</span>
        <div class="avatar">管</div>
      </div>
    </header>

    <div class="content">
      <div class="page-head">
        <h2>工作台</h2>
        <div class="desc">装维全流程运营总览 · 数据实时更新</div>
      </div>

      <!-- 统计卡 -->
      <div class="grid g-4" style="margin-bottom:16px;" id="stats"></div>

      <!-- 订单状态分布 + 待办 -->
      <div class="grid g-2">
        <div class="card">
          <div class="card-title">订单状态分布 <span class="extra">查看全部 →</span></div>
          <table class="tbl">
            <thead><tr><th>状态</th><th>数量</th><th>占比</th></tr></thead>
            <tbody id="statusDist"></tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">我的待办</div>
          <table class="tbl">
            <thead><tr><th>事项</th><th>来源</th><th>时间</th></tr></thead>
            <tbody id="todos"></tbody>
          </table>
        </div>
      </div>

      <!-- 趋势占位 -->
      <div class="card">
        <div class="card-title">近 7 日装机趋势（示意）</div>
        <div style="height:160px;display:flex;align-items:flex-end;gap:12px;padding:10px 0;" id="trendBars"></div>
        <div style="display:flex;gap:12px;font-size:11px;color:#999;" id="trendDays"></div>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
// 工作台数据渲染(契约: GET /dashboard)
(function () {
  var STATUS_TAG = { PENDING: 'tag-blue', RESERVED: 'tag-orange', INSTALLING: 'tag-orange', DONE: 'tag-green' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  API.dashboard.get().then(function (d) {
    document.getElementById('stats').innerHTML = d.stats.map(function (s) {
      return '<div class="stat"><div class="label">' + esc(s.label) + '</div><div class="val">'
        + esc(s.value) + '</div><div class="delta ' + esc(s.trend) + '">' + esc(s.delta) + '</div></div>';
    }).join('');

    document.getElementById('statusDist').innerHTML = d.orderStatusDist.map(function (r) {
      return '<tr><td><span class="tag ' + (STATUS_TAG[r.status] || '') + '">' + esc(r.statusLabel)
        + '</span></td><td>' + r.count + '</td><td>' + esc(r.percent) + '</td></tr>';
    }).join('');

    document.getElementById('todos').innerHTML = d.todos.items.map(function (t) {
      return '<tr><td>' + esc(t.subject) + '</td><td>' + esc(t.source) + '</td><td>' + esc(t.time) + '</td></tr>';
    }).join('');

    var max = Math.max.apply(null, d.trend.values);
    document.getElementById('trendBars').innerHTML = d.trend.values.map(function (v) {
      return '<div style="flex:1;height:' + Math.round((v / max) * 100)
        + '%;background:#1677ff;border-radius:4px 4px 0 0;" title="' + v + '"></div>';
    }).join('');
    document.getElementById('trendDays').innerHTML = d.trend.days.map(function (day) {
      return '<span style="flex:1;text-align:center;">' + esc(day) + '</span>';
    }).join('');
  }).catch(function (e) {
    document.getElementById('stats').innerHTML = '<div class="card">加载失败: ' + esc(e.message) + '</div>';
  });
})();
</script>
<script src="menu.js"></script>
</body>
</html>
