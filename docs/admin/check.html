<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对账与告警 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">对账与告警</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>对账与告警</h2><div class="desc">四码关系自动核对 · 冲突告警限期处理</div></div>

      <div class="toolbar">
        <button class="btn btn-primary" id="btn-check">立即对账</button>
        <span class="spacer"></span>
        <span class="tag tag-red">冲突 2 笔 · 处理时限 4 小时</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>冲突编号</th><th>关联码</th><th>冲突类型</th><th>发现时间</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function load() {
    API.quad.conflicts()
      .then(function (r) {
        var html = '';
        for (var i = 0; i < r.items.length; i++) {
          var c = r.items[i];
          html += '<tr><td>' + esc(c.conflictNo) + '</td><td>' + esc(c.code) + '</td><td>' + esc(c.conflictType)
            + '</td><td>' + esc(c.foundAt)
            + '</td><td><a href="#" class="op-resolve" data-no="' + esc(c.conflictNo) + '">处理</a></td></tr>';
        }
        document.getElementById('rows').innerHTML = html || '<tr><td colspan="5">无冲突</td></tr>';
      })
      .catch(function (e) { alert('冲突列表加载失败: ' + e.message); });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A') return;
    ev.preventDefault();
    var no = a.getAttribute('data-no');
    API.quad.resolveConflict(no)
      .then(function (r) { alert('冲突 ' + no + ' 处理: ' + r.message); load(); })
      .catch(function (e) { alert('处理失败: ' + e.message); });
  });

  document.getElementById('btn-check').onclick = function () {
    load();
    alert('已触发立即对账');
  };

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
