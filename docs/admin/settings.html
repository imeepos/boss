<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务参数 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">业务参数</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>业务参数</h2>
        <div class="desc">欠费阈值 · 预占有效期 · 对账/报告周期 等业务规则集中配置</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="参数/说明搜索">
        <select class="input" style="width:140px" id="st">
          <option value="">全部状态</option><option value="changed">本次已修改</option><option value="origin">未修改</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
      </div>

      <div class="card">
        <div class="card-title">业务参数配置 <span class="extra">热更新 · 即时生效</span></div>
        <table class="tbl">
          <thead><tr><th style="width:220px;">参数</th><th>值</th><th>说明</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
        <div style="margin-top:14px;">
          <button class="btn btn-primary" id="saveBtn">保存</button>
          <button class="btn" id="resetBtn">重置表单</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 业务参数(契约: GET /params, PUT /params/{key};字段: docs/contract/fields.md §1.6 key/value)
(function () {
  var all = [];        // { key, label, value(编辑中), origin, desc }
  var state = { page: 1, pageSize: 10 };

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var st = document.getElementById('st').value;
    var hitKw = !kw || (String(r.label) + String(r.desc) + String(r.key)).indexOf(kw) >= 0;
    var hitSt = !st || (st === 'changed' ? r.value !== r.origin : r.value === r.origin);
    return hitKw && hitSt;
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r) {
      var dirty = r.value !== r.origin;
      return '<tr><td>' + UI.esc(r.label) + '</td>' +
        '<td><input class="input" style="width:140px" data-key="' + UI.esc(r.key) + '" value="' + UI.esc(r.value) + '">' +
        (dirty ? ' <span class="tag tag-orange">已修改</span>' : '') + '</td>' +
        '<td>' + UI.esc(r.desc) + '</td>' +
        '<td><a href="#" data-op="detail" data-key="' + UI.esc(r.key) + '">查看</a></td></tr>';
    }).join('') : UI.tbodyState(4, '无匹配数据');
    var inputs = document.getElementById('rows').querySelectorAll('input[data-key]');
    for (var i = 0; i < inputs.length; i++) inputs[i].oninput = function () {
      var r = findByKey(this.getAttribute('data-key'));
      if (!r) return;
      r.value = this.value;
      var cell = this.parentNode;
      var tagEl = cell.querySelector('.tag');
      if (r.value !== r.origin && !tagEl) cell.insertAdjacentHTML('beforeend', ' <span class="tag tag-orange">已修改</span>');
      else if (r.value === r.origin && tagEl) tagEl.remove();
    };
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findByKey(k) {
    for (var i = 0; i < all.length; i++) if (all[i].key === k) return all[i];
    return null;
  }

  function syncInputs() {
    var inputs = document.querySelectorAll('#rows input[data-key]');
    for (var i = 0; i < inputs.length; i++) {
      var r = findByKey(inputs[i].getAttribute('data-key'));
      if (r) r.value = inputs[i].value;
    }
  }

  function showDetail(k) {
    var r = findByKey(k);
    if (!r) return;
    var items = [['参数', r.label], ['Key', r.key], ['当前值', r.value], ['原始值', r.origin],
      ['说明', r.desc], ['状态', r.value === r.origin ? '未修改' : '本次已修改']].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '参数详情', body: items, okText: '关闭' });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || a.getAttribute('data-op') !== 'detail') return;
    ev.preventDefault();
    showDetail(a.getAttribute('data-key'));
  });

  function save() {
    syncInputs();
    var dirty = all.filter(function (r) { return r.value !== r.origin; });
    if (!dirty.length) { UI.toast('没有需要保存的修改', 'err'); return; }
    var jobs = dirty.map(function (r) { return API.sys.updateParam(r.key, r.value); });
    Promise.all(jobs).then(function () {
      dirty.forEach(function (r) { r.origin = r.value; });
      UI.toast('保存成功: ' + dirty.length + ' 项参数已更新', 'ok');
      render();
    }).catch(function (e) { UI.toast('保存失败: ' + e.message, 'err'); });
  }

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(4, '加载中...');
    API.sys.params().then(function (d) {
      all = (d.items || []).map(function (p) {
        return { key: p.key, label: p.label, value: p.value, origin: p.value, desc: p.desc };
      });
      state.page = 1;
      render();
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('saveBtn').onclick = save;
  document.getElementById('resetBtn').onclick = function () { load(); };
  document.getElementById('btn-search').onclick = function () { syncInputs(); state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('st').value = '';
    syncInputs(); state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { syncInputs(); state.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { syncInputs(); state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
