<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务参数 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">业务参数</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>业务参数</h2>
        <div class="desc">欠费阈值 · 预占有效期 · 对账/报告周期 等业务规则集中配置</div>
      </div>

      <div class="card">
        <div class="card-title">业务参数配置 <span class="extra">热更新 · 即时生效</span></div>
        <table class="tbl">
          <thead><tr><th style="width:220px;">参数</th><th>值</th><th>说明</th></tr></thead>
          <tbody>
            <tr><td>欠费停机阈值</td><td><input class="input" style="width:120px" value="30 天"></td><td>欠费达到阈值自动停机</td></tr>
            <tr><td>端口预占有效期</td><td><input class="input" style="width:120px" value="24 小时"></td><td>超时自动释放端口</td></tr>
            <tr><td>四码对账周期</td><td><input class="input" style="width:120px" value="每日"></td><td>自动核对四码关系</td></tr>
            <tr><td>报告生成周期</td><td><input class="input" style="width:120px" value="周报"></td><td>经营分析报告自动生成</td></tr>
            <tr><td>复机恢复时限</td><td><input class="input" style="width:120px" value="5 分钟"></td><td>缴费后网络侧恢复时限</td></tr>
          </tbody>
        </table>
        <div style="margin-top:14px;">
          <button class="btn btn-primary">保存</button>
          <button class="btn">重置</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
