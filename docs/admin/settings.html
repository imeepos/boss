<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务参数 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">业务参数</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>业务参数</h2>
        <div class="desc">欠费阈值 · 预占有效期 · 对账/报告周期 等业务规则集中配置</div>
      </div>

      <div class="card">
        <div class="card-title">业务参数配置 <span class="extra">热更新 · 即时生效</span></div>
        <table class="tbl">
          <thead><tr><th style="width:220px;">参数</th><th>值</th><th>说明</th></tr></thead>
          <tbody id="paramBody"></tbody>
        </table>
        <div style="margin-top:14px;">
          <button class="btn btn-primary" id="saveBtn">保存</button>
          <button class="btn">重置</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function rowHtml(p) {
  return '<tr>' +
    '<td>' + esc(p.label) + '</td>' +
    '<td><input class="input" style="width:120px" data-key="' + esc(p.key) + '" value="' + esc(p.value) + '"></td>' +
    '<td>' + esc(p.desc) + '</td>' +
  '</tr>';
}
function render(items) {
  document.getElementById('paramBody').innerHTML = items.map(rowHtml).join('');
}
API.sys.params().then(function (r) { render(r.items); })
  .catch(function (err) { alert('加载失败：' + err.message); });
document.getElementById('saveBtn').onclick = function () {
  var inputs = document.querySelectorAll('#paramBody input[data-key]');
  var jobs = [];
  for (var i = 0; i < inputs.length; i++) {
    jobs.push(API.sys.updateParam(inputs[i].getAttribute('data-key'), inputs[i].value));
  }
  Promise.all(jobs).then(function (rs) {
    alert('保存成功：' + rs.length + ' 项参数已更新');
  }).catch(function (err) { alert('保存失败：' + err.message); });
};
</script>
<script src="menu.js"></script>
</body>
</html>
