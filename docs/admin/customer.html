<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">客户管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>客户管理</h2>
        <div class="desc">客户档案 · 客户视图</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="姓名/电话/证件号">
        <select class="input" style="width:140px" id="svc">
          <option value="">全部服务状态</option><option>在网</option><option>欠费</option><option>停机</option>
        </select>
        <select class="input" style="width:140px" id="real">
          <option value="">全部实名状态</option><option>已实名</option><option>待补登</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-create">+ 新增客户</button>
        <button class="btn" id="btn-export">导出</button>
      </div>

      <div class="card">
        <div class="card-title">客户列表 <span class="extra" id="row-hint"></span></div>
        <table class="tbl">
          <thead><tr><th>客户</th><th>联系电话</th><th>证件类型</th><th>证件号码</th><th>实名状态</th><th>服务状态</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>

      <div class="card">
        <div class="card-title">实名核验记录</div>
        <table class="tbl">
          <thead><tr><th>客户</th><th>核验方式</th><th>核验时间</th><th>结果</th><th>操作人</th></tr></thead>
          <tbody id="verifyRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 客户管理(契约: GET /customers, GET /customers/{customerId}/verify-logs;新增/补登无接口,confirm+演示兜底)
(function () {
  var REAL_TAG = { '已实名': 'tag-green', '待补登': 'tag-red' };
  var SVC_TAG = { '在网': 'tag-green', '欠费': 'tag-orange', '停机': 'tag-gray' };
  var RESULT_TAG = { '通过': 'tag-green', '未核验': 'tag-gray' };
  var ID_TYPES = ['身份证', '护照', '营业执照', '无'];
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, v) { return '<span class="tag ' + cls + '">' + UI.esc(v) + '</span>'; }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var svc = document.getElementById('svc').value;
    var real = document.getElementById('real').value;
    var hitKw = !kw || (String(r.name) + String(r.phone) + String(r.idNo)).indexOf(kw) >= 0;
    return hitKw && (!svc || r.serviceStatus === svc) && (!real || r.realNameStatus === real);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r) {
      var ops = '<a href="#" data-op="detail" data-id="' + UI.esc(r.customerId) + '">详情</a>';
      if (r.realNameStatus === '待补登') ops += ' <a href="#" data-op="fixreal" data-id="' + UI.esc(r.customerId) + '">补登实名</a>';
      return '<tr><td>' + UI.esc(r.name) + '</td><td>' + UI.esc(r.phone) + '</td><td>' + UI.esc(r.idType)
        + '</td><td>' + UI.esc(r.idNo) + '</td><td>' + tag(REAL_TAG[r.realNameStatus] || 'tag-gray', r.realNameStatus)
        + '</td><td>' + tag(SVC_TAG[r.serviceStatus] || 'tag-gray', r.serviceStatus)
        + '</td><td>' + ops + '</td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findById(id) {
    for (var i = 0; i < all.length; i++) if (String(all[i].customerId) === String(id)) return all[i];
    return null;
  }

  function showDetail(id) {
    var r = findById(id);
    if (!r) return;
    var items = [['客户', r.name], ['联系电话', r.phone], ['证件类型', r.idType], ['证件号码', r.idNo],
      ['实名状态', r.realNameStatus], ['服务状态', r.serviceStatus]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '客户详情', body: items, okText: '关闭' });
    loadVerifyLogs(id);
  }

  function fixReal(id) {
    var r = findById(id);
    UI.confirm('确认补登客户 ' + (r ? r.name : id) + ' 的实名信息?', function () {
      UI.toast('补登实名已提交(演示)', 'ok');
    });
  }

  var createFields = [
    { key: 'name', label: '客户', required: true, placeholder: '个人姓名/企业名' },
    { key: 'phone', label: '联系电话', required: true, placeholder: '11 位手机号' },
    { key: 'idType', label: '证件类型', type: 'select', options: ID_TYPES.map(function (t) { return { v: t, t: t }; }) },
    { key: 'idNo', label: '证件号码', placeholder: '与证件类型对应' }
  ];

  function create() {
    UI.modal({
      title: '新增客户', body: UI.formFields(createFields), okText: '提交',
      onOk: function (mask, close) {
        var v = UI.readForm(mask.querySelector('.form'), createFields);
        if (!v) return false;
        close();
        UI.toast('新增客户已提交(演示): ' + v.name, 'ok');
      }
    });
  }

  function loadVerifyLogs(customerId) {
    document.getElementById('verifyRows').innerHTML = UI.tbodyState(5, '加载中...');
    API.customer.verifyLogs(customerId).then(function (d) {
      document.getElementById('verifyRows').innerHTML = (d.items || []).length ? d.items.map(function (r) {
        return '<tr><td>' + UI.esc(r.customerName) + '</td><td>' + UI.esc(r.method) + '</td><td>' + UI.esc(r.verifiedAt)
          + '</td><td>' + tag(RESULT_TAG[r.result] || 'tag-gray', r.result) + '</td><td>' + UI.esc(r.operator) + '</td></tr>';
      }).join('') : UI.tbodyState(5, '无匹配数据');
    }).catch(function (e) { UI.toast('核验记录加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var id = a.getAttribute('data-id');
    if (a.getAttribute('data-op') === 'detail') showDetail(id);
    else fixReal(id);
  });

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(7, '加载中...');
    API.customer.list().then(function (d) {
      all = d.items || [];
      state.page = 1;
      render();
      if (all.length) loadVerifyLogs(all[0].customerId);
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    ['kw', 'svc', 'real'].forEach(function (i) { document.getElementById(i).value = ''; });
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-create').onclick = create;
  document.getElementById('btn-export').onclick = function () {
    UI.toast('已导出当前筛选结果 ' + all.filter(matches).length + ' 条(演示)', 'ok');
  };
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('svc').addEventListener('change', function () { state.page = 1; render(); });
  document.getElementById('real').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
