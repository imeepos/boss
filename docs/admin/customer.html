<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">客户管理</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>客户管理</h2>
        <div class="desc">客户档案 · 客户视图</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新增客户</button>
        <input class="input" style="width:220px" placeholder="姓名/电话/地址">
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>客户</th><th>联系电话</th><th>证件类型</th><th>证件号码</th><th>实名状态</th><th>服务状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>王先生</td><td>138****1234</td><td>身份证</td><td>110***********1234</td><td><span class="tag tag-green">已实名</span></td><td><span class="tag tag-green">在网</span></td><td><a href="#">详情</a></td></tr>
            <tr><td>吴女士</td><td>139****5678</td><td>身份证</td><td>110***********5678</td><td><span class="tag tag-green">已实名</span></td><td><span class="tag tag-orange">欠费</span></td><td><a href="#">详情</a></td></tr>
            <tr><td>孙先生</td><td>137****9012</td><td>—</td><td>—</td><td><span class="tag tag-red">待补登</span></td><td><span class="tag tag-green">在网</span></td><td><a href="#">详情</a> <a href="#">补登实名</a></td></tr>
          </tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">实名核验记录</div>
        <table class="tbl">
          <thead><tr><th>客户</th><th>核验方式</th><th>核验时间</th><th>结果</th><th>操作人</th></tr></thead>
          <tbody>
            <tr><td>王先生</td><td>证件 + 人像比对</td><td>2025-08-01 10:12</td><td><span class="tag tag-green">通过</span></td><td>ops01</td></tr>
            <tr><td>吴女士</td><td>证件 OCR</td><td>2025-07-28 15:40</td><td><span class="tag tag-green">通过</span></td><td>ops01</td></tr>
            <tr><td>孙先生</td><td>—</td><td>—</td><td><span class="tag tag-gray">未核验</span></td><td>—</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
