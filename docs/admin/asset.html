<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">资产管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>资产管理</h2>
        <div class="desc">资产台账 · 生命周期 · 标签/盘点见独立菜单</div>
      </div>

      <div class="grid g-4" style="margin-bottom:16px;" id="stats"></div>
      <div class="card">
        <div class="card-title">资产清单</div>
        <table class="tbl">
          <thead><tr><th>资产编码</th><th>标签编号</th><th>EPC 码</th><th>类型</th><th>入库批次</th><th>位置</th><th>生命周期</th><th>状态</th></tr></thead>
          <tbody id="assetBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">生命周期时间轴 / 流转记录</div>
        <table class="tbl">
          <thead><tr><th>资产编码</th><th>时间</th><th>事务</th><th>由</th><th>至</th><th>操作人</th></tr></thead>
          <tbody id="lifecycleBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function tag(label, cls) {
  return cls ? '<span class="tag ' + cls + '">' + esc(label) + '</span>' : esc(label);
}
function renderStats(stats) {
  var html = '';
  html += '<div class="stat"><div class="label">资产总数</div><div class="val">' + esc(stats.total) + '</div><div class="delta up">' + esc(stats.totalDelta) + '</div></div>';
  html += '<div class="stat"><div class="label">在库</div><div class="val">' + esc(stats.inStock) + '</div></div>';
  html += '<div class="stat"><div class="label">在用</div><div class="val">' + esc(stats.deployed) + '</div></div>';
  html += '<div class="stat"><div class="label">维修/报废</div><div class="val">' + esc(stats.maintenance) + '</div></div>';
  document.getElementById('stats').innerHTML = html;
}
function renderAssets(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var a = items[i];
    html += '<tr><td>' + esc(a.assetCode) + '</td><td>' + esc(a.tagNo) + '</td><td>' + esc(a.epcCode) +
      '</td><td>' + esc(a.type) + '</td><td>' + esc(a.batchNo) + '</td><td>' + esc(a.location) +
      '</td><td>' + esc(a.lifecycle) + '</td><td>' + tag(a.statusLabel, a.statusClass) + '</td></tr>';
  }
  document.getElementById('assetBody').innerHTML = html;
}
function renderLifecycle(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    html += '<tr><td>' + esc(r.assetCode) + '</td><td>' + esc(r.time) + '</td><td>' + esc(r.action) +
      '</td><td>' + esc(r.fromState) + '</td><td>' + esc(r.toState) + '</td><td>' + esc(r.operator) + '</td></tr>';
  }
  document.getElementById('lifecycleBody').innerHTML = html;
}
function loadAssets() {
  API.asset.list()
    .then(function (d) { renderStats(d.stats); renderAssets(d.items); })
    .catch(function (e) { alert('加载资产失败: ' + e.message); });
}
function loadLifecycle() {
  API.asset.lifecycle('A-20250001')
    .then(function (d) { renderLifecycle(d.items); })
    .catch(function (e) { alert('加载生命周期失败: ' + e.message); });
}
function init() {
  loadAssets();
  loadLifecycle();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
