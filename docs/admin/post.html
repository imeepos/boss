<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">岗位管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>岗位管理</h2>
        <div class="desc">岗位（组织编制）与角色（功能权限）分离 · 一人一岗 · 岗位→角色绑定后可复用</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新建岗位</button>
        <select class="input" style="width:180px">
          <option>全部部门</option><option>装维调度部</option><option>客服部</option>
          <option>财务部</option><option>网络运维部</option><option>市场经营部</option>
        </select>
        <input class="input" style="width:180px" placeholder="搜索岗位代码/名称">
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>岗位代码</th><th>岗位</th><th>所属部门</th><th>绑定角色（功能权限）</th><th>数据范围</th><th>操作</th></tr></thead>
          <tbody id="postBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">同名岗位跨子公司复用 <span class="extra">岗位→角色分离的意义</span></div>
        <div class="desc" style="margin-bottom:10px">LEG-A 与 LEG-B 各有「客服坐席」岗，复用同一角色码 `ops`，
        但数据各自隔离 → 权限 = 功能(角色) ∪ 数据(子公司/区域)。（A08）</div>
        <table class="tbl">
          <thead><tr><th>岗位</th><th>复用的角色</th><th>LEG-A 数据域</th><th>LEG-B 数据域</th></tr></thead>
          <tbody id="reuseBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text) + '</span>'; }
function postRowHtml(p) {
  return '<tr>' +
    '<td>' + esc(p.code) + '</td>' +
    '<td>' + esc(p.name) + '</td>' +
    '<td>' + esc(p.deptName) + '</td>' +
    '<td>' + tag(p.roleTag, p.roleCode) + '</td>' +
    '<td>' + esc(p.scopeName) + '</td>' +
    '<td><a href="#">编辑</a></td>' +
  '</tr>';
}
function reuseRowHtml(r) {
  return '<tr><td>' + esc(r.post) + '</td><td>' + esc(r.roleCode) + '</td><td>' + esc(r.domainA) + '</td><td>' + esc(r.domainB) + '</td></tr>';
}
function render(items, reuses) {
  document.getElementById('postBody').innerHTML = items.map(postRowHtml).join('');
  document.getElementById('reuseBody').innerHTML = (reuses || []).map(reuseRowHtml).join('');
}
var allPosts = [], allReuses = [];
API.org.posts().then(function (r) {
  allPosts = r.items;
  allReuses = r.reuses || [];
  render(allPosts, allReuses);
}).catch(function (err) { alert('加载失败：' + err.message); });
// toolbar 前端过滤:部门下拉 + 岗位代码/名称关键字
(function bindToolbar() {
  var sel = document.querySelector('.toolbar select');
  var kw = document.querySelector('.toolbar input[placeholder="搜索岗位代码/名称"]');
  function onch() {
    var items = allPosts.filter(function (p) {
      var okDept = !sel || sel.selectedIndex <= 0 || p.deptName === sel.value;
      var k = kw ? kw.value.trim() : '';
      var okKw = !k || p.code.indexOf(k) >= 0 || p.name.indexOf(k) >= 0;
      return okDept && okKw;
    });
    render(items, allReuses);
  }
  if (sel) sel.onchange = onch;
  if (kw) kw.oninput = onch;
})();
</script>
<script src="menu.js"></script>
</body>
</html>
