<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据权限 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">数据权限</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>数据权限</h2>
        <div class="desc">数据范围授权（功能权限之外的约束）· 角色=功能权限，组织=数据范围</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新增授权</button>
        <input class="input" style="width:220px" placeholder="搜索账号">
        <span class="spacer"></span>
        <span class="tag tag-blue">越权访问 → 拒绝 + 审计留痕</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>账号</th><th>角色（功能）</th><th>子公司</th><th>部门</th><th>岗位</th><th>数据范围</th><th>操作</th></tr></thead>
          <tbody id="scopeBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">授权策略说明 <span class="extra">即时生效</span></div>
        <div class="desc" style="margin-bottom:10px">数据范围快照写 Redis，授权变更即时生效；越权访问被拒并记录到审计日志（A01~A09）。</div>
        <table class="tbl">
          <thead><tr><th>数据范围类型</th><th>判定依据</th><th>示例</th></tr></thead>
          <tbody id="strategyBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text) + '</span>'; }
function scopeRowHtml(s) {
  return '<tr>' +
    '<td>' + esc(s.username) + '</td>' +
    '<td>' + tag(s.roleTag, s.roleName) + '</td>' +
    '<td>' + esc(s.legalEntityName) + '</td>' +
    '<td>' + esc(s.deptName) + '</td>' +
    '<td>' + esc(s.postName) + '</td>' +
    '<td>' + tag(s.scopeTag, s.scopeName) + '</td>' +
    '<td><a href="#">编辑</a></td>' +
  '</tr>';
}
function strategyRowHtml(s) {
  return '<tr><td>' + esc(s.scopeType) + '</td><td>' + esc(s.basis) + '</td><td>' + esc(s.example) + '</td></tr>';
}
function render(items, strategies) {
  document.getElementById('scopeBody').innerHTML = items.map(scopeRowHtml).join('');
  document.getElementById('strategyBody').innerHTML = (strategies || []).map(strategyRowHtml).join('');
}
var allScopes = [], allStrategies = [];
API.org.dataScopes().then(function (r) {
  allScopes = r.items;
  allStrategies = r.strategies || [];
  render(allScopes, allStrategies);
}).catch(function (err) { alert('加载失败：' + err.message); });
// toolbar 前端过滤:账号关键字
(function bindToolbar() {
  var kw = document.querySelector('.toolbar input[placeholder="搜索账号"]');
  if (!kw) return;
  kw.oninput = function () {
    var k = kw.value.trim();
    var items = allScopes.filter(function (s) {
      return !k || s.username.indexOf(k) >= 0 || s.roleName.indexOf(k) >= 0;
    });
    render(items, allStrategies);
  };
})();
</script>
<script src="menu.js"></script>
</body>
</html>
