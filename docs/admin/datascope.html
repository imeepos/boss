<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据权限 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">数据权限</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>数据权限</h2>
        <div class="desc">数据范围授权（功能权限之外的约束）· 角色=功能权限，组织=数据范围</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="搜索账号/角色">
        <select class="input" style="width:150px" id="scope">
          <option value="">全部数据范围</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <span class="tag tag-blue">越权访问 → 拒绝 + 审计留痕</span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-new">+ 新增授权</button>
      </div>
      <div class="card">
        <div class="card-title">授权列表</div>
        <table class="tbl">
          <thead><tr><th>账号</th><th>角色（功能）</th><th>子公司</th><th>部门</th><th>岗位</th><th>数据范围</th><th>操作</th></tr></thead>
          <tbody id="scopeBody"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>

      <div class="card">
        <div class="card-title">授权策略说明 <span class="extra">即时生效</span></div>
        <div class="desc" style="margin-bottom:10px">数据范围快照写 Redis，授权变更即时生效；越权访问被拒并记录到审计日志（A01~A09）。</div>
        <table class="tbl">
          <thead><tr><th>数据范围类型</th><th>判定依据</th><th>示例</th></tr></thead>
          <tbody id="strategyBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 数据权限: 筛选/分页/详情/新增编辑表单(契约: GET /data-scopes)
(function () {
  var all = [], strategies = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, text) { return '<span class="tag ' + UI.esc(cls) + '">' + UI.esc(text) + '</span>'; }

  function matches(s) {
    var kw = document.getElementById('kw').value.trim();
    var sc = document.getElementById('scope').value;
    var hitKw = !kw || String(s.username).indexOf(kw) >= 0 || String(s.roleName).indexOf(kw) >= 0;
    return hitKw && (!sc || s.scopeName === sc);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('scopeBody').innerHTML = slice.length ? slice.map(function (s) {
      return '<tr><td>' + UI.esc(s.username) + '</td><td>' + tag(s.roleTag, s.roleName) + '</td><td>' + UI.esc(s.legalEntityName)
        + '</td><td>' + UI.esc(s.deptName) + '</td><td>' + UI.esc(s.postName) + '</td><td>' + tag(s.scopeTag, s.scopeName)
        + '</td><td><a href="#" data-op="detail" data-id="' + s.accountId + '">详情</a>'
        + ' <a href="#" data-op="edit" data-id="' + s.accountId + '">编辑</a></td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findRow(id) {
    for (var i = 0; i < all.length; i++) if (String(all[i].accountId) === String(id)) return all[i];
    return null;
  }

  function detail(id) {
    var s = findRow(id);
    if (!s) return;
    var rows = [['账号', s.username], ['角色（功能）', s.roleName], ['子公司', s.legalEntityName], ['部门', s.deptName],
      ['岗位', s.postName], ['数据范围', s.scopeName]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '授权详情', body: rows, okText: '关闭' });
  }

  function distinctScopeNames() {
    var names = [];
    all.forEach(function (x) { if (names.indexOf(x.scopeName) < 0) names.push(x.scopeName); });
    return names;
  }

  function save(s) {
    var scopeOpts = distinctScopeNames().map(function (n) { return { v: n, t: n }; });
    var fields = [
      { key: 'username', label: '账号', required: true, value: s ? s.username : '', placeholder: '如 agent-a02' },
      { key: 'legalEntityName', label: '子公司', value: s ? s.legalEntityName : '', placeholder: '如 LEG-A' },
      { key: 'deptName', label: '部门', value: s ? s.deptName : '' },
      { key: 'scopeName', label: '数据范围', type: 'select', required: true, value: s ? s.scopeName : '', options: scopeOpts },
    ];
    UI.modal({
      title: s ? '编辑授权' : '新增授权', body: UI.formFields(fields), okText: '保存',
      onOk: function (root, close) {
        var v = UI.readForm(root, fields);
        if (!v) return false;
        close();
        UI.toast((s ? '已保存授权 ' : '已新增授权 ') + v.username + ' → ' + v.scopeName + '(演示)', 'ok');
      }
    });
  }

  document.getElementById('scopeBody').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var op = a.getAttribute('data-op'), id = a.getAttribute('data-id');
    if (op === 'detail') detail(id);
    else if (op === 'edit') save(findRow(id));
  });

  function load() {
    document.getElementById('scopeBody').innerHTML = UI.tbodyState(7, '加载中...');
    API.org.dataScopes().then(function (r) {
      all = r.items || [];
      strategies = r.strategies || [];
      var sel = document.getElementById('scope');
      sel.innerHTML = '<option value="">全部数据范围</option>' + distinctScopeNames().map(function (n) {
        return '<option>' + UI.esc(n) + '</option>';
      }).join('');
      document.getElementById('strategyBody').innerHTML = strategies.length ? strategies.map(function (x) {
        return '<tr><td>' + UI.esc(x.scopeType) + '</td><td>' + UI.esc(x.basis) + '</td><td>' + UI.esc(x.example) + '</td></tr>';
      }).join('') : UI.tbodyState(3, '无匹配数据');
      state.page = 1;
      render();
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('scope').value = '';
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-new').onclick = function () { save(null); };
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('scope').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
