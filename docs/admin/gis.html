<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS 地图 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">GIS 地图</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>GIS 地图</h2>
        <div class="desc">三维数字孪生 · 八级钻取</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="地址码/订单号/EPC">
        <select class="input" style="width:140px" id="st">
          <option value="">同步：全部</option><option value="SYNCED">已同步</option><option value="SYNCING">同步中</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
      </div>

      <div class="card" style="padding:8px;">
        <div style="height:320px;background:linear-gradient(135deg,#1a2b4a,#23486f);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9fb6d0;flex-direction:column;gap:8px;">
          <img src="icons/map.svg" alt="" style="width:40px;height:40px;">
          <div style="font-size:15px;">三维数字孪生地图（Cesium 预览占位）</div>
          <div style="font-size:12px;">八级钻取：市 → 区 → 街道 → 小区 → 楼栋 → 弱电井 → 分光器 → 端口</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">地址层级码（ltree）→ GIS 实体联动 <span class="extra">REQ-CL-001 环节12·更新GIS</span></div>
        <table class="tbl">
          <thead><tr><th>地址码</th><th>层级路径</th><th>关联订单</th><th>关联资产(EPC)</th><th>GIS 同步</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// GIS 地址联动(契约: GET /gis/address-links)
(function () {
  var SYNC_TAG = { '已同步': 'tag-green', '同步中': 'tag-orange', SYNCED: 'tag-green', SYNCING: 'tag-orange' };
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, text) { return '<span class="tag ' + cls + '">' + UI.esc(text) + '</span>'; }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var st = document.getElementById('st').value;
    var hitKw = !kw || [r.addressCode, r.orderNo, r.epcCode].some(function (v) {
      return String(v || '').indexOf(kw) >= 0;
    });
    var synced = r.syncStatus === '已同步' || r.syncStatus === 'SYNCED';
    return hitKw && (!st || (st === 'SYNCED') === synced);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r, i) {
      return '<tr><td>' + UI.esc(r.addressCode) + '</td><td>' + UI.esc(r.pathLabel) + '</td><td>'
        + UI.esc(r.orderNo) + '</td><td>' + UI.esc(r.epcCode) + '</td><td>'
        + tag(SYNC_TAG[r.syncStatus] || 'tag-gray', r.syncStatus)
        + '</td><td><a href="#" data-op="detail" data-idx="' + (all.indexOf(r)) + '">查看</a></td></tr>';
    }).join('') : UI.tbodyState(6, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function showDetail(r) {
    var rows = [
      ['地址码', r.addressCode], ['层级路径', r.pathLabel], ['关联订单', r.orderNo],
      ['关联资产(EPC)', r.epcCode], ['GIS 同步', r.syncStatus],
    ].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '地址-GIS 联动详情', body: rows, okText: '关闭' });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || a.getAttribute('data-op') !== 'detail') return;
    ev.preventDefault();
    var r = all[parseInt(a.getAttribute('data-idx'), 10)];
    if (r) showDetail(r);
  });

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(6, '加载中...');
    API.intel.gisAddressLinks().then(function (d) {
      all = d.items || [];
      state.page = 1;
      render();
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
