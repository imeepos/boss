<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS 地图 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">GIS 地图</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>GIS 地图</h2>
        <div class="desc">三维数字孪生 · 八级钻取</div>
      </div>

      <div class="card" style="padding:8px;">
        <div style="height:480px;background:linear-gradient(135deg,#1a2b4a,#23486f);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9fb6d0;flex-direction:column;gap:8px;">
          <img src="icons/map.svg" alt="" style="width:40px;height:40px;">
          <div style="font-size:15px;">三维数字孪生地图（Cesium 预览占位）</div>
          <div style="font-size:12px;">八级钻取：市 → 区 → 街道 → 小区 → 楼栋 → 弱电井 → 分光器 → 端口</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">地址层级码（ltree）→ GIS 实体联动 <span class="extra">REQ-CL-001 环节12·更新GIS</span></div>
        <table class="tbl">
          <thead><tr><th>地址码</th><th>层级路径</th><th>关联订单</th><th>关联资产(EPC)</th><th>GIS 同步</th></tr></thead>
          <tbody id="linkRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// GIS 地址联动渲染(契约: GET /gis/address-links)
(function () {
  var SYNC_TAG = { '已同步': 'tag-green', '同步中': 'tag-orange' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  API.intel.gisAddressLinks().then(function (d) {
    document.getElementById('linkRows').innerHTML = d.items.map(function (r) {
      return '<tr><td>' + esc(r.addressCode) + '</td><td>' + esc(r.pathLabel) + '</td><td>'
        + esc(r.orderNo) + '</td><td>' + esc(r.epcCode) + '</td><td><span class="tag '
        + (SYNC_TAG[r.syncStatus] || 'tag-gray') + '">' + esc(r.syncStatus) + '</span></td></tr>';
    }).join('');
  }).catch(function (e) {
    document.getElementById('linkRows').innerHTML = '<tr><td colspan="5">加载失败: ' + esc(e.message) + '</td></tr>';
  });
})();
</script>
<script src="menu.js"></script>
</body>
</html>
