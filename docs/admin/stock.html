<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘点管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">盘点管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>盘点管理</h2><div class="desc">按区域/小区/楼栋批量盘点 · 差异清单处理</div></div>

      <div class="toolbar">
        <button class="btn btn-primary" id="createBtn">+ 新建盘点任务</button>
        <span class="spacer"></span>
        <span class="tag tag-orange" id="diffTag">当前差异：12 项待处理</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>盘点任务</th><th>范围</th><th>进度</th><th>差异项</th><th>状态</th></tr></thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderTasks(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    html += '<tr><td>' + esc(t.taskId) + '</td><td>' + esc(t.scope) + '</td><td>' + esc(t.progress) +
      '</td><td>' + esc(t.diffCount) +
      '</td><td><span class="tag ' + esc(t.statusClass) + '">' + esc(t.statusLabel) + '</span></td></tr>';
  }
  document.getElementById('taskBody').innerHTML = html;
}
function loadStocktakes() {
  API.asset.stocktakes()
    .then(function (d) {
      renderTasks(d.items);
      document.getElementById('diffTag').innerHTML =
        '当前差异：' + esc(d.pendingDiffCount) + ' 项待处理';
    })
    .catch(function (e) { alert('加载盘点任务失败: ' + e.message); });
}
function bindCreate() {
  document.getElementById('createBtn').onclick = function () {
    API.post('/stocktakes', { scope: '望京X小区' })
      .then(function (r) { alert('新建盘点任务: ' + r.message); loadStocktakes(); })
      .catch(function (e) { alert('新建失败: ' + e.message); });
  };
}
function init() {
  loadStocktakes();
  bindCreate();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
