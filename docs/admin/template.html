<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置模板 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">配置模板</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>配置模板</h2><div class="desc">配置模板管理（text/template）</div></div>

      <div class="toolbar">
        <button class="btn btn-primary" id="btnCreate">+ 新建模板</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>模板编号</th><th>模板</th><th>设备类型</th><th>参数</th><th>更新时间</th><th>操作</th></tr></thead>
          <tbody id="tplRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 配置模板数据渲染(契约: GET/POST /provision-templates)
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderRows(items) {
    document.getElementById('tplRows').innerHTML = items.map(function (r, i) {
      return '<tr><td>' + esc(r.templateNo) + '</td><td>' + esc(r.name) + '</td><td>'
        + esc(r.deviceType) + '</td><td>' + esc(r.params) + '</td><td>' + esc(r.updatedAt)
        + '</td><td><a href="#" data-i="' + i + '">编辑</a></td></tr>';
    }).join('');
    var links = document.getElementById('tplRows').getElementsByTagName('a');
    for (var j = 0; j < links.length; j++) {
      links[j].onclick = function () {
        var tpl = items[Number(this.getAttribute('data-i'))];
        API.post('/provision-templates', { sourceTemplateNo: tpl.templateNo, name: tpl.name }).then(function (res) {
          alert('模板 ' + tpl.templateNo + ' 复制' + (res.code === 0 ? '成功' : '失败'));
        });
        return false;
      };
    }
  }

  document.getElementById('btnCreate').onclick = function () {
    API.post('/provision-templates', { name: '新建模板' }).then(function (res) {
      alert(res.code === 0 ? '模板创建成功' : '模板创建失败');
    });
  };

  API.provision.templates().then(function (d) {
    renderRows(d.items);
  }).catch(function (e) {
    document.getElementById('tplRows').innerHTML = '<tr><td colspan="6">加载失败: ' + esc(e.message) + '</td></tr>';
  });
})();
</script>
<script src="menu.js"></script>
</body>
</html>
