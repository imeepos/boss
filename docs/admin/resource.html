<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">资源管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>资源管理</h2>
        <div class="desc">端口台账、核查、预占状态管理</div>
      </div>

      <div class="grid g-4" style="margin-bottom:16px;" id="stats"></div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="端口编号/四码/地址">
        <select class="input" id="st" style="width:140px">
          <option value="">全部状态</option><option>空闲</option><option>预占</option><option>在用</option><option>禁用</option>
        </select>
        <button class="btn btn-primary btn-search" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-export">导出台账</button>
      </div>

      <div class="card">
        <div class="card-title">端口台账</div>
        <table class="tbl">
          <thead><tr><th>端口编号</th><th>四码端口码</th><th>所属 OLT/分光器</th><th>地址</th><th>状态</th><th>占用订单</th><th>操作</th></tr></thead>
          <tbody id="portBody"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>

      <div class="card">
        <div class="card-title">端口变更历史</div>
        <table class="tbl">
          <thead><tr><th>端口编号</th><th>时间</th><th>变更前</th><th>变更后</th><th>触发来源</th><th>操作人</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 资源管理(契约: GET /ports, GET /ports/{portCode}/change-history)
(function () {
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, v) { return '<span class="tag ' + cls + '">' + UI.esc(v) + '</span>'; }

  function renderStats(stats) {
    var html = '';
    [['端口总数', stats.total], ['空闲', stats.idle], ['预占', stats.reserved], ['禁用', stats.disabled]]
      .forEach(function (x) {
        html += '<div class="stat"><div class="label">' + UI.esc(x[0]) + '</div><div class="val">' + UI.esc(x[1]) + '</div></div>';
      });
    document.getElementById('stats').innerHTML = html;
  }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var st = document.getElementById('st').value;
    var hitKw = !kw || (r.portCode + r.quadCode + r.parentName + r.address).indexOf(kw) >= 0;
    return hitKw && (!st || r.statusLabel === st);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('portBody').innerHTML = slice.length ? slice.map(function (p) {
      return '<tr><td>' + UI.esc(p.portCode) + '</td><td>' + UI.esc(p.quadCode) + '</td><td>' + UI.esc(p.parentName) +
        '</td><td>' + UI.esc(p.address) + '</td><td>' + tag(p.statusClass, p.statusLabel) + '</td><td>' + UI.esc(p.orderId || '—') +
        '</td><td><a href="#" data-op="detail" data-code="' + UI.esc(p.portCode) + '">详情</a> ' +
        '<a href="#" data-op="hist" data-code="' + UI.esc(p.portCode) + '">变更历史</a></td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findByCode(code) {
    for (var i = 0; i < all.length; i++) if (all[i].portCode === code) return all[i];
    return null;
  }

  function showDetail(code) {
    var p = findByCode(code);
    if (!p) return;
    var items = [['端口编号', p.portCode], ['四码端口码', p.quadCode], ['所属 OLT/分光器', p.parentName],
      ['地址', p.address], ['状态', p.statusLabel], ['占用订单', p.orderId || '—']].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '端口详情', body: items, okText: '关闭' });
  }

  function renderHistory(items) {
    document.getElementById('historyBody').innerHTML = items.length ? items.map(function (h) {
      return '<tr><td>' + UI.esc(h.portCode) + '</td><td>' + UI.esc(h.time) + '</td><td>' + UI.esc(h.fromStatus) +
        '</td><td>' + UI.esc(h.toStatus) + '</td><td>' + UI.esc(h.source) + '</td><td>' + UI.esc(h.operator) + '</td></tr>';
    }).join('') : UI.tbodyState(6, '无数据');
  }

  function loadHistory(code) {
    document.getElementById('historyBody').innerHTML = UI.tbodyState(6, '加载中...');
    API.oss.portChangeHistory(code)
      .then(function (d) { renderHistory(d.items || []); })
      .catch(function (e) { UI.toast('加载变更历史失败: ' + e.message, 'err'); });
  }

  document.getElementById('portBody').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var code = a.getAttribute('data-code');
    if (a.getAttribute('data-op') === 'detail') showDetail(code);
    else loadHistory(code);
  });

  function load() {
    document.getElementById('portBody').innerHTML = UI.tbodyState(7, '加载中...');
    API.oss.ports().then(function (d) {
      renderStats(d.stats || {});
      all = d.items || [];
      state.page = 1;
      render();
      if (all.length) loadHistory(all[0].portCode);
    }).catch(function (e) { UI.toast('加载端口台账失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('st').value = '';
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-export').onclick = function () {
    UI.toast('已导出端口台账 ' + all.filter(matches).length + ' 条(演示)', 'ok');
  };
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
