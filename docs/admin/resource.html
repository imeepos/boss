<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">资源管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>资源管理</h2>
        <div class="desc">端口台账、核查、预占状态管理</div>
      </div>

      <div class="grid g-4" style="margin-bottom:16px;" id="stats"></div>
      <div class="card">
        <div class="card-title">端口台账</div>
        <table class="tbl">
          <thead><tr><th>端口编号</th><th>四码端口码</th><th>所属 OLT/分光器</th><th>地址</th><th>状态</th><th>占用订单</th><th>操作</th></tr></thead>
          <tbody id="portBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">端口变更历史</div>
        <table class="tbl">
          <thead><tr><th>端口编号</th><th>时间</th><th>变更前</th><th>变更后</th><th>触发来源</th><th>操作人</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderStats(stats) {
  var html = '';
  html += '<div class="stat"><div class="label">端口总数</div><div class="val">' + esc(stats.total) + '</div></div>';
  html += '<div class="stat"><div class="label">空闲</div><div class="val">' + esc(stats.idle) + '</div></div>';
  html += '<div class="stat"><div class="label">预占</div><div class="val">' + esc(stats.reserved) + '</div></div>';
  html += '<div class="stat"><div class="label">禁用</div><div class="val">' + esc(stats.disabled) + '</div></div>';
  document.getElementById('stats').innerHTML = html;
}
function renderPorts(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var p = items[i];
    html += '<tr><td>' + esc(p.portCode) + '</td><td>' + esc(p.quadCode) + '</td><td>' + esc(p.parentName) +
      '</td><td>' + esc(p.address) + '</td><td><span class="tag ' + esc(p.statusClass) + '">' + esc(p.statusLabel) +
      '</span></td><td>' + esc(p.orderId || '—') +
      '</td><td><a href="#" class="hist-link" data-code="' + esc(p.portCode) + '">变更历史</a></td></tr>';
  }
  document.getElementById('portBody').innerHTML = html;
  bindHistoryLinks();
}
function renderHistory(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var h = items[i];
    html += '<tr><td>' + esc(h.portCode) + '</td><td>' + esc(h.time) + '</td><td>' + esc(h.fromStatus) +
      '</td><td>' + esc(h.toStatus) + '</td><td>' + esc(h.source) + '</td><td>' + esc(h.operator) + '</td></tr>';
  }
  document.getElementById('historyBody').innerHTML = html;
}
function bindHistoryLinks() {
  var links = document.getElementById('portBody').getElementsByClassName('hist-link');
  for (var i = 0; i < links.length; i++) {
    links[i].onclick = function (e) {
      e.preventDefault();
      var code = this.getAttribute('data-code');
      loadHistory(code);
    };
  }
}
function loadHistory(code) {
  API.oss.portChangeHistory(code)
    .then(function (d) { renderHistory(d.items); })
    .catch(function (e) { alert('加载变更历史失败: ' + e.message); });
}
function loadPorts() {
  API.oss.ports()
    .then(function (d) { renderStats(d.stats); renderPorts(d.items); loadHistory(d.items[0].portCode); })
    .catch(function (e) { alert('加载端口台账失败: ' + e.message); });
}
function init() {
  loadPorts();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
