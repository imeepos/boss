<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告中心 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">报告中心</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>经营分析报告中心</h2>
        <div class="desc">日/周/月/季 自动生成 · 含指标/图表/结论与建议 · 推送记录</div>
      </div>

      <div class="toolbar">
        <select class="input" style="width:140px"><option>日</option><option>周</option><option>月</option><option>季度</option></select>
        <input class="input" style="width:220px" placeholder="报告标题">
        <span class="spacer"></span>
        <button class="btn btn-primary">+ 手动生成</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>报告</th><th>周期</th><th>生成时间</th><th>推送对象</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>2025-08-17 经营日报</td><td>日</td><td>08:00</td><td>经营分析组</td><td><span class="tag tag-green">已推送</span></td><td><a href="#">查看</a></td></tr>
            <tr><td>2025-08 第3周 周报</td><td>周</td><td>周一 09:00</td><td>经营分析组/管理层</td><td><span class="tag tag-green">已推送</span></td><td><a href="#">查看</a></td></tr>
            <tr><td>2025-08 月度报告</td><td>月</td><td>—</td><td>管理层</td><td><span class="tag tag-orange">生成中</span></td><td><a href="#">详情</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
