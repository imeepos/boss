<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经营区域 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">经营区域</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>经营区域</h2>
        <div class="desc">集团→大区→省→城市 四级经营区域树 · 与地址地理树解耦 · ltree 物化路径</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新增区域</button>
        <input class="input" style="width:220px" placeholder="搜索区域名称/路径">
        <span class="spacer"></span>
        <span class="tag tag-blue">路径唯一权威：ltree path</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>层级路径</th><th>名称</th><th>级别</th><th>父级</th><th>下级数</th><th>操作</th></tr></thead>
          <tbody id="regionBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">区域数据范围 <span class="extra">区域经理只可见本区</span></div>
        <div class="desc" style="margin-bottom:10px">账号的 `region_scope` 绑定到某区域子树；GIS/经营指标/资源/订单按区域图层化，跨区访问被数据权限拦截。（A01/A02）</div>
        <table class="tbl">
          <thead><tr><th>区域</th><th>可触达经营数据</th><th>越权表现</th></tr></thead>
          <tbody id="regionScopeBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function regionRowHtml(r) {
  return '<tr>' +
    '<td>' + esc(r.path) + '</td>' +
    '<td>' + esc(r.name) + '</td>' +
    '<td>' + esc(r.levelLabel) + '</td>' +
    '<td>' + esc(r.parentName) + '</td>' +
    '<td>' + esc(r.childCount) + '</td>' +
    '<td><a href="#">下钻</a></td>' +
  '</tr>';
}
function scopeRowHtml(s) {
  return '<tr><td>' + esc(s.region) + '</td><td>' + esc(s.visibleData) + '</td><td>' + esc(s.denyHint) + '</td></tr>';
}
function render(items, scopes) {
  document.getElementById('regionBody').innerHTML = items.map(regionRowHtml).join('');
  document.getElementById('regionScopeBody').innerHTML = (scopes || []).map(scopeRowHtml).join('');
}
var allRegions = [], allScopes = [];
API.org.regions().then(function (r) {
  allRegions = r.items;
  allScopes = r.scopes || [];
  render(allRegions, allScopes);
}).catch(function (err) { alert('加载失败：' + err.message); });
// toolbar 前端过滤:区域名称/路径关键字
(function bindToolbar() {
  var kw = document.querySelector('.toolbar input[placeholder="搜索区域名称/路径"]');
  if (!kw) return;
  kw.oninput = function () {
    var k = kw.value.trim();
    var items = allRegions.filter(function (r) {
      return !k || r.name.indexOf(k) >= 0 || r.path.indexOf(k) >= 0;
    });
    render(items, allScopes);
  };
})();
</script>
<script src="menu.js"></script>
</body>
</html>
