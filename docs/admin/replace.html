<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备更换单 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">设备更换单</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>设备更换单</h2>
        <div class="desc">维护一张表 → 待替换设备优先级 → 更换单闭环</div>
      </div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="更换单号/设备/资产码">
        <select class="input" id="st" style="width:160px"><option>全部状态</option><option>待派单</option><option>维修中</option><option>已更换</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="createBtn">+ 新建更换单</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>更换单</th><th>设备</th><th>健康度/故障</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="rplBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderList(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    html += '<tr><td>' + esc(r.replacementNo) + '</td><td>' + esc(r.device) + '</td><td>' + esc(r.issue) +
      '</td><td><span class="tag ' + esc(r.priorityClass) + '">' + esc(r.priority) + '</span>' +
      '</td><td><span class="tag ' + esc(r.statusClass) + '">' + esc(r.statusLabel) + '</span></td>' +
      '<td><a href="#" data-no="' + esc(r.replacementNo) + '" data-act="' + esc(r.action) + '">' + esc(r.action) + '</a></td></tr>';
  }
  document.getElementById('rplBody').innerHTML = html;
  bindRowActions();
}
function dispatchReplacement(no) {
  API.post('/replacements', { replacementNo: no, action: 'dispatch' })
    .then(function (r) { alert('更换单 ' + no + ' 派单: ' + r.message); loadList(); })
    .catch(function (e) { alert('派单失败: ' + e.message); });
}
function bindRowActions() {
  var links = document.getElementById('rplBody').getElementsByTagName('a');
  for (var i = 0; i < links.length; i++) {
    links[i].onclick = function (e) {
      e.preventDefault();
      var act = this.getAttribute('data-act');
      var no = this.getAttribute('data-no');
      if (act === '派单') dispatchReplacement(no);
      else alert('更换单 ' + no + ': ' + act);
    };
  }
}
function loadList() {
  var st = document.getElementById('st').value;
  API.asset.replacements(document.getElementById('kw').value, st === '全部状态' ? '' : st)
    .then(function (d) { renderList(d.items); })
    .catch(function (e) { alert('加载更换单失败: ' + e.message); });
}
function bindToolbar() {
  document.getElementById('kw').oninput = loadList;
  document.getElementById('st').onchange = loadList;
  document.getElementById('createBtn').onclick = function () {
    API.post('/replacements', { device: '', reason: '手工新建' })
      .then(function (r) { alert('新建更换单: ' + r.message); loadList(); })
      .catch(function (e) { alert('新建失败: ' + e.message); });
  };
}
function init() {
  loadList();
  bindToolbar();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
