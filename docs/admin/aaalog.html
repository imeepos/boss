<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话单与认证日志 · BOSS 管理后台（历史原型）</title>
<link rel="stylesheet" href="style.css">
<style>.legacy-notice{margin:16px;padding:10px 12px;border:1px solid #e5b85c;background:#fff8e5;color:#6b4d00;font-size:13px}</style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">话单与认证日志</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="legacy-notice">历史原型，仅用于视觉参考。真实契约为新 Admin 前端的分页 GET /cdrs 与 GET /auth-logs；补单、详情、旧 /aaa-logs 路由未纳入当前交付。</div>
      <div class="page-head">
        <h2>话单与认证日志（AAA）</h2>
        <div class="desc">认证成败 · 授权记录 · 实时话单 · 丢单/补单</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="LOID/账号" id="kw">
        <select class="input" style="width:140px" id="typeSel">
          <option value="">全部类型</option><option value="AUTH_OK">认证成功</option>
          <option value="AUTH_FAIL">认证失败</option><option value="CDR">话单</option>
        </select>
        <select class="input" style="width:140px" id="st">
          <option value="">入账：全部</option><option value="BILLED">已入账</option><option value="UNBILLED">未入账</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-refresh">刷新</button>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="btnMend">补单</button>
      </div>
      <div class="card">
        <div class="card-title">AAA 日志 <span class="extra" id="row-hint"></span></div>
        <table class="tbl">
          <thead><tr><th>LOID</th><th>类型</th><th>结果</th><th>时长/流量</th><th>入账状态</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// AAA 日志(契约: GET /aaa-logs; 补单走 POST /aaa-logs/mend)
(function () {
  var RESULT_TAG = { '成功': 'tag-green', '失败': 'tag-red', '正常': 'tag-green' };
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, text) { return '<span class="tag ' + cls + '">' + UI.esc(text) + '</span>'; }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var tp = document.getElementById('typeSel').value;
    var st = document.getElementById('st').value;
    var hitKw = !kw || [r.loid].some(function (v) { return String(v || '').indexOf(kw) >= 0; });
    var unbilled = r.billing === '未入账';
    return hitKw && (!tp || r.type === tp) && (!st || (st === 'UNBILLED') === unbilled);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r) {
      return '<tr><td>' + UI.esc(r.loid) + '</td><td>' + UI.esc(r.typeLabel)
        + '</td><td>' + tag(RESULT_TAG[r.result] || 'tag-gray', r.result) + '</td><td>'
        + UI.esc(r.usage) + '</td><td>' + (r.billing === '未入账' ? tag('tag-orange', '未入账') : UI.esc(r.billing))
        + '</td><td>' + UI.esc(r.time)
        + '</td><td><a href="#" data-op="detail" data-id="' + UI.esc(r.logId) + '">详情</a></td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    var un = list.filter(function (r) { return r.billing === '未入账'; }).length;
    document.getElementById('row-hint').textContent = list.length ? '未入账 ' + un + ' 条' : '';
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findById(id) {
    for (var i = 0; i < all.length; i++) if (String(all[i].logId) === String(id)) return all[i];
    return null;
  }

  function showDetail(id) {
    var r = findById(id);
    if (!r) return;
    var rows = [
      ['日志编号', r.logId], ['LOID', r.loid], ['类型', r.typeLabel || r.type],
      ['结果', r.result], ['时长/流量', r.usage], ['入账状态', r.billing], ['时间', r.time],
    ].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: 'AAA 日志详情', body: rows, okText: '关闭' });
  }

  function mend() {
    var fields = [
      { key: 'loid', label: 'LOID', required: true, placeholder: '待补单的 LOID' },
      { key: 'period', label: '账期', required: true, placeholder: '如 2026-08' },
      { key: 'reason', label: '补单原因', type: 'textarea', placeholder: '必填说明' },
    ];
    UI.modal({
      title: 'AAA 补单', body: UI.formFields(fields), okText: '提交',
      onOk: function (mask) {
        var v = UI.readForm(mask, fields);
        if (!v) return false;
        return API.post('/aaa-logs/mend', v).then(function (res) {
          if (res.code === 0) { UI.toast('补单请求已提交', 'ok'); load(); return true; }
          UI.toast('补单失败', 'err'); return false;
        });
      }
    });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    if (a.getAttribute('data-op') === 'detail') showDetail(a.getAttribute('data-id'));
  });

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(7, '加载中...');
    API.aaa.logs(document.getElementById('kw').value.trim(), document.getElementById('typeSel').value)
      .then(function (d) { all = d.items || []; state.page = 1; render(); })
      .catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btnMend').onclick = mend;
  document.getElementById('kw').addEventListener('input', UI.debounce(load, 300));
  document.getElementById('typeSel').addEventListener('change', load);
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
