<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话单与认证日志 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">话单与认证日志</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>话单与认证日志（AAA）</h2>
        <div class="desc">认证成败 · 授权记录 · 实时话单 · 丢单/补单</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="LOID/账号">
        <select class="input" style="width:140px"><option>认证成功</option><option>认证失败</option><option>话单</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary">补单</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>LOID</th><th>类型</th><th>结果</th><th>时长/流量</th><th>入账状态</th><th>时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>LOID-88A1</td><td>认证</td><td><span class="tag tag-green">成功</span></td><td>—</td><td>—</td><td>10:46</td><td><a href="#">详情</a></td></tr>
            <tr><td>LOID-88A4</td><td>认证</td><td><span class="tag tag-red">失败</span></td><td>—</td><td>—</td><td>10:30</td><td><a href="#">详情</a></td></tr>
            <tr><td>LOID-88A1</td><td>话单</td><td><span class="tag tag-green">正常</span></td><td>3.2GB / 2h</td><td><span class="tag tag-orange">未入账</span></td><td>10:00</td><td><a href="#">补单</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
