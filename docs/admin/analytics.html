<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经营分析 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">经营分析</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>经营分析</h2>
        <div class="desc">五大核心指标、热力图、维护清单、报告 · 品牌×区域交叉汇总</div>
      </div>

      <div class="toolbar">
        <select class="input" style="width:160px" id="brandSel">
          <option value="">品牌：全部</option><option>LEG-A 主品牌·企业</option>
          <option>LEG-B 家庭宽带</option><option>LEG-C 批发品牌</option>
        </select>
        <select class="input" style="width:160px" id="regionSel">
          <option value="">区域：全部</option><option>吕宋大区</option>
          <option>比萨扬大区</option><option>棉兰老大区</option>
        </select>
        <span class="spacer"></span>
        <span class="tag tag-blue">品牌隔离 · 跨层汇总 = 明细之和</span>
      </div>

      <div class="grid g-2">
        <div class="card">
          <div class="card-title">五大核心指标</div>
          <table class="tbl">
            <tbody id="kpiRows"></tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">投资一张图（热力图占位）</div>
          <div style="height:180px;background:linear-gradient(135deg,#fde7e7,#fbd0d0,#f7b3b3,#f29191);border-radius:8px;display:flex;align-items:flex-end;justify-content:center;color:#7f1d1d;padding:10px;font-size:12px;">高潜扩容区域热力图示意</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">品牌×区域交叉汇总 <span class="extra">LEG-B 跨大区经营 · 下钻到区</span></div>
        <table class="tbl">
          <thead id="matrixHead"></thead>
          <tbody id="matrixRows"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">维护一张表 · 待替换设备优先级清单</div>
        <table class="tbl">
          <thead><tr><th>设备</th><th>健康度</th><th>故障次数</th><th>使用年限</th><th>替换建议</th></tr></thead>
          <tbody id="replaceRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 经营分析渲染(契约: GET /analytics/overview，region/brand 作为 query 参数)
(function () {
  var SUGGEST_TAG = { '立即替换': 'tag-red', '优先级高': 'tag-orange', '观察': 'tag-gray' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderKpis(kpis) {
    document.getElementById('kpiRows').innerHTML = kpis.map(function (k) {
      return '<tr><td>' + esc(k.label) + '</td><td style="font-weight:700;">' + esc(k.value) + '</td></tr>';
    }).join('');
  }

  function renderMatrix(m) {
    document.getElementById('matrixHead').innerHTML = '<tr><th>品牌</th>'
      + m.regions.map(function (r) { return '<th>' + esc(r) + '</th>'; }).join('')
      + '<th>合并营收</th></tr>';
    document.getElementById('matrixRows').innerHTML = m.rows.map(function (row, i) {
      var bold = i === m.rows.length - 1 ? ' style="font-weight:700;"' : '';
      return '<tr' + bold + '><td>' + esc(row.brand) + '</td>'
        + m.regions.map(function (r) { return '<td>' + esc(row.values[r]) + '</td>'; }).join('')
        + '<td>' + esc(row.total) + '</td></tr>';
    }).join('');
  }

  function renderReplace(list) {
    document.getElementById('replaceRows').innerHTML = list.map(function (r) {
      return '<tr><td>' + esc(r.device) + '</td><td>' + esc(r.health) + '</td><td>'
        + esc(r.faultCount) + '</td><td>' + esc(r.years) + '</td><td><span class="tag '
        + (SUGGEST_TAG[r.suggestion] || 'tag-gray') + '">' + esc(r.suggestion) + '</span></td></tr>';
    }).join('');
  }

  function load() {
    API.intel.analytics(
      document.getElementById('regionSel').value,
      document.getElementById('brandSel').value
    ).then(function (d) {
      renderKpis(d.kpis);
      renderMatrix(d.brandRegionMatrix);
      renderReplace(d.replaceList);
    });
  }

  document.getElementById('brandSel').onchange = load;
  document.getElementById('regionSel').onchange = load;

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
