<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部门管理 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">部门管理</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>部门管理</h2>
        <div class="desc">组织内职能单元 · 挂靠子公司 · 部门数据范围 / 队列归属 / 部门绩效</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新建部门</button>
        <select class="input" style="width:180px">
          <option>全部子公司</option><option>LEG-A 主品牌·企业</option>
          <option>LEG-B 家庭宽带</option><option>LEG-C 批发品牌</option>
        </select>
        <input class="input" style="width:200px" placeholder="搜索部门名称">
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>部门</th><th>所属子公司</th><th>职能</th><th>岗位数</th><th>工单队列</th><th>操作</th></tr></thead>
          <tbody id="deptBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">部门数据范围 <span class="extra">坐席/收款员只可见本部门队列</span></div>
        <div class="desc" style="margin-bottom:10px">同子公司内，部门即最小数据可见单元；跨部门取他部门工单会被拦截并审计留痕（A05/A06）。</div>
        <table class="tbl">
          <thead><tr><th>部门</th><th>可见数据</th><th>越权拦截</th></tr></thead>
          <tbody id="deptScopeBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text) + '</span>'; }
function deptRowHtml(d) {
  return '<tr>' +
    '<td>' + esc(d.name) + '</td>' +
    '<td>' + esc(d.legalEntityName) + '</td>' +
    '<td>' + tag(d.funcTag, d.funcLabel) + '</td>' +
    '<td>' + esc(d.postCount) + '</td>' +
    '<td>' + esc(d.queueName) + '</td>' +
    '<td><a href="#">编辑</a> <a href="#">停用</a></td>' +
  '</tr>';
}
function scopeRowHtml(s) {
  return '<tr><td>' + esc(s.deptName) + '</td><td>' + esc(s.visibleData) + '</td><td>' + esc(s.denyHint) + '</td></tr>';
}
function render(items, scopes) {
  document.getElementById('deptBody').innerHTML = items.map(deptRowHtml).join('');
  document.getElementById('deptScopeBody').innerHTML = (scopes || []).map(scopeRowHtml).join('');
}
var allDepts = [], allScopes = [];
API.org.departments().then(function (r) {
  allDepts = r.items;
  allScopes = r.scopes || [];
  render(allDepts, allScopes);
}).catch(function (err) { alert('加载失败：' + err.message); });
// toolbar 前端过滤:子公司下拉 + 部门名关键字
(function bindToolbar() {
  var sel = document.querySelector('.toolbar select');
  var kw = document.querySelector('.toolbar input[placeholder="搜索部门名称"]');
  function onch() {
    var items = allDepts.filter(function (d) {
      var okLe = !sel || sel.selectedIndex <= 0 || d.legalEntityName === sel.value;
      var okKw = !kw || !kw.value.trim() || d.name.indexOf(kw.value.trim()) >= 0;
      return okLe && okKw;
    });
    render(items, allScopes);
  }
  if (sel) sel.onchange = onch;
  if (kw) kw.oninput = onch;
})();
</script>
<script src="menu.js"></script>
</body>
</html>
