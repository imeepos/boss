<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号与权限 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">账号与权限</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>账号与权限</h2>
        <div class="desc">账号、角色、权限管理 · 组织归属（子公司/部门/岗位）· 数据范围授权</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新建账号</button>
        <input class="input" style="width:220px" placeholder="搜索账号/角色">
        <span class="spacer"></span>
        <button class="btn">导出</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>子公司</th><th>部门</th><th>岗位</th><th>数据范围</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="accountBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// api.js 未覆盖 PUT/DELETE,这里经统一网关直发
function req(method, path, body) {
  var opt = { method: method, headers: { 'Content-Type': 'application/json' } };
  var tk = API.token();
  if (tk) opt.headers['Authorization'] = 'Bearer ' + tk;
  if (body !== undefined) opt.body = JSON.stringify(body);
  return fetch(API.config.base + path, opt).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
function tag(cls, text) { return '<span class="tag ' + esc(cls) + '">' + esc(text) + '</span>'; }
function rowHtml(a) {
  return '<tr>' +
    '<td>' + esc(a.username) + '</td>' +
    '<td>' + esc(a.realName) + '</td>' +
    '<td>' + tag(a.roleTag, a.roleName) + '</td>' +
    '<td>' + esc(a.legalEntityName) + '</td>' +
    '<td>' + esc(a.deptName) + '</td>' +
    '<td>' + esc(a.postName) + '</td>' +
    '<td>' + tag(a.scopeTag, a.scopeName) + '</td>' +
    '<td>' + tag(a.statusTag, a.statusLabel) + '</td>' +
    '<td><a href="#" data-id="' + a.accountId + '" data-act="edit">编辑</a> <a href="#" data-id="' + a.accountId + '" data-act="disable">禁用</a></td>' +
  '</tr>';
}
function render(items) {
  document.getElementById('accountBody').innerHTML = items.map(rowHtml).join('');
}
function bindOps() {
  document.getElementById('accountBody').onclick = function (e) {
    var el = e.target || e.srcElement;
    if (el.tagName !== 'A') return;
    e.preventDefault();
    var id = el.getAttribute('data-id');
    var act = el.getAttribute('data-act');
    var p = act === 'disable'
      ? req('PUT', '/accounts/' + id, { status: 0 })
      : req('PUT', '/accounts/' + id, {});
    p.then(function (r) { alert('操作成功：' + r.message); })
     .catch(function (err) { alert('操作失败：' + err.message); });
  };
}
API.sys.accounts().then(function (r) { render(r.items); })
  .catch(function (err) { alert('加载失败：' + err.message); });
bindOps();
</script>
<script src="menu.js"></script>
</body>
</html>
