<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号与权限 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">账号与权限</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>账号与权限</h2>
        <div class="desc">账号、角色、权限管理 · 组织归属（子公司/部门/岗位）· 数据范围授权</div>
      </div>

      <div class="toolbar">
        <input class="input" style="width:220px" id="kw" placeholder="账号/姓名/角色">
        <select class="input" style="width:140px" id="role">
          <option value="">全部角色</option>
        </select>
        <select class="input" style="width:120px" id="st">
          <option value="">全部状态</option><option value="1">启用</option><option value="0">停用</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-create">+ 新建账号</button>
        <button class="btn" id="btn-export">导出</button>
      </div>
      <div class="card">
        <div class="card-title">账号列表 <span class="extra" id="row-hint"></span></div>
        <table class="tbl">
          <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>子公司</th><th>部门</th><th>岗位</th><th>数据范围</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>

    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 账号与权限(契约: GET/POST /accounts, PUT /accounts/{id};字段: docs/contract/fields.md §1.1)
(function () {
  var ROLE_TAG = {};
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, v) { return '<span class="tag ' + (cls || 'tag-gray') + '">' + UI.esc(v) + '</span>'; }

  function matches(r) {
    var kw = document.getElementById('kw').value.trim();
    var role = document.getElementById('role').value;
    var st = document.getElementById('st').value;
    var hitKw = !kw || (String(r.username) + String(r.realName) + String(r.roleName)).indexOf(kw) >= 0;
    return hitKw && (!role || r.roleName === role) && (st === '' || String(r.status) === st);
  }

  function render() {
    var list = all.filter(matches);
    var start = (state.page - 1) * state.pageSize;
    var slice = list.slice(start, start + state.pageSize);
    document.getElementById('row-hint').textContent = list.length ? '匹配 ' + list.length + ' 条' : '';
    document.getElementById('rows').innerHTML = slice.length ? slice.map(function (r) {
      var ops = '<a href="#" data-op="detail" data-id="' + UI.esc(r.accountId) + '">详情</a>' +
        ' <a href="#" data-op="edit" data-id="' + UI.esc(r.accountId) + '">编辑</a>';
      if (r.status === 1) ops += ' <a href="#" data-op="disable" data-id="' + UI.esc(r.accountId) + '">禁用</a>';
      return '<tr><td>' + UI.esc(r.username) + '</td><td>' + UI.esc(r.realName) + '</td>' +
        '<td>' + tag(ROLE_TAG[r.roleName], r.roleName) + '</td><td>' + UI.esc(r.legalEntityName) + '</td>' +
        '<td>' + UI.esc(r.deptName) + '</td><td>' + UI.esc(r.postName) + '</td>' +
        '<td>' + tag(r.scopeTag, r.scopeName) + '</td><td>' + tag(r.statusTag, r.statusLabel) + '</td>' +
        '<td>' + ops + '</td></tr>';
    }).join('') : UI.tbodyState(9, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: list.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findById(id) {
    for (var i = 0; i < all.length; i++) if (String(all[i].accountId) === String(id)) return all[i];
    return null;
  }

  function detailItems(r) {
    return [['账号', r.username], ['姓名', r.realName], ['角色', r.roleName], ['子公司', r.legalEntityName],
      ['部门', r.deptName], ['岗位', r.postName], ['数据范围', r.scopeName], ['状态', r.statusLabel]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
  }

  function showDetail(id) {
    var r = findById(id);
    if (r) UI.modal({ title: '账号详情', body: detailItems(r), okText: '关闭' });
  }

  function accountFields(r) {
    return [
      { key: 'username', label: '账号', required: true, value: r ? r.username : '' },
      { key: 'realName', label: '姓名', required: true, value: r ? r.realName : '' },
      { key: 'roleName', label: '角色', type: 'select', value: r ? r.roleName : '',
        options: Object.keys(ROLE_TAG).map(function (n) { return { v: n, t: n }; }) },
      { key: 'legalEntityName', label: '子公司', value: r ? r.legalEntityName : '' },
      { key: 'deptName', label: '部门', value: r ? r.deptName : '' },
      { key: 'postName', label: '岗位', value: r ? r.postName : '' }
    ];
  }

  function openForm(r) {
    var fields = accountFields(r);
    UI.modal({
      title: r ? '编辑账号' : '新建账号', body: UI.formFields(fields), okText: '提交',
      onOk: function (mask, close) {
        var v = UI.readForm(mask.querySelector('.form'), fields);
        if (!v) return false;
        close();
        if (r) { UI.toast('编辑账号已提交(演示): ' + v.username, 'ok'); return; }
        API.post('/accounts', v).then(function () {
          UI.toast('新建账号已提交: ' + v.username, 'ok'); load();
        }).catch(function (e) { UI.toast('新建失败: ' + e.message, 'err'); });
      }
    });
  }

  function disable(id) {
    var r = findById(id);
    UI.confirm('确认禁用账号 ' + (r ? r.username : id) + '?', function () {
      UI.toast('禁用已提交(演示,写接口待 PUT 通道)', 'ok');
    });
  }

  document.getElementById('rows').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var id = a.getAttribute('data-id');
    var op = a.getAttribute('data-op');
    if (op === 'detail') showDetail(id);
    else if (op === 'edit') openForm(findById(id));
    else disable(id);
  });

  function load() {
    document.getElementById('rows').innerHTML = UI.tbodyState(9, '加载中...');
    API.sys.accounts().then(function (d) {
      all = d.items || [];
      var seen = {};
      all.forEach(function (r) { ROLE_TAG[r.roleName] = r.roleTag; seen[r.roleName] = 1; });
      document.getElementById('role').innerHTML = '<option value="">全部角色</option>' +
        Object.keys(seen).map(function (n) { return '<option>' + UI.esc(n) + '</option>'; }).join('');
      state.page = 1;
      render();
    }).catch(function (e) { UI.toast('加载失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { state.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    ['kw', 'role', 'st'].forEach(function (i) { document.getElementById(i).value = ''; });
    state.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-create').onclick = function () { openForm(null); };
  document.getElementById('btn-export').onclick = function () {
    UI.toast('已导出当前筛选结果 ' + all.filter(matches).length + ' 条(演示)', 'ok');
  };
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { state.page = 1; render(); }, 300));
  document.getElementById('role').addEventListener('change', function () { state.page = 1; render(); });
  document.getElementById('st').addEventListener('change', function () { state.page = 1; render(); });

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
