<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地址层级 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">地址层级</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>地址层级</h2><div class="desc">市级→区级→街道→小区→楼栋 五级统一地址基准 · 支持存量导入</div></div>

      <div class="toolbar">
        <button class="btn btn-primary">+ 新增层级</button>
        <button class="btn">批量导入</button>
        <span class="spacer"></span>
        <span class="tag tag-blue">路径唯一权威：ltree path</span>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>层级路径</th><th>名称</th><th>级别</th><th>下级数量</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>bj</td><td>北京</td><td>市</td><td>16</td><td><a href="#">下钻</a></td></tr>
            <tr><td>bj.chaoyang</td><td>朝阳区</td><td>区</td><td>24</td><td><a href="#">下钻</a></td></tr>
            <tr><td>bj.chaoyang.wangjing</td><td>望京街道</td><td>街道</td><td>12</td><td><a href="#">下钻</a></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
