<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道对账 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">渠道对账</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>缴费渠道对账</h2><div class="desc">线上/线下渠道入账汇总 · 差异挂起 · 人工平账</div></div>

      <div class="toolbar">
        <input class="input" style="width:220px" placeholder="对账批次/渠道">
        <select class="input" style="width:160px"><option>全部状态</option><option>待对账</option><option>差异挂起</option><option>已平账</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary">发起对账</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>对账批次</th><th>渠道</th><th>渠道金额</th><th>系统金额</th><th>差异</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>PC-20250816-05</td><td>微信</td><td>¥1,284,320</td><td>¥1,284,320</td><td>¥0</td><td><span class="tag tag-green">已平账</span></td><td><a href="#">详情</a></td></tr>
            <tr><td>PC-20250816-04</td><td>支付宝</td><td>¥862,005</td><td>¥861,905</td><td>¥-100</td><td><span class="tag tag-red">差异挂起</span></td><td><a href="#">核对</a></td></tr>
            <tr><td>PC-20250815-09</td><td>线下营业厅</td><td>¥215,600</td><td>¥215,600</td><td>¥0</td><td><span class="tag tag-green">已平账</span></td><td><a href="#">详情</a></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
