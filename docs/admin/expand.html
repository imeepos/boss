<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扩容申请 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">扩容申请</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>扩容申请</h2>
        <div class="desc">投资一张图 → 扩容决策 → 扩容申请单全流程</div>
      </div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="申请单号/区域/小区">
        <select class="input" id="st" style="width:160px">
          <option value="">全部状态</option><option>待审批</option><option>实施中</option><option>已完成</option>
        </select>
        <button class="btn btn-primary btn-search" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="createBtn">+ 新建扩容申请</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>申请单</th><th>区域</th><th>预期端口数</th><th>原因</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="expBody"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 扩容申请(契约: GET /expansions, POST /expansions)
(function () {
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, v) { return '<span class="tag ' + cls + '">' + UI.esc(v) + '</span>'; }

  function render() {
    var start = (state.page - 1) * state.pageSize;
    var slice = all.slice(start, start + state.pageSize);
    document.getElementById('expBody').innerHTML = slice.length ? slice.map(function (e) {
      var ops = '<a href="#" data-op="detail" data-no="' + UI.esc(e.expansionNo) + '">详情</a>';
      if (e.status === 'PENDING') ops += ' <a href="#" data-op="approve" data-no="' + UI.esc(e.expansionNo) + '">审批</a>';
      return '<tr><td>' + UI.esc(e.expansionNo) + '</td><td>' + UI.esc(e.region) + '</td><td>' + UI.esc(e.expectedPorts) +
        '</td><td>' + UI.esc(e.reason) + '</td><td>' + tag(e.statusClass, e.statusLabel) + '</td><td>' + ops + '</td></tr>';
    }).join('') : UI.tbodyState(6, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: all.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findByNo(no) {
    for (var i = 0; i < all.length; i++) if (all[i].expansionNo === no) return all[i];
    return null;
  }

  function showDetail(no) {
    var e = findByNo(no);
    if (!e) return;
    var items = [['申请单', e.expansionNo], ['区域', e.region], ['预期端口数', e.expectedPorts],
      ['原因', e.reason], ['状态', e.statusLabel]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '扩容申请详情', body: items, okText: '关闭' });
  }

  function approve(no) {
    UI.confirm('确认审批通过扩容申请 ' + no + '?', function () {
      UI.toast('扩容申请 ' + no + ' 已审批(演示)', 'ok'); load();
    });
  }

  var createFields = [
    { key: 'region', label: '区域', required: true, placeholder: '扩容热区/小区' },
    { key: 'expectedPorts', label: '预期端口数', type: 'number', required: true, placeholder: '如 256' },
    { key: 'reason', label: '原因', type: 'textarea', placeholder: '端口利用率/投资回报依据' }
  ];

  function create() {
    UI.modal({
      title: '新建扩容申请', body: UI.formFields(createFields), okText: '提交',
      onOk: function (mask, close) {
        var v = UI.readForm(mask.querySelector('.form'), createFields);
        if (!v) return false;
        close();
        UI.toast('扩容申请(' + v.region + ')已提交(演示)', 'ok');
        load();
      }
    });
  }

  document.getElementById('expBody').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var no = a.getAttribute('data-no');
    if (a.getAttribute('data-op') === 'detail') showDetail(no);
    else approve(no);
  });

  function load() {
    document.getElementById('expBody').innerHTML = UI.tbodyState(6, '加载中...');
    var st = document.getElementById('st').value;
    API.oss.expansions(document.getElementById('kw').value.trim(), st)
      .then(function (d) { all = d.items || []; state.page = 1; render(); })
      .catch(function (e) { UI.toast('加载扩容申请失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = load;
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('st').value = '';
    load();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('createBtn').onclick = create;
  document.getElementById('kw').addEventListener('input', UI.debounce(load, 300));
  document.getElementById('st').addEventListener('change', load);

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
