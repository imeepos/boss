<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计日志 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">审计日志</div>
      <div class="right"><span>🔔</span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>审计日志</h2><div class="desc">操作审计 · 按人/时间/类型查询 · 分区存储</div></div>

      <div class="toolbar">
        <input class="input" style="width:180px" placeholder="操作人">
        <select class="input" style="width:150px"><option>操作类型：全部</option><option>数据变更</option><option>状态变更</option><option>权限变更</option></select>
        <input class="input" style="width:160px" type="date">
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>时间</th><th>操作人</th><th>类型</th><th>操作内容</th><th>IP</th></tr></thead>
          <tbody>
            <tr><td>2025-08-17 10:32:11</td><td>admin</td><td><span class="tag tag-blue">权限变更</span></td><td>修改角色权限</td><td>10.0.0.12</td></tr>
            <tr><td>2025-08-17 09:15:44</td><td>asset01</td><td><span class="tag tag-green">数据变更</span></td><td>资产盘点导入</td><td>10.0.0.23</td></tr>
            <tr><td>2025-08-17 08:40:02</td><td>oss01</td><td><span class="tag tag-orange">状态变更</span></td><td>端口故障上报</td><td>10.0.0.31</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
