<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜单权限 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">菜单权限</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>菜单权限</h2>
        <div class="desc">角色 → 菜单可见性（功能权限之菜单层）· 与数据权限正交 · 即时生效</div>
      </div>

      <div class="toolbar">
        <select class="input" style="width:180px">
          <option>角色：系统管理员</option><option>装维师傅</option><option>资产管理员</option>
          <option>资源运维管理员</option><option>业务运营/客服</option><option>经营分析人员</option><option>客户</option>
        </select>
        <span class="spacer"></span>
        <button class="btn btn-primary">保存变更</button>
        <button class="btn">重置</button>
      </div>

      <div class="card">
        <div class="card-title">角色 × 菜单组可见性 <span class="extra"><img src="icons/check.svg" alt="" style="width:12px;height:12px;vertical-align:-1px;">=可见 · 空=隐藏</span></div>
        <table class="tbl">
          <thead id="matrixHead"><tr><th>菜单组</th></tr></thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">三层权限模型 <span class="extra">正交 · 取交集</span></div>
        <table class="tbl">
          <thead><tr><th>权限层</th><th>载体</th><th>语义</th><th>落地</th></tr></thead>
          <tbody id="modelBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var CHECK = '<img src="icons/check.svg" alt="" style="width:14px;height:14px;display:block;">';
function renderMatrix(matrix) {
  var cols = matrix.roleColumns || [];
  var head = '<tr><th>菜单组</th>' + cols.map(function (c) {
    return '<th>' + esc(c.name) + '</th>';
  }).join('') + '</tr>';
  document.getElementById('matrixHead').innerHTML = head;
  var body = (matrix.rows || []).map(function (r) {
    return '<tr><td>' + esc(r.menu) + '</td>' + cols.map(function (c) {
      return '<td>' + (r.visible.indexOf(c.code) >= 0 ? CHECK : '') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  document.getElementById('matrixBody').innerHTML = body;
}
function renderModel(model) {
  document.getElementById('modelBody').innerHTML = (model.layers || []).map(function (l) {
    return '<tr><td>' + esc(l.layer) + '</td><td>' + esc(l.carrier) + '</td><td>' + esc(l.semantic) + '</td><td>' + esc(l.landing) + '</td></tr>';
  }).join('');
}
API.org.menuPerms().then(function (r) {
  renderMatrix(r.matrix);
  renderModel(r.model);
}).catch(function (err) { alert('加载失败：' + err.message); });
</script>
<script src="menu.js"></script>
</body>
</html>
