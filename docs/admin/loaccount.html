<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认证账号 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">认证账号</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>认证账号（LOID）</h2>
        <div class="desc">用户认证标识 LOID · 服务授权 · 状态联动</div>
      </div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="LOID/客户/带宽">
        <select class="input" id="st" style="width:140px">
          <option value="">全部状态</option><option>在服</option><option>停机</option>
        </select>
        <button class="btn btn-primary btn-search" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="btn-export">导出账号清单</button>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>LOID</th><th>客户</th><th>产品/带宽</th><th>QoS 模板</th><th>认证状态</th><th>最近认证</th><th>操作</th></tr></thead>
          <tbody id="loBody"></tbody>
        </table>
        <div class="pagination" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 认证账号 LOID(契约: GET /lo-accounts)
(function () {
  var all = [];
  var state = { page: 1, pageSize: 10 };

  function tag(cls, v) { return '<span class="tag ' + cls + '">' + UI.esc(v) + '</span>'; }

  function render() {
    var start = (state.page - 1) * state.pageSize;
    var slice = all.slice(start, start + state.pageSize);
    document.getElementById('loBody').innerHTML = slice.length ? slice.map(function (a) {
      return '<tr><td>' + UI.esc(a.loid) + '</td><td>' + UI.esc(a.customerName) + '</td><td>' + UI.esc(a.productBandwidth) +
        '</td><td>' + UI.esc(a.qosTemplate) + '</td><td>' + tag(a.statusClass, a.statusLabel) + '</td><td>' + UI.esc(a.lastAuth) +
        '</td><td><a href="#" data-op="detail" data-loid="' + UI.esc(a.loid) + '">详情</a></td></tr>';
    }).join('') : UI.tbodyState(7, '无匹配数据');
    UI.paginate(document.getElementById('pager'), {
      total: all.length, page: state.page, pageSize: state.pageSize,
      onChange: function (p, ps) { state.page = p; state.pageSize = ps; render(); }
    });
  }

  function findByLoid(loid) {
    for (var i = 0; i < all.length; i++) if (String(all[i].loid) === String(loid)) return all[i];
    return null;
  }

  function showDetail(loid) {
    var a = findByLoid(loid);
    if (!a) return;
    var items = [['LOID', a.loid], ['客户', a.customerName], ['产品/带宽', a.productBandwidth],
      ['QoS 模板', a.qosTemplate], ['认证状态', a.statusLabel], ['最近认证', a.lastAuth]].map(function (x) {
      return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>';
    }).join('');
    UI.modal({ title: '认证账号详情', body: items, okText: '关闭' });
  }

  document.getElementById('loBody').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    showDetail(a.getAttribute('data-loid'));
  });

  function load() {
    document.getElementById('loBody').innerHTML = UI.tbodyState(7, '加载中...');
    var st = document.getElementById('st').value;
    API.oss.loAccounts(document.getElementById('kw').value.trim(), st)
      .then(function (d) { all = d.items || []; state.page = 1; render(); })
      .catch(function (e) { UI.toast('加载认证账号失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = load;
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = '';
    document.getElementById('st').value = '';
    load();
  };
  document.getElementById('btn-refresh').onclick = load;
  document.getElementById('btn-export').onclick = function () {
    UI.toast('已导出认证账号 ' + all.length + ' 条(演示)', 'ok');
  };
  document.getElementById('kw').addEventListener('input', UI.debounce(load, 300));
  document.getElementById('st').addEventListener('change', load);

  load();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
