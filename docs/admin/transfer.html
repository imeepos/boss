<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨区域调配 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">跨区域调配</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>跨区域调配</h2>
        <div class="desc">跨大区资源调配申请与审批 · 归属变更 · 两区账实一致（REQ-REG-005）</div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" id="createBtn">+ 新建调配申请</button>
        <select class="input" id="type" style="width:160px">
          <option>调配类型：全部</option><option>端口调配</option><option>资产调配</option><option>设备调配</option>
        </select>
        <select class="input" id="st" style="width:160px">
          <option>状态：全部</option><option>待审批</option><option>已批准</option><option>已驳回</option><option>已完成</option>
        </select>
        <span class="spacer"></span>
        <span class="tag tag-blue">总部审批 · 归属变更 · 台账联动</span>
      </div>

      <div class="card">
        <div class="card-title">调配申请单 <span class="extra">Luzon 缺端口 → 调 Visayas 空闲端口</span></div>
        <table class="tbl">
          <thead><tr><th>调配单号</th><th>资源</th><th>调出区域</th><th>调入区域</th><th>数量</th><th>状态</th><th>审批人</th><th>操作</th></tr></thead>
          <tbody id="trBody"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">归属变更台账 <span class="extra">总部汇总 = 各区域之和</span></div>
        <table class="tbl">
          <thead><tr><th>区域</th><th>调出</th><th>调入</th><th>当前可用</th><th>账实一致性</th></tr></thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
var TYPE_MAP = { '端口调配': 'PORT', '资产调配': 'ASSET', '设备调配': 'DEVICE' };
var STATUS_MAP = { '待审批': 'PENDING', '已批准': 'APPROVED', '已驳回': 'REJECTED', '已完成': 'DONE' };
function renderTransfers(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var t = items[i];
    html += '<tr><td>' + esc(t.transferNo) + '</td><td>' + esc(t.resourceLabel) + '</td><td>' + esc(t.fromRegion) +
      '</td><td>' + esc(t.toRegion) + '</td><td>' + esc(t.quantity) +
      '</td><td><span class="tag ' + esc(t.statusClass) + '">' + esc(t.statusLabel) + '</span></td><td>' + esc(t.approver) +
      '</td><td>';
    for (var j = 0; j < t.actions.length; j++) {
      var act = t.actions[j];
      html += '<a href="#" data-no="' + esc(t.transferNo) + '" data-act="' + esc(act) + '">' + esc(act) + '</a> ';
    }
    html += '</td></tr>';
  }
  document.getElementById('trBody').innerHTML = html;
  bindRowActions();
}
function renderLedger(items) {
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var l = items[i];
    html += '<tr><td>' + esc(l.region) + '</td><td>' + esc(l.transferOut) + '</td><td>' + esc(l.transferIn) +
      '</td><td>' + esc(l.available) +
      '</td><td><span class="tag ' + esc(l.statusClass) + '">' + esc(l.consistentLabel) + '</span></td></tr>';
  }
  document.getElementById('ledgerBody').innerHTML = html;
}
function bindRowActions() {
  var links = document.getElementById('trBody').getElementsByTagName('a');
  for (var i = 0; i < links.length; i++) {
    links[i].onclick = function (e) {
      e.preventDefault();
      var act = this.getAttribute('data-act');
      var no = this.getAttribute('data-no');
      if (act === '审批') decide(no, true);
      else if (act === '驳回') decide(no, false);
      else alert('调配单 ' + no + ': ' + act);
    };
  }
}
function decide(no, approve) {
  var call = approve ? API.oss.approveTransfer(no) : API.oss.rejectTransfer(no);
  call.then(function (r) { alert('调配单 ' + no + (approve ? ' 审批' : ' 驳回') + ': ' + r.message); loadList(); })
    .catch(function (e) { alert('操作失败: ' + e.message); });
}
function loadList() {
  var type = TYPE_MAP[document.getElementById('type').value] || '';
  var st = STATUS_MAP[document.getElementById('st').value] || '';
  API.oss.transfers(st, type)
    .then(function (d) { renderTransfers(d.items); renderLedger(d.ledger.items); })
    .catch(function (e) { alert('加载调配单失败: ' + e.message); });
}
function bindToolbar() {
  document.getElementById('type').onchange = loadList;
  document.getElementById('st').onchange = loadList;
  document.getElementById('createBtn').onclick = function () {
    API.post('/transfers', { fromRegion: '', toRegion: '', quantity: 0 })
      .then(function (r) { alert('新建调配申请: ' + r.message); loadList(); })
      .catch(function (e) { alert('新建失败: ' + e.message); });
  };
}
function init() {
  loadList();
  bindToolbar();
}
init();
</script>
<script src="menu.js"></script>
</body>
</html>
