<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置下发 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb">配置下发</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head"><h2>配置下发</h2><div class="desc">配置自动下发 · 失败重试留痕</div></div>

      <div class="grid g-3" style="margin-bottom:16px;" id="stats"></div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>任务号</th><th>设备</th><th>模板</th><th>状态</th><th>重试次数</th></tr></thead>
          <tbody id="taskRows"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
// 配置下发数据渲染(契约: GET /provision-tasks)
(function () {
  var STATUS_TAG = { '成功': 'tag-green', '失败': 'tag-red' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderStats(stats) {
    document.getElementById('stats').innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="label">' + esc(s.label)
        + '</div><div class="val">' + esc(s.value) + '</div></div>';
    }).join('');
  }

  function renderRows(items) {
    document.getElementById('taskRows').innerHTML = items.map(function (r) {
      return '<tr><td>' + esc(r.taskNo) + '</td><td>' + esc(r.device) + '</td><td>'
        + esc(r.template) + '</td><td><span class="tag ' + (STATUS_TAG[r.status] || 'tag-gray') + '">'
        + esc(r.status) + '</span></td><td>' + esc(r.retries) + '</td></tr>';
    }).join('');
  }

  API.provision.tasks().then(function (d) {
    renderStats(d.stats);
    renderRows(d.items);
  }).catch(function (e) {
    document.getElementById('taskRows').innerHTML = '<tr><td colspan="5">加载失败: ' + esc(e.message) + '</td></tr>';
  });
})();
</script>
<script src="menu.js"></script>
</body>
</html>
