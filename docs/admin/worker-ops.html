<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>师傅端内容运营 · BOSS 管理后台</title>
<link rel="stylesheet" href="style.css">
<style>
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; }
  @media (max-width: 1100px) { .wgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="logo"><span class="mark">B</span> 装维运营平台</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <div class="crumb"><a href="worker.html">订单与工单 / 师傅管理</a> / 内容运营</div>
      <div class="right"><span class="ico"><img src="icons/bell.svg" alt=""></span><span>系统管理员</span><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <div class="page-head">
        <h2>师傅端内容运营</h2>
        <div class="desc">非按师傅维度的师傅端数据：公告 · FAQ 知识库 · 设备健康观察 · 抢单池任务（改动即时生效于师傅端）</div>
      </div>

      <div class="toolbar">
        <input class="input" id="kw" style="width:220px" placeholder="公告/FAQ/设备/单号 关键字">
        <select class="input" id="st" style="width:130px">
          <option value="">全部状态</option><option value="发布中">发布中</option><option value="已下架">已下架</option>
        </select>
        <button class="btn btn-primary" id="btn-search">查询</button>
        <button class="btn" id="btn-reset">重置</button>
        <span class="spacer"></span>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn btn-primary" id="noticeBtn">发布公告</button>
      </div>

      <div class="wgrid">
        <div class="card">
          <h3>公告管理（下架即从师傅端消失）</h3>
          <table class="tbl"><thead><tr><th>公告</th><th>分类</th><th>发布日</th><th>状态</th><th>操作</th></tr></thead><tbody id="noticeBody"></tbody></table>
          <div class="pagination" id="noticePager"></div>
        </div>
        <div class="card">
          <h3>FAQ 知识库</h3>
          <table class="tbl"><thead><tr><th>条目</th><th>摘要</th><th>状态</th><th>操作</th></tr></thead><tbody id="faqBody"></tbody></table>
        </div>
        <div class="card">
          <h3>设备健康观察（师傅端主动运维）</h3>
          <table class="tbl"><thead><tr><th>设备</th><th>类型</th><th>健康度</th><th>故障</th><th>年限</th><th>原因</th><th>优先级</th></tr></thead><tbody id="mntBody"></tbody></table>
        </div>
        <div class="card">
          <h3>抢单池（师傅端可抢任务）</h3>
          <table class="tbl"><thead><tr><th>单号</th><th>类型</th><th>地址/范围</th><th>来源</th></tr></thead><tbody id="hallBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="jquery.min.js"></script>
<script src="api.js"></script>
<script src="common.js"></script>
<script>
// 师傅端内容运营:公告/FAQ 增改与上下架,健康观察/抢单池只读(契约: /notices /faqs /device-maintenances /hall-items)
(function () {
  var S = { notices: [], faqs: [], mnts: [], halls: [], page: 1, pageSize: 10 };

  function kw() { return document.getElementById('kw').value.trim(); }
  function st() { return document.getElementById('st').value; }
  function hitText(r) { var k = kw(); return !k || JSON.stringify(r).indexOf(k) >= 0; }

  function fill(id, rows, cells) {
    document.getElementById(id).innerHTML = rows.length ? rows.map(function (r) {
      return '<tr>' + cells(r).map(function (h) { return '<td>' + h + '</td>'; }).join('') + '</tr>';
    }).join('') : UI.tbodyState(cells({}).length, '无匹配数据');
  }

  function render() {
    var notices = S.notices.filter(function (n) { return hitText(n) && (!st() || n.activeLabel === st()); });
    var start = (S.page - 1) * S.pageSize;
    fill('noticeBody', notices.slice(start, start + S.pageSize), function (n) {
      return [UI.esc(n.title), UI.esc(n.category), UI.esc(n.publishedAt),
        '<span class="tag ' + UI.esc(n.activeClass) + '">' + UI.esc(n.activeLabel) + '</span>',
        '<a href="#" data-kind="notice" data-op="detail" data-id="' + UI.esc(n.noticeId) + '">查看</a> · '
        + '<a href="#" data-kind="notice" data-op="toggle" data-id="' + UI.esc(n.noticeId) + '">上架/下架</a>'];
    });
    UI.paginate(document.getElementById('noticePager'), {
      total: notices.length, page: S.page, pageSize: S.pageSize,
      onChange: function (p, ps) { S.page = p; S.pageSize = ps; render(); }
    });
    fill('faqBody', S.faqs.filter(function (f) { return hitText(f) && (!st() || f.activeLabel === st()); }), function (f) {
      return [UI.esc(f.title), UI.esc(f.summary),
        '<span class="tag ' + UI.esc(f.activeClass) + '">' + UI.esc(f.activeLabel) + '</span>',
        '<a href="#" data-kind="faq" data-op="detail" data-id="' + UI.esc(f.faqId) + '">查看</a> · '
        + '<a href="#" data-kind="faq" data-op="toggle" data-id="' + UI.esc(f.faqId) + '">启用/停用</a>'];
    });
    fill('mntBody', S.mnts.filter(hitText), function (m) {
      return [UI.esc(m.deviceNo), UI.esc(m.deviceType), m.healthScore, m.faultCount, m.ageYears + ' 年', UI.esc(m.reason || '—'),
        '<span class="tag ' + UI.esc(m.priorityClass) + '">' + UI.esc(m.priorityLabel) + '</span>'];
    });
    fill('hallBody', S.halls.filter(hitText), function (h) {
      return [UI.esc(h.ticketNo), UI.esc(h.typeLabel), UI.esc(h.address), UI.esc(h.source)];
    });
  }

  function showNotice(id) {
    var n = S.notices.find(function (x) { return String(x.noticeId) === String(id); });
    if (!n) return;
    var rows = [['公告', n.title], ['分类', n.category], ['发布日', n.publishedAt], ['状态', n.activeLabel]]
      .map(function (x) { return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>'; }).join('');
    UI.modal({ title: '公告详情', body: rows, okText: '关闭' });
  }

  function showFaq(id) {
    var f = S.faqs.find(function (x) { return String(x.faqId) === String(id); });
    if (!f) return;
    var rows = [['条目', f.title], ['摘要', f.summary], ['状态', f.activeLabel]]
      .map(function (x) { return '<div class="form-item"><label>' + UI.esc(x[0]) + '</label><div>' + UI.esc(x[1]) + '</div></div>'; }).join('');
    UI.modal({ title: 'FAQ 详情', body: rows, okText: '关闭' });
  }

  function toggle(kind, id) {
    var act = kind === 'notice' ? API.worker.toggleNotice(id) : API.worker.toggleFaq(id);
    var text = kind === 'notice' ? '切换公告上架/下架' : '切换 FAQ 启用/停用';
    UI.confirm('确认' + text + '?', function () {
      act.then(function () { UI.toast('已更新', 'ok'); loadAll(); })
        .catch(function (e) { UI.toast('操作失败: ' + e.message, 'err'); });
    });
  }

  function publishNotice() {
    var fields = [
      { key: 'title', label: '公告标题', required: true, placeholder: '如: 系统维护通知' },
      { key: 'category', label: '分类', type: 'select', value: '功能公告', options: [
        { v: '功能公告', t: '功能公告' }, { v: '运营公告', t: '运营公告' }, { v: '紧急通知', t: '紧急通知' }] },
      { key: 'content', label: '内容', type: 'textarea', placeholder: '公告正文' },
    ];
    UI.modal({
      title: '发布公告', body: UI.formFields(fields), okText: '发布',
      onOk: function (m, close) {
        var v = UI.readForm(m, fields);
        if (!v) return false;
        return API.worker.publishNotice({ title: v.title, category: v.category, content: v.content }).then(function () {
          UI.toast('公告已发布', 'ok'); close(); loadAll();
        });
      }
    });
  }

  document.querySelector('.wgrid').addEventListener('click', function (ev) {
    var a = ev.target;
    if (a.tagName !== 'A' || !a.getAttribute('data-op')) return;
    ev.preventDefault();
    var kind = a.getAttribute('data-kind'), op = a.getAttribute('data-op'), id = a.getAttribute('data-id');
    if (op === 'toggle') toggle(kind, id);
    else if (kind === 'notice') showNotice(id);
    else showFaq(id);
  });

  function loadAll() {
    ['noticeBody', 'faqBody', 'mntBody', 'hallBody'].forEach(function (id) {
      document.getElementById(id).innerHTML = UI.tbodyState(id === 'noticeBody' ? 5 : id === 'faqBody' ? 4 : id === 'mntBody' ? 7 : 4, '加载中...');
    });
    Promise.all([API.worker.notices(), API.worker.faqs(), API.worker.maintenances(), API.worker.hallItems()])
      .then(function (r) {
        S.notices = r[0].items || []; S.faqs = r[1].items || [];
        S.mnts = r[2].items || []; S.halls = r[3].items || [];
        render();
      }).catch(function (e) { UI.toast('加载内容运营数据失败: ' + e.message, 'err'); });
  }

  document.getElementById('btn-search').onclick = function () { S.page = 1; render(); };
  document.getElementById('btn-reset').onclick = function () {
    document.getElementById('kw').value = ''; document.getElementById('st').value = '';
    S.page = 1; render();
  };
  document.getElementById('btn-refresh').onclick = loadAll;
  document.getElementById('noticeBtn').onclick = publishNotice;
  document.getElementById('kw').addEventListener('input', UI.debounce(function () { S.page = 1; render(); }, 300));
  document.getElementById('st').addEventListener('change', function () { S.page = 1; render(); });

  loadAll();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
