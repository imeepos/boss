<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助注册 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
<style>
  .lg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f1f3d,#1a2b4a 55%,#1677ff);}
  .lg-card{background:#fff;border-radius:16px;padding:32px 24px;width:360px;margin:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .lg-card h1{font-size:20px;margin:0;text-align:center;}
  .lg-card .sub{color:#999;font-size:12.5px;text-align:center;margin:6px 0 26px;}
  .code-row{display:flex;gap:8px;}
  .code-row input{flex:1;}
  .code-btn{width:110px;flex-shrink:0;border:1px solid var(--primary);color:var(--primary);
    background:#fff;border-radius:8px;font-size:12.5px;cursor:pointer;}
</style>
</head>
<body>
<div class="lg-wrap">
  <div class="lg-card">
    <h1>自助注册</h1>
    <p class="sub">手机号注册 · 注册即享宽带自助服务</p>
    <div class="field">
      <label>手机号</label>
      <input type="tel" placeholder="请输入手机号">
    </div>
    <div class="field">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" placeholder="6 位验证码">
        <button class="code-btn">获取验证码</button>
      </div>
    </div>
    <div class="field">
      <label>设置密码（≥10 位，含大小写与数字）</label>
      <input type="password" placeholder="请设置登录密码">
    </div>
    <div class="field">
      <label>确认密码</label>
      <input type="password" placeholder="请再次输入密码">
    </div>
    <div class="lg-extra" style="display:flex;justify-content:space-between;font-size:12.5px;margin:8px 0 18px;color:var(--muted);">
      <label><input type="checkbox" checked> 已阅读并同意<a href="agreement.html">《用户协议》</a></label>
      <a href="login.html">已有账号，去登录</a>
    </div>
    <button class="btn-block" onclick="location.href='home.html'">注册并登录</button>
  </div>
</div>
</body>
</html>
