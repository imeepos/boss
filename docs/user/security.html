<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号安全 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">账号安全</div>
    <span class="act"></span>
  </div>

  <div class="card">
    <div class="c-title">实名认证 <span class="tag tag-green" id="s-rn-status">已实名</span><a class="more" href="verify.html">核验详情</a></div>
    <div class="cell"><div class="main"><div class="t">姓名</div></div><div class="right" id="s-name">—</div></div>
    <div class="cell"><div class="main"><div class="t">证件号码</div></div><div class="right" id="s-idno">—</div></div>
    <div class="cell"><div class="main"><div class="t">认证时间</div></div><div class="right" id="s-verifyat">—</div></div>
    <div class="muted" style="font-size:12px;margin-top:8px;">实名信息用于办理入网与停机复机，一经核验不可在线变更，如需变更请携证件至营业厅。</div>
  </div>

  <div class="card">
    <div class="c-title">登录密码</div>
    <div class="cell">
      <div class="main"><div class="t">登录密码</div><div class="d">上次修改 <span id="s-pwdupdated">—</span></div></div>
      <div class="right"><button class="btn" onclick="location.href='forgot.html'">修改</button></div>
    </div>
    <div class="cell">
      <div class="main"><div class="t">绑定手机号</div><div class="d" id="s-phone">—</div></div>
      <div class="right"><button class="btn">更换</button></div>
    </div>
  </div>

  <div class="card">
    <div class="c-title">安全提示</div>
    <div class="cell"><div class="main"><div class="t">密码策略</div><div class="d">≥10 位，含大小写与数字，90 天更换</div></div></div>
    <div class="cell"><div class="main"><div class="t">登录保护</div><div class="d">连续失败 5 次锁定 30 分钟</div></div></div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  API.profile.security().then(function (s) {
    document.getElementById('s-rn-status').textContent = s.realNameStatus === 'VERIFIED' ? '已实名' : '待补登';
    document.getElementById('s-name').textContent = s.nameMasked || '—';
    document.getElementById('s-idno').textContent = s.idNoMasked || '—';
    document.getElementById('s-verifyat').textContent = s.verifyAt || '—';
    document.getElementById('s-pwdupdated').textContent = s.passwordUpdatedAt || '—';
    document.getElementById('s-phone').textContent = s.phoneMasked || '—';
  }).catch(function () {});
</script>
</body>
</html>
