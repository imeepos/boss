<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助排障 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="fault.html"></div>

  <div class="card">
    <div class="c-title">请选择故障现象</div>
    <div id="symptom-list"></div>
  </div>

  <div id="sections"></div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function symptomCell(s) {
    return '<a class="cell" href="#' + s.id + '"><div class="main"><div class="t">' + s.title + '</div><div class="d">' + s.desc + '</div></div><div class="right">›</div></a>';
  }
  function stepCell(st) {
    return '<div class="cell"><div class="main"><div class="t">' + st.title + '</div><div class="d">' + st.desc + '</div></div></div>';
  }
  function sectionCard(s) {
    return '<div class="card" id="' + s.id + '"><div class="c-title">' + s.title + ' · 引导排查</div>'
      + (s.steps || []).map(stepCell).join('')
      + '<button class="btn-block ghost" style="margin-top:12px;" onclick="location.href=\'fault.html\'" data-i18n="user.diy.text1">仍未解决 · 转人工报修</button></div>';
  }
  API.misc.diySteps().then(function (d) {
    var items = d.items || [];
    document.getElementById('symptom-list').innerHTML = items.map(symptomCell).join('');
    document.getElementById('sections').innerHTML = items.map(sectionCard).join('');
  });
</script>
</body>
</html>
