<!DOCTYPE html>

<head>

<title>自助排障 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="fault.html">&lsaquo;</a>
    <div class="t">自助排障</div>
    <span class="act" onclick="location.href='service.html'">在线客服</span>
  </div>

  <div class="card">
    <div class="c-title">请选择故障现象</div>
    <a class="cell" href="#s1"><div class="main"><div class="t">无法上网</div><div class="d">光猫灯异常 / 完全断网</div></div><div class="right">›</div></a>
    <a class="cell" href="#s2"><div class="main"><div class="t">网速慢</div><div class="d">视频卡顿 / 下载缓慢</div></div><div class="right">›</div></a>

  </div>

  <div class="card" id="s1">
    <div class="c-title">无法上网 · 引导排查</div>

    <div class="cell"><div class="main"><div class="t">2 重启光猫与路由器</div><div class="d">断电 30 秒后重新上电</div></div></div>
    <div class="cell"><div class="main"><div class="t">3 检查认证状态</div><div class="d">确认账号未欠费停机</div></div></div>
    <button class="btn-block ghost" style="margin-top:12px;" onclick="location.href='fault.html'">仍未解决 · 转人工报修</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
