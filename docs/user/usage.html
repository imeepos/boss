<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络用量 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="home.html"></div>

  <div class="seg" id="tabs">
    <a class="active" onclick="switchPeriod('current')">本周期</a>
    <a onclick="switchPeriod('last')">上月</a>
    <a onclick="switchPeriod('six_month')">近 6 月</a>
  </div>

  <div class="card" style="text-align:center;">
    <div class="muted" style="font-size:12.5px;" id="u-period">—</div>
    <div class="amount" style="font-size:30px;font-weight:700;margin:6px 0;" id="u-used">—</div>
    <div class="muted" style="font-size:12px;" id="u-quota">—</div>
    <div class="bar" style="height:8px;background:var(--line);border-radius:4px;margin:12px 0;overflow:hidden;">
      <div style="width:29%;height:100%;background:var(--primary);" id="u-bar"></div>
    </div>
    <div class="muted" style="font-size:12px;" id="u-forecast">—</div>
  </div>

  <div class="card">
    <div class="c-title">用量明细</div>
    <div class="cell"><div class="main"><div class="t">下行流量</div></div><div class="right" id="u-down">—</div></div>
    <div class="cell"><div class="main"><div class="t">上行流量</div></div><div class="right" id="u-up">—</div></div>
    <div class="cell"><div class="main"><div class="t">IPTV 独立通道</div></div><div class="right" id="u-iptv">—</div></div>
  </div>

  <div class="card">
    <div class="c-title">在线状态</div>
    <div class="cell"><div class="main"><div class="t">当前在线时长</div></div><div class="right" id="u-duration">—</div></div>
    <div class="cell"><div class="main"><div class="t">最近一次上线</div></div><div class="right" id="u-lastonline">—</div></div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function switchPeriod(p) {
    document.querySelectorAll('#tabs a').forEach(function (a, i) { a.className = (['current', 'last', 'six_month'][i] === p) ? 'active' : ''; });
  }
  function render(d) {
    document.getElementById('u-period').textContent = d.periodLabel;
    document.getElementById('u-used').textContent = d.used + ' ' + d.unit;
    document.getElementById('u-quota').textContent = '套餐内含 ' + d.quota + ' GB · 剩余 ' + (d.quota - d.used).toFixed(1) + ' GB（' + (100 - d.percent) + '%）';
    document.getElementById('u-bar').style.width = d.percent + '%';
    document.getElementById('u-forecast').textContent = '日均 ' + d.dailyAvg + ' GB · 预计月底剩余 ' + d.forecastRemain + ' GB';
    document.getElementById('u-down').textContent = d.detail.down + ' GB';
    document.getElementById('u-up').textContent = d.detail.up + ' GB';
    document.getElementById('u-iptv').textContent = d.detail.iptvNote;
    document.getElementById('u-duration').textContent = d.online.duration;
    document.getElementById('u-lastonline').textContent = d.online.lastOnlineAt;
  }
  API.misc.usage().then(render).catch(function () {});
</script>
</body>
</html>
