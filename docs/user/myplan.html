<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的套餐 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">我的套餐</div>
    <span class="act"></span>
  </div>

  <div class="card" style="border:1px solid var(--primary);">
    <div class="c-title">1000M 极速宽带 <span class="tag tag-green">在网</span></div>
    <div class="cell"><div class="main"><div class="t">月费</div></div><div class="right">¥199/月</div></div>
    <div class="cell"><div class="main"><div class="t">合约到期</div></div><div class="right">2026-08</div></div>
    <div class="cell"><div class="main"><div class="t">安装地址</div></div><div class="right">望京X · 3栋 · 501</div></div>
    <div class="cell"><div class="main"><div class="t">账户状态</div></div><div class="right"><span class="tag tag-green">正常</span></div></div>
    <div class="cell"><div class="main"><div class="t">本月账单</div></div><div class="right">¥158.00 · 未缴</div></div>
  </div>

  <div class="quick">
    <a class="q" href="change.html"><span class="ic ic-blue">改</span>改套餐</a>
    <a class="q" href="addon.html"><span class="ic ic-green">增</span>加购</a>
    <a class="q" href="move.html"><span class="ic ic-orange">迁</span>迁址</a>
    <a class="q" href="cancel.html"><span class="ic ic-red" style="background:#ff4d4f;">退</span>退订</a>
  </div>

  <div class="card">
    <div class="c-title">停机 / 复机状态</div>
    <div class="cell"><div class="main"><div class="t">当前状态</div><div class="d">无欠费，网络正常</div></div><div class="right"><span class="tag tag-green">正常</span></div></div>
    <div class="cell"><div class="main"><div class="t">缴费复机</div><div class="d">欠费停机后缴费自动复机，3 分钟内恢复</div></div><div class="right"><a href="pay.html">去缴费</a></div></div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
