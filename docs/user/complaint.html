<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投诉建议 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="profile.html"></div>

  <div class="card">
    <div class="c-title">我要投诉 / 建议</div>
    <div class="field">
      <label>类型</label>
      <select id="type"><option value="attitude">服务态度投诉</option><option value="quality">装维质量投诉</option><option value="billing">计费争议</option><option value="suggestion">业务建议</option><option value="other">其他</option></select>
    </div>
    <div class="field">
      <label>关联订单 / 报修单（选填）</label>
      <input type="text" id="rel" placeholder="如 ORD-20250817-001">
    </div>
    <div class="field">
      <label>详细描述</label>
      <textarea rows="4" id="desc" placeholder="请描述问题经过与诉求"></textarea>
    </div>
    <div class="field">
      <label>联系方式</label>
      <input type="tel" id="contact" value="13800001234">
    </div>
    <button class="btn-block" onclick="submit()">提交投诉</button>
    <div class="muted" style="font-size:12px;margin-top:10px;">提交后 24 小时内受理，处理进度可在「消息中心」查询。</div>
  </div>

  <div class="card">
    <div class="c-title">我的投诉</div>
    <div id="list"></div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function cell(c) {
    return '<div class="cell"><div class="main"><div class="t">' + c.typeLabel + '</div><div class="d">' + c.createdAt + '</div></div>'
      + '<div class="right"><span class="tag tag-green">' + c.statusLabel + '</span></div></div>';
  }
  API.complaint.list().then(function (d) {
    document.getElementById('list').innerHTML = (d.items || []).map(cell).join('');
  });
  function submit() {
    API.complaint.submit({
      type: document.getElementById('type').value,
      relOrderNo: document.getElementById('rel').value,
      description: document.getElementById('desc').value,
      contact: document.getElementById('contact').value,
    }).then(function () { alert('已提交，24 小时内受理'); location.reload(); });
  }
</script>
</body>
</html>
