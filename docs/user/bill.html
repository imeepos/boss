<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单明细 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="bills.html"></div>

  <div class="card">
    <div class="c-title" id="b-title">加载中…</div>
    <div id="b-items"></div>
    <div class="cell" style="border-top:1px solid var(--line);"><div class="main"><div class="t" style="font-weight:700;">合计应缴</div></div><div class="right amount" style="font-size:16px;" id="b-total">¥—</div></div>
  </div>

  <div class="card">
    <div class="c-title">自动缴费 <span class="tag tag-gray" id="b-autopay">未开通</span></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;">开通后每月账期自动扣款，避免忘记缴费导致停机。</div>
    <button class="btn-block ghost" onclick="location.href='payresult.html'">开通微信自动缴费</button>
  </div>

  <div style="margin:12px 14px 0;">
    <button class="btn-block" id="b-pay-btn" onclick="location.href='pay.html'">立即缴费</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var billNo = new URLSearchParams(location.search).get('no') || 'BILL-202508';
  function itemCell(it, isNeg) {
    return '<div class="cell"><div class="main"><div class="t">' + it.name + '</div><div class="d">' + it.range + '</div></div>'
      + '<div class="right"' + (isNeg ? ' style="color:var(--success);"' : '') + '>' + (it.amount < 0 ? '-¥' + (-it.amount).toFixed(2) : '¥' + it.amount.toFixed(2)) + '</div></div>';
  }
  API.bill.detail(billNo).then(function (d) {
    var b = d.bill || {};
    var tag = b.status === 'PAID' ? 'tag-green' : 'tag-orange';
    document.getElementById('b-title').innerHTML = b.period + ' 账期 <span class="tag ' + tag + '">' + b.statusLabel + '</span>';
    document.getElementById('b-items').innerHTML = (d.items || []).map(itemCell).join('');
    document.getElementById('b-total').textContent = '¥' + d.totalDue.toFixed(2);
    document.getElementById('b-autopay').textContent = d.autoPayEnabled ? '已开通' : '未开通';
    document.getElementById('b-pay-btn').textContent = '立即缴费 ¥' + d.totalDue.toFixed(2);
  }).catch(function () {});
</script>
</body>
</html>
