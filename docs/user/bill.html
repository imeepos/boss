<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单明细 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="bills.html">&lsaquo;</a>
    <div class="t">账单明细</div>
    <span class="act" onclick="location.href='invoice.html'">开发票</span>
  </div>

  <div class="card">
    <div class="c-title">2025-08 账期 <span class="tag tag-orange">未缴</span></div>
    <div class="cell"><div class="main"><div class="t">1000M 极速宽带套餐费</div><div class="d">08-01 ~ 08-31</div></div><div class="right">¥199.00</div></div>
    <div class="cell"><div class="main"><div class="t">IPTV 高清电视</div><div class="d">08-01 ~ 08-31</div></div><div class="right">¥10.00</div></div>
    <div class="cell"><div class="main"><div class="t">全屋 WiFi</div><div class="d">08-01 ~ 08-31</div></div><div class="right">¥15.00</div></div>
    <div class="cell"><div class="main"><div class="t">合约减免</div><div class="d">首年立减</div></div><div class="right" style="color:var(--success);">-¥66.00</div></div>
    <div class="cell" style="border-top:1px solid var(--line);"><div class="main"><div class="t" style="font-weight:700;">合计应缴</div></div><div class="right amount" style="font-size:16px;">¥158.00</div></div>
  </div>

  <div class="card">
    <div class="c-title">自动缴费 <span class="tag tag-gray">未开通</span></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;">开通后每月账期自动扣款，避免忘记缴费导致停机。</div>
    <button class="btn-block ghost" onclick="location.href='payresult.html'">开通微信自动缴费</button>
  </div>

  <div style="margin:12px 14px 0;">
    <button class="btn-block" onclick="location.href='pay.html'">立即缴费 ¥158.00</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
