<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分中心 · 客户门户</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="app">
  <div id="header" data-back="home.html"></div>
  <main class="card points-page">
    <section class="points-balance"><span data-i18n="points.balance">当前积分</span><strong id="points-balance">—</strong><span id="points-tier" class="tag tag-blue">—</span></section>
    <div class="section-title"><h2 data-i18n="points.tasks">积分任务</h2></div><div id="points-tasks" class="list" aria-live="polite"></div>
    <div class="section-title"><h2 data-i18n="points.entries">积分流水</h2></div><div id="points-entries" class="list" aria-live="polite"></div>
    <p id="points-error" class="error" hidden data-i18n="errors.load">暂时无法加载，请稍后重试。</p>
  </main><div id="tabbar"></div>
</div><script src="nav.js"></script><script src="api.js"></script><script>
(function () {
  var copy = { 'zh-CN': { 'points.title':'积分中心','points.balance':'当前积分','points.tasks':'积分任务','points.entries':'积分流水','nav.profile':'我的','errors.load':'暂时无法加载，请稍后重试。','points.done':'已完成','points.complete':'完成任务','points.empty':'暂无记录' }, 'en-US': { 'points.title':'Points','points.balance':'Balance','points.tasks':'Tasks','points.entries':'History','nav.profile':'Profile','errors.load':'Unable to load. Try again later.','points.done':'Completed','points.complete':'Complete','points.empty':'No records' }, 'ms-MY': { 'points.title':'Mata ganjaran','points.balance':'Baki mata','points.tasks':'Tugasan','points.entries':'Sejarah','nav.profile':'Profil','errors.load':'Tidak dapat dimuatkan. Cuba lagi.','points.done':'Selesai','points.complete':'Lengkapkan','points.empty':'Tiada rekod' } };
  var lang = localStorage.getItem('boss_user_locale') || 'zh-CN'; var t = copy[lang] || copy['zh-CN'];
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.getAttribute('data-i18n')] || el.textContent; });
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }
  function render(data) { var entries = data.entries || []; document.getElementById('points-balance').textContent = data.balance == null ? '—' : data.balance; document.getElementById('points-entries').innerHTML = entries.length ? entries.map(function (e) { return '<div class="cell"><div class="main"><div class="t">' + esc(e.reason) + '</div><div class="d">' + esc(e.createdAt) + '</div></div><div class="right"><b class="amt">' + (e.delta > 0 ? '+' : '') + esc(e.delta) + '</b></div></div>'; }).join('') : '<p class="empty">' + t['points.empty'] + '</p>'; }
  function load() { return Promise.all([API.points.get(), API.points.tier(), API.points.tasks()]).then(function (r) { render(r[0].data || r[0]); var tier = (r[1].data || r[1] || {}).tier; document.getElementById('points-tier').textContent = tier ? esc(tier.name) : '—'; var tasks = ((r[2].data || r[2] || {}).tasks || []); document.getElementById('points-tasks').innerHTML = tasks.length ? tasks.map(function (x) { var done = !!x.completedAt; return '<div class="cell"><div class="main"><div class="t">' + esc(x.name) + '</div><div class="d">+' + esc(x.points) + '</div></div><button class="btn ' + (done ? '' : 'btn-primary') + '" data-task="' + esc(x.taskId) + '" ' + (done ? 'disabled' : '') + '>' + (done ? t['points.done'] : t['points.complete']) + '</button></div>'; }).join('') : '<p class="empty">' + t['points.empty'] + '</p>'; }).catch(function () { document.getElementById('points-error').hidden = false; }); }
  document.getElementById('points-tasks').addEventListener('click', function (e) { var b = e.target.closest('[data-task]'); if (!b) return; b.disabled = true; API.points.complete(b.getAttribute('data-task')).then(load).catch(function () { b.disabled = false; document.getElementById('points-error').hidden = false; }); });
  load();
}());
</script></body></html>
