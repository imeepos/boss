<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户协议 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="login.html"></div>

  <div class="card">
    <div class="c-title">用户协议</div>
    <div class="muted" style="font-size:13px;line-height:1.8;" id="agreement"></div>
  </div>

  <div class="card">
    <div class="c-title">隐私政策</div>
    <div class="muted" style="font-size:13px;line-height:1.8;" id="privacy"></div>
  </div>

  <button class="btn-block" style="margin:0 14px 20px;width:auto;" onclick="location.href='login.html'" data-i18n="user.agreement.text1">返回登录</button>
</div>
<script src="api.js"></script>
<script>
  function paras(items) {
    return (items || []).map(function (t, i) { return '<p data-i18n="user.agreement.text2">' + (i + 1) + '. ' + t + '</p>'; }).join('');
  }
  API.misc.agreement().then(function (d) {
    document.getElementById('agreement').innerHTML = paras(d.userAgreement);
    document.getElementById('privacy').innerHTML = paras(d.privacyPolicy);
  }).catch(function () {});
</script>
</body>
</html>
