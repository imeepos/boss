<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">优惠券与活动</div>
    <span class="act"></span>
  </div>

  <div class="seg" id="tabs">
    <a class="active" onclick="filterList('available')">可用</a>
    <a onclick="filterList('used')">已使用</a>
    <a onclick="filterList('expired')">已过期</a>
  </div>

  <div id="coupon-list"></div>

  <div class="card">
    <div class="c-title">邀请好友</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;">邀请好友办理宽带，双方各得 ¥50 优惠券。</div>
    <button class="btn-block ghost" onclick="copyInvite()">复制邀请链接</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var inviteLink = '';
  function card(c) {
    var hint = c.threshold > 0 ? '<span class="muted" style="font-size:12px;">满 ' + c.threshold + ' 可用</span>' : '';
    return '<div class="card" style="border-left:4px solid var(--primary);">'
      + '<div class="row" style="display:flex;justify-content:space-between;align-items:center;">'
      + '<div><b style="font-size:18px;">¥' + c.amount + '</b> ' + hint + '</div>'
      + '<span class="tag tag-blue">可用</span></div>'
      + '<div class="muted" style="font-size:12px;margin-top:6px;">' + c.title + ' · 有效期至 ' + c.expireAt + '</div>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="location.href=\'products.html\'">去使用</button></div>';
  }
  function filterList(k) {
    document.querySelectorAll('#tabs a').forEach(function (a, i) { a.className = (['available', 'used', 'expired'][i] === k) ? 'active' : ''; });
  }
  function copyInvite() {
    if (inviteLink && navigator.clipboard) {
      navigator.clipboard.writeText(inviteLink).then(function () { alert('已复制邀请链接'); });
    } else { alert('邀请链接：' + (inviteLink || '生成中…')); }
  }
  API.misc.coupons().then(function (d) {
    inviteLink = d.inviteLink;
    document.getElementById('coupon-list').innerHTML = (d.items || []).map(card).join('');
  });
</script>
</body>
</html>
