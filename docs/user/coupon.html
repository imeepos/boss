<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">优惠券与活动</div>
    <span class="act"></span>
  </div>

  <div class="seg">
    <a class="active">可用</a>
    <a>已使用</a>
    <a>已过期</a>
  </div>

  <div class="card" style="border-left:4px solid var(--primary);">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;">
      <div><b style="font-size:18px;">¥40</b> <span class="muted" style="font-size:12px;">满 100 可用</span></div>
      <span class="tag tag-blue">可用</span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px;">1000M 套餐首月立减 · 有效期至 2025-08-31</div>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="location.href='products.html'">去使用</button>
  </div>

  <div class="card" style="border-left:4px solid var(--warn);">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;">
      <div><b style="font-size:18px;">¥20</b> <span class="muted" style="font-size:12px;">充值券</span></div>
      <span class="tag tag-orange">可用</span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px;">余额充值满 200 减 20 · 有效期至 2025-09-30</div>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="location.href='topup.html'">去使用</button>
  </div>

  <div class="card">
    <div class="c-title">邀请好友</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;">邀请好友办理宽带，双方各得 ¥50 优惠券。</div>
    <button class="btn-block ghost">复制邀请链接</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
