<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线缴费 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="bills.html">&lsaquo;</a>
    <div class="t">在线缴费</div>
    <span class="act"></span>
  </div>

  <div class="card">
    <div class="muted" style="font-size:12.5px;">缴费金额</div>
    <div class="amount" style="font-size:26px;font-weight:700;margin:4px 0 12px;">¥158.00</div>
    <div class="muted" style="font-size:12px;margin-bottom:14px;">账期 2025-08 · 1000M 极速宽带</div>
    <div class="c-title" style="font-size:13.5px;color:var(--muted);">支付方式</div>
    <div class="cell"><div class="main"><div class="t">微信支付</div></div><div class="right"><input type="radio" name="pay" checked></div></div>
    <div class="cell"><div class="main"><div class="t">支付宝</div></div><div class="right"><input type="radio" name="pay"></div></div>
    <div class="cell"><div class="main"><div class="t">银行卡</div></div><div class="right"><input type="radio" name="pay"></div></div>
    <button class="btn-block" style="margin-top:14px;" onclick="location.href='payresult.html'">确认支付 ¥158.00</button>
  </div>

  <div class="card">
    <div class="c-title">缴费记录 <span class="more" onclick="location.href='invoice.html'">开发票</span></div>
    <div class="cell">
      <div class="main"><div class="t">¥158 · 2025-07 账期</div><div class="d">微信支付 · 2025-07-25 10:12</div></div>
      <div class="right"><a href="receipt.html">凭证</a></div>
    </div>
    <div class="cell">
      <div class="main"><div class="t">¥129 · 2025-06 账期</div><div class="d">支付宝 · 2025-06-24 09:40</div></div>
      <div class="right"><a href="receipt.html">凭证</a></div>
    </div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
