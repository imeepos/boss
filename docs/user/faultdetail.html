<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报修详情 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="fault.html"></div>

  <div class="card">
    <div class="c-title" id="f-title">加载中…</div>
    <div class="cell"><div class="main"><div class="t">故障类型</div></div><div class="right" id="f-type">—</div></div>
    <div class="cell"><div class="main"><div class="t">故障地址</div></div><div class="right" id="f-addr">—</div></div>
    <div class="cell"><div class="main"><div class="t">报修时间</div></div><div class="right" id="f-time">—</div></div>
    <div class="cell"><div class="main"><div class="t">受理师傅</div></div><div class="right" id="f-tech">—</div></div>
  </div>

  <div class="card">
    <div class="c-title">处理进度（报障 6 环节）</div>
    <div class="timeline" id="f-timeline"></div>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <button class="btn" style="flex:1;">联系师傅</button>
    <button class="btn" style="flex:1;">催单</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var ticketNo = new URLSearchParams(location.search).get('no') || 'TKT-20250817-015';
  function nodeCss(r) { return r === 'DONE' ? 'node done' : (r === 'DOING' ? 'node doing' : 'node'); }
  function tlItem(t, i, total) {
    var itemCls = t.result === 'DONE' ? 'tl-item done' : 'tl-item';
    var line = i < total - 1 ? '<span class="line"></span>' : '';
    return '<div class="' + itemCls + '"><div class="rail"><span class="' + nodeCss(t.result) + '"></span>' + line + '</div>'
      + '<div class="body"><div class="t">' + t.step + ' ' + t.title + '</div><div class="meta">' + t.meta + '</div></div></div>';
  }
  API.fault.detail(ticketNo).then(function (d) {
    var f = d.fault || {};
    document.getElementById('f-title').innerHTML = f.ticketNo + ' <span class="tag tag-blue">' + f.statusLabel + '</span>';
    document.getElementById('f-type').textContent = f.faultTypeLabel || '—';
    document.getElementById('f-addr').textContent = f.address || '—';
    document.getElementById('f-time').textContent = f.createdAt || '—';
    document.getElementById('f-tech').textContent = (d.technicianName || '—') + (d.technicianPhoneMasked ? ' · ' + d.technicianPhoneMasked : '');
    var tl = d.timeline || [];
    document.getElementById('f-timeline').innerHTML = tl.map(function (t, i) { return tlItem(t, i, tl.length); }).join('');
  }).catch(function () {});
</script>
</body>
</html>
