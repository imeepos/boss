<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退订拆机 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="myplan.html"></div>

  <div class="card">
    <div class="c-title">退订须知</div>
    <div class="muted" style="font-size:13px;line-height:1.8;">
      <p data-i18n="user.cancel.text1">1. 合约期内退订，按未履约月份收取违约金，具体以结算页为准。</p>
      <p data-i18n="user.cancel.text2">2. 拆机须装维师傅上门扫码解绑光猫设备（强制节点），请保持联系畅通。</p>
      <p data-i18n="user.cancel.text3">3. 拆机完成后端口与账号同步释放，未缴账单需结清后方可完成。</p>
    </div>
  </div>

  <div class="card">
    <div class="c-title">待结清款项</div>
    <div id="unpaid"></div>
  </div>

  <div class="card">
    <div class="c-title">退订原因</div>
    <div class="field">
      <select id="reason">
        <option value="leave_area">迁离服务区</option>
        <option value="switch_operator">更换运营商</option>
        <option value="cost">费用过高</option>
        <option value="other">其他</option>
      </select>
    </div>
  </div>

  <div style="margin:12px 14px 0;">
    <button class="btn-block" onclick="submit()" data-i18n="user.cancel.text4">确认退订 · 生成拆机单</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.zh-CN.js"></script>
<script src="locale.en-US.js"></script>
<script src="locale.ms-MY.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function billCell(b) {
    return '<div class="cell"><div class="main"><div class="t">' + b.period + ' 账期</div><div class="d">¥' + b.amount.toFixed(2) + ' · 未缴</div></div>'
      + '<div class="right"><span class="tag tag-orange" data-i18n="user.cancel.text5">未缴</span></div></div>';
  }
  API.plan.cancelPreview('PLAN-1000').then(function (d) {
    var html = (d.unpaidBills || []).map(billCell).join('');
    html += '<div class="cell"><div class="main"><div class="t">合约违约金</div><div class="d">' + d.penaltyDesc + '</div></div><div class="right">¥' + d.penalty.toFixed(2) + '</div></div>';
    document.getElementById('unpaid').innerHTML = html;
  }).catch(function () {});
  function submit() {
    API.plan.cancel('PLAN-1000', document.getElementById('reason').value).then(function (o) {
      location.href = 'order.html?no=' + encodeURIComponent(o.orderNo);
    });
  }
</script>
</body>
</html>
