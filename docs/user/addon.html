<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加购增值服务 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="myplan.html"></div>

  <div class="card">
    <div class="c-title">可订购增值服务</div>
    <div id="avail"></div>
  </div>

  <div class="card">
    <div class="c-title">已订购 <span class="more" data-i18n="user.addon.text1">生效中</span></div>
    <div id="subscribed"></div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.zh-CN.js"></script>
<script src="locale.en-US.js"></script>
<script src="locale.ms-MY.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function availCell(a) {
    return '<div class="cell"><div class="main"><div class="t">' + a.name + '</div><div class="d">' + a.description + '</div></div>'
      + '<div class="right"><button class="btn btn-primary" onclick="subscribe(\'' + a.addonId + '\')" data-i18n="user.addon.text2">订购</button></div></div>';
  }
  function subCell(a) {
    return '<div class="cell"><div class="main"><div class="t">' + a.name + '</div><div class="d">' + a.description + '</div></div>'
      + '<div class="right"><button class="btn" onclick="unsubscribe(\'' + a.addonId + '\')" data-i18n="user.addon.text3">退订</button></div></div>';
  }
  function subscribe(id) {
    API.addon.subscribe(id).then(function () { alert('已订购'); location.reload(); });
  }
  function unsubscribe(id) {
    API.addon.unsubscribe(id).then(function () { alert('已退订'); location.reload(); });
  }
  API.addon.list().then(function (d) {
    document.getElementById('avail').innerHTML = (d.available || []).map(availCell).join('');
    document.getElementById('subscribed').innerHTML = (d.subscribed || []).map(subCell).join('');
  });
</script>
</body>
</html>
