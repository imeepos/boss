<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单详情 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="orders.html"></div>

  <div class="card">
    <div class="c-title" id="o-title">加载中…</div>
    <div class="cell"><div class="main"><div class="t">产品</div></div><div class="right" id="o-product">—</div></div>
    <div class="cell"><div class="main"><div class="t">安装地址</div></div><div class="right" id="o-address">—</div></div>
    <div class="cell"><div class="main"><div class="t">下单时间</div></div><div class="right" id="o-time">—</div></div>
    <div class="cell"><div class="main"><div class="t">装维师傅</div></div><div class="right" id="o-tech">—</div></div>
  </div>

  <div class="card">
    <div class="c-title">装维进度（12 环节）<span class="more" id="o-progress" data-i18n="user.order.text1">—</span></div>
    <div class="timeline" id="o-timeline"></div>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <button class="btn" style="flex:1;" onclick="location.href='move.html'" data-i18n="user.order.text2">变更地址</button>
    <a class="btn" style="flex:1;" href="tel:1388899" data-i18n="user.order.text3">联系师傅</a>
    <button class="btn btn-primary" style="flex:1;" onclick="urge()" data-i18n="user.order.text4">催单</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var orderNo = getQuery('no') || 'ORD-20250817-001';
  function getQuery(k) { return new URLSearchParams(location.search).get(k); }

  function itemCss(result) {
    if (result === 'DONE') return 'done';
    if (result === 'DOING') return '';
    return '';
  }
  function nodeCss(result) {
    return result === 'DONE' ? 'node done' : (result === 'DOING' ? 'node doing' : 'node');
  }
  function tlItem(t, idx, total) {
    var itemCls = t.result === 'DONE' ? 'tl-item done' : 'tl-item';
    var hasLine = idx < total - 1 ? '<span class="line"></span>' : '';
    return '<div class="' + itemCls + '"><div class="rail"><span class="' + nodeCss(t.result) + '"></span>' + hasLine + '</div>'
      + '<div class="body"><div class="t">' + t.stage + ' ' + t.title + '</div>'
      + '<div class="meta">' + t.meta + '</div></div></div>';
  }

  API.order.detail(orderNo).then(function (d) {
    var o = d.order || {};
    document.getElementById('o-title').innerHTML = o.orderNo + ' <span class="tag tag-blue" data-i18n="user.order.text5">' + o.statusLabel + '</span>';
    document.getElementById('o-product').textContent = o.productName || '—';
    document.getElementById('o-address').textContent = o.address || '—';
    document.getElementById('o-time').textContent = d.submitedAt || '—';
    document.getElementById('o-tech').textContent = (d.technicianName || '—') + (d.technicianPhoneMasked ? ' · ' + d.technicianPhoneMasked : '');
    document.getElementById('o-progress').textContent = (d.completedStage || 0) + '/12 已完成 · 含合同收费';
    var tl = d.timeline || [];
    document.getElementById('o-timeline').innerHTML = tl.map(function (t, i) { return tlItem(t, i, tl.length); }).join('');
  }).catch(function () {});

  function cancelOrder() {
    if (confirm('确认取消该订单？取消后将释放预占端口并关闭订单。')) {
      API.order.cancel(orderNo).then(function () { location.href = 'orders.html'; });
    }
  }
  function urge() {
    API.order.urge(orderNo).then(function () { alert('已催单，装维师傅将尽快处理，进度更新见消息中心。'); });
  }
</script>
</body>
</html>
