<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
<style>
  .chat{display:flex;flex-direction:column;gap:10px;padding:12px 0;}
  .bubble{max-width:78%;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.5;}
  .bot{background:#f0f4f8;align-self:flex-start;border-top-left-radius:2px;}
  .me{background:var(--primary);color:#fff;align-self:flex-end;border-top-right-radius:2px;}
  .chat-input{display:flex;gap:8px;margin-top:10px;}
  .chat-input input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
</style>
</head>
<body>
<div class="app" style="padding-bottom:90px;">
  <div id="header" data-back="home.html"></div>

  <div class="card">
    <div class="c-title">智能客服 <span class="tag tag-green">在线</span></div>
    <div class="chat" id="chat">
      <div class="bubble bot">您好，我是智能客服小维。可为您解答账单、套餐、报障等问题，输入「人工」可转接人工坐席。</div>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="输入你的问题…" onkeydown="if(event.key==='Enter')send()">
      <button class="btn btn-primary" onclick="send()">发送</button>
    </div>
  </div>

  <div class="card">
    <div class="c-title">常见问题 <span class="more" onclick="location.href='help.html'">更多</span></div>
    <div id="faq"></div>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function bubble(cls, text) {
    var d = document.createElement('div');
    d.className = 'bubble ' + cls;
    d.textContent = text;
    return d;
  }
  function send() {
    var input = document.getElementById('input');
    var msg = input.value.trim();
    if (!msg) return;
    document.getElementById('chat').appendChild(bubble('me', msg));
    input.value = '';
    API.service.chat(msg).then(function (r) {
      document.getElementById('chat').appendChild(bubble('bot', r.reply));
      if (r.toHuman) document.getElementById('chat').appendChild(bubble('bot', '正在为您转接人工坐席…'));
    });
  }
  API.service.faq().then(function (d) {
    document.getElementById('faq').innerHTML = (d.items || []).map(function (f) {
      return '<div class="cell"><div class="main"><div class="t">' + f.question + '</div></div><div class="right">›</div></div>';
    }).join('');
  });
</script>
</body>
</html>
