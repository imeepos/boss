<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>电子发票 · 装维平台用户端</title>

</head>
<body>
<div class="app">

    <a class="back" href="bills.html">&lsaquo;</a>

  <div class="card">

  <div class="card">

  </div>

    <div class="c-title">开票记录</div>
    <div class="cell"><div class="main"><div class="t">2025-07 账期 · ¥158.00</div><div class="d">2025-07-26 开票</div></div><div class="right"><a href="#">下载 PDF</a></div></div>
  </div>
