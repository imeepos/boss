<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭地址 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="profile.html"></div>

  <div class="card" id="addr-list"></div>

  <div class="card">
    <div class="c-title">新增地址</div>
    <div class="field">
      <label data-i18n="user.address.text1">小区 / 楼盘</label>
      <input type="text" id="community" placeholder="请输入小区名">
    </div>
    <div class="field">
      <label data-i18n="user.address.text2">楼栋</label>
      <input type="text" id="building" placeholder="楼栋号">
    </div>
    <div class="field">
      <label data-i18n="user.address.text3">门牌号</label>
      <input type="text" id="door" placeholder="单元/房间号">
    </div>
    <div class="field">
      <label data-i18n="user.address.text4">联系人 / 电话</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="contact" placeholder="联系人" style="flex:1;">
        <input type="tel" id="phone" placeholder="联系电话" style="flex:1.4;">
      </div>
    </div>
    <button class="btn-block" onclick="save()" data-i18n="user.address.text5">保存地址</button>
  </div>

  <div class="muted" style="text-align:center;font-size:12px;margin:0 14px;">地址须挂接到小区/楼栋层级，用于资源核查与装维上门。</div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function cell(a) {
    return '<div class="cell"><div class="main"><div class="t">' + a.label + '</div>'
      + '<div class="d">' + (a.isDefault ? '默认安装地址' : '备用地址') + ' · ' + a.contact + ' · ' + a.phoneMasked + '</div></div>'
      + '<div class="right"><span class="tag ' + (a.isDefault ? 'tag-green" data-i18n="user.address.text6">默认' : 'tag-gray">备用') + '</span></div></div>';
  }
  API.misc.addresses().then(function (d) {
    document.getElementById('addr-list').innerHTML = (d.items || []).map(cell).join('');
  }).catch(function () {
    API.profile.get().then(function (d) {
      document.getElementById('addr-list').innerHTML = (d.addresses || []).map(cell).join('');
    });
  });
  function save() {
    var payload = {
      community: document.getElementById('community').value,
      building: document.getElementById('building').value,
      door: document.getElementById('door').value,
      contact: document.getElementById('contact').value,
    };
    API.misc.createAddress(payload).then(function () { alert('已保存'); location.reload(); });
  }
</script>
</body>
</html>
