<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="home-head" style="padding-bottom:24px;">
    <div class="hi" style="align-items:center;gap:12px;">
      <span style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);
        display:inline-flex;align-items:center;justify-content:center;font-size:20px;" id="avatar" data-i18n="user.profile.text1">王</span>
      <span id="hi-name">加载中…<span id="hi-phone" style="display:block;font-size:12.5px;font-weight:400;opacity:.85;"></span></span>
    </div>
  </div>

  <div class="card">
    <div class="c-title">实名信息 <a class="more" href="security.html" data-i18n="user.profile.text2">账号安全</a></div>
    <a class="cell" href="verify.html" style="color:inherit;"><div class="main"><div class="t">姓名</div></div><div class="right" id="real-name-masked">—</div></a>
    <a class="cell" href="verify.html" style="color:inherit;"><div class="main"><div class="t">证件</div></div><div class="right" id="real-id-masked">—</div></a>
    <a class="cell" href="verify.html" style="color:inherit;"><div class="main"><div class="t">核验记录</div></div><div class="right" id="real-status">— · ›</div></a>
  </div>

  <div class="card">
    <div class="c-title">家庭地址 <a class="more" href="address.html" data-i18n="user.profile.text3">管理</a></div>
    <div id="addresses"></div>
  </div>

  <div class="card">
    <div class="c-title">我的套餐 <a class="more" href="myplan.html" data-i18n="user.profile.text4">详情</a></div>
    <a class="cell" href="myplan.html" style="color:inherit;">
      <div class="main"><div class="t" id="plan-name">—</div><div class="d" id="plan-desc">—</div></div>
      <div class="right"><span class="tag tag-green" data-i18n="user.profile.text5">在网</span></div>
    </a>
  </div>

  <div class="card">
    <div class="c-title">我的服务</div>
    <a class="cell" href="orders.html"><div class="main"><div class="t">我的订单</div></div><div class="right">›</div></a>
    <a class="cell" href="bills.html"><div class="main"><div class="t">我的账单</div></div><div class="right">›</div></a>
    <a class="cell" href="pay.html"><div class="main"><div class="t">缴费记录</div></div><div class="right">›</div></a>
    <a class="cell" href="fault.html"><div class="main"><div class="t">报障记录</div></div><div class="right">›</div></a>
    <a class="cell" href="messages.html"><div class="main"><div class="t">消息中心</div></div><div class="right">›</div></a>
    <a class="cell" href="coupon.html"><div class="main"><div class="t">优惠券与活动</div></div><div class="right">›</div></a>
    <a class="cell" href="invoice.html"><div class="main"><div class="t">电子发票</div></div><div class="right">›</div></a>
  </div>

  <div class="card">
    <div class="c-title">账号与设置</div>
    <a class="cell" href="security.html"><div class="main"><div class="t">账号安全</div></div><div class="right">›</div></a>
    <a class="cell" href="notify.html"><div class="main"><div class="t">通知订阅设置</div></div><div class="right">›</div></a>
    <a class="cell" href="complaint.html"><div class="main"><div class="t">投诉与建议</div></div><div class="right">›</div></a>
    <a class="cell" href="help.html"><div class="main"><div class="t">帮助中心</div></div><div class="right">›</div></a>
    <a class="cell" href="agreement.html"><div class="main"><div class="t">用户协议与隐私</div></div><div class="right">›</div></a>
  </div>

  <div class="card">
    <div class="c-title">语言 / Language <span class="tag tag-gray" data-i18n="user.profile.text6">中/EN/菲</span></div>
    <div class="seg" style="margin:0;">
      <a class="active" onclick="setLang('zh')" data-i18n="user.profile.text7">中文</a>
      <a onclick="setLang('en')" data-i18n="user.profile.text8">English</a>
      <a onclick="setLang('fil')" data-i18n="user.profile.text9">Filipino</a>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px;">界面三语由品牌/区域默认语言配置驱动，切换后 3 秒内生效。</div>
  </div>

  <div class="card" style="text-align:center;">
    <button class="btn" style="width:100%;" onclick="logout()" data-i18n="user.profile.text10">退出登录</button>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.zh-CN.js"></script>
<script src="locale.en-US.js"></script>
<script src="locale.ms-MY.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function addrCell(a) {
    return '<a class="cell" href="address.html" style="color:inherit;"><div class="main"><div class="t">'
      + a.label + '</div><div class="d">' + (a.isDefault ? '默认安装地址' : '备用地址') + '</div></div>'
      + '<div class="right"><span class="tag ' + (a.isDefault ? 'tag-green" data-i18n="user.profile.text11">在用' : 'tag-gray">未用') + '</span></div></a>';
  }
  function setLang(lang) {
    API.profile.setLanguage(lang).then(function () {
      document.querySelectorAll('.seg a').forEach(function (a, i) {
        a.className = (['zh', 'en', 'fil'][i] === lang) ? 'active' : '';
      });
    });
  }
  function logout() {
    API.auth.logout().finally(function () {
      API.setToken('');
      location.href = 'login.html';
    });
  }

  API.profile.get().then(function (d) {
    document.getElementById('avatar').textContent = (d.name || '王').charAt(0);
    document.getElementById('hi-name').firstChild.textContent = d.name || '';
    document.getElementById('hi-phone').textContent = d.phoneMasked || '';
    var rn = d.realName || {};
    document.getElementById('real-name-masked').textContent = rn.nameMasked || '—';
    document.getElementById('real-id-masked').textContent = (rn.idType || '') + ' ' + (rn.idNoMasked || '');
    document.getElementById('real-status').textContent = (rn.status === 'VERIFIED' ? '已实名' : '待补登') + ' · ›';
    document.getElementById('addresses').innerHTML = (d.addresses || []).map(addrCell).join('');
    var pl = d.plan || {};
    document.getElementById('plan-name').textContent = pl.name || '—';
    document.getElementById('plan-desc').textContent = '¥' + (pl.monthlyFee || '—') + '/月 · 合约至 ' + (pl.contractEnd || '—');
  }).catch(function () {});
</script>
</body>
</html>
