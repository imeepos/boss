<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缴费凭证 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="pay.html"></div>

  <div class="card" style="text-align:center;">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px;">电子缴费凭证</div>
    <div class="muted" style="font-size:12px;" id="receipt-no">—</div>
    <div class="cell" style="margin-top:16px;text-align:left;">
      <div class="main"><div class="t">客户</div></div><div class="right" id="r-customer">—</div>
    </div>
    <div class="cell" style="text-align:left;">
      <div class="main"><div class="t">缴费金额</div></div><div class="right amount" id="r-amount">¥—</div>
    </div>
    <div class="cell" style="text-align:left;">
      <div class="main"><div class="t">对应账期</div></div><div class="right" id="r-period">—</div>
    </div>
    <div class="cell" style="text-align:left;">
      <div class="main"><div class="t">支付方式 / 时间</div></div><div class="right" id="r-method">—</div>
    </div>
    <div class="cell" style="text-align:left;">
      <div class="main"><div class="t">交易单号</div></div><div class="right" id="r-payno">—</div>
    </div>
  </div>

  <div style="margin:12px 14px 0;">
    <button class="btn-block" data-i18n="user.receipt.text1">下载凭证（PDF）</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var payNo = new URLSearchParams(location.search).get('no') || 'PAY20250817001';
  API.payment.receipt(payNo).then(function (r) {
    document.getElementById('receipt-no').textContent = r.receiptNo;
    document.getElementById('r-customer').textContent = r.customerName + ' · ' + r.phoneMasked;
    document.getElementById('r-amount').textContent = '¥' + r.amount.toFixed(2);
    document.getElementById('r-period').textContent = r.period;
    document.getElementById('r-method').textContent = r.payMethod + ' · ' + r.paidAt;
    document.getElementById('r-payno').textContent = r.payNo;
  }).catch(function () {});
</script>
</body>
</html>
