<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套餐详情 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="products.html"></div>

  <div class="card" style="border:1px solid var(--primary);" id="detail-card">
    <div class="c-title" id="p-title">加载中…</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;" id="p-desc">—</div>
    <div id="p-specs"></div>
  </div>

  <div class="card">
    <div class="c-title">套餐对比 <span class="more" data-i18n="user.product.text1">同档可选</span></div>
    <div id="p-compare"></div>
  </div>

  <div class="card">
    <div class="c-title">合约与说明</div>
    <div class="muted" style="font-size:12.5px;line-height:1.7;">合约期内退订按未履约月份收取违约金；改套餐当月按新旧价按日折算（pro-rata）。</div>
  </div>

  <div style="margin:12px 14px 0;">
    <button class="btn-block" id="p-cta" onclick="orderNow()" data-i18n="user.product.text2">立即办理</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  var currentId = getQuery('id') || 'P-1000';
  var product = null;
  function getQuery(k) {
    return new URLSearchParams(location.search).get(k);
  }
  function specCell(s) {
    return '<div class="cell"><div class="main"><div class="t">' + s.label + '</div></div><div class="right">' + s.value + '</div></div>';
  }
  function cmpCell(p) {
    return '<div class="cell"><div class="main"><div class="t">' + p.name + '</div><div class="d">'
      + p.description + '</div></div><div class="right"><button class="btn" onclick="location.href=\'product.html?id=' + p.productId + '\'" data-i18n="user.product.text3">查看</button></div></div>';
  }
  function orderNow() {
    API.order.submit({ productId: currentId, addressId: 'ADDR-001' }).then(function (o) {
      location.href = 'order.html?no=' + encodeURIComponent(o.orderNo);
    });
  }

  API.product.detail(currentId).then(function (d) {
    product = d.product;
    document.getElementById('p-title').innerHTML = product.name + ' <span class="tag tag-orange" data-i18n="user.product.text4">¥' + product.monthlyFee + '/月</span>';
    document.getElementById('p-desc').textContent = product.description;
    document.getElementById('p-specs').innerHTML = (d.specs || []).map(specCell).join('');
    document.getElementById('p-compare').innerHTML = (d.compare || []).map(cmpCell).join('');
    document.getElementById('p-cta').textContent = '立即办理 ¥' + product.monthlyFee + '/月';
  }).catch(function () {});
</script>
</body>
</html>
