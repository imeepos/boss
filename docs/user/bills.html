<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的账单 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="home.html"></div>

  <div class="card" style="text-align:center;">
    <div class="muted" style="font-size:12.5px;" id="due-label">当前应缴</div>
    <div class="amount" style="font-size:30px;font-weight:700;margin:6px 0;" id="due-amount">¥—</div>
    <button class="btn btn-primary" onclick="location.href='pay.html'" data-i18n="user.bills.text1">立即缴费</button>
    <button class="btn" style="margin-left:8px;" onclick="location.href='topup.html'" data-i18n="user.bills.text2">余额充值</button>
  </div>

  <div class="seg" id="tabs">
    <a class="active" onclick="filterList('')" data-i18n="user.bills.text3">近 6 期</a>
    <a onclick="filterList('paid')" data-i18n="user.bills.text4">已缴</a>
    <a onclick="filterList('unpaid')" data-i18n="user.bills.text5">未缴</a>
  </div>

  <div class="card" id="bill-list"></div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="locale.zh-CN.js"></script>
<script src="locale.en-US.js"></script>
<script src="locale.ms-MY.js"></script>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function cell(b) {
    var tag = b.status === 'PAID' ? 'tag-green' : 'tag-orange';
    return '<a class="cell" href="bill.html?no=' + encodeURIComponent(b.billNo) + '" style="color:inherit;">'
      + '<div class="main"><div class="t">' + b.period + ' 账期</div><div class="d">' + b.productName + ' · ' + b.periodRange + '</div></div>'
      + '<div class="right"><div class="amt amount">¥' + b.amount + '</div><span class="tag ' + tag + '" data-i18n="user.bills.text6">' + b.statusLabel + '</span></div></a>';
  }
  function filterList(k) {
    document.querySelectorAll('#tabs a').forEach(function (a, i) { a.className = (['', 'paid', 'unpaid'][i] === k) ? 'active' : ''; });
    render(k);
  }
  function render(k) {
    API.bill.list().then(function (d) {
      document.getElementById('due-label').textContent = '当前应缴（' + d.currentPeriod + ' 账期）';
      document.getElementById('due-amount').textContent = '¥' + d.currentDue.toFixed(2);
      var items = d.items || [];
      if (k === 'paid') items = items.filter(function (b) { return b.status === 'PAID'; });
      if (k === 'unpaid') items = items.filter(function (b) { return b.status !== 'PAID'; });
      document.getElementById('bill-list').innerHTML = items.map(cell).join('');
    });
  }
  render('');
</script>
</body>
</html>
