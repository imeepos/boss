<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息中心 · 装维平台用户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="header" data-back="home.html"></div>

  <div class="seg" id="tabs">
    <a class="active" onclick="filterList('')">全部</a>
    <a onclick="filterList('billing')">账单缴费</a>
    <a onclick="filterList('balance')">余额预警</a>
    <a onclick="filterList('fault')">故障公告</a>
    <a onclick="filterList('promo')">优惠活动</a>
  </div>

  <div class="card" id="msg-list"></div>

  <div class="card" style="text-align:center;">
    <button class="btn" style="width:100%;" onclick="readAll()">全部标为已读</button>
  </div>
  <div id="tabbar"></div>
</div>
<script src="header.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script>
  function tagCss(level) {
    return { balance: 'tag-orange', bill: 'tag-orange', fault: 'tag-gray', promo: 'tag-red', info: 'tag-blue' }[level] || 'tag-gray';
  }
  function hrefOf(m) {
    if (m.category === 'balance') return 'topup.html';
    if (m.category === 'fault') return 'faultdetail.html';
    if (m.category === 'promo') return 'coupon.html';
    return 'bill.html';
  }
  function cell(m) {
    return '<a class="cell" href="' + hrefOf(m) + '" style="color:inherit;">'
      + '<div class="main"><div class="t">' + m.title + '</div><div class="d">' + m.content + '</div></div>'
      + '<div class="right"><span class="tag ' + tagCss(m.tagLevel) + '">' + m.tag + '</span></div></a>';
  }
  function filterList(k) {
    document.querySelectorAll('#tabs a').forEach(function (a, i) { a.className = (['', 'billing', 'balance', 'fault', 'promo'][i] === k) ? 'active' : ''; });
    render(k);
  }
  function render(k) {
    API.misc.messages().then(function (d) {
      var items = d.items || [];
      if (k) items = items.filter(function (m) { return m.category === k; });
      document.getElementById('msg-list').innerHTML = items.map(cell).join('');
    });
  }
  function readAll() {
    API.misc.readAllMessages().then(function () { alert('已全部标为已读'); render(''); });
  }
  render('');
</script>
</body>
</html>
