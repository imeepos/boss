<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修复工单 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">修复工单</div>
    <span class="act" onclick="location.href='service.html'">联系调度</span>
  </div>

  <div class="card">
    <div class="c-title" id="rc-title">修复工单</div>
    <div id="rc-fields"></div>
  </div>

  <div class="card" id="diag-card">
    <div class="c-title">远程诊断 <span class="more">结果可查</span></div>
    <div class="msg-banner ok" id="diag-body"></div>
  </div>

  <div class="card">
    <div class="c-title" id="rtl-title">修复流程</div>
    <div class="timeline" id="rtl-body"></div>
    <div id="rtl-err" class="notice" style="display:none;margin-top:12px;">进度加载失败，请刷新重试。</div>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <a class="btn" style="flex:1;" href="navi.html">一键导航</a>
    <a class="btn" style="flex:1;" href="checkin.html">到点签到</a>
    <a class="btn" style="flex:1;" id="rbtn-call" href="tel:" onclick="return confirm('即将拨打客户，确认拨号？')">联系客户</a>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <button class="btn" style="flex:1;" onclick="location.href='tool.html'">现场测速</button>
    <button class="btn" style="flex:1;" onclick="reportRepair()">上报修复</button>
  </div>

  <div class="card">
    <div class="notice">上报修复后系统自动复核网络是否恢复；未恢复将回「处理中」，恢复则关闭并触发满意度回访。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';
  var ES = { DONE: 'done', DOING: 'doing', PENDING: '' };

  function fix(n, d) { if (n === undefined || n === null || n === '') return d; return n; }

  function tagCls(st) {
    if (st === 'DOING') return 'tag-red';
    if (st === 'DONE') return 'tag-green';
    return 'tag-blue';
  }

  function tlItem(s) {
    var cls = 'tl-item ' + ES[s.result];
    var node = ES[s.result] ? 'node ' + ES[s.result] : 'node';
    var rail = '<span class="' + node + '"></span><span class="line"></span>';
    var meta = fix(s.note, '');
    if (s.finishedAt) meta = s.finishedAt + (meta ? ' · ' + meta : '');
    return '<div class="' + cls + '"><div class="rail">' + rail + '</div>'
      + '<div class="body"><div class="t">' + s.stage + ' ' + s.name + '</div><div class="meta">' + meta + '</div></div></div>';
  }

  function doneCount(stages) {
    var n = 0;
    (stages || []).forEach(function (s) { if (s.result === 'DONE') n++; });
    return n;
  }

  function field(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

  function showErr() {
    document.getElementById('rc-title').textContent = NO;
    document.getElementById('rc-fields').innerHTML = '<div class="notice">工单加载失败，请刷新重试。</div>';
    document.getElementById('diag-card').style.display = 'none';
    document.getElementById('rtl-title').textContent = '修复流程';
    document.getElementById('rtl-err').style.display = '';
  }

  function renderDetail(d) {
    document.getElementById('rc-title').innerHTML = fix(d.ticketNo, NO) + ' <span class="tag ' + tagCls(d.status) + '">' + fix(d.statusLabel, '') + '</span>';
    var fields = '';
    fields += field('故障类型', fix(d.faultTypeLabel, '-'));
    fields += field('客户', fix(d.customerName, '-') + ' · ' + fix(d.customerPhoneMasked, '-'));
    fields += field('报障时间', fix(d.reportedAt, '-'));
    fields += field('SLA 剩余', '<span style="color:var(--err);">' + (d.slaLeftMinutes !== null && d.slaLeftMinutes !== undefined ? d.slaLeftMinutes + ' 分钟' : '-') + '</span>');
    fields += field('地址', fix(d.address, '-'));
    fields += field('分光器/端口', fix(d.splitterPort, '-'));
    document.getElementById('rc-fields').innerHTML = fields;
    document.getElementById('rbtn-call').setAttribute('href', 'tel:' + (d.customerPhoneMasked || '').replace(/\*/g, ''));
    if (d.remoteDiagnosis) { document.getElementById('diag-body').textContent = d.remoteDiagnosis; }
    else { document.getElementById('diag-card').style.display = 'none'; }
    renderTimeline(d.stages);
  }

  function renderTimeline(stages) {
    var list = stages || [];
    var done = doneCount(list);
    document.getElementById('rtl-title').innerHTML = '修复流程（' + list.length + ' 环节）<span class="more">报障闭环</span>';
    document.getElementById('rtl-body').innerHTML = list.map(tlItem).join('');
  }

  window.reportRepair = function () {
    API.ticket.repairReport(NO, 'FIXED', '').then(function (r) {
      var msg = (r && r.reviewPassed) ? '网络已恢复，工单关闭，系统自动复核通过。' : '结果已上报，系统复核中。';
      alert(msg);
      location.href = 'orders.html';
    }).catch(function () { alert('上报失败，请重试。'); });
  };

  API.ticket.detail(NO).then(renderDetail).catch(showErr);
})();
</script>
</body>
</html>
