<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现场收款 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.charge" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">现场收款</div>
    <span class="act">凭证</span>
  </div>

  <div class="card">
    <div class="c-title" id="ticketTitle">加载中…</div>
    <div class="kv"><span class="k">应收</span><span class="v" id="chargeDue">--</span></div>
    <div class="kv"><span class="k">收款方式</span><span class="v" id="chargeMethods">--</span></div>
  </div>

  <div class="card">
    <div class="fld">
      <label>实收金额</label>
      <input type="text" id="amount" value="" placeholder="¥">
    </div>
    <div class="fld">
      <label>支付方式</label>
      <select id="payMethod">
        <option>扫码支付</option>
        <option>现金</option>
        <option>POS</option>
      </select>
    </div>
    <button class="btn-green btn-block" onclick="submitCharge()">确认收款并签收</button>
    <div id="tip" class="hint muted" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="notice">收款到账即时更新账务，缴费凭证同步生成电子收据。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function showTip(msg) {
  var el = document.getElementById('tip');
  el.textContent = msg;
  el.style.display = (msg ? 'block' : 'none');
}

function renderCharge(c) {
  document.getElementById('ticketTitle').textContent = c.ticketNo || NO;
  document.getElementById('chargeDue').textContent = '¥' + (c.amountDue || 0) + (c.amountDesc ? '（' + c.amountDesc + '）' : '');
  document.getElementById('chargeMethods').textContent = (c.payMethods || []).join(' / ');
  document.getElementById('amount').value = c.amountDue || '';
  var m = c.payMethods || [];
  var sel = document.getElementById('payMethod');
  sel.innerHTML = m.map(function (x) { return '<option>' + x + '</option>'; }).join('');
}

API.scan.charge(NO).then(renderCharge).catch(function (e) {
  document.getElementById('ticketTitle').textContent = NO;
  showTip('应收信息加载失败：' + (e && e.message) + '，请重试。');
});

function submitCharge() {
  var amount = Number(document.getElementById('amount').value);
  var payMethod = document.getElementById('payMethod').value;
  if (!amount || amount <= 0) { showTip('请填写有效的实收金额。'); return; }
  showTip('提交中…');
  API.scan.submitCharge(NO, amount, payMethod).then(function () {
    location.href = 'sign.html?no=' + NO;
  }).catch(function (e) {
    showTip('收款提交失败：' + (e && e.message) + '，请重试。');
  });
}
</script>
</body>
</html>
