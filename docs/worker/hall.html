<!DOCTYPE html>
<html lang="zh-CN">
<head>

</head>

  <div class="card">

      </div>
      <div class="right"><button class="btn btn-primary" style="padding:6px 12px;" onclick="this.textContent='已抢';this.disabled=true;this.classList.remove('btn-primary');this.parentNode.parentNode.querySelector('.main .t').innerHTML='<a href=repair.html>EMG-20250817-001 · 台风批量复测</a>';">抢单</button></div>
    </div>

    <div class="cell">
      <div class="main">
        <div class="t">TKT-20250817-006 · 抢修</div>
        <div class="d">望京X · 8栋 · 断网 · 距您 1.2km</div>
      </div>
      <div class="right"><button class="btn btn-primary" style="padding:6px 12px;" onclick="this.textContent='已抢';this.disabled=true;this.classList.remove('btn-primary');this.parentNode.parentNode.querySelector('.main .t').innerHTML='<a href=repair.html>TKT-20250817-006 · 抢修</a>';">抢单</button></div>
    </div>

    <div class="cell">
      <div class="main">
        <div class="t">ORD-20250817-007 · 新装</div>

    </div>

    <div class="cell">
      <div class="main">
        <div class="t">ORD-20250817-008 · 变更</div>
        <div class="d">望京X · 4栋 · 距您 3.5km</div>
      </div>
      <div class="right"><button class="btn btn-primary" style="padding:6px 12px;" onclick="this.textContent='已抢';this.disabled=true;this.classList.remove('btn-primary');">抢单</button></div>
    </div>
  </div>

  <div class="card">
    <div class="notice">任务池按区域与技能公开，先到先得；抢单后进入「我的工单」。</div>
  </div>

  <div id="tabbar"></div>
</div>
