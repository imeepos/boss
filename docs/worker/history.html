<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史工单 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">历史工单</div>
    <span class="act">筛选</span>
  </div>

  <div class="seg">
    <a class="active" data-period="month" href="javascript:;">本月</a>
    <a data-period="last-month" href="javascript:;">上月</a>
    <a data-period="all" href="javascript:;">全部</a>
  </div>

  <div class="card" id="listCard"></div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var periodLabels = { 'month': '本月', 'last-month': '上月', 'all': '全部' };

function render(d, period) {
  var items = d.items || [];
  var title = periodLabels[period] + ' · ' + (items.length || d.totalCount) + ' 单';
  var html = '<div class="c-title">' + title + '</div>';
  items.forEach(function (it) {
    html += '<a class="cell" href="order.html?no=' + it.ticketNo + '">' +
      '<div class="main"><div class="t">' + it.ticketNo + ' · ' + it.typeLabel + '</div>' +
      '<div class="d">' + it.address + ' · ' + it.finishedAt + '</div></div>' +
      '<div class="right"><span class="tag tag-green">' + it.statusLabel + '</span></div></a>';
  });
  document.getElementById('listCard').innerHTML = html;
}

function load(period) {
  var segs = document.querySelectorAll('.seg a');
  for (var i = 0; i < segs.length; i++) {
    segs[i].className = segs[i].getAttribute('data-period') === period ? 'active' : '';
  }
  API.ticket.history(period).then(function (d) {
    render(d, period);
  }).catch(function (e) {
    alert('历史工单加载失败：' + e.message);
  });
}

var segs = document.querySelectorAll('.seg a');
for (var j = 0; j < segs.length; j++) {
  segs[j].addEventListener('click', function () {
    load(this.getAttribute('data-period'));
  });
}

load('month');
</script>
</body>
</html>
