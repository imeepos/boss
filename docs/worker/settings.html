<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接单设置 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">接单设置</div>
    <span class="act">保存</span>
  </div>

  <div class="card">
    <div class="kv"><span class="k">接单状态</span><span class="v"><button class="btn btn-primary" style="padding:5px 10px;" onclick="this.textContent=this.textContent==='在线接单'?'已停接单':'在线接单';">在线接单</button></span></div>
    <div class="kv"><span class="k">接单半径</span><span class="v">5 km</span></div>
    <div class="kv"><span class="k">接单类型</span><span class="v">新装 / 变更 / 抢修</span></div>
  </div>

  <div class="card">
    <div class="c-title">能接单类型</div>
    <div class="fld"><label><input type="checkbox" checked> 新装宽带</label></div>
    <div class="fld"><label><input type="checkbox" checked> 宽带变更</label></div>
    <div class="fld"><label><input type="checkbox" checked> 拆机</label></div>
    <div class="fld"><label><input type="checkbox"> 抢修（需资质）</label></div>
  </div>

  <div class="card">
    <div class="notice">停止接单后不再派发新工单，进行中工单不受影响。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
