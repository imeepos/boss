<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码绑定 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="order.html">&lsaquo;</a>
    <div class="t">扫码绑定（环节 9）</div>
    <span class="act" id="net-state">在线</span>
  </div>

  <div class="card" id="info-card">
    <div class="c-title" id="ticket-no">加载中… <span class="tag tag-blue" id="ticket-status">待扫码绑定</span></div>
    <div class="kv"><span class="k">预绑定标签</span><span class="v" id="pre-bind-tag">-</span></div>
    <div class="kv"><span class="k">客户</span><span class="v" id="customer">-</span></div>
    <div class="kv"><span class="k">安装地址</span><span class="v" id="address">-</span></div>
    <div class="kv"><span class="k">分光器/端口</span><span class="v" id="port">-</span></div>
  </div>

  <div class="card" style="text-align:center;" id="scan-card">
    <div class="c-title" style="justify-content:center;">请扫描光猫电子标签</div>
    <div class="scan-frame">
      <div class="glyph">▣</div>
      <div class="hint">将取景框对准光猫机身电子标签</div>
      <div class="hint muted">支持 LF / HF / UHF 频段 · 弱网自动离线缓存</div>
    </div>
    <button class="btn-primary btn-block" onclick="doBind('EPC-0001', false)">模拟扫码</button>
    <button class="btn btn-block ghost" style="margin-top:8px;" onclick="doBind('EPC-9999', false)">模拟「不符」</button>
    <button class="btn btn-block ghost" style="margin-top:8px;" onclick="doBind('EPC-0001', true)">模拟「弱网离线」</button>
  </div>

  <div class="card" style="display:none;" id="result-ok">
    <div class="c-title">扫码结果 <span class="tag tag-green">一致</span></div>
    <div class="notice" style="margin-top:0;" id="msg-ok">-</div>
    <button class="btn-green btn-block" style="margin-top:12px;" onclick="goto('report.html')">继续结果上报</button>
  </div>

  <div class="card" style="display:none;" id="result-bad">
    <div class="c-title">扫码结果 <span class="tag tag-red">不一致</span></div>
    <div class="notice red" style="margin-top:0;" id="msg-bad">-</div>
    <button class="btn btn-block" style="margin-top:12px;" onclick="goto('replace.html')">换件登记</button>
    <button class="btn btn-block ghost" style="margin-top:8px;" onclick="goto('scanabnormal.html')">异常上报</button>
  </div>

  <div class="card" style="display:none;" id="result-offline">
    <div class="c-title">网络状态 <span class="tag tag-orange">弱网离线</span></div>
    <div class="notice" style="margin-top:0;" id="msg-offline">-</div>
    <button class="btn btn-block" style="margin-top:12px;" onclick="goto('scan.html')">重新扫码</button>
  </div>

  <div class="card">
    <div class="notice">绑定结果必须与预绑定标签一致，不一致时绑定将被系统拒绝，请勿用手工数据替代扫码。</div>
  </div>


  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function set(id, text) { document.getElementById(id).textContent = text || '-'; }
function goto(page) { location.href = page.indexOf('?') >= 0 ? page : page + '?no=' + NO; }

function renderInfo(d) {
  set('ticket-no', d.ticketNo);
  set('ticket-status', d.statusLabel);
  set('pre-bind-tag', d.preBindTag);
  set('customer', (d.customerName || '') + ' · ' + (d.customerPhoneMasked || ''));
  set('address', d.address);
  set('port', d.splitterPort);
}

function showCard(kind) {
  ['ok', 'bad', 'offline'].forEach(function (k) {
    document.getElementById('result-' + k).style.display = (k === kind) ? '' : 'none';
  });
}

function showResult(d) {
  document.getElementById('scan-card').style.display = 'none';
  if (d.result === 'MATCH') { set('msg-ok', d.message); showCard('ok'); }
  else if (d.result === 'MISMATCH') { set('msg-bad', d.message); showCard('bad'); }
  else { set('msg-offline', d.message); document.getElementById('net-state').textContent = '弱网'; showCard('offline'); }
}

function doBind(epc, offline) {
  API.scan.bind(NO, epc, offline).then(showResult).catch(function (e) {
    alert('扫码失败：' + (e && e.message ? e.message : e));
  });
}

API.ticket.detail(NO).then(renderInfo).catch(function (e) { alert('加载工单失败：' + e.message); });
</script>
</body>
</html>
