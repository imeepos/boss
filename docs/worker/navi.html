<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.navi" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">一键导航</div>
    <span class="act" id="topDist">距您 --</span>
  </div>

  <div class="card">
    <div class="c-title" id="ticketTitle">加载中…</div>
    <div class="kv"><span class="k">地址</span><span class="v" id="naviAddress">--</span></div>
    <div class="kv"><span class="k">距离</span><span class="v" id="naviDistance">--</span></div>
    <div class="kv"><span class="k">入口</span><span class="v" id="naviEntrance">--</span></div>
  </div>

  <div class="card" style="text-align:center;">
    <div class="scan-frame" style="padding:60px 16px;">
      <div class="glyph">▣</div>
      <div class="hint">地图路线（示意）</div>
      <div class="hint muted">已按实时路况规划最优路线</div>
    </div>
    <button class="btn-primary btn-block" onclick="alert('已拉起地图应用导航（示意）。')">开始导航</button>
    <div id="tip" class="hint muted" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="notice">弱网/无 GPS 时，可在角落手工标注坐标，确位置上图。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function showTip(msg) {
  var el = document.getElementById('tip');
  el.textContent = msg;
  el.style.display = (msg ? 'block' : 'none');
}

function renderNavi(n) {
  document.getElementById('ticketTitle').textContent = NO + ' · 目的地';
  document.getElementById('naviAddress').textContent = n.address || '--';
  document.getElementById('naviDistance').textContent = (n.distanceKm || 0) + 'km · 约 ' + (n.etaMinutes || 0) + ' 分钟';
  document.getElementById('naviEntrance').textContent = n.entrance || '--';
  document.getElementById('topDist').textContent = '距您 ' + (n.distanceKm || 0) + 'km';
}

API.ticket.navi(NO).then(renderNavi).catch(function (e) {
  document.getElementById('ticketTitle').textContent = NO + ' · 目的地';
  showTip('导航信息加载失败：' + (e && e.message) + '，请重试。');
});
</script>
</body>
</html>
