<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="home-head">
    <div class="hi" id="worker-name">工人 <span id="worker-sub" style="font-size:13px;font-weight:400;opacity:.85;"></span>
      <a href="profile.html" style="color:#fff;font-size:18px;">◉</a>
    </div>
    <div class="st-line" id="worker-today"><span class="dot"></span> 今日接单 - · 进行中 - · 待处理 -</div>
  </div>

  <div class="stats-card">
    <div class="row"><span class="title">今日业绩</span><span class="date" id="stats-date">-</span></div>
    <div class="stats">
      <div><div class="v blue" id="stat-accepted">-</div><div class="k">接单</div></div>
      <div><div class="v green" id="stat-finished">-</div><div class="k">已完成</div></div>
      <div><div class="v orange" id="stat-doing">-</div><div class="k">进行中</div></div>
    </div>
  </div>

  <div class="card">
    <div class="c-title" id="ongoing-title">进行中工单 <a class="more" href="orders.html">全部</a></div>
    <div id="ongoing-list"></div>
  </div>

  <div class="card">
    <div class="c-title">待领取工单 <a class="more" href="orders.html">更多</a></div>
    <div id="todo-list"></div>
  </div>

  <div class="card">
    <div class="c-title" id="notice-title">今日提醒 <span class="more"><a href="messages.html">消息中心</a></span></div>
    <div id="notice-list"></div>
  </div>

  <div class="card">
    <div class="c-title">快捷入口</div>
    <div class="grid">
      <a class="gitem" href="schedule.html"><b>排期</b><span>日程</span></a>
      <a class="gitem" href="notice.html"><b>公告</b><span>通告</span></a>
      <a class="gitem" href="hall.html"><b>任务池</b><span>抢单</span></a>
      <a class="gitem" href="help.html"><b>手册</b><span>排障</span></a>
      <a class="gitem" href="tool.html"><b>测速</b><span>工具</span></a>
      <a class="gitem" href="pickup.html"><b>领料</b><span>出库</span></a>
      <a class="gitem" href="safety.html"><b>安全</b><span>上报</span></a>
      <a class="gitem" href="maintenance.html"><b>维护</b><span>清单</span></a>
    </div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  var ES = { DONE: 'done', DOING: 'doing', PENDING: '' };

  function fix(n, d) { if (n === undefined || n === null) return d; return n; }

  function orderType(no) {
    return (no && (no.indexOf('TKT') === 0 || no.indexOf('EMG') === 0)) ? 'repair.html' : 'order.html';
  }

  function tagCls(st) {
    if (st === 'SCAN_PENDING') return 'tag-blue';
    if (st === 'ACCEPTED' || st === 'TODO') return 'tag-orange';
    if (st === 'DOING') return 'tag-red';
    if (st === 'DONE') return 'tag-green';
    return 'tag-blue';
  }

  function cell(it) {
    var no = fix(it.ticketNo, '');
    var sub = '';
    var title = no + ' · ' + fix(it.typeLabel, '');
    var d = fix(it.address, '');
    if (it.distanceKm !== undefined && it.distanceKm !== null) d += ' · 距您 ' + it.distanceKm + 'km';
    var right = '<div class="right"><span class="tag ' + tagCls(it.status) + '">' + fix(it.statusLabel, '') + '</span>';
    if (it.stageTotal !== undefined && it.stageTotal !== null) {
      right += '<div style="margin-top:4px">' + fix(it.stage, '-') + '/' + it.stageTotal + ' 环节</div>';
    }
    right += '</div>';
    return '<a class="cell" href="' + orderType(no) + '?no=' + encodeURIComponent(no) + '">'
      + '<div class="main"><div class="t">' + title + '</div><div class="d">' + d + '</div></div>'
      + right + '</a>';
  }

  function show(id, s) { document.getElementById(id).innerHTML = s; }

  function err() {
    show('ongoing-list', '<div class="notice">数据加载失败，请刷新重试。</div>');
    show('todo-list', '<div class="notice">数据加载失败，请刷新重试。</div>');
    show('notice-list', '<div class="notice">消息加载失败，请刷新重试。</div>');
  }

  function render(d) {
    document.getElementById('worker-name').innerHTML = fix(d.workerName, '工人') + ' <span id="worker-sub" style="font-size:13px;font-weight:400;opacity:.85;">' + fix(d.groupName, '') + ' · ' + fix(d.phoneMasked, '') + '</span>';
    var t = d.today || {};
    document.getElementById('worker-today').innerHTML = '<span class="dot"></span> 今日接单 ' + fix(t.accepted, '-') + ' · 进行中 ' + fix(t.doing, '-') + ' · 待处理 ' + fix(t.todo, '-');
    document.getElementById('stat-accepted').textContent = fix(t.accepted, '-');
    document.getElementById('stat-finished').textContent = fix(t.finished, '-');
    document.getElementById('stat-doing').textContent = fix(t.doing, '-');
    var ong = d.ongoing || [];
    document.getElementById('ongoing-title').innerHTML = '进行中工单 (' + ong.length + ') <a class="more" href="orders.html">全部</a>';
    show('ongoing-list', ong.map(cell).join(''));
    document.getElementById('stats-date').textContent = new Date().toISOString().slice(0, 10).replace(/-/g, '-');
  }

  function showMsg(errMsg) { document.getElementById('notice-list').innerHTML = '<div class="notice">' + errMsg + '</div>'; }

  function loadMessages() {
    API.misc.messages().then(function (m) {
      var items = (m && m.items) || [];
      if (!items.length) { showMsg('暂无提醒'); return; }
      show('notice-list', items.slice(0, 3).map(function (x) {
        return '<div class="kv"><span class="k">' + x.title + '</span><span class="v">' + x.content + '</span></div>';
      }).join(''));
    }).catch(function () { showMsg('消息加载失败，请刷新重试。'); });
  }

  API.home.get().then(render).catch(err);
  loadMessages();
})();
</script>
</body>
</html>
