<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工单详情 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.order" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">工单详情</div>
    <span class="act" onclick="location.href='service.html'">联系调度</span>
  </div>

  <div class="card">
    <div class="c-title" id="oc-title">工单</div>
    <div id="oc-fields"></div>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <a class="btn" style="flex:1;" id="btn-call" href="tel:" onclick="return confirm('即将拨打客户，确认拨号？')">联系客户</a>
    <a class="btn" style="flex:1;" href="navi.html">一键导航</a>
    <a class="btn" style="flex:1;" href="checkin.html">到点签到</a>
  </div>

  <div class="card">
    <div class="c-title" id="tl-title">装维进度</div>
    <div class="timeline" id="tl-body"></div>
    <div id="tl-err" class="notice" style="display:none;margin-top:12px;">进度加载失败，请刷新重试。</div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn" style="flex:1;" onclick="doRollback()">回退上一环节</button>
      <button class="btn" style="flex:1;" onclick="doRetry()">重试失败环节</button>
    </div>
  </div>

  <div class="card">
    <div class="c-title">预绑定四码对照 <span class="more">一致性校验</span></div>
    <div class="quad" id="quad-body"></div>
  </div>

  <div class="card">
    <div class="c-title">风控校验 <span class="more">名单拦截</span></div>
    <div class="kv"><span class="k">黑/灰名单</span><span class="v" id="risk-val" style="color:var(--success);">校验中…</span></div>
    <div class="notice" style="margin-bottom:0;">若命中风控名单，此单将自动拦截或转人工审核，操作全程留痕。</div>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <button class="btn" style="flex:1;" onclick="location.href='scanabnormal.html'">异常上报</button>
    <button class="btn" style="flex:1;" onclick="location.href='transfer.html'">转单/改派</button>
    <a class="btn" style="flex:1;" href="reschedule.html">改约</a>
    <button class="btn btn-primary" style="flex:1;" onclick="location.href='scan.html'">扫码绑定</button>
  </div>

  <div class="card" style="display:flex;gap:10px;">
    <a class="btn" style="flex:1;" href="activate.html">激活重试</a>
    <a class="btn" style="flex:1;" href="dismantle.html">拆机作业</a>
    <a class="btn" style="flex:1;" href="complaint.html">投诉登记</a>
  </div>
  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';
  var ES = { DONE: 'done', DOING: 'doing', PENDING: '' };

  function fix(n, d) { if (n === undefined || n === null || n === '') return d; return n; }

  function tagCls(st) {
    if (st === 'DOING') return 'tag-red';
    if (st === 'DONE') return 'tag-green';
    return 'tag-blue';
  }

  function tlItem(s) {
    var cls = 'tl-item ' + ES[s.result];
    var node = ES[s.result] ? 'node ' + ES[s.result] : 'node';
    var rail = '<span class="' + node + '"></span><span class="line"></span>';
    var meta = fix(s.note, '');
    if (s.finishedAt) meta = s.finishedAt + (meta ? ' · ' + meta : '');
    return '<div class="' + cls + '"><div class="rail">' + rail + '</div>'
      + '<div class="body"><div class="t">' + s.stage + ' ' + s.name + '</div><div class="meta">' + meta + '</div></div></div>';
  }

  function doneCount(stages) {
    var n = 0;
    (stages || []).forEach(function (s) { if (s.result === 'DONE') n++; });
    return n;
  }

  function field(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

  function quadCell(lb, vc, st) {
    return '<div class="qm ok"><div class="lb">' + lb + '</div><div class="vc">' + vc + '</div><div class="st">' + st + '</div></div>';
  }

  function showErr() {
    document.getElementById('oc-title').textContent = NO;
    document.getElementById('oc-fields').innerHTML = '<div class="notice">工单加载失败，请刷新重试。</div>';
    document.getElementById('tl-title').textContent = '装维进度';
    document.getElementById('tl-err').style.display = '';
  }

  function renderDetail(d) {
    document.getElementById('oc-title').innerHTML = fix(d.ticketNo, NO) + ' <span class="tag ' + tagCls(d.status) + '">' + fix(d.statusLabel, '') + '</span>';
    var fields = '';
    fields += field('产品', fix(d.product, '-'));
    fields += field('客户', fix(d.customerName, '-') + ' · ' + fix(d.customerPhoneMasked, '-'));
    fields += field('安装地址', fix(d.address, '-'));
    fields += field('分光器/端口', fix(d.splitterPort, '-'));
    fields += field('预绑定标签', fix(d.preBindTag, '-'));
    fields += field('预约时间', fix(d.scheduleSlot, '-'));
    document.getElementById('oc-fields').innerHTML = fields;
    document.getElementById('btn-call').setAttribute('href', 'tel:' + (d.customerPhoneMasked || '').replace(/\*/g, ''));
    renderTimeline(d.stages, d.stageTotal);
    renderQuad(d.quad);
    renderRisk(d.riskCheck);
  }

  function renderTimeline(stages, total) {
    var list = stages || [];
    var done = doneCount(list);
    document.getElementById('tl-title').innerHTML = '装维进度（' + (total || list.length) + ' 环节）<span class="more">' + done + '/' + (total || list.length) + ' 已完成</span>';
    document.getElementById('tl-body').innerHTML = list.map(tlItem).join('');
  }

  function renderQuad(q) {
    q = q || {};
    var ok = q.matched !== false;
    var status = ('status:' + (q.status || '')).toUpperCase();
    var stText = ok ? '已通过校验' : (status.indexOf('CONFLICT') >= 0 ? '不一致 · 需核实' : '待校验');
    var html = quadCell('资产码', fix(q.assetCode, '-'), stText)
      + quadCell('用户码', fix(q.customerCode, '-'), stText)
      + quadCell('端口码', fix(q.portCode, '-'), stText)
      + quadCell('地址码', fix(q.addrCode, '-'), stText);
    document.getElementById('quad-body').innerHTML = html;
  }

  function renderRisk(rk) {
    rk = rk || {};
    var el = document.getElementById('risk-val');
    if (rk.blacklistHit || rk.graylistHit) { el.textContent = '已命中，自动拦截或转人工审核'; el.style.color = 'var(--err)'; }
    else { el.textContent = '未命中，可正常装维'; el.style.color = 'var(--success)'; }
  }

  function act(method, okMsg) {
    method(NO).then(function (r) { alert((r && r.message) || okMsg); }).catch(function () { alert('操作失败，请重试。'); });
  }
  window.doRollback = function () { act(API.ticket.rollback, '已回退上一环节'); };
  window.doRetry = function () { act(API.ticket.retry, '已重试失败环节'); };

  API.ticket.detail(NO).then(renderDetail).catch(showErr);
})();
</script>
</body>
</html>
