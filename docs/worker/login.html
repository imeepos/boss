<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="home-head">
    <div class="hi">装维平台 · 师傅端</div>
    <div class="st-line"><span class="dot"></span> 请用工号手机号登录</div>
  </div>

  <div class="card">
    <div class="fld">
      <label>手机号</label>
      <input type="tel" id="phone" maxlength="11" placeholder="请输入手机号" value="13800008899">
    </div>
    <div class="fld">
      <label>验证码</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="sms" maxlength="6" placeholder="短信验证码" style="flex:1;">
        <button class="btn" id="sms-btn" onclick="sendSms(this)">获取验证码</button>
      </div>
    </div>
    <button class="btn-green btn-block" onclick="doLogin(this)">登录</button>
  </div>

  <div class="card">
    <div class="notice">登录需师傅手机号在职且验证码有效;登录后 token 存 localStorage 并由 api.js 自动携带。</div>
  </div>

  <div id="tip" class="card" style="display:none;"><div class="notice red" id="tip-msg"></div></div>
</div>
<script src="api.js"></script>
<script>
function showTip(msg) {
  var c = document.getElementById('tip');
  document.getElementById('tip-msg').textContent = msg;
  c.style.display = '';
}

function sendSms(btn) {
  var phone = document.getElementById('phone').value.trim();
  if (!phone) { showTip('请先输入手机号'); return; }
  API.auth.smsCode(phone).then(function () {
    var n = 60;
    btn.disabled = true;
    var t = setInterval(function () {
      btn.textContent = n + 's 后重发';
      if (n-- <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = '获取验证码'; }
    }, 1000);
  }).catch(function (e) { showTip('验证码发送失败:' + e.message); });
}

function doLogin(btn) {
  var phone = document.getElementById('phone').value.trim();
  var code = document.getElementById('sms').value.trim();
  if (!phone || !code) { showTip('请输入手机号与验证码'); return; }
  btn.disabled = true;
  API.auth.login(phone, 'sms', code).then(function (r) {
    API.setToken(r.token);
    location.href = 'home.html';
  }).catch(function (e) {
    btn.disabled = false;
    showTip('登录失败:' + e.message);
  });
}
</script>
</body>
</html>
