<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转单 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.transfer" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">转单 / 改派</div>
    <span class="act">联系调度</span>
  </div>

  <div class="card" id="ticketCard">
    <div class="c-title" id="ticketTitle">加载中…</div>
    <div class="kv"><span class="k">当前接单</span><span class="v">张师傅（本人）</span></div>
    <div class="kv"><span class="k">预约</span><span class="v" id="ticketSlot">--</span></div>
  </div>

  <div class="card">
    <div class="fld">
      <label>转单原因</label>
      <select id="reason">
        <option>现场无法处理（需其他专业/工具）</option>
        <option>与客户时间冲突</option>
        <option>跨片区/无资源</option>
        <option>设备/材料需更换</option>
      </select>
    </div>
    <div class="fld">
      <label>转派对象（选填，留空退回调度池）</label>
      <select id="target">
        <option value="">退回调度中心（自动分配）</option>
        <option value="李师傅">李师傅 · 装机一组</option>
        <option value="王师傅">王师傅 · 抢修组</option>
      </select>
    </div>
    <div class="fld">
      <label>说明</label>
      <textarea id="remark" rows="3" placeholder="向调度说明现场情况"></textarea>
    </div>
    <button class="btn btn-block ghost" onclick="submitTransfer()">确认转单</button>
    <div id="tip" class="hint muted" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="notice">转单后本单将从「我的工单」移除，避免同一订单双人处理。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function showTip(msg) {
  var el = document.getElementById('tip');
  el.textContent = msg;
  el.style.display = (msg ? 'block' : 'none');
}

function renderTicket(d) {
  document.getElementById('ticketTitle').textContent = d.ticketNo;
  document.getElementById('ticketSlot').textContent = d.scheduleSlot || '--';
}

API.ticket.detail(NO).then(renderTicket).catch(function (e) {
  document.getElementById('ticketTitle').textContent = NO;
  showTip('工单信息加载失败：' + (e && e.message) + '，可继续操作。');
});

function submitTransfer() {
  var reason = document.getElementById('reason').value;
  var target = document.getElementById('target').value;
  var remark = document.getElementById('remark').value.trim();
  showTip('提交中…');
  API.ticket.transfer(NO, reason, target || null, remark).then(function (r) {
    alert(r.message || '已退回调度池，等待重新派发。');
    location.href = 'orders.html';
  }).catch(function (e) {
    showTip('转单失败：' + (e && e.message) + '，请重试。');
  });
}
</script>
</body>
</html>
