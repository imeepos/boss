<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转单 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="order.html">&lsaquo;</a>
    <div class="t">转单 / 改派</div>
    <span class="act">联系调度</span>
  </div>

  <div class="card">
    <div class="c-title">ORD-20250817-001</div>
    <div class="kv"><span class="k">当前接单</span><span class="v">张师傅（本人）</span></div>
    <div class="kv"><span class="k">预约</span><span class="v">今天 10:00-12:00</span></div>
  </div>

  <div class="card">
    <div class="fld">
      <label>转单原因</label>
      <select>
        <option selected>现场无法处理（需其他专业/工具）</option>
        <option>与客户时间冲突</option>
        <option>跨片区/无资源</option>
        <option>设备/材料需更换</option>
      </select>
    </div>
    <div class="fld">
      <label>转派对象（选填，留空退回调度池）</label>
      <select>
        <option selected>退回调度中心（自动分配）</option>
        <option>李师傅 · 装机一组</option>
        <option>王师傅 · 抢修组</option>
      </select>
    </div>
    <div class="fld">
      <label>说明</label>
      <textarea rows="3" placeholder="向调度说明现场情况"></textarea>
    </div>
    <button class="btn btn-block ghost" onclick="alert('已退回调度池，等待重新派发。')">确认转单</button>
  </div>

  <div class="card">
    <div class="notice">转单后本单将从「我的工单」移除，避免同一订单双人处理。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
