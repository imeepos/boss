<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系调度 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.service" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="order.html">&lsaquo;</a>
    <div class="t">联系调度</div>
    <span class="act" onclick="alert('已转人工。')">转人工</span>
  </div>

  <div class="card" id="chatCard" style="min-height:260px;"></div>

  <div class="card" style="display:flex;gap:10px;">
    <a class="btn" style="flex:1;" href="tel:10086">拨号</a>
    <button class="btn btn-primary" style="flex:1;" onclick="location.href='transfer.html'">转单/改派</button>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
function render(items) {
  var html = '';
  items.forEach(function (m) {
    var cls = m.from === 'worker' ? 'warn' : 'ok';
    var align = m.from === 'worker' ? 'align-self:flex-end;' : '';
    html += '<div class="msg-banner ' + cls + '" style="' + align + '">' + m.content + '</div>';
  });
  document.getElementById('chatCard').innerHTML = html || '<div class="notice">暂无会话</div>';
}

API.misc.serviceMessages().then(function (d) {
  render(d.items);
}).catch(function (e) {
  alert('会话加载失败：' + e.message);
});
</script>
</body>
</html>
