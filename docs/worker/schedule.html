<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排期日历 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="home.html">&lsaquo;</a>
    <div class="t">排期日历</div>
    <span class="act" id="monthLbl">2025-08</span>
  </div>

  <div class="card" id="calCard"></div>

  <div class="card" id="todayCard">
    <div class="c-title">今日排期</div>
  </div>

  <div class="card">
    <div class="c-title">工时打卡</div>
    <button class="btn btn-block" onclick="clock('IN')">上班打卡</button>
    <button class="btn btn-block ghost" style="margin-top:8px;" onclick="clock('OUT')">下班打卡</button>
  </div>

  <div id="tabbar"></div>
</div>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
function renderCal(month, busy) {
  var days = ['一', '二', '三', '四', '五', '六', '日'];
  var html = '<div class="cal">';
  days.forEach(function (h) { html += '<div class="h">' + h + '</div>'; });
  var total = 31;
  for (var i = 1; i <= total; i++) {
    var cls = 'd';
    if (busy.indexOf(i) !== -1) cls += ' todo';
    html += '<div class="' + cls + '">' + i + '</div>';
  }
  html += '</div>';
  document.getElementById('calCard').innerHTML = html;
  document.getElementById('monthLbl').textContent = month;
}

function renderToday(items) {
  var html = '<div class="c-title">今日排期 <span class="more">' + items.length + ' 单</span></div>';
  items.forEach(function (it) {
    html += '<div class="kv"><span class="k">' + it.time + '</span>' +
      '<span class="v">' + it.ticketNo + ' · ' + it.address + '</span></div>';
  });
  document.getElementById('todayCard').innerHTML = html;
}

function clock(type) {
  API.profile.clock(type).then(function (r) {
    alert((type === 'IN' ? '上班打卡成功' : '下班打卡成功') + '：' + r.clockedAt);
  }).catch(function (e) {
    alert('打卡失败：' + e.message);
  });
}

API.profile.schedule().then(function (d) {
  renderCal(d.month, d.busyDays);
  renderToday(d.today);
}).catch(function (e) {
  alert('排期加载失败：' + e.message);
});
</script>
</body>
</html>
