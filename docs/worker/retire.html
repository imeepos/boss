<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旧件回收 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="replace.html">&lsaquo;</a>
    <div class="t">旧件回收</div>
    <span class="act">返库登记</span>
  </div>

  <div class="card">
    <div class="c-title">待回收旧件</div>
    <div class="cell"><div class="main"><div class="t">光猫 EPC-0002</div><div class="d">故障 · 返修（换件）</div></div><div class="right"><button class="btn btn-primary" style="padding:5px 10px;" onclick="alert('已登记返库（示意）。')">返库</button></div></div>
    <div class="cell"><div class="main"><div class="t">光猫 EPC-0110</div><div class="d">拆机回收（ORD-20250817-009）</div></div><div class="right"><button class="btn btn-primary" style="padding:5px 10px;" onclick="alert('已登记返库（示意）。')">返库</button></div></div>
  </div>

  <div class="card">
    <div class="c-title">已回收记录 <span class="more">本月</span></div>
    <div class="kv"><span class="k">返修件</span><span class="v">3 件</span></div>
    <div class="kv"><span class="k">拆机回收</span><span class="v">12 件</span></div>
  </div>

  <div class="card">
    <div class="notice">旧件回收须扫码留痕，返修件与拆机件分流处理。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
