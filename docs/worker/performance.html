<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绩效 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">绩效明细</div>
    <span class="act">2025-08</span>
  </div>

  <div class="stats-card" style="margin-top:14px;">
    <div class="row"><span class="title">本月绩效</span><span class="date">2025-08</span></div>
    <div class="stats">
      <div><div class="v blue">46</div><div class="k">完成</div></div>
      <div><div class="v green">98%</div><div class="k">按时率</div></div>
      <div><div class="v orange">4.9</div><div class="k">评分</div></div>
    </div>
  </div>

  <div class="card">
    <div class="c-title">提成明细</div>
    <div class="kv"><span class="k">装机提成</span><span class="v">46 × ¥30 = ¥1380</span></div>
    <div class="kv"><span class="k">抢修提成</span><span class="v">12 × ¥20 = ¥240</span></div>
    <div class="kv"><span class="k">满意度奖励</span><span class="v">+¥120</span></div>
    <div class="kv"><span class="k">合计</span><span class="v" style="color:var(--primary);font-weight:700;">¥1740</span></div>
  </div>

  <div class="card">
    <div class="c-title">小组排名</div>
    <div class="kv"><span class="k">张师傅（本人）</span><span class="v">#1</span></div>
    <div class="kv"><span class="k">李师傅</span><span class="v">#2</span></div>
    <div class="kv"><span class="k">王师傅</span><span class="v">#3</span></div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
