<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绩效 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.performance" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="profile.html">&lsaquo;</a>
    <div class="t">绩效明细</div>
    <span class="act" id="periodLbl">2025-08</span>
  </div>

  <div class="stats-card" style="margin-top:14px;" id="summaryCard">
    <div class="row"><span class="title">本月绩效</span><span class="date">2025-08</span></div>
    <div class="stats">
      <div><div class="v blue">46</div><div class="k">完成</div></div>
      <div><div class="v green">98%</div><div class="k">按时率</div></div>
      <div><div class="v orange">4.9</div><div class="k">评分</div></div>
    </div>
  </div>

  <div class="card" id="commissionCard">
    <div class="c-title">提成明细</div>
  </div>

  <div class="card" id="rankingCard">
    <div class="c-title">小组排名</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
function renderSummary(d) {
  document.getElementById('periodLbl').textContent = d.period;
  var s = d.summary;
  document.getElementById('summaryCard').innerHTML =
    '<div class="row"><span class="title">本月绩效</span><span class="date">' + d.period + '</span></div>' +
    '<div class="stats">' +
    '<div><div class="v blue">' + s.finished + '</div><div class="k">完成</div></div>' +
    '<div><div class="v green">' + s.onTimeRate + '%</div><div class="k">按时率</div></div>' +
    '<div><div class="v orange">' + s.score + '</div><div class="k">评分</div></div>' +
    '</div>';
}

function renderCommissions(items, total) {
  var html = '<div class="c-title">提成明细</div>';
  items.forEach(function (c) {
    html += '<div class="kv"><span class="k">' + c.name + '</span>' +
      '<span class="v">' + (c.formula ? c.formula + ' = ' : '') + '¥' + c.amount + '</span></div>';
  });
  html += '<div class="kv"><span class="k">合计</span>' +
    '<span class="v" style="color:var(--primary);font-weight:700;">¥' + total + '</span></div>';
  document.getElementById('commissionCard').innerHTML = html;
}

function renderRanking(items) {
  var html = '<div class="c-title">小组排名</div>';
  items.forEach(function (r) {
    html += '<div class="kv"><span class="k">' + r.name + '</span><span class="v">#' + r.rank + '</span></div>';
  });
  document.getElementById('rankingCard').innerHTML = html;
}

API.profile.performance().then(function (d) {
  renderSummary(d);
  renderCommissions(d.commissions, d.totalAmount);
  renderRanking(d.ranking);
}).catch(function (e) {
  alert('绩效加载失败：' + e.message);
});
</script>
</body>
</html>
