<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.profile" data-back="home.html"></div>
<div class="app">

  <div class="home-head" id="headCard">
    <div class="hi">张师傅
      <a href="javascript:toggleLang()" style="color:#fff;font-size:14px;font-weight:400;">中文 ▾</a>
    </div>
    <div class="phone">装机一组 · 工号 WK-1024</div>
    <div class="st-line"><span class="dot"></span> 在线接单 · 服务 3 年</div>
  </div>

  <div class="stats-card" id="monthCard">
    <div class="row"><span class="title">本月累计</span><span class="date">2025-08</span></div>
    <div class="stats">
      <div><div class="v blue">46</div><div class="k">完成工单</div></div>
      <div><div class="v green">98%</div><div class="k">按时率</div></div>
      <div><div class="v orange">4.9</div><div class="k">客户评分</div></div>
    </div>
  </div>

  <div class="card">
    <div class="c-title">账户</div>
    <a class="cell" href="performance.html"><div class="main"><div class="t">绩效明细</div><div class="d">提成 · 排名 · 服务评分</div></div><div class="right">&rsaquo;</div></a>
    <a class="cell" href="settings.html"><div class="main"><div class="t">接单设置</div></div><div class="right"><span id="statusLbl">在线接单</span> &rsaquo;</div></a>
    <a class="cell" href="history.html"><div class="main"><div class="t">历史工单</div></div><div class="right">全部 &rsaquo;</div></a>
    <a class="cell" href="messages.html"><div class="main"><div class="t">消息通知</div></div><div class="right">&rsaquo;</div></a>
  </div>

  <div class="card">
    <div class="c-title">常用工具</div>
    <a class="cell" href="tool.html"><div class="main"><div class="t">测速 / 光功率</div></div><div class="right">&rsaquo;</div></a>
    <a class="cell" href="pickup.html"><div class="main"><div class="t">领料 / 借还</div></div><div class="right">&rsaquo;</div></a>
    <a class="cell" href="help.html"><div class="main"><div class="t">排障手册</div></div><div class="right">&rsaquo;</div></a>
    <a class="cell" href="service.html"><div class="main"><div class="t">联系调度</div></div><div class="right">&rsaquo;</div></a>
  </div>

  <div class="card">
    <div class="c-title">设置</div>
    <a class="cell" href="notice.html"><div class="main"><div class="t">服务公告</div></div><div class="right">&rsaquo;</div></a>
    <a class="cell" href="feedback.html"><div class="main"><div class="t">帮助与反馈</div></div><div class="right">&rsaquo;</div></a>
  </div>

  <div class="card" style="text-align:center;">
    <button class="btn-block ghost" onclick="logout()">退出登录</button>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
function renderHead(d) {
  document.getElementById('headCard').innerHTML =
    '<div class="hi">' + d.name + ' <a href="javascript:toggleLang()" style="color:#fff;font-size:14px;font-weight:400;">中文 ▾</a></div>' +
    '<div class="phone">' + d.groupName + ' · 工号 ' + d.staffNo + '</div>' +
    '<div class="st-line"><span class="dot"></span> ' + (d.online ? '在线接单' : '已停接单') + ' · 服务 ' + d.serveYears + ' 年</div>';
}

function renderMonth(m) {
  document.getElementById('monthCard').innerHTML =
    '<div class="row"><span class="title">本月累计</span><span class="date">2025-08</span></div>' +
    '<div class="stats">' +
    '<div><div class="v blue">' + m.finished + '</div><div class="k">完成工单</div></div>' +
    '<div><div class="v green">' + m.onTimeRate + '%</div><div class="k">按时率</div></div>' +
    '<div><div class="v orange">' + m.score + '</div><div class="k">客户评分</div></div>' +
    '</div>';
}

function logout() {
  API.auth.logout().then(function (r) {
    alert(r.message || '已退出登录。');
  }).catch(function (e) {
    alert('退出失败：' + e.message);
  });
}

API.profile.get().then(function (d) {
  renderHead(d);
  renderMonth(d.month);
  document.getElementById('statusLbl').textContent = d.online ? '在线接单' : '已停接单';
}).catch(function (e) {
  alert('个人信息加载失败：' + e.message);
});
</script>
</body>
</html>
