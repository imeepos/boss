<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投诉登记 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header" data-i18n="worker.title.complaint" data-back="home.html"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="orders.html">&lsaquo;</a>
    <div class="t">投诉登记</div>
    <span class="act">安抚</span>
  </div>

  <div class="card">
    <div class="c-title" id="ticketTitle">加载中…</div>
    <div class="kv"><span class="k">投诉类型</span><span class="v">现场服务类</span></div>
  </div>

  <div class="card">
    <div class="fld">
      <label>投诉分类</label>
      <select id="category">
        <option selected>预约时间延误</option>
        <option>服务态度</option>
        <option>安装质量</option>
        <option>收费争议</option>
        <option>其他</option>
      </select>
    </div>
    <div class="fld">
      <label>现场情况</label>
      <textarea id="content" rows="3" placeholder="记录客户诉求与安抚情况"></textarea>
    </div>
    <button class="btn btn-block ghost" onclick="submitComplaint()">提交登记</button>
    <div id="tip" class="hint muted" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="notice">现场投诉即时登记，转客服回访，形成闭环；师傅可同步说明现场处理情况。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="locale.js"></script>
<script src="header.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
var NO = new URLSearchParams(location.search).get('no') || 'ORD-20250817-001';

function showTip(msg) {
  var el = document.getElementById('tip');
  el.textContent = msg;
  el.style.display = (msg ? 'block' : 'none');
}

function renderTicket(d) {
  document.getElementById('ticketTitle').textContent = d.ticketNo + ' · ' + (d.customerName || '');
}

API.ticket.detail(NO).then(renderTicket).catch(function (e) {
  document.getElementById('ticketTitle').textContent = NO;
  showTip('工单信息加载失败：' + (e && e.message) + '，可继续登记。');
});

function submitComplaint() {
  var category = document.getElementById('category').value;
  var content = document.getElementById('content').value.trim();
  if (!content) { showTip('请填写现场情况。'); return; }
  showTip('提交中…');
  API.ticket.complaint(NO, category, content).then(function (r) {
    alert(r.message || '投诉已登记，转客服回访闭环。');
    location.href = 'orders.html';
  }).catch(function (e) {
    showTip('提交失败：' + (e && e.message) + '，请重试。');
  });
}
</script>
</body>
</html>
