<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改约 · 装维平台师傅端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="order.html">&lsaquo;</a>
    <div class="t">预约改约</div>
    <span class="act">爽约登记</span>
  </div>

  <div class="card">
    <div class="c-title">ORD-20250817-001</div>
    <div class="kv"><span class="k">原预约</span><span class="v">今天 10:00-12:00</span></div>
    <div class="kv"><span class="k">客户</span><span class="v">王先生 · 138****1234</span></div>
  </div>

  <div class="card">
    <div class="fld">
      <label>新预约日期</label>
      <select><option>今天 08-17</option><option selected>明天 08-18</option><option>后天 08-19</option></select>
    </div>
    <div class="fld">
      <label>新预约时段</label>
      <select><option>09:00-11:00</option><option selected>14:00-16:00</option><option>16:00-18:00</option></select>
    </div>
    <div class="fld">
      <label>变更原因</label>
      <select><option>客户要求改期</option><option selected>客户不在家（爽约）</option><option>师傅排期冲突</option><option>天气/交通延误</option></select>
    </div>
    <div class="fld">
      <label>备注（选填）</label>
      <textarea rows="2" placeholder="特殊情况说明"></textarea>
    </div>
    <button class="btn-primary btn-block" onclick="alert('改约申请已提交，客户将收到短信确认。')">提交改约</button>
  </div>

  <div class="card">
    <div class="notice">改约与「爽约」同一入口：客户不在家选「客户不在家」，系统二次短信确认并重新计时 SLA。</div>
  </div>

  <div id="tabbar"></div>
</div>
<script src="nav.js"></script>
</body>
</html>
