name: CI

# 质量门禁:任何 push/PR 必须过 build + vet + race 测试 + lint(见 docs/plan/3-month-roadmap §6)。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Contract sync gate
        run: go run ./scripts/check-contract-sync -root .

  # Android 门禁:双 app(用户端/师傅端)assembleDebug+Release 与单测(UI 测试随 testDebugUnitTest)。
  # 不跑 connectedAndroidTest(无模拟器);Release 签名缺 keystore.properties 时回退 debug key。
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile/user/android, mobile/worker/android]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build + unit/UI tests
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

  # Android UI 测试门禁:模拟器跑 connectedDebugAndroidTest(Compose 页面渲染断言)。
  android-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/user/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: UI tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
